name: Validate Agency command dispatcher

on:
  pull_request:
    paths:
      - '.github/actionlint.yaml'
      - '.github/workflows/agency-command-dispatch.yml'
      - '.github/workflows/agency-command-dispatch-validation.yml'
      - '.github/workflows/promote-production.yml'
      - '.github/workflows/production-scheduler-change.yml'
      - '.github/workflows/trusted-editorial-publication.yml'
      - '.github/workflows/trusted-editorial-preprod-candidate.yml'
      - '.github/workflows/trusted-editorial-feature-image.yml'
      - '.github/workflows/preprod-914-governed-successor.yml'
      - '.github/workflows/development-seed-publish.yml'
      - '.github/workflows/preprod-blog-image-diagnostic.yml'
      - '.github/workflows/preprod-editorial-image-rehydrate-971.yml'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/AgencyCommandDispatchWorkflowTest.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/EditorialPreprodCandidateWorkflowTest.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/ProductionPromotionSafetyTest.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/SchedulerGovernanceSafetyTest.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/GovernedEditorialPublicationWorkflowTest.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/GovernedEditorialFeatureImageWorkflowTest.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/PreprodBlogImageDiagnosticWorkflowTest.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/PreprodEditorialImageRehydrate971WorkflowTest.php'

permissions:
  contents: read

jobs:
  dispatcher-contract:
    name: Single listener and exact native routing
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Validate #922 GitHub Actions surface with actionlint
        shell: bash
        run: |
          set -euo pipefail
          files=(
            '.github/workflows/agency-command-dispatch.yml'
            '.github/workflows/agency-command-dispatch-validation.yml'
            '.github/workflows/promote-production.yml'
            '.github/workflows/production-scheduler-change.yml'
            '.github/workflows/trusted-editorial-publication.yml'
            '.github/workflows/trusted-editorial-preprod-candidate.yml'
            '.github/workflows/trusted-editorial-feature-image.yml'
            '.github/workflows/preprod-914-governed-successor.yml'
            '.github/workflows/development-seed-publish.yml'
            '.github/workflows/preprod-blog-image-diagnostic.yml'
            '.github/workflows/preprod-editorial-image-rehydrate-971.yml'
          )
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.7 -color "${files[@]}"

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install exact locked dependencies
        shell: bash
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Execute dispatcher structural and routing contract
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/phpunit -c web/core/phpunit.xml.dist web/modules/custom/agency_project_tests/tests/src/Unit/AgencyCommandDispatchWorkflowTest.php
          vendor/bin/phpunit -c web/core/phpunit.xml.dist web/modules/custom/agency_project_tests/tests/src/Unit/PreprodBlogImageDiagnosticWorkflowTest.php
          vendor/bin/phpunit -c web/core/phpunit.xml.dist web/modules/custom/agency_project_tests/tests/src/Unit/PreprodEditorialImageRehydrate971WorkflowTest.php
          git diff --check HEAD^..HEAD

      - name: Prove non-operational validation boundary
        shell: bash
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';

          $workflow = Symfony\Component\Yaml\Yaml::parseFile(
            '.github/workflows/agency-command-dispatch-validation.yml',
          );
          if (!is_array($workflow) || !isset($workflow['jobs']) || !is_array($workflow['jobs'])) {
            exit(1);
          }

          $allowedUses = [
            'actions/checkout@v6',
            'shivammathur/setup-php@v2',
          ];

          foreach ($workflow['jobs'] as &$job) {
            if (!is_array($job)) {
              exit(1);
            }
            $runsOn = $job['runs-on'] ?? NULL;
            $labels = is_array($runsOn) ? $runsOn : [$runsOn];
            if (in_array('self-hosted', $labels, TRUE)) {
              exit(1);
            }

            if (!isset($job['steps']) || !is_array($job['steps'])) {
              continue;
            }
            $job['steps'] = array_values(array_filter(
              $job['steps'],
              static fn ($step): bool => !is_array($step)
                || ($step['name'] ?? '') !== 'Prove non-operational validation boundary',
            ));
            foreach ($job['steps'] as $step) {
              if (!is_array($step)) {
                exit(1);
              }
              if (isset($step['uses']) && !in_array($step['uses'], $allowedUses, TRUE)) {
                exit(1);
              }
              $run = $step['run'] ?? '';
              if (!is_string($run)) {
                exit(1);
              }
              foreach (['ssh', 'scp'] as $binary) {
                if (preg_match('/(^|[[:space:];|&])' . preg_quote($binary, '/') . '([[:space:]]|$)/', $run) === 1) {
                  exit(1);
                }
              }
            }
          }
          unset($job);

          $surface = json_encode($workflow, JSON_THROW_ON_ERROR);
          $secretReference = 'secrets' . '.';
          if (str_contains($surface, $secretReference)) {
            exit(1);
          }
          PHP
          printf '%s\n' \
            'TARGETED_DISPATCH_VALIDATION=PASS' \
            'VALIDATION_OPERATIONAL_SECRETS=NONE' \
            'VALIDATION_SELF_HOSTED_RUNNER=NONE' \
            'VALIDATION_SSH=NONE' \
            'VALIDATION_SCP=NONE' \
            'PROD_PREPROD_RUNTIME_MUTATION=NONE' \
            'OPERATIONAL_SECRET_CONSUMPTION=NONE'
