name: Validate Agency command dispatcher

on:
  pull_request:
    paths:
      - '.github/actionlint.yaml'
      - '.github/workflows/agency-command-dispatch.yml'
      - '.github/workflows/agency-command-dispatch-validation.yml'
      - '.github/workflows/trusted-canvas-ai-provider-proof.yml'
      - 'playwright.config.mjs'
      - '.github/workflows/promote-production.yml'
      - '.github/workflows/production-scheduler-change.yml'
      - '.github/workflows/trusted-editorial-publication.yml'
      - '.github/workflows/trusted-editorial-preprod-candidate.yml'
      - '.github/workflows/trusted-editorial-feature-image.yml'
      - '.github/workflows/preprod-914-governed-successor.yml'
      - '.github/workflows/development-seed-publish.yml'
      - '.github/workflows/preprod-blog-image-diagnostic.yml'
      - '.github/workflows/preprod-editorial-image-rehydrate-971.yml'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/AgencyCommandDispatchWorkflowTest.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/EditorialPreprodCandidateWorkflowTest.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/ProductionPromotionSafetyTest.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/SchedulerGovernanceSafetyTest.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/GovernedEditorialPublicationWorkflowTest.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/GovernedEditorialFeatureImageWorkflowTest.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/Issue975EditorialFeatureImageRunnerTargetTest.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/PreprodBlogImageDiagnosticWorkflowTest.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/PreprodEditorialImageRehydrate971WorkflowTest.php'

permissions:
  contents: read

jobs:
  dispatcher-contract:
    name: Single listener and exact native routing
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install exact browser test dependencies
        shell: bash
        run: npm ci

      - name: Prove trusted-main Playwright config with exact #533 provider spec
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_MAIN_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          provider_spec='tests/browser/canvas-ai-provider-proof.spec.mjs'
          trusted_playwright_config='.agency-trusted-playwright.config.mjs'
          materialized_provider_spec='0'

          cleanup_proof_files() {
            rm -f "$trusted_playwright_config"
            if [[ "$materialized_provider_spec" = '1' ]]; then
              rm -f "$provider_spec"
            fi
          }
          trap cleanup_proof_files EXIT

          [[ "$TRUSTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          provider_head="$(
            gh api "repos/$GITHUB_REPOSITORY/pulls/533" --jq '.head.sha'
          )"
          [[ "$provider_head" =~ ^[0-9a-f]{40}$ ]]

          trusted_playwright_blob="$(
            gh api               "repos/$GITHUB_REPOSITORY/contents/playwright.config.mjs?ref=$TRUSTED_MAIN_SHA"               --jq '.sha'
          )"
          target_playwright_blob="$(
            gh api               "repos/$GITHUB_REPOSITORY/contents/playwright.config.mjs?ref=$provider_head"               --jq '.sha'
          )"
          provider_spec_blob="$(
            gh api               "repos/$GITHUB_REPOSITORY/contents/$provider_spec?ref=$provider_head"               --jq '.sha'
          )"
          [[ "$trusted_playwright_blob" =~ ^[0-9a-f]{40}$ ]]
          [[ "$target_playwright_blob" =~ ^[0-9a-f]{40}$ ]]
          [[ "$provider_spec_blob" =~ ^[0-9a-f]{40}$ ]]

          gh api             "repos/$GITHUB_REPOSITORY/contents/playwright.config.mjs?ref=$TRUSTED_MAIN_SHA"             --jq '.content' |
            base64 -d > "$trusted_playwright_config"
          test -s "$trusted_playwright_config"

          if [[ -f "$provider_spec" ]]; then
            test "$(git hash-object "$provider_spec")" = "$provider_spec_blob"
          else
            gh api               "repos/$GITHUB_REPOSITORY/contents/$provider_spec?ref=$provider_head"               --jq '.content' |
              base64 -d > "$provider_spec"
            test -s "$provider_spec"
            test "$(git hash-object "$provider_spec")" = "$provider_spec_blob"
            materialized_provider_spec='1'
          fi

          grep -Fq             "process.env.CANVAS_AI_PROVIDER_PROOF === '1'"             "$trusted_playwright_config"
          grep -Fq             "'**/canvas-ai-provider-proof.spec.mjs'"             "$trusted_playwright_config"
          grep -Fq             "'public-blog.json': '**/public-blog.spec.mjs'"             "$trusted_playwright_config"
          grep -Fq             "'production-editorial-401.json': '**/production-editorial-article.spec.mjs'"             "$trusted_playwright_config"
          grep -Fq             "'drupal-2027-preprod.json': '**/drupal-2027-preprod.spec.mjs'"             "$trusted_playwright_config"
          grep -Fq             "'homepage-brand-1059-preprod.json': '**/homepage-brand-1059-preprod.spec.mjs'"             "$trusted_playwright_config"
          grep -Fq             'if (!providerProofMode && !contractTestMatch)'             "$trusted_playwright_config"

          discovery="$(
            CANVAS_AI_PROVIDER_PROOF=1             BROWSER_VALIDATION_CONTRACT='tests/browser/contracts/unsupported.json'             PLAYWRIGHT_BASE_URL='http://127.0.0.1:65535'             npx playwright test               tests/browser/canvas-ai-provider-proof.spec.mjs               --config="$trusted_playwright_config"               --project=desktop               --workers=1               --list
          )"
          printf '%s\n' "$discovery"

          discovered="$(
            grep -E '^  \[desktop\].*canvas-ai-provider-proof\.spec\.mjs:'               <<<"$discovery" || true
          )"
          test "$(grep -c . <<<"$discovered")" = '1'
          test "$(grep -Ec '^  \[[^]]+\].*\.spec\.mjs:' <<<"$discovery")" = '1'
          grep -Fq 'Total: 1 test in 1 file' <<<"$discovery"

          set +e
          unsupported="$(
            CANVAS_AI_PROVIDER_PROOF=0             BROWSER_VALIDATION_CONTRACT='tests/browser/contracts/unsupported.json'             PLAYWRIGHT_BASE_URL='http://127.0.0.1:65535'             npx playwright test               --config="$trusted_playwright_config"               --list 2>&1
          )"
          unsupported_rc=$?
          set -e
          test "$unsupported_rc" -ne 0
          grep -Fq             'Unsupported BROWSER_VALIDATION_CONTRACT: unsupported.json'             <<<"$unsupported"

          printf '%s\n'             "TRUSTED_PLAYWRIGHT_CONFIG_SOURCE=MAIN / ref=$TRUSTED_MAIN_SHA"             "TRUSTED_PLAYWRIGHT_CONFIG_BLOB=$trusted_playwright_blob"             "TARGET_PLAYWRIGHT_CONFIG_BLOB=$target_playwright_blob"             "TARGET_PROVIDER_SPEC_SOURCE=PR #533 HEAD $provider_head"             "TARGET_PROVIDER_SPEC_BLOB=$provider_spec_blob"             'PROVIDER_SPEC_DISCOVERED=YES'             'DISCOVERED_DESKTOP_TEST_COUNT=1'             'OTHER_SPECS_DISCOVERED=0'             'PROVIDER_TEST_EXECUTED=NO'             'PROVIDER_CALL=NONE'             'NORMAL_BROWSER_CONTRACT_BEHAVIOR=UNCHANGED'             'UNSUPPORTED_CONTRACT_OUTSIDE_PROVIDER_MODE=FAIL_CLOSED'

          cleanup_proof_files
          trap - EXIT
          test -z "$(git status --porcelain)"
          printf 'WORKTREE_FINAL=CLEAN\n'

      - name: Validate #922 GitHub Actions surface with actionlint
        shell: bash
        run: |
          set -euo pipefail
          files=(
            '.github/workflows/agency-command-dispatch.yml'
            '.github/workflows/agency-command-dispatch-validation.yml'
            '.github/workflows/trusted-canvas-ai-provider-proof.yml'
            '.github/workflows/promote-production.yml'
            '.github/workflows/production-scheduler-change.yml'
            '.github/workflows/trusted-editorial-publication.yml'
            '.github/workflows/trusted-editorial-preprod-candidate.yml'
            '.github/workflows/trusted-editorial-feature-image.yml'
            '.github/workflows/preprod-914-governed-successor.yml'
            '.github/workflows/development-seed-publish.yml'
            '.github/workflows/preprod-blog-image-diagnostic.yml'
            '.github/workflows/preprod-editorial-image-rehydrate-971.yml'
          )
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.7 -color "${files[@]}"

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install exact locked dependencies
        shell: bash
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Execute dispatcher structural and routing contract
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/phpunit -c web/core/phpunit.xml.dist web/modules/custom/agency_project_tests/tests/src/Unit/AgencyCommandDispatchWorkflowTest.php
          vendor/bin/phpunit -c web/core/phpunit.xml.dist web/modules/custom/agency_project_tests/tests/src/Unit/PreprodBlogImageDiagnosticWorkflowTest.php
          vendor/bin/phpunit -c web/core/phpunit.xml.dist web/modules/custom/agency_project_tests/tests/src/Unit/GovernedEditorialFeatureImageWorkflowTest.php
          vendor/bin/phpunit -c web/core/phpunit.xml.dist web/modules/custom/agency_project_tests/tests/src/Unit/Issue975EditorialFeatureImageRunnerTargetTest.php
          vendor/bin/phpunit -c web/core/phpunit.xml.dist web/modules/custom/agency_project_tests/tests/src/Unit/PreprodEditorialImageRehydrate971WorkflowTest.php
          git diff --check HEAD^..HEAD

      - name: Prove non-operational validation boundary
        shell: bash
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          require 'vendor/autoload.php';

          $workflow = Symfony\Component\Yaml\Yaml::parseFile(
            '.github/workflows/agency-command-dispatch-validation.yml',
          );
          if (!is_array($workflow) || !isset($workflow['jobs']) || !is_array($workflow['jobs'])) {
            exit(1);
          }

          $allowedUses = [
            'actions/checkout@v6',
            'actions/setup-node@v6',
            'shivammathur/setup-php@v2',
          ];

          foreach ($workflow['jobs'] as &$job) {
            if (!is_array($job)) {
              exit(1);
            }
            $runsOn = $job['runs-on'] ?? NULL;
            $labels = is_array($runsOn) ? $runsOn : [$runsOn];
            if (in_array('self-hosted', $labels, TRUE)) {
              exit(1);
            }

            if (!isset($job['steps']) || !is_array($job['steps'])) {
              continue;
            }
            $job['steps'] = array_values(array_filter(
              $job['steps'],
              static fn ($step): bool => !is_array($step)
                || ($step['name'] ?? '') !== 'Prove non-operational validation boundary',
            ));
            foreach ($job['steps'] as $step) {
              if (!is_array($step)) {
                exit(1);
              }
              if (isset($step['uses']) && !in_array($step['uses'], $allowedUses, TRUE)) {
                exit(1);
              }
              $run = $step['run'] ?? '';
              if (!is_string($run)) {
                exit(1);
              }
              foreach (['ssh', 'scp'] as $binary) {
                if (preg_match('/(^|[[:space:];|&])' . preg_quote($binary, '/') . '([[:space:]]|$)/', $run) === 1) {
                  exit(1);
                }
              }
            }
          }
          unset($job);

          $surface = json_encode($workflow, JSON_THROW_ON_ERROR);
          $secretReference = 'secrets' . '.';
          if (str_contains($surface, $secretReference)) {
            exit(1);
          }
          PHP
          printf '%s\n' \
            'TARGETED_DISPATCH_VALIDATION=PASS' \
            'VALIDATION_OPERATIONAL_SECRETS=NONE' \
            'VALIDATION_SELF_HOSTED_RUNNER=NONE' \
            'VALIDATION_SSH=NONE' \
            'VALIDATION_SCP=NONE' \
            'PROD_PREPROD_RUNTIME_MUTATION=NONE' \
            'OPERATIONAL_SECRET_CONSUMPTION=NONE'
