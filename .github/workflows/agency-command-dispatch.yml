      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}

  homepage-brand-1015-preprod-candidate:
    name: Route #1015 Homepage Brand PREPROD candidate
    needs: classify
    if: >-
      ${{ github.event.issue.pull_request == null
          && github.event.issue.number == 1015
          && github.event.comment.author_association == 'OWNER'
          && github.event.comment.user.login == 'E-merging-digital'
          && (github.event.comment.body == '/agency-homepage-brand-1015 inspect'
              || github.event.comment.body == '/agency-homepage-brand-1015 dry-run'
              || github.event.comment.body == '/agency-homepage-brand-1015 apply') }}
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/trusted-homepage-brand-1015-preprod.yml
    secrets:
      PREPROD_SSH_PRIVATE_KEY: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}
      PREPROD_SERVER_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
      PREPROD_BASIC_AUTH_USER: ${{ secrets.PREPROD_BASIC_AUTH_USER }}
      PREPROD_BASIC_AUTH_PASSWORD: ${{ secrets.PREPROD_BASIC_AUTH_PASSWORD }}
