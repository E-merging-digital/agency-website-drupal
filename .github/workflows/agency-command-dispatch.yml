name: Agency command dispatch

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

env:
  AGENCY_COMMAND_ROUTES: >-
    [
      {"route":"PRODUCTION_PROMOTE","prefix":"/agency-production-promote ","regex":"^/agency-production-promote go sha=[0-9a-f]{40} artifact=[0-9a-f]{64} composer=[0-9a-f]{64} build=[0-9]+ preprod=[0-9]+$"},
      {"route":"PRODUCTION_SCHEDULER","prefix":"/agency-production-scheduler ","regex":"^/agency-production-scheduler (action=CREATE release=[0-9a-f]{40} expected=ABSENT|action=UPDATE release=[0-9a-f]{40} expected=MANAGED_DRIFT|action=REMOVE release=[0-9a-f]{40} expected=CONTROLLED)$"},
      {"route":"EDITORIAL_PUBLICATION","prefix":"/agency-editorial ","exact":["/agency-editorial inspect","/agency-editorial dry-run","/agency-editorial apply"]},
      {"route":"EDITORIAL_PREPROD_CANDIDATE","prefix":"/agency-editorial-candidate ","exact":["/agency-editorial-candidate inspect","/agency-editorial-candidate dry-run","/agency-editorial-candidate apply"]},
      {"route":"EDITORIAL_FEATURE_IMAGE","prefix":"/agency-editorial-image ","exact":["/agency-editorial-image inspect","/agency-editorial-image dry-run","/agency-editorial-image apply","/agency-editorial-image-prod inspect","/agency-editorial-image-prod dry-run","/agency-editorial-image-prod apply"]},
      {"route":"PREPROD_REFRESH","prefix":"/agency-preprod-refresh-successor ","regex_template":"^/agency-preprod-refresh-successor (PLAN plan-{issue}-[A-Za-z0-9._-]{8,40}-r1 [0-9a-f]{40} AUTO agency-preprod-refresh-simple-v1|APPLY apply-{issue}-[A-Za-z0-9._-]{8,40}-r1 [0-9a-f]{40} [0-9a-f]{40} agency-preprod-refresh-simple-v1)$"},
      {"route":"DEVELOPMENT_SEED","prefix":"/agency-development-seed ","regex_template":"^/agency-development-seed publish seed-{issue}-[A-Za-z0-9._-]{8,40}-r1 [0-9a-f]{40} [A-Za-z0-9._:-]{8,80} [0-9a-f]{40}$","cleanup_route":"DEVELOPMENT_SEED_CLEANUP_PROOF","cleanup_prefix":"/agency-development-seed-cleanup-proof ","cleanup_regex":"^/agency-development-seed-cleanup-proof run=[1-9][0-9]* request=seed-956-[A-Za-z0-9._-]{8,40}-r1 main=[0-9a-f]{40}$"},
      {"route":"PREPROD_REFRESH_940_DIAGNOSTIC","prefix":"/agency-preprod-refresh-940-diagnostic ","exact":["/agency-preprod-refresh-940-diagnostic diagnose"]},
      {"route":"PREPROD_REFRESH_940_RECOVERY","prefix":"/agency-preprod-refresh-940-recovery ","exact":["/agency-preprod-refresh-940-recovery plan","/agency-preprod-refresh-940-recovery cleanup"]},
      {"route":"PREPROD_REFRESH_948_DETAIL","prefix":"/agency-preprod-refresh-948-detail ","exact":["/agency-preprod-refresh-948-detail diagnose"]},
      {"route":"PREPROD_BLOG_IMAGE_DIAGNOSTIC","prefix":"/agency-preprod-blog-image-diagnostic ","exact":["/agency-preprod-blog-image-diagnostic diagnose"]},
      {"route":"PREPROD_EDITORIAL_IMAGE_REHYDRATE_971","prefix":"/agency-preprod-image-rehydrate ","exact":["/agency-preprod-image-rehydrate dry-run","/agency-preprod-image-rehydrate apply"]},
      {"route":"CONFIG_SYNC_RUNTIME_DIAGNOSTIC","prefix":"/agency-config-sync-runtime ","exact":["/agency-config-sync-runtime diagnose"]},
      {"route":"PROD_CONFIG_SYNC_RUNTIME_DIAGNOSTIC","prefix":"/agency-config-sync-prod-runtime ","exact":["/agency-config-sync-prod-runtime diagnose"]}
    ]

jobs:
  classify:
    name: Classify exact Agency command
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      route: ${{ steps.route.outputs.route }}
    steps:
      - id: route
        name: Route syntax only; authorization remains downstream
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
          ROUTES_JSON: ${{ env.AGENCY_COMMAND_ROUTES }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          event_name = os.environ['EVENT_NAME']
          event_action = os.environ['EVENT_ACTION']
          body = os.environ['COMMENT_BODY']
          issue = os.environ['ISSUE_NUMBER']
          issue_title = os.environ['ISSUE_TITLE']
          issue_body = os.environ['ISSUE_BODY']
          is_pr = os.environ['IS_PULL_REQUEST'].lower() == 'true'
          routes = json.loads(os.environ['ROUTES_JSON'])
          incident_issue = {
              'DEVELOPMENT_SEED': '956',
              'DEVELOPMENT_SEED_CLEANUP_PROOF': '956',
              'PREPROD_REFRESH_940_DIAGNOSTIC': '941',
              'PREPROD_REFRESH_940_RECOVERY': '943',
              'PREPROD_REFRESH_948_DETAIL': '949',
              'PREPROD_BLOG_IMAGE_DIAGNOSTIC': '966',
              'PREPROD_EDITORIAL_IMAGE_REHYDRATE_971': '971',
              'CONFIG_SYNC_RUNTIME_DIAGNOSTIC': ('982', '995'),
              'PROD_CONFIG_SYNC_RUNTIME_DIAGNOSTIC': ('982', '995'),
          }
          route = 'NONE'
          if not is_pr and event_name == 'issue_comment':
              matches = []
              for spec in routes:
                  required_issue = incident_issue.get(spec['route'])
                  if isinstance(required_issue, tuple):
                      if issue not in required_issue:
                          continue
                  elif required_issue is not None and issue != required_issue:
                      continue
                  exact = spec.get('exact', [])
                  pattern = spec.get('regex')
                  template = spec.get('regex_template')
                  matched = body in exact
                  if pattern is not None:
                      matched = matched or re.fullmatch(pattern, body) is not None
                  if template is not None:
                      matched = matched or re.fullmatch(template.replace('{issue}', re.escape(issue)), body) is not None
                  if matched:
                      matches.append(spec['route'])
                  cleanup_route = spec.get('cleanup_route')
                  cleanup_pattern = spec.get('cleanup_regex')
                  if spec['route'] == 'DEVELOPMENT_SEED' and cleanup_route is not None and cleanup_pattern is not None:
                      cleanup_required_issue = incident_issue.get(cleanup_route)
                      if issue == cleanup_required_issue and re.fullmatch(cleanup_pattern, body) is not None:
                          matches.append(cleanup_route)
              route = matches[0] if len(matches) == 1 else 'NONE'
          elif not is_pr and event_name == 'issues' and event_action == 'opened':
              marker = (
                  'AGENCY_PREPROD_COCKPIT_PLAN_AUTHORITY='
                  '{"authorized_actor":"E-merging-digital","implementation_issue":914,'
                  '"mode":"PLAN","parent_issue":816,'
                  '"profile_id":"agency-preprod-refresh-simple-v1",'
                  '"run_attempt":1,"schema_version":1}'
              )
              if (
                  issue_title == '[Ops][PLAN] Prepare PREPROD refresh PLAN'
                  and issue_body.startswith('Parent: #816\n')
                  and issue_body.count(marker) == 1
              ):
                  route = 'PREPROD_REFRESH_COCKPIT_PLAN'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'route={route}\n')
          print(f'ROUTE={route}')
          PY

  production-promote:
    name: Route production promotion
    needs: classify
    if: ${{ needs.classify.outputs.route == 'PRODUCTION_PROMOTE' }}
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/promote-production.yml
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}

  production-scheduler:
    name: Route production scheduler change
    needs: classify
    if: ${{ needs.classify.outputs.route == 'PRODUCTION_SCHEDULER' }}
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/production-scheduler-change.yml
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}

  editorial-publication:
    name: Route editorial publication
    needs: classify
    if: ${{ needs.classify.outputs.route == 'EDITORIAL_PUBLICATION' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/trusted-editorial-publication.yml
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}

  editorial-preprod-candidate:
    name: Route PREPROD Article candidate
    needs: classify
    if: ${{ needs.classify.outputs.route == 'EDITORIAL_PREPROD_CANDIDATE' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/trusted-editorial-preprod-candidate.yml
    secrets:
      PREPROD_SSH_PRIVATE_KEY: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}
      PREPROD_SERVER_HOST: ${{ secrets.PREPROD_SERVER_HOST }}

  editorial-feature-image:
    name: Route editorial feature image
    needs: classify
    if: ${{ needs.classify.outputs.route == 'EDITORIAL_FEATURE_IMAGE' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/trusted-editorial-feature-image.yml
    secrets:
      SSH_PRIVATE_KEY: ${{ github.event.issue.number == 958 && startsWith(github.event.comment.body, '/agency-editorial-image ') && secrets.PREPROD_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
      SERVER_HOST: ${{ github.event.issue.number == 958 && startsWith(github.event.comment.body, '/agency-editorial-image ') && secrets.PREPROD_SERVER_HOST || secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}

  preprod-refresh:
    name: Route governed PREPROD refresh
    needs: classify
    if: ${{ needs.classify.outputs.route == 'PREPROD_REFRESH' }}
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/preprod-914-governed-successor.yml
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      PREPROD_SSH_PRIVATE_KEY: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}
      PREPROD_PROVISIONING_SSH_PRIVATE_KEY: ${{ secrets.PREPROD_PROVISIONING_SSH_PRIVATE_KEY }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      PREPROD_SERVER_HOST: ${{ secrets.PREPROD_SERVER_HOST }}

  preprod-refresh-cockpit-plan:
    name: Route Cockpit human GitHub PREPROD PLAN
    needs: classify
    if: ${{ needs.classify.outputs.route == 'PREPROD_REFRESH_COCKPIT_PLAN' }}
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/preprod-914-governed-successor.yml
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      PREPROD_SSH_PRIVATE_KEY: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}
      PREPROD_PROVISIONING_SSH_PRIVATE_KEY: ${{ secrets.PREPROD_PROVISIONING_SSH_PRIVATE_KEY }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      PREPROD_SERVER_HOST: ${{ secrets.PREPROD_SERVER_HOST }}

  publish-cockpit-plan-receipt:
    name: Publish Cockpit PREPROD PLAN receipt
    needs:
      - classify
      - preprod-refresh-cockpit-plan
    if: >-
      ${{ github.event_name == 'issues'
          && github.event.action == 'opened'
          && needs.classify.outputs.route == 'PREPROD_REFRESH_COCKPIT_PLAN'
          && needs['preprod-refresh-cockpit-plan'].result == 'success'
          && needs['preprod-refresh-cockpit-plan'].outputs.mode == 'PLAN' }}
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Publish canonical evidence-only PLAN receipt
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITY_ISSUE: ${{ needs['preprod-refresh-cockpit-plan'].outputs.authority_issue }}
          REQUEST_ID: ${{ needs['preprod-refresh-cockpit-plan'].outputs.request_id }}
          MAIN_SHA: ${{ needs['preprod-refresh-cockpit-plan'].outputs.main_sha }}
          PROFILE_ID: ${{ needs['preprod-refresh-cockpit-plan'].outputs.operation_profile }}
          OBSERVED_PROD_RELEASE_SHA: ${{ needs['preprod-refresh-cockpit-plan'].outputs.observed_prod_release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AUTHORITY_ISSUE" =~ ^[0-9]+$ ]]
          [[ "$REQUEST_ID" == "plan-${AUTHORITY_ISSUE}-cockpit-v1-r1" ]]
          [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OBSERVED_PROD_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$PROFILE_ID" = 'agency-preprod-refresh-simple-v1'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          completed_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          receipt="$(jq -cn \
            --argjson authority_issue "$AUTHORITY_ISSUE" \
            --argjson dispatch_run "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg request_id "$REQUEST_ID" \
            --arg profile_id "$PROFILE_ID" \
            --arg main_sha "$MAIN_SHA" \
            --arg observed_prod_release_sha "$OBSERVED_PROD_RELEASE_SHA" \
            --arg completed_at "$completed_at" \
            '{schema_version:1,receipt_source:"WORKFLOW",authority_issue:$authority_issue,dispatch_run:$dispatch_run,run_attempt:$run_attempt,request_id:$request_id,mode:"PLAN",profile_id:$profile_id,main_sha:$main_sha,jit_main_revalidation:"PASS",plan_result:"PASS",observed_prod_release_sha:$observed_prod_release_sha,prod_db_content_read:"NONE",prod_snapshot:"NOT_PERFORMED",prod_data_transfer:"NONE",preprod_db_mutation:"NONE",prod_write:"NONE",data_activation_authority:"DISABLED",apply_job:"SKIPPED",issue_open_apply:"IMPOSSIBLE",completed_at:$completed_at}')"
          body="AGENCY_PREPROD_COCKPIT_PLAN_RECEIPT=$receipt"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$AUTHORITY_ISSUE/comments" \
            -f body="$body" >/dev/null

  development-seed:
    name: Route Development Seed publication
    needs: classify
    if: ${{ needs.classify.outputs.route == 'DEVELOPMENT_SEED' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/development-seed-publish.yml
    secrets:
      PREPROD_SSH_PRIVATE_KEY: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}
      PREPROD_SERVER_HOST: ${{ secrets.PREPROD_SERVER_HOST }}

  development-seed-cleanup-proof:
    name: Route Development Seed cleanup absence proof
    needs: classify
    if: ${{ needs.classify.outputs.route == 'DEVELOPMENT_SEED_CLEANUP_PROOF' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/development-seed-cleanup-proof.yml

  preprod-refresh-940-diagnostic:
    name: Route #940 read-only PREPROD refresh diagnostic
    needs: classify
    if: ${{ needs.classify.outputs.route == 'PREPROD_REFRESH_940_DIAGNOSTIC' }}
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/preprod-refresh-940-diagnostic.yml
    secrets:
      PREPROD_SSH_PRIVATE_KEY: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}
      PREPROD_SERVER_HOST: ${{ secrets.PREPROD_SERVER_HOST }}

  preprod-refresh-940-recovery:
    name: Route #940 bounded PREPROD root-stage recovery
    needs: classify
    if: ${{ needs.classify.outputs.route == 'PREPROD_REFRESH_940_RECOVERY' }}
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/preprod-refresh-940-recovery.yml
    secrets:
      PREPROD_PROVISIONING_SSH_PRIVATE_KEY: ${{ secrets.PREPROD_PROVISIONING_SSH_PRIVATE_KEY }}
      PREPROD_SERVER_HOST: ${{ secrets.PREPROD_SERVER_HOST }}

  preprod-refresh-948-detail:
    name: Route fixed #948 read-only rollback detail diagnostic
    needs: classify
    if: ${{ needs.classify.outputs.route == 'PREPROD_REFRESH_948_DETAIL' }}
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/preprod-refresh-948-detail-diagnostic.yml
    secrets:
      PREPROD_PROVISIONING_SSH_PRIVATE_KEY: ${{ secrets.PREPROD_PROVISIONING_SSH_PRIVATE_KEY }}
      PREPROD_SERVER_HOST: ${{ secrets.PREPROD_SERVER_HOST }}

  preprod-blog-image-diagnostic:
    name: Route #966 read-only PREPROD Blog image diagnostic
    needs: classify
    if: ${{ needs.classify.outputs.route == 'PREPROD_BLOG_IMAGE_DIAGNOSTIC' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/preprod-blog-image-diagnostic.yml
    secrets:
      PREPROD_SSH_PRIVATE_KEY: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}
      PREPROD_SERVER_HOST: ${{ secrets.PREPROD_SERVER_HOST }}

  preprod-editorial-image-rehydrate-971:
    name: Route #971 bounded PREPROD image rehydration
    needs: classify
    if: ${{ needs.classify.outputs.route == 'PREPROD_EDITORIAL_IMAGE_REHYDRATE_971' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/preprod-editorial-image-rehydrate-971.yml
    secrets:
      PREPROD_SSH_PRIVATE_KEY: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}
      PREPROD_SERVER_HOST: ${{ secrets.PREPROD_SERVER_HOST }}

  config-sync-runtime-diagnostic:
    name: Route #982/#995 read-only PREPROD config diagnostic
    needs: classify
    if: ${{ needs.classify.outputs.route == 'CONFIG_SYNC_RUNTIME_DIAGNOSTIC' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/config-sync-runtime-diagnostic.yml
    secrets:
      PREPROD_SSH_PRIVATE_KEY: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}
      PREPROD_SERVER_HOST: ${{ secrets.PREPROD_SERVER_HOST }}

  prod-config-sync-runtime-diagnostic:
    name: Route #982/#995 read-only PROD config diagnostic
    needs: classify
    if: ${{ needs.classify.outputs.route == 'PROD_CONFIG_SYNC_RUNTIME_DIAGNOSTIC' }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/prod-config-sync-runtime-diagnostic.yml
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}

  drupal-2027-preprod-candidate:
    name: Route #1046 Drupal 2027 PREPROD candidate
    needs: classify
    if: >-
      ${{ github.event.issue.pull_request == null
          && github.event.issue.number == 1046
          && github.event.comment.author_association == 'OWNER'
          && github.event.comment.user.login == 'E-merging-digital'
          && (github.event.comment.body == '/agency-drupal-2027-candidate inspect'
              || github.event.comment.body == '/agency-drupal-2027-candidate dry-run'
              || github.event.comment.body == '/agency-drupal-2027-candidate apply') }}
    permissions:
      actions: read
      contents: read
      issues: write
    uses: ./.github/workflows/trusted-drupal-2027-preprod-candidate.yml
    secrets:
      PREPROD_SSH_PRIVATE_KEY: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}
      PREPROD_SERVER_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
      PREPROD_BASIC_AUTH_USER: ${{ secrets.PREPROD_BASIC_AUTH_USER }}
      PREPROD_BASIC_AUTH_PASSWORD: ${{ secrets.PREPROD_BASIC_AUTH_PASSWORD }}

  drupal-2027-production-publication:
    name: Route #1010 Drupal 2027 production publication
    needs: classify
    if: >-
      ${{ github.event.issue.pull_request == null
          && github.event.issue.number == 1010
          && github.event.comment.author_association == 'OWNER'
          && github.event.comment.user.login == 'E-merging-digital'
          && (github.event.comment.body == '/agency-drupal-2027-prod dry-run'
              || github.event.comment.body == '/agency-drupal-2027-prod apply') }}
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/trusted-drupal-2027-production-publication.yml
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}

  homepage-brand-1059-production-publication:
    name: Route #1091 Homepage Brand #1059 EN production publication
    needs: classify
    if: >-
      ${{ github.event.issue.pull_request == null
          && github.event.issue.number == 1091
