name: Agency runner health probe

on:
  push:
    branches:
      - main
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:
    inputs:
      diagnostic:
        description: 'One-shot bounded rootless DDEV diagnosis; not scheduled'
        required: false
        type: choice
        default: disabled
        options:
          - disabled
          - agency1418-r12-ownerproof-20261024

permissions:
  contents: read

concurrency:
  group: agency-runner-health-probe
  cancel-in-progress: true

jobs:
  probe:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.diagnostic != 'agency1418-r12-ownerproof-20261024' }}
    name: Probe Agency runner health
    runs-on:
      - self-hosted
      - linux
      - x64
      - agency
      - ddev
      - browser
    timeout-minutes: 5

    steps:
      - name: Checkout bounded publication helper
        uses: actions/checkout@v5
        with:
          clean: false
          fetch-depth: 1
          persist-credentials: false

      - name: Validate bounded runner health
        shell: bash
        env:
          EXPECTED_RUNNER_NAME: agency-browser-runner-01
          EXPECTED_HOSTNAME: preflight-runner-01
          EXPECTED_USER: agency-runner
          EXPECTED_RUNNER_SERVICE: actions.runner.E-merging-digital-agency-website-drupal.agency-browser-runner-01.service
          DISK_WARNING_PCT: '85'
          DISK_CRITICAL_PCT: '92'
          MEMORY_WARNING_AVAILABLE_PCT: '10'
          MEMORY_CRITICAL_AVAILABLE_PCT: '5'
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$*"
            exit 1
          }
          warn() {
            echo "::warning::$*"
          }

          [[ "${RUNNER_NAME:-}" == "$EXPECTED_RUNNER_NAME" ]] || fail "unexpected runner name: ${RUNNER_NAME:-missing}"
          [[ "$(hostname)" == "$EXPECTED_HOSTNAME" ]] || fail "unexpected hostname: $(hostname)"
          [[ "$(id -un)" == "$EXPECTED_USER" ]] || fail "unexpected execution identity: $(id -un)"

          command -v systemctl >/dev/null || fail "systemctl CLI missing"
          service_id="$(systemctl show "$EXPECTED_RUNNER_SERVICE" --property=Id --value)"
          service_state="$(systemctl show "$EXPECTED_RUNNER_SERVICE" --property=ActiveState --value)"
          service_substate="$(systemctl show "$EXPECTED_RUNNER_SERVICE" --property=SubState --value)"
          [[ "$service_id" == "$EXPECTED_RUNNER_SERVICE" ]] || fail "unexpected runner service identity: ${service_id:-missing}"
          [[ "$service_state" =~ ^[a-z0-9_-]{1,64}$ ]] || fail "runner service state is unavailable or unbounded"
          [[ "$service_substate" =~ ^[a-z0-9_-]{1,64}$ ]] || fail "runner service substate is unavailable or unbounded"
          [[ "$service_state" == 'active' && "$service_substate" == 'running' ]] || fail "runner service is unhealthy: ${service_state}/${service_substate}"

          runner_status='healthy'

          disk_used_pct="$(df -P / | awk 'NR == 2 {gsub("%", "", $5); print $5}')"
          [[ "$disk_used_pct" =~ ^[0-9]+$ ]] || fail "unable to read root filesystem usage"
          (( disk_used_pct >= 0 && disk_used_pct <= 100 )) || fail "root filesystem usage is outside 0..100"
          if (( disk_used_pct >= DISK_CRITICAL_PCT )); then
            fail "root filesystem is critical: ${disk_used_pct}% used"
          elif (( disk_used_pct >= DISK_WARNING_PCT )); then
            runner_status='warning'
            warn "root filesystem warning: ${disk_used_pct}% used"
          fi

          read -r mem_total_kib mem_available_kib < <(
            awk '/^MemTotal:/ {total=$2} /^MemAvailable:/ {available=$2} END {print total, available}' /proc/meminfo
          )
          [[ "${mem_total_kib:-}" =~ ^[0-9]+$ && "${mem_available_kib:-}" =~ ^[0-9]+$ ]] || fail "unable to read memory availability"
          (( mem_total_kib > 0 )) || fail "memory total is invalid"
          memory_available_pct=$((100 * mem_available_kib / mem_total_kib))
          (( memory_available_pct >= 0 && memory_available_pct <= 100 )) || fail "memory availability is outside 0..100"
          if (( memory_available_pct <= MEMORY_CRITICAL_AVAILABLE_PCT )); then
            fail "available memory is critical: ${memory_available_pct}%"
          elif (( memory_available_pct <= MEMORY_WARNING_AVAILABLE_PCT )); then
            runner_status='warning'
            warn "available memory warning: ${memory_available_pct}%"
          fi

          command -v docker >/dev/null || fail "docker CLI missing"
          command -v ddev >/dev/null || fail "DDEV CLI missing"
          command -v jq >/dev/null || fail "jq CLI missing"
          docker_root="$(docker info --format '{{.DockerRootDir}}')"
          docker_driver="$(docker info --format '{{.Driver}}')"
          [[ -n "$docker_root" && -n "$docker_driver" ]] || fail "Docker daemon health unavailable"
          docker_storage="$(docker system df --format '{{.Type}}|{{.TotalCount}}|{{.Active}}|{{.Size}}|{{.Reclaimable}}')"
          [[ -n "$docker_storage" ]] || fail "Docker storage accounting unavailable"
          printf 'Docker storage summary:\n%s\n' "$docker_storage"
          ddev version >/dev/null

          receipt_dir="$RUNNER_TEMP/agency-runner-health-state"
          receipt_file="$receipt_dir/agency-runner-health.json"
          rm -rf -- "$receipt_dir"
          install -d -m 700 "$receipt_dir"

          stamp="$(date -u '+%Y%m%dT%H%M%SZ')"
          [[ "$stamp" =~ ^[0-9]{8}T[0-9]{6}Z$ ]] || fail "unable to generate bounded UTC receipt timestamp"
          observed_at="${stamp:0:4}-${stamp:4:2}-${stamp:6:2}T${stamp:9:2}:${stamp:11:2}:${stamp:13:2}Z"
          receipt_id="agency-health-$stamp"

          # Compatibility-only envelope. Infrastructure refreshes PROD /health/live
          # and /health/ready directly when it consumes this runner receipt.
          jq -n \
            --arg receipt_id "$receipt_id" \
            --arg observed_at "$observed_at" \
            --arg runner_status "$runner_status" \
            --arg runner_name "$RUNNER_NAME" \
            --arg runner_host "$(hostname)" \
            --arg service_state "$service_state" \
            --arg service_substate "$service_substate" \
            --argjson disk_used_pct "$disk_used_pct" \
            --argjson memory_available_pct "$memory_available_pct" \
            '{
              schema_version: 1,
              project_id: "agency-website",
              receipt_id: $receipt_id,
              observed_at: $observed_at,
              external: {
                source: "compatibility-placeholder-not-authoritative",
                status: "unavailable",
                live: {
                  http_status: 0,
                  body_status: "unavailable",
                  duration_seconds: 0
                },
                ready: {
                  http_status: 0,
                  body_status: "unavailable",
                  duration_seconds: 0
                }
              },
              runner: {
                source: "same-run-self-hosted-probe",
                status: $runner_status,
                name: $runner_name,
                host: $runner_host,
                service_state: $service_state,
                service_substate: $service_substate,
                disk_used_pct: $disk_used_pct,
                memory_available_pct: $memory_available_pct
              }
            }' > "$receipt_file"
          chmod 600 "$receipt_file"

          [[ -f "$receipt_file" && ! -L "$receipt_file" && -s "$receipt_file" ]] || fail "runner health receipt is missing or unsafe"
          receipt_bytes="$(wc -c < "$receipt_file")"
          [[ "$receipt_bytes" =~ ^[0-9]+$ ]] || fail "unable to determine receipt size"
          (( receipt_bytes <= 8192 )) || fail "runner health receipt exceeds bounded size"

          jq -e \
            --arg expected_receipt "$receipt_id" \
            --arg expected_observed "$observed_at" \
            --arg expected_status "$runner_status" \
            --arg expected_state "$service_state" \
            --arg expected_substate "$service_substate" \
            '
              .schema_version == 1
              and .project_id == "agency-website"
              and .receipt_id == $expected_receipt
              and (.receipt_id | test("^agency-health-[0-9]{8}T[0-9]{6}Z$"))
              and .observed_at == $expected_observed
              and (.observed_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
              and .external.source == "compatibility-placeholder-not-authoritative"
              and .external.status == "unavailable"
              and .external.live == {http_status: 0, body_status: "unavailable", duration_seconds: 0}
              and .external.ready == {http_status: 0, body_status: "unavailable", duration_seconds: 0}
              and .runner.source == "same-run-self-hosted-probe"
              and .runner.status == $expected_status
              and (.runner.status == "healthy" or .runner.status == "warning")
              and .runner.name == "agency-browser-runner-01"
              and .runner.host == "preflight-runner-01"
              and .runner.service_state == $expected_state
              and .runner.service_substate == $expected_substate
              and (.runner.disk_used_pct | type == "number")
              and (.runner.disk_used_pct >= 0 and .runner.disk_used_pct <= 100)
              and (.runner.memory_available_pct | type == "number")
              and (.runner.memory_available_pct >= 0 and .runner.memory_available_pct <= 100)
            ' "$receipt_file" >/dev/null || fail "runner health receipt contract validation failed"

          if grep -Eiq \
            '("?(token|secret|password|credential|private[_ -]?key|ssh[_ -]?key)"?[[:space:]]*:|github_pat_|gh[pousr]_[A-Za-z0-9]|-----BEGIN [A-Z ]*PRIVATE KEY-----)' \
            "$receipt_file"; then
            fail "runner health receipt failed secret scan"
          fi

          {
            echo "## Agency runner health"
            echo
            echo "- runner: $RUNNER_NAME"
            echo "- host: $(hostname)"
            echo "- identity: $(id -un)"
            echo "- runner service: $service_id"
            echo "- service state: ${service_state}/${service_substate}"
            echo "- runner status: $runner_status"
            echo "- root filesystem: ${disk_used_pct}% used"
            echo "- memory available: ${memory_available_pct}%"
            echo "- Docker root: $docker_root"
            echo "- Docker driver: $docker_driver"
            echo
            echo "### Docker storage (read-only)"
            echo
            echo "| Type | Total | Active | Size | Reclaimable |"
            echo "| --- | ---: | ---: | ---: | ---: |"
            while IFS='|' read -r type total active size reclaimable; do
              echo "| $type | $total | $active | $size | $reclaimable |"
            done <<< "$docker_storage"
            echo
            echo "- normalized receipt artifact: agency-runner-health-state"
            echo "- external health in receipt: unavailable / non-authoritative compatibility envelope"
            echo "- known Docker privilege transition: tracked separately by infrastructure #11"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish bounded runner-local health handoff
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/runner/publish-agency-runner-health-handoff.sh "$RUNNER_TEMP/agency-runner-health-state/agency-runner-health.json"

      - name: Upload normalized runner health receipt
        uses: actions/upload-artifact@v4
        with:
          name: agency-runner-health-state
          path: ${{ runner.temp }}/agency-runner-health-state/agency-runner-health.json
          if-no-files-found: error
 
  diagnostic:
    name: One-shot Agency R12 rootless DDEV diagnosis
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic == 'agency1418-r12-ownerproof-20261024' && github.ref == 'refs/heads/main' && github.actor == 'E-merging-digital' }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - agency
      - ddev
      - browser
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - name: Check read-only runtime, ownership, and port listeners; reproduce once only if isolated
        shell: bash
        env:
          EXPECTED_RUNNER: agency-browser-runner-01
          EXPECTED_HOST: preflight-runner-01
          EXPECTED_USER: agency-runner
          EXPECTED_UID: '1002'
          R12_DIAGNOSTIC_ID: agency1418-r12-ownerproof-20261024
        run: |
          set -euo pipefail
          umask 077
          report() { printf '%s\n' "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          stop() { report "R12_RESULT=CONTROLLED_STOP_$1"; exit 1; }
          [[ "${RUNNER_NAME:-}" == "$EXPECTED_RUNNER" ]] || stop RUNNER_NAME
          [[ "$(hostname -s)" == "$EXPECTED_HOST" ]] || stop HOST_IDENTITY
          [[ "$(id -un)" == "$EXPECTED_USER" && "$(id -u)" == "$EXPECTED_UID" ]] || stop USER_IDENTITY
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || stop REF_NOT_MAIN
          [[ "$GITHUB_ACTOR" == 'E-merging-digital' ]] || stop UNEXPECTED_ACTOR
          # Resolve the effective Docker endpoint before any container or port probe.
          [[ "${DOCKER_HOST:-}" != *'/var/run/docker.sock'* ]] || stop ROOTFUL_SOCKET
          command -v docker >/dev/null && command -v ddev >/dev/null || stop TOOL_MISSING
          command -v ss >/dev/null || stop SS_MISSING
          [[ "${XDG_RUNTIME_DIR:-/run/user/1002}" == '/run/user/1002' ]] || stop RUNTIME_DIR
          docker_context="$(docker context show 2>/dev/null)" || stop DOCKER_CONTEXT_UNAVAILABLE
          [[ "$docker_context" =~ ^[a-zA-Z0-9_.-]{1,64}$ ]] || stop UNBOUNDED_CONTEXT
          docker_endpoint="${DOCKER_HOST:-}"
          if [[ -z "$docker_endpoint" ]]; then
            docker_endpoint="$(docker context inspect "$docker_context" --format '{{.Endpoints.docker.Host}}' 2>/dev/null)" || stop DOCKER_ENDPOINT_UNAVAILABLE
          fi
          [[ "$docker_endpoint" == 'unix:///run/user/1002/docker.sock' ]] || stop UNEXPECTED_DOCKER_ENDPOINT
          docker_root="$(docker info --format '{{.DockerRootDir}}' 2>/dev/null)" || stop DOCKER_UNAVAILABLE
          [[ "$docker_root" == '/home/agency-runner/.local/share/docker' ]] || stop UNEXPECTED_DOCKER_ROOT
          docker_security="$(docker info --format '{{json .SecurityOptions}}' 2>/dev/null)" || stop DOCKER_SECURITY_UNAVAILABLE
          [[ "$docker_security" == *rootless* && "$docker_security" == *cgroupns* ]] || stop NON_ROOTLESS
          ddev_version="$(ddev version -j 2>/dev/null)" || stop DDEV_VERSION_UNAVAILABLE
          [[ -n "$ddev_version" ]] || stop DDEV_VERSION_EMPTY
          report "R12_IDENTITY=PASS / RUNNER=$EXPECTED_RUNNER / HOST=$EXPECTED_HOST / UID=$EXPECTED_UID"
          report "R12_DOCKER=ROOTLESS / CONTEXT=$docker_context / ROOT_CLASS=AGENCY_PRIVATE"
          report "R12_DDEV_BINARY=AVAILABLE"

          # Collect BOTH ports before enforcing the stop. Never print raw ss/lsof/ps/inspect output.
          ports="$(ss -H -ltnp 2>/dev/null)" || stop PORT_SCAN_DENIED
          docker_containers_for_owner="$(docker ps -q)" || stop DOCKER_PS_DENIED
          ddev list -j >/dev/null 2>&1 || stop DDEV_LIST_DENIED
          busy=no
          for port in 18180 18543; do
            listener="$(printf '%s\n' "$ports" | awk -v p=":$port" '$4 ~ (p "$") {print; exit}')"
            if [[ -z "$listener" ]]; then
              report "R12_PORT_$port=FREE"
              continue
            fi
            busy=yes
            ownership=UNVERIFIED
            # ss and optional lsof disclose PIDs only inside this private job.
            pids="$(printf '%s\n' "$listener" | grep -Eo 'pid=[0-9]+' | cut -d= -f2 | sort -u || true)"
            if command -v lsof >/dev/null 2>&1; then
              lsof_pids="$(lsof -nP -t -iTCP:"$port" -sTCP:LISTEN 2>/dev/null || true)"
              pids="$(printf '%s\n%s\n' "$pids" "$lsof_pids" | awk '/^[0-9]+$/ {print}' | sort -u)"
            fi
            pid_count="$(printf '%s\n' "$pids" | awk '/^[0-9]+$/ {n++} END {print n+0}')"
            if [[ "$pid_count" == 1 ]]; then
              pid="$pids"
              owner_uid="$(ps -p "$pid" -o uid= 2>/dev/null | tr -d '[:space:]' || true)"
              owner_comm="$(ps -p "$pid" -o comm= 2>/dev/null | tr -d '[:space:]' || true)"
              if [[ "$owner_uid" =~ ^[0-9]+$ && "$owner_uid" != "$EXPECTED_UID" ]]; then
                ownership=PROVEN_FOREIGN
              elif [[ "$owner_uid" == "$EXPECTED_UID" && "$owner_comm" == rootlesskit ]]; then
                # Prove the listener is mapped by a container of Agency's private engine.
                for cid in $docker_containers_for_owner; do
                  mapping="$(docker inspect --format '{{json .NetworkSettings.Ports}}' "$cid" 2>/dev/null)" || stop DOCKER_INSPECT_DENIED
                  labels="$(docker inspect --format '{{json .Config.Labels}}' "$cid" 2>/dev/null)" || stop DOCKER_INSPECT_DENIED
                  if printf '%s\n' "$mapping" | grep -Eq "\"HostPort\":\"$port\""; then
                    if printf '%s\n' "$labels" | grep -Eq 'com[.]ddev|com[.]docker[.]compose[.]project'; then
                      ownership=PROVEN_OWNED
                    fi
                  fi
                done
              fi
            fi
            report "R12_PORT_$port=LISTENING / OWNER=$ownership / NO_STOP"
          done
          [[ "$busy" == no ]] || stop LISTENER_OCCUPIED
          docker_containers="$(docker ps -q)" || stop DOCKER_PS_DENIED
          [[ -z "$docker_containers" ]] || {
            container_count="$(printf '%s\n' "$docker_containers" | wc -l)"
            report "R12_ROOTLESS_ACTIVE_CONTAINERS=$container_count / DO_NOT_STOP"
            stop EXISTING_CONTAINERS
          }
          if ps -u "$EXPECTED_USER" -o comm= | grep -Eq '^(ddev|docker-compose)$'; then
            stop ACTIVE_DDEV_PROCESS
          fi
          report "R12_ISOLATION=PASS / NO_PREEXISTING_ROOTLESS_CONTAINERS"
          diag_dir="$(mktemp -d "$RUNNER_TEMP/agency-r12-ddev.XXXXXXXX")" || stop TEMP_DIR
          [[ -d "$diag_dir" && "$diag_dir" == "$RUNNER_TEMP"/agency-r12-ddev.* ]] || stop TEMP_IDENTITY
          project="agency-r12-${GITHUB_RUN_ID}"
          [[ "$project" =~ ^agency-r12-[0-9]{8,15}$ ]] || stop PROJECT_ID
          mkdir -p "$diag_dir/web"
          printf '<!doctype html><title>diagnostic</title>\n' > "$diag_dir/web/index.html"
          log="$diag_dir/private-ddev-start.log"
          : > "$log"
          chmod 600 "$log"
          configured=no
          if (cd "$diag_dir" && ddev config --project-name "$project" --project-type=php --docroot=web > "$log" 2>&1); then
            configured=yes
          else
            report "R12_DDEV_CONFIG=FAIL_REDACTED"
            rm -f -- "$log"
            stop DDEV_CONFIG
          fi
          result=FAIL
          if (cd "$diag_dir" && timeout 150 ddev start >> "$log" 2>&1); then
            result=PASS
          else
            if grep -Eqi 'PortManager.AddPort|RootlessKit' "$log"; then
              report "R12_FIRST_ERROR_CLASS=ROOTLESSKIT_PORT_MANAGER"
            elif grep -Eqi 'address already in use|bind:' "$log"; then
              report "R12_FIRST_ERROR_CLASS=TCP_PORT_BIND"
            elif grep -Eqi 'permission denied|access denied' "$log"; then
              report "R12_FIRST_ERROR_CLASS=PERMISSION_DENIED"
            elif grep -Eqi 'timed out|deadline exceeded' "$log"; then
              report "R12_FIRST_ERROR_CLASS=TIMEOUT"
            else
              report "R12_FIRST_ERROR_CLASS=OTHER_DDEV_FAILURE"
            fi
            errport="$(grep -Eo ':[0-9]{4,5}([ :]|$)' "$log" | head -1 | tr -cd '0-9' || true)"
            if [[ "$errport" =~ ^[0-9]{4,5}$ ]] && (( errport <= 65535 )); then
              report "R12_FIRST_ERROR_TCP_PORT=$errport"
            fi
          fi
          rm -f -- "$log"
          [[ "$configured" == yes ]] || stop PROJECT_NOT_CONFIGURED
          [[ -f "$diag_dir/.ddev/config.yaml" ]] || stop OWNED_CONFIG_MISSING
          grep -Eq "^name: ['\"]?$project['\"]?$" "$diag_dir/.ddev/config.yaml" || stop OWNED_PROJECT_ID_MISMATCH
          (cd "$diag_dir" && ddev stop --yes >/dev/null 2>&1) || stop OWNED_DDEV_CLEANUP
          [[ -z "$(docker ps --filter "name=$project" -q)" ]] || stop OWNED_CONTAINER_REMAINS
          report "R12_OWNED_CLEANUP=PASS"
          report "R12_DDEV_START=$result"
          [[ "$result" == PASS ]] || stop DDEV_START_FAILURE
