name: Agent Composer materialization dispatch

on:
  push:
    branches:
      - agency/composer-materialization-dispatch-control
    paths:
      - .agency/composer-materialization-request.json

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  dispatch:
    name: Validate, dispatch and observe governed Composer materialization
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout control branch history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate control mutation
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_ACTOR" != "E-merging-digital" ]]; then
            echo "Unauthorized control actor: $GITHUB_ACTOR" >&2
            exit 1
          fi

          changed="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          expected='.agency/composer-materialization-request.json'
          if [[ "$changed" != "$expected" ]]; then
            echo "Control branch mutation must change exactly $expected" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

      - name: Validate request schema and live dependency-only target
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 - <<'PY' > /tmp/composer-request.env
          import json
          import re
          from pathlib import Path

          path = Path('.agency/composer-materialization-request.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          expected = {'request_id', 'pr_number', 'head_sha', 'profile'}
          if set(data) != expected:
              raise SystemExit(
                  f'Expected exactly {sorted(expected)}, got {sorted(data)}'
              )

          request_id = data['request_id']
          pr_number = data['pr_number']
          head_sha = data['head_sha']
          profile = data['profile']

          if not isinstance(request_id, str) or not re.fullmatch(
              r'[A-Za-z0-9._-]{8,80}', request_id
          ):
              raise SystemExit('Invalid request_id')
          if not isinstance(pr_number, int) or pr_number <= 0:
              raise SystemExit('pr_number must be a positive integer')
          if not isinstance(head_sha, str) or not re.fullmatch(
              r'[0-9a-f]{40}', head_sha
          ):
              raise SystemExit('head_sha must be a lowercase 40-character SHA')

          allowed_profiles = {
              'canvas-ai-agents-530',
              'config-language-lock-628',
              'dependency-maintenance-962',
          }
          if profile not in allowed_profiles:
              raise SystemExit('Unsupported Composer materialization profile')

          print(f'REQUEST_ID={request_id}')
          print(f'PR_NUMBER={pr_number}')
          print(f'HEAD_SHA={head_sha}')
          print(f'PROFILE={profile}')
          PY

          source /tmp/composer-request.env

          case "$PROFILE" in
            canvas-ai-agents-530)
              mode='package'
              expected_package='drupal/ai_agents'
              expected_constraint='^1.3'
              ;;
            config-language-lock-628)
              mode='package'
              expected_package='drupal/config_language_lock'
              expected_constraint='^1.0'
              ;;
            dependency-maintenance-962)
              mode='lock-refresh'
              expected_package=''
              expected_constraint=''
              ;;
            *)
              echo 'Unsupported Composer materialization profile' >&2
              exit 1
              ;;
          esac

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          test "$(jq -r '.state' <<<"$pr_json")" = 'open'
          test "$(jq -r '.base.ref' <<<"$pr_json")" = 'main'
          test "$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")" \
            = "$GITHUB_REPOSITORY"
          test "$(jq -r '.head.sha' <<<"$pr_json")" = "$HEAD_SHA"

          base_sha="$(jq -r '.base.sha' <<<"$pr_json")"
          changed="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[].filename'
          )"

          gh api \
            "repos/$GITHUB_REPOSITORY/contents/composer.json?ref=$base_sha" \
            --jq '.content' | tr -d '\n' | base64 --decode \
            > /tmp/composer-base.json
          gh api \
            "repos/$GITHUB_REPOSITORY/contents/composer.json?ref=$HEAD_SHA" \
            --jq '.content' | tr -d '\n' | base64 --decode \
            > /tmp/composer-target.json

          if [[ "$mode" == 'package' ]]; then
            if [[ "$changed" != 'composer.json' ]]; then
              echo 'Package target PR must change exactly composer.json before resolution.' >&2
              printf '%s\n' "$changed" >&2
              exit 1
            fi

            EXPECTED_PACKAGE="$expected_package" \
            EXPECTED_CONSTRAINT="$expected_constraint" \
            python3 - <<'PY'
          import copy
          import json
          import os

          with open('/tmp/composer-base.json', encoding='utf-8') as handle:
              base = json.load(handle)
          with open('/tmp/composer-target.json', encoding='utf-8') as handle:
              target = json.load(handle)

          expected = copy.deepcopy(base)
          expected.setdefault('require', {})[os.environ['EXPECTED_PACKAGE']] = (
              os.environ['EXPECTED_CONSTRAINT']
          )
          if target != expected:
              raise SystemExit(
                  'Target composer.json contains changes outside the reviewed '
                  'Composer profile.'
              )
          PY
          elif [[ "$mode" == 'lock-refresh' ]]; then
            if [[ -n "$changed" ]]; then
              echo 'Lock-refresh target PR must have no file delta before resolution.' >&2
              printf '%s\n' "$changed" >&2
              exit 1
            fi
            cmp /tmp/composer-base.json /tmp/composer-target.json
          else
            echo "Unsupported Composer materialization mode: $mode" >&2
            exit 1
          fi

          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

      - name: Snapshot trusted workflow run IDs
        id: before
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow trusted-composer-materialization.yml \
            --event workflow_dispatch \
            --limit 30 \
            --json databaseId \
            --jq '.[].databaseId' \
            | sort -n > /tmp/composer-runs-before.txt

      - name: Dispatch trusted Composer materialization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          PR_NUMBER: ${{ steps.request.outputs.pr_number }}
          HEAD_SHA: ${{ steps.request.outputs.head_sha }}
          PROFILE: ${{ steps.request.outputs.profile }}
        run: |
          set -euo pipefail
          gh workflow run trusted-composer-materialization.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "request_id=$REQUEST_ID" \
            -f "pr_number=$PR_NUMBER" \
            -f "head_sha=$HEAD_SHA" \
            -f "profile=$PROFILE"

      - name: Discover exact trusted workflow run
        id: trusted
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trusted_run_id=''
          for _ in $(seq 1 30); do
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow trusted-composer-materialization.yml \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId \
              --jq '.[].databaseId' \
              | sort -n > /tmp/composer-runs-after.txt

            trusted_run_id="$(
              comm -13 \
                /tmp/composer-runs-before.txt \
                /tmp/composer-runs-after.txt \
                | tail -n 1
            )"
            if [[ -n "$trusted_run_id" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$trusted_run_id" ]]; then
            echo 'Trusted Composer workflow run was not discoverable.' >&2
            exit 1
          fi

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${trusted_run_id}"
          echo "run_id=$trusted_run_id" >> "$GITHUB_OUTPUT"
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"

      - name: Publish pending target status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.request.outputs.head_sha }}
          RUN_URL: ${{ steps.trusted.outputs.run_url }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f state='pending' \
            -f context='agency/composer-materialization' \
            -f description='Governed Composer materialization running' \
            -f target_url="$RUN_URL" >/dev/null

      - name: Observe trusted workflow conclusion
        id: conclusion
        if: ${{ always() && steps.trusted.outputs.run_id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_RUN_ID: ${{ steps.trusted.outputs.run_id }}
        run: |
          set -euo pipefail
          conclusion=''
          for _ in $(seq 1 900); do
            run_json="$(
              gh run view "$TRUSTED_RUN_ID" \
                --repo "$GITHUB_REPOSITORY" \
                --json status,conclusion
            )"
            status="$(jq -r '.status' <<<"$run_json")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$run_json")"
            if [[ "$status" == 'completed' ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$conclusion" ]]; then
            conclusion='timed_out'
          fi
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"

      - name: Publish final target status and diagnostic comment
        if: ${{ always() && steps.trusted.outputs.run_id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.request.outputs.pr_number }}
          INPUT_HEAD_SHA: ${{ steps.request.outputs.head_sha }}
          TRUSTED_RUN_ID: ${{ steps.trusted.outputs.run_id }}
          RUN_URL: ${{ steps.trusted.outputs.run_url }}
          CONCLUSION: ${{ steps.conclusion.outputs.conclusion }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
        run: |
          set -euo pipefail

          state='failure'
          description="Composer materialization ${CONCLUSION:-unknown}"
          if [[ "$CONCLUSION" == 'success' ]]; then
            state='success'
            description='Governed Composer materialization succeeded'
          fi

          publish_status() {
            local sha="$1"
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/statuses/$sha" \
              -f state="$state" \
              -f context='agency/composer-materialization' \
              -f description="$description" \
              -f target_url="$RUN_URL" >/dev/null
          }

          publish_status "$INPUT_HEAD_SHA"

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          live_head="$(jq -r '.head.sha' <<<"$pr_json")"
          output_head="$INPUT_HEAD_SHA"
          if [[ "$state" == 'success' && "$live_head" != "$INPUT_HEAD_SHA" ]]; then
            parent_sha="$(
              gh api "repos/$GITHUB_REPOSITORY/commits/$live_head" \
                --jq '.parents[0].sha // ""'
            )"
            if [[ "$parent_sha" == "$INPUT_HEAD_SHA" ]]; then
              publish_status "$live_head"
              output_head="$live_head"
            fi
          fi

          body="$(cat <<EOF
          ### Governed Composer materialization — ${CONCLUSION:-unknown}

          - request: \`${REQUEST_ID}\`
          - trusted workflow run: \`${TRUSTED_RUN_ID}\`
          - input HEAD: \`${INPUT_HEAD_SHA}\`
          - observed output HEAD: \`${output_head}\`
          - status context: \`agency/composer-materialization\`

          The observable gateway tracked the exact trusted run. Inspect the linked status run for the failing job when the conclusion is not success.
          EOF
          )"
          gh pr comment "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "$body"

          test "$state" = 'success'
