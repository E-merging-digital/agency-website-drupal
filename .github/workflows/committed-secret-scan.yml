name: Committed secret scan

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  committed-secret-scan:
    name: Committed secret scan
    runs-on: ubuntu-latest
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      GITLEAKS_VERSION: v8.30.1
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

    steps:
      - name: Checkout exact candidate with full history
        uses: actions/checkout@v5
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact complete Git history
        shell: bash
        run: |
          set -euo pipefail

          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD"
          test "$(git rev-parse --is-shallow-repository)" = "false"
          git cat-file -e "${EXPECTED_HEAD}^{commit}"

          commit_count="$(git rev-list --count HEAD)"
          test "$commit_count" -gt 0

          git_stderr="$(mktemp)"
          trap 'rm -f "$git_stderr"' EXIT

          if ! git log -p -U0 --full-history HEAD --diff-filter=tuxdb >/dev/null 2>"$git_stderr"; then
            echo "Git history proof failed." >&2
            exit 1
          fi

          if [ -s "$git_stderr" ]; then
            echo "Git history proof produced stderr; refusing to scan." >&2
            exit 1
          fi

          echo "REPOSITORY_HEAD=$actual_head"
          echo "HISTORY_COMMIT_COUNT=$commit_count"
          echo "HISTORY_PREREQUISITES=PASS"

      - name: Scan committed secrets
        shell: bash
        run: |
          set -euo pipefail

          docker pull "$GITLEAKS_IMAGE" >/dev/null
          version_output="$(docker run --rm --network none "$GITLEAKS_IMAGE" --version)"
          test "$version_output" = "gitleaks version $GITLEAKS_VERSION"

          echo "SCANNER_VERSION=$GITLEAKS_VERSION"
          echo "SCANNER_IDENTITY=${GITLEAKS_IMAGE##*@}"
          echo "REPOSITORY_HEAD=$EXPECTED_HEAD"
          echo "SCAN_MODE=HISTORY"

          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -w /repo \
            "$GITLEAKS_IMAGE" \
            git \
            --config=/repo/.gitleaks.toml \
            --redact=100 \
            --no-banner \
            --no-color \
            --log-level=info \
            --log-opts="--full-history HEAD --diff-filter=tuxdb" \
            .

          echo "RESULT=PASS"
          echo "SECRET_VALUES_LOGGED=NONE"
