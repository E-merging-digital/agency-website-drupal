name: "#1316 Configuration-language migration materialization"

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/config-language-policy-migration-1316-hosted-ddev.yml'
      - 'scripts/runner/config-language-ai-automator-diagnostic-1316.php'
      - 'docs/evidence/config-language-migration-1316-commit-approval.yml'
      - 'config/sync/**'
      - 'docs/configuration-language-policy.yml'
      - 'docs/configuration-language-governance.md'
      - 'AGENTS.md'
      - 'web/modules/custom/agency_project_tests/tests/src/**'
      - 'web/modules/custom/agency_ai_translation/**'

permissions:
  contents: write

jobs:
  migration:
    name: "#1316 hosted Drupal-owned migration"
    if: ${{ github.event.pull_request.head.ref == 'fix/1316-configuration-language-policy-migration' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact checkout and historical boundaries
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD" ]]
          git diff --check "$BASE_SHA..$EXPECTED_HEAD"
          git diff --quiet "$BASE_SHA..$EXPECTED_HEAD" --             docs/decisions/ADR-002-configuration-language-governance.md             .github/workflows/config-language-lock-609-hosted-ddev.yml

      - name: Setup DDEV without autostart
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Isolate hosted DDEV project
        shell: bash
        run: |
          set -euo pipefail
          cat > .ddev/config.gate-config-language-1316-hosted.yaml <<EOF
          name: agency-config-language-1316-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          EOF
          ddev utility configyaml             | grep -F "agency-config-language-1316-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Determine repository migration mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          settings='config/sync/config_language_lock.settings.yml'
          locked="$(awk -F': ' '/^locked_langcode:/ {print $2}' "$settings")"
          follow="$(awk -F': ' '/^follow_site_default:/ {print $2}' "$settings")"
          if [[ "$locked" == 'en' && "$follow" == 'false' ]]; then
            mode='MATERIALIZE'
          elif [[ "$locked" == 'fr' && "$follow" == 'true' ]]; then
            mode='VERIFY'
          else
            echo "Unsupported lock settings: $locked / $follow" >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "MODE=$mode"

      - name: Install exact dependencies and existing configuration
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          ddev start -y
          ddev composer install --no-interaction --no-progress --prefer-dist

          if [[ "$MODE" == 'MATERIALIZE' ]]; then
            provenance='artifacts/config-language-repository-en-intent-1316'
            mkdir -p "$provenance"
            ddev exec env AGENCY_CONFIG_LANGUAGE_PROVENANCE_STAGE=repository-source \
              php /var/www/html/scripts/runner/config-language-repository-en-intent-diagnostic-1316.php \
              > "$provenance/repository-source.json"
            jq -e '
              .schema_version == 1
              and .stage == "repository-source"
              and .object_count > 0
              and .raw_config_values_exposed == false
            ' "$provenance/repository-source.json" >/dev/null
          fi

          admin_pass="$(openssl rand -hex 24)"
          ddev drush site:install --existing-config -y             --account-pass="$admin_pass"             >"${RUNNER_TEMP}/site-install-1316.log" 2>&1
          unset admin_pass

          grep -Fq 'Installation complete.' "${RUNNER_TEMP}/site-install-1316.log"

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          text = (root / "site-install-1316.log").read_text(
              encoding="utf-8",
              errors="replace",
          )
          matches = re.findall(
              r"([0-9]+)\s+configuration objects updated",
              text,
              flags=re.IGNORECASE,
          )
          (root / "normalization-count.txt").write_text(
              (matches[-1] if matches else "0") + "\n",
              encoding="utf-8",
          )
          PY

      - name: Discover repository-owned EN divergences before reconciliation
        if: ${{ steps.mode.outputs.mode == 'MATERIALIZE' }}
        shell: bash
        run: |
          set -euo pipefail
          helper='/var/www/html/scripts/runner/reconcile-config-language-repository-en-intent-1316.php'
          artifact='artifacts/config-language-repository-en-reconciliation-1316'
          mkdir -p "$artifact"

          ddev exec env \
            AGENCY_CONFIG_LANGUAGE_REPOSITORY_EN_RECONCILE=1 \
            AGENCY_CONFIG_LANGUAGE_REPOSITORY_EN_MODE=ANALYZE \
            vendor/bin/drush php:script "$helper" \
            > "$artifact/before.json"

          jq -e '
            .schema_version == 1
            and .status == "PASS"
            and .mode == "ANALYZE"
            and .divergent_object_count_before == 3
            and .divergent_path_count_before == 3
            and .divergent_objects_before == [
              "language.entity.fr",
              "llms_txt.settings",
              "taxonomy.vocabulary.tags"
            ]
            and ([.divergent_paths_before[] | "\(.config):\(.path)"] == [
              "language.entity.fr:label",
              "llms_txt.settings:content",
              "taxonomy.vocabulary.tags:description"
            ])
            and ([.divergent_paths_before[].schema_translatability] | all(. == "YES"))
            and (.divergence_sha256 | test("^[0-9a-f]{64}$"))
            and .raw_config_values_exposed == false
            and .prod_access == "NONE"
            and .preprod_access == "NONE"
          ' "$artifact/before.json" >/dev/null

          jq -r '.divergence_sha256' "$artifact/before.json" \
            > "${RUNNER_TEMP}/repository-en-divergence-sha256.txt"

      - name: Reconcile repository-owned historical EN before manager
        if: ${{ steps.mode.outputs.mode == 'MATERIALIZE' }}
        shell: bash
        run: |
          set -euo pipefail
          helper='/var/www/html/scripts/runner/reconcile-config-language-repository-en-intent-1316.php'
          artifact='artifacts/config-language-repository-en-reconciliation-1316'
          expected_sha="$(cat "${RUNNER_TEMP}/repository-en-divergence-sha256.txt")"

          ddev exec env \
            AGENCY_CONFIG_LANGUAGE_REPOSITORY_EN_RECONCILE=1 \
            AGENCY_CONFIG_LANGUAGE_REPOSITORY_EN_MODE=RECONCILE \
            AGENCY_CONFIG_LANGUAGE_REPOSITORY_EN_EXPECTED_DIVERGENCE_SHA256="$expected_sha" \
            vendor/bin/drush php:script "$helper" \
            > "$artifact/result.json"

          jq -e '
            def sha256: type == "string" and test("^[0-9a-f]{64}$");
            def boolean: type == "boolean";
            def classification:
              . == "CONVERGED"
              or . == "LANGUAGE_EN_OVERRIDE_MASKS_CANONICAL"
              or . == "CANONICAL_WRITE_DID_NOT_PERSIST"
              or . == "OTHER_EFFECTIVE_LAYER"
              or . == "UNCLASSIFIED";
            def layer_shape:
              (.source_sha256 | sha256)
              and (.canonical_before_exists | boolean)
              and (.canonical_before_sha256 | sha256)
              and (.en_override_object_before_exists | boolean)
              and (.en_override_path_before_exists | boolean)
              and (.en_override_before_sha256 | sha256)
              and (.effective_en_before_exists | boolean)
              and (.effective_en_before_sha256 | sha256)
              and (.canonical_after_exists | boolean)
              and (.canonical_after_sha256 | sha256)
              and (.en_override_object_after_exists | boolean)
              and (.en_override_path_after_exists | boolean)
              and (.en_override_after_sha256 | sha256)
              and (.effective_en_after_exists | boolean)
              and (.effective_en_after_sha256 | sha256)
              and (.source_equals_canonical_after | boolean)
              and (.source_equals_en_override_after | boolean)
              and (.source_equals_effective_after | boolean)
              and (.source_equals_after | boolean)
              and (.masking_classification | classification)
              and (.masking_classification_before_cleanup | classification)
              and (.override_path_cleared | boolean)
              and (.override_object_deleted | boolean)
              and (.source_equals_effective_after_cleanup | boolean);

            .schema_version == 1
            and .mode == "RECONCILE"
            and .divergent_object_count_before == 3
            and .divergent_path_count_before == 3
            and .divergent_objects_before == [
              "language.entity.fr",
              "llms_txt.settings",
              "taxonomy.vocabulary.tags"
            ]
            and ([.divergent_paths_before[] | "\(.config):\(.path)"] == [
              "language.entity.fr:label",
              "llms_txt.settings:content",
              "taxonomy.vocabulary.tags:description"
            ])
            and .reconciled_object_count == 3
            and .reconciled_path_count == 3
            and (.reconciled_paths | length == 3)
            and ([.reconciled_paths[].schema_translatability] | all(. == "YES"))
            and ([.reconciled_paths[] | layer_shape] | all)
            and (.masking_object_count_before_cleanup | type == "number")
            and (.masking_path_count_before_cleanup | type == "number")
            and (.masking_paths_before_cleanup | type == "array")
            and (.cleared_override_path_count | type == "number")
            and (.cleared_override_object_count | type == "number")
            and (.deleted_empty_override_object_count | type == "number")
            and (.saved_nonempty_override_object_count | type == "number")
            and .raw_config_values_exposed == false
            and .prod_access == "NONE"
            and .preprod_access == "NONE"
          ' "$artifact/result.json" >/dev/null

          jq '{
            divergent_object_count_before,
            divergent_path_count_before,
            reconciled_object_count,
            reconciled_path_count,
            masking_object_count_before_cleanup,
            masking_path_count_before_cleanup,
            cleared_override_path_count,
            cleared_override_object_count,
            deleted_empty_override_object_count,
            saved_nonempty_override_object_count,
            divergent_object_count_after,
            divergent_path_count_after,
            reconciled_paths: [.reconciled_paths[] | {
              config,
              path,
              ownership,
              schema_type,
              schema_translatability,
              masking_classification_before_cleanup,
              override_path_cleared,
              override_object_deleted,
              source_equals_effective_after_cleanup
            }]
          }' "$artifact/result.json"

      - name: Upload repository EN reconciliation layer diagnostic
        if: ${{ steps.mode.outputs.mode == 'MATERIALIZE' }}
        uses: actions/upload-artifact@v4
        with:
          name: agency-config-language-repository-en-reconciliation-1316-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/config-language-repository-en-reconciliation-1316
          if-no-files-found: error
          retention-days: 30

      - name: Enforce strict repository EN reconciliation convergence
        if: ${{ steps.mode.outputs.mode == 'MATERIALIZE' }}
        shell: bash
        run: |
          set -euo pipefail
          artifact='artifacts/config-language-repository-en-reconciliation-1316'

          jq -e '
            .schema_version == 1
            and .status == "PASS"
            and .mode == "RECONCILE"
            and .divergent_object_count_before == 3
            and .divergent_path_count_before == 3
            and .divergent_objects_before == [
              "language.entity.fr",
              "llms_txt.settings",
              "taxonomy.vocabulary.tags"
            ]
            and ([.divergent_paths_before[] | "\(.config):\(.path)"] == [
              "language.entity.fr:label",
              "llms_txt.settings:content",
              "taxonomy.vocabulary.tags:description"
            ])
            and .reconciled_object_count == 3
            and .reconciled_path_count == 3
            and .masking_object_count_before_cleanup == 2
            and .masking_path_count_before_cleanup == 2
            and .cleared_override_path_count == 2
            and ([.reconciled_paths[].schema_translatability] | all(. == "YES"))
            and ([.reconciled_paths[].source_equals_effective_after_cleanup] | all(. == true))
            and .divergent_object_count_after == 0
            and .divergent_path_count_after == 0
            and .raw_config_values_exposed == false
            and .prod_access == "NONE"
            and .preprod_access == "NONE"
          ' "$artifact/result.json" >/dev/null

      - name: Capture repository EN provenance after site install before manager
        if: ${{ steps.mode.outputs.mode == 'MATERIALIZE' }}
        shell: bash
        run: |
          set -euo pipefail
          provenance='artifacts/config-language-repository-en-intent-1316'
          ddev exec env AGENCY_CONFIG_LANGUAGE_PROVENANCE_STAGE=pre-manager \
            vendor/bin/drush php:script \
            /var/www/html/scripts/runner/config-language-repository-en-intent-diagnostic-1316.php \
            > "$provenance/pre-manager.json"
          jq -e '
            .schema_version == 1
            and .stage == "pre-manager"
            and (.targets | length == 4)
            and .raw_config_values_exposed == false
          ' "$provenance/pre-manager.json" >/dev/null

      - name: Prove Agency AI Automator config-schema compatibility
        shell: bash
        run: |
          set -euo pipefail
          ddev exec env \
            SYMFONY_DEPRECATIONS_HELPER=disabled \
            SIMPLETEST_BASE_URL=http://agency-website-drupal.ddev.site \
            SIMPLETEST_DB=mysql://db:db@db/db \
            vendor/bin/phpunit -c web/core/phpunit.xml.dist \
            web/modules/custom/agency_ai_translation/tests/src/Kernel/AiAutomatorConfigSchemaCompatibilityKernelTest.php

      - name: Capture effective FR/EN semantics before migration
        shell: bash
        run: |
          set -euo pipefail
          ddev drush php:script             /var/www/html/scripts/runner/config-language-effective-semantics-1316.php             > "${RUNNER_TEMP}/effective-before.json"
          jq -e '
            .schema_version == 1
            and .config_values_exposed == false
            and .languages.fr.count > 0
            and .languages.en.count > 0
          ' "${RUNNER_TEMP}/effective-before.json" >/dev/null

      - name: Capture two-target storage/schema diagnostic before migration
        if: ${{ steps.mode.outputs.mode == 'MATERIALIZE' }}
        shell: bash
        run: |
          set -euo pipefail
          helper='/var/www/html/scripts/runner/config-language-ai-automator-diagnostic-1316.php'
          ddev drush php:script "$helper" > "${RUNNER_TEMP}/ai-automator-before.json"

          locked_ai_version="$(php -r '
            $lock = json_decode(file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR);
            foreach ($lock["packages"] as $package) {
              if (($package["name"] ?? null) === "drupal/ai") {
                echo $package["version"];
                exit(0);
              }
            }
            exit(1);
          ')"
          [[ "$locked_ai_version" == '1.5.0-rc4' ]]

          jq -e --arg version "$locked_ai_version" '
            .schema_version == 1
            and .ai_version == $version
            and (.ai_automator_schema_source_path | type == "string")
            and (.ai_automator_schema_source_sha256 | test("^[0-9a-f]{64}$"))
            and (.targets | length == 2)
            and .raw_config_values_exposed == false
          ' "${RUNNER_TEMP}/ai-automator-before.json" >/dev/null

      - name: Apply Candidate A through Config Language Lock manager
        if: ${{ steps.mode.outputs.mode == 'MATERIALIZE' }}
        shell: bash
        run: |
          set -euo pipefail
          ddev exec env AGENCY_CONFIG_LANGUAGE_1316_EXECUTE=1             vendor/bin/drush php:script             /var/www/html/scripts/runner/apply-config-language-policy-1316.php             > "${RUNNER_TEMP}/drupal-owned-migration.json"
          jq -e '
            .schema_version == 1
            and .status == "PASS"
            and .locked_langcode == "fr"
            and .follow_site_default == true
            and .site_default_language == "fr"
          ' "${RUNNER_TEMP}/drupal-owned-migration.json" >/dev/null

      - name: Capture repository EN provenance after manager
        if: ${{ steps.mode.outputs.mode == 'MATERIALIZE' }}
        shell: bash
        run: |
          set -euo pipefail
          provenance='artifacts/config-language-repository-en-intent-1316'
          ddev exec env AGENCY_CONFIG_LANGUAGE_PROVENANCE_STAGE=post-manager \
            vendor/bin/drush php:script \
            /var/www/html/scripts/runner/config-language-repository-en-intent-diagnostic-1316.php \
            > "$provenance/post-manager.json"
          jq -e '
            .schema_version == 1
            and .stage == "post-manager"
            and (.targets | length == 4)
            and .raw_config_values_exposed == false
          ' "$provenance/post-manager.json" >/dev/null

      - name: Prove installed policy runtime before final materialization
        shell: bash
        run: |
          set -euo pipefail
          helper='/var/www/html/scripts/runner/config-language-policy-candidate-1314-runtime-proof.php'
          ddev drush php:script "$helper" > "${RUNNER_TEMP}/runtime-before.json"
          jq -e '
            .drupal_core_version == "11.4.7"
            and .canvas_version == "1.11.0"
            and .config_language_lock_version == "1.0.2"
            and .site_default_language == "fr"
            and .locked_langcode == "fr"
            and .follow_site_default == true
            and .canvas_requirement_verdict == "PASS"
            and .languages.und.id == "und"
            and .languages.und.locked == true
            and .languages.zxx.id == "zxx"
            and .languages.zxx.locked == true
            and .config_values_exposed == false
          ' "${RUNNER_TEMP}/runtime-before.json" >/dev/null

      - name: Build bounded two-target AI Automator diagnostic
        if: ${{ steps.mode.outputs.mode == 'MATERIALIZE' }}
        shell: bash
        run: |
          set -euo pipefail
          helper='/var/www/html/scripts/runner/config-language-ai-automator-diagnostic-1316.php'
          ddev drush php:script "$helper" > "${RUNNER_TEMP}/ai-automator-after.json"

          before="${RUNNER_TEMP}/ai-automator-before.json"
          after="${RUNNER_TEMP}/ai-automator-after.json"
          migration="${RUNNER_TEMP}/drupal-owned-migration.json"
          artifact="${RUNNER_TEMP}/ai-automator-diagnostic-1316"
          mkdir -p "$artifact"

          jq -n             --slurpfile before "$before"             --slurpfile after "$after"             --slurpfile migration "$migration" '
              def sorted_keys($map): ($map | keys | sort);
              def difference($left; $right):
                [$left[] | select(($right | index(.)) == null)];
              def common($left; $right):
                [$left[] | select(($right | index(.)) != null)];
              def layer_diff($b; $a):
                sorted_keys($b.per_leaf_path_sha256) as $before_paths
                | sorted_keys($a.per_leaf_path_sha256) as $after_paths
                | difference($after_paths; $before_paths) as $added
                | difference($before_paths; $after_paths) as $removed
                | common($before_paths; $after_paths) as $shared
                | [
                    $shared[]
                    | select(
                        $b.per_leaf_path_sha256[.]
                        != $a.per_leaf_path_sha256[.]
                      )
                  ] as $changed
                | {
                    before_exists: $b.object_exists,
                    after_exists: $a.object_exists,
                    before_whole_layer_sha256: $b.whole_layer_sha256,
                    after_whole_layer_sha256: $a.whole_layer_sha256,
                    added_paths: $added,
                    removed_paths: $removed,
                    changed_paths: $changed,
                    unchanged_path_count:
                      (($shared | length) - ($changed | length)),
                    added_count: ($added | length),
                    removed_count: ($removed | length),
                    changed_count: ($changed | length)
                  };
              def target_diff($name):
                ($before[0].targets[$name]) as $b
                | ($after[0].targets[$name]) as $a
                | {
                    target: $name,
                    base: layer_diff($b.layers.base; $a.layers.base),
                    fr_override:
                      layer_diff($b.layers.fr_override; $a.layers.fr_override),
                    en_override:
                      layer_diff($b.layers.en_override; $a.layers.en_override),
                    effective_fr:
                      layer_diff($b.layers.effective_fr; $a.layers.effective_fr),
                    effective_en:
                      layer_diff($b.layers.effective_en; $a.layers.effective_en)
                  }
                | . as $diff
                | (
                    [
                      $diff.base.changed_paths[],
                      $diff.fr_override.changed_paths[],
                      $diff.en_override.changed_paths[],
                      $diff.effective_fr.changed_paths[],
                      $diff.effective_en.changed_paths[],
                      $diff.base.added_paths[],
                      $diff.fr_override.added_paths[],
                      $diff.en_override.added_paths[],
                      $diff.effective_fr.added_paths[],
                      $diff.effective_en.added_paths[],
                      $diff.base.removed_paths[],
                      $diff.fr_override.removed_paths[],
                      $diff.en_override.removed_paths[],
                      $diff.effective_fr.removed_paths[],
                      $diff.effective_en.removed_paths[]
                    ]
                    | unique
                  ) as $changed_paths
                | $diff + {
                    changed_path_schema_classification:
                      [
                        $changed_paths[]
                        | . as $path
                        | (
                            $a.schema_by_path[$path]
                            // $b.schema_by_path[$path]
                            // {
                              schema_path: $path,
                              schema_type: "UNKNOWN",
                              schema_definition_present: "NO",
                              schema_translatability: "UNKNOWN"
                            }
                          )
                      ]
                  };
              ($before[0].targets | keys | sort) as $targets
              | {
                  schema_version: 1,
                  ai_version: $after[0].ai_version,
                  ai_automator_schema_source_path:
                    $after[0].ai_automator_schema_source_path,
                  ai_automator_schema_source_sha256:
                    $after[0].ai_automator_schema_source_sha256,
                  manager_stats: {
                    config_items_changed:
                      ($migration[0].stats.config_items_changed // null),
                    translations_updated:
                      ($migration[0].stats.translations_updated // null),
                    translations_removed:
                      ($migration[0].stats.translations_removed // null)
                  },
                  targets:
                    (
                      reduce $targets[] as $target
                        ({}; .[$target] = target_diff($target))
                    ),
                  raw_config_values_exposed: false
                }
            ' > "$artifact/result.json"

          jq -e '
            .schema_version == 1
            and .ai_version == "1.5.0-rc4"
            and (.ai_automator_schema_source_path | type == "string")
            and (.ai_automator_schema_source_sha256 | test("^[0-9a-f]{64}$"))
            and (.targets | length == 2)
            and (
              [
                .targets[]
                | .base,
                  .fr_override,
                  .en_override,
                  .effective_fr,
                  .effective_en
                | .added_paths[],
                  .removed_paths[],
                  .changed_paths[]
              ]
              | all(type == "string")
            )
            and (
              [
                .targets[]
                | .changed_path_schema_classification[]
                | .schema_definition_present
              ]
              | all(. == "YES" or . == "NO")
            )
            and .raw_config_values_exposed == false
          ' "$artifact/result.json" >/dev/null

      - name: Upload bounded two-target AI Automator diagnostic
        if: ${{ steps.mode.outputs.mode == 'MATERIALIZE' }}
        uses: actions/upload-artifact@v4
        with:
          name: agency-config-language-ai-automator-diagnostic-1316-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ai-automator-diagnostic-1316/result.json
          if-no-files-found: error
          retention-days: 30

      - name: Build bounded effective FR/EN semantic diagnostic
        shell: bash
        run: |
          set -euo pipefail
          ddev drush php:script             /var/www/html/scripts/runner/config-language-effective-semantics-1316.php             > "${RUNNER_TEMP}/effective-after.json"

          jq -e '
            .und.id == "und"
            and .und.locked == true
            and .zxx.id == "zxx"
            and .zxx.locked == true
          ' "${RUNNER_TEMP}/effective-after.json" >/dev/null

          mkdir -p "${RUNNER_TEMP}/semantic-diagnostic-1316"
          jq -n             --slurpfile before "${RUNNER_TEMP}/effective-before.json"             --slurpfile after "${RUNNER_TEMP}/effective-after.json" '
              def sorted_keys($map): ($map | keys | sort);
              def difference($left; $right):
                [$left[] | select(($right | index(.)) == null)];
              def common($left; $right):
                [$left[] | select(($right | index(.)) != null)];
              def diagnostic($lang):
                ($before[0].languages[$lang]) as $b
                | ($after[0].languages[$lang]) as $a
                | sorted_keys($b.object_fingerprints) as $before_names
                | sorted_keys($a.object_fingerprints) as $after_names
                | difference($after_names; $before_names) as $added
                | difference($before_names; $after_names) as $removed
                | common($before_names; $after_names) as $shared
                | [
                    $shared[]
                    | select(
                        $b.object_fingerprints[.]
                        != $a.object_fingerprints[.]
                      )
                  ] as $changed
                | {
                    names_equal: ($b.names_sha256 == $a.names_sha256),
                    values_equal: ($b.values_sha256 == $a.values_sha256),
                    before_count: $b.count,
                    after_count: $a.count,
                    before_names_sha256: $b.names_sha256,
                    after_names_sha256: $a.names_sha256,
                    before_values_sha256: $b.values_sha256,
                    after_values_sha256: $a.values_sha256,
                    added_object_names: $added,
                    removed_object_names: $removed,
                    changed_object_names: $changed,
                    added_count: ($added | length),
                    removed_count: ($removed | length),
                    changed_count: ($changed | length)
                  };
              {
                schema_version: 1,
                fr: diagnostic("fr"),
                en: diagnostic("en"),
                raw_config_values_exposed: false
              }
            ' > "${RUNNER_TEMP}/semantic-diagnostic-1316/result.json"

          jq -e '
            .schema_version == 1
            and (.fr.names_equal | type == "boolean")
            and (.fr.values_equal | type == "boolean")
            and (.en.names_equal | type == "boolean")
            and (.en.values_equal | type == "boolean")
            and (.fr.added_object_names | type == "array")
            and (.fr.removed_object_names | type == "array")
            and (.fr.changed_object_names | type == "array")
            and (.en.added_object_names | type == "array")
            and (.en.removed_object_names | type == "array")
            and (.en.changed_object_names | type == "array")
            and .raw_config_values_exposed == false
          ' "${RUNNER_TEMP}/semantic-diagnostic-1316/result.json" >/dev/null

      - name: Upload bounded FR/EN semantic diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: agency-config-language-semantic-diagnostic-1316-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/semantic-diagnostic-1316/result.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce unchanged effective FR/EN semantic equality
        shell: bash
        run: |
          set -euo pipefail
          diagnostic="${RUNNER_TEMP}/semantic-diagnostic-1316/result.json"
          jq -e '
            .fr.names_equal == true
            and .fr.values_equal == true
            and .en.names_equal == true
            and .en.values_equal == true
          ' "$diagnostic" >/dev/null

      - name: Capture pre-materialization config status
        shell: bash
        run: |
          set -euo pipefail
          ddev drush config:status --format=json             > "${RUNNER_TEMP}/config-status-before.json"
          jq -e 'type == "array" or type == "object"'             "${RUNNER_TEMP}/config-status-before.json" >/dev/null
          jq 'length' "${RUNNER_TEMP}/config-status-before.json"             > "${RUNNER_TEMP}/config-status-before-count.txt"

      - name: Final bounded materialization through Drupal export
        if: ${{ steps.mode.outputs.mode == 'MATERIALIZE' }}
        shell: bash
        run: |
          set -euo pipefail
          ddev drush cex -y > "${RUNNER_TEMP}/cex-1316.log" 2>&1
          git diff --check -- config/sync

      - name: Prove isolated two-override fresh-install roundtrip
        if: ${{ steps.mode.outputs.mode == 'VERIFY' }}
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eEuo pipefail

          artifact="${GITHUB_WORKSPACE}/artifacts/config-language-roundtrip-candidate-1316"
          candidate="${RUNNER_TEMP}/config-language-roundtrip-1316"
          site_install_log="${RUNNER_TEMP}/roundtrip-site-install.log"
          candidate_paths='["config/sync/language/en/llms_txt.settings.yml","config/sync/language/en/taxonomy.vocabulary.tags.yml"]'
          current_phase='INIT'
          completed_phases='[]'
          config_import_attempted='false'
          config_import_exit_code='-1'
          config_import_output_sha256='NONE'
          mkdir -p "$artifact"

          write_progress() {
            local status="${1:-RUNNING}"
            jq -n \
              --arg head_sha "$HEAD_SHA" \
              --arg status "$status" \
              --arg current_phase "$current_phase" \
              --argjson completed_phases "$completed_phases" \
              --argjson candidate_paths "$candidate_paths" \
              '{
                schema_version: 1,
                head_sha: $head_sha,
                mode: "VERIFY",
                experiment: "two_override_fresh_install_roundtrip",
                status: $status,
                current_phase: $current_phase,
                completed_phases: $completed_phases,
                candidate_paths: $candidate_paths,
                raw_config_values_exposed: false,
                primary_config_sync_mutated: false,
                prod_access: "NONE",
                preprod_access: "NONE"
              }' > "$artifact/progress.json"
          }

          begin_phase() {
            current_phase="$1"
            write_progress RUNNING
          }

          complete_phase() {
            completed_phases="$(
              jq -c --arg phase "$current_phase" '. + [$phase]' <<<"$completed_phases"
            )"
            write_progress RUNNING
          }

          record_failure() {
            local exit_code="$1"
            local site_install_log_sha256='NONE'
            if [[ "$current_phase" == 'SITE_INSTALL' || "$current_phase" == 'SITE_INSTALL_COMPLETION_GATE' ]] \
              && [[ -f "$site_install_log" ]]; then
              site_install_log_sha256="$(sha256sum "$site_install_log" | awk '{print $1}')"
            fi

            jq -n \
              --arg head_sha "$HEAD_SHA" \
              --arg failed_phase "$current_phase" \
              --argjson exit_code "$exit_code" \
              --argjson completed_phases "$completed_phases" \
              --argjson candidate_paths "$candidate_paths" \
              --arg site_install_log_sha256 "$site_install_log_sha256" \
              --argjson config_import_attempted "$config_import_attempted" \
              --argjson config_import_exit_code "$config_import_exit_code" \
              --arg config_import_output_sha256 "$config_import_output_sha256" \
              '{
                schema_version: 1,
                head_sha: $head_sha,
                mode: "VERIFY",
                experiment: "two_override_fresh_install_roundtrip",
                status: "FAIL",
                failed_phase: $failed_phase,
                exit_code: $exit_code,
                completed_phases: $completed_phases,
                candidate_paths: $candidate_paths,
                site_install_log_sha256: $site_install_log_sha256,
                site_install_safe_error_diagnostic: "NONE",
                config_import: {
                  attempted: $config_import_attempted,
                  exit_code: $config_import_exit_code,
                  output_sha256: $config_import_output_sha256
                },
                raw_config_values_exposed: false,
                primary_config_sync_mutated: false,
                prod_access: "NONE",
                preprod_access: "NONE"
              }' > "$artifact/failure.json"
            write_progress FAIL
          }

          cleanup_roundtrip() {
            set +e
            if [[ -d "$candidate" ]]; then
              (
                cd "$candidate"
                ddev delete --omit-snapshot --yes
              ) >/dev/null 2>&1 || true
              git worktree remove --force "$candidate" >/dev/null 2>&1 || true
            fi
          }

          on_roundtrip_exit() {
            local exit_code="$?"
            trap - EXIT ERR
            set +e
            if [[ "$exit_code" -ne 0 ]]; then
              record_failure "$exit_code"
            fi
            cleanup_roundtrip
            exit "$exit_code"
          }

          trap on_roundtrip_exit EXIT
          write_progress RUNNING

          begin_phase PRIMARY_FR_FINGERPRINT
          cat > "$artifact/target-fingerprints.php" <<'PHP'
          <?php
          declare(strict_types=1);
          use Drupal\language\Entity\ConfigurableLanguage;

          $langcode = getenv('AGENCY_TARGET_LANGCODE');
          if (!in_array($langcode, ['fr', 'en'], TRUE)) {
            throw new RuntimeException('Unsupported target language.');
          }
          $language = ConfigurableLanguage::load($langcode);
          if (!$language instanceof ConfigurableLanguage) {
            throw new RuntimeException('Target language is unavailable.');
          }
          $configFactory = \Drupal::service('config.factory');
          $overrideFactory = \Drupal::service('language.config_factory_override');
          $overrideFactory->setLanguage($language);
          $configFactory->reset();

          $fingerprint = static fn(mixed $value): string => hash(
            'sha256',
            json_encode(
              $value,
              JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE | JSON_THROW_ON_ERROR,
            ),
          );
          $targets = [
            'llms_txt_content' => ['llms_txt.settings', 'content'],
            'taxonomy_tags_name' => ['taxonomy.vocabulary.tags', 'name'],
            'taxonomy_tags_description' => ['taxonomy.vocabulary.tags', 'description'],
          ];
          $result = [];
          foreach ($targets as $key => [$name, $path]) {
            $result[$key] = ['sha256' => $fingerprint($configFactory->get($name)->get($path))];
          }
          echo json_encode([
            'schema_version' => 1,
            'langcode' => $langcode,
            'targets' => $result,
            'raw_config_values_exposed' => FALSE,
          ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL;
          PHP

          ddev exec env AGENCY_TARGET_LANGCODE=fr \
            vendor/bin/drush php:script \
            /var/www/html/artifacts/config-language-roundtrip-candidate-1316/target-fingerprints.php \
            > "$artifact/primary-fr.json"
          jq -e '
            .schema_version == 1
            and .langcode == "fr"
            and .raw_config_values_exposed == false
            and (.targets.llms_txt_content.sha256 | test("^[0-9a-f]{64}$"))
            and (.targets.taxonomy_tags_name.sha256 | test("^[0-9a-f]{64}$"))
            and (.targets.taxonomy_tags_description.sha256 | test("^[0-9a-f]{64}$"))
          ' "$artifact/primary-fr.json" >/dev/null
          complete_phase

          begin_phase WORKTREE_CREATE
          git worktree add --detach "$candidate" "$HEAD_SHA"
          cat > "$candidate/.ddev/config.roundtrip-1316.yaml" <<EOF
          name: agency-config-language-roundtrip-1316-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          EOF
          complete_phase

          begin_phase DDEV_START
          (
            cd "$candidate"
            ddev start -y
          )
          complete_phase

          begin_phase COMPOSER_INSTALL
          (
            cd "$candidate"
            ddev composer install --no-interaction --no-progress --prefer-dist
          )
          complete_phase

          begin_phase CANDIDATE_REPRESENTATION_BEFORE
          candidate_artifact="$candidate/artifacts/config-language-roundtrip-candidate-1316"
          mkdir -p "$candidate_artifact"

          cat > "$candidate_artifact/candidate-representation.php" <<'PHP'
          <?php
          declare(strict_types=1);

          use Symfony\Component\Yaml\Yaml;

          $root = dirname(__DIR__, 2);
          require_once $root . '/vendor/autoload.php';

          $stage = getenv('AGENCY_CANDIDATE_REPRESENTATION_STAGE');
          if (!in_array($stage, ['before', 'after'], TRUE)) {
            throw new RuntimeException('Unsupported representation stage.');
          }

          $paths = [
            'config/sync/language/en/llms_txt.settings.yml',
            'config/sync/language/en/taxonomy.vocabulary.tags.yml',
          ];

          $normalize = static function (mixed $value) use (&$normalize): mixed {
            if (!is_array($value)) {
              return $value;
            }
            if (array_is_list($value)) {
              return array_map($normalize, $value);
            }
            $result = [];
            foreach ($value as $key => $child) {
              $result[(string) $key] = $normalize($child);
            }
            ksort($result, SORT_STRING);
            return $result;
          };

          $topLevelKeys = static function (string $bytes): array {
            $keys = [];
            foreach (preg_split('/\r?\n/', $bytes) ?: [] as $line) {
              if (preg_match('/^([A-Za-z0-9_.-]+):(?:\s|$)/', $line, $matches) === 1) {
                $keys[] = $matches[1];
              }
            }
            return $keys;
          };

          $scalarMetadata = static function (string $bytes, string $key): array {
            $pattern = '/^' . preg_quote($key, '/') . ':(.*)$/m';
            if (preg_match($pattern, $bytes, $matches) !== 1) {
              return [
                'present' => FALSE,
                'style' => 'other',
                'chomping' => 'none',
                'indent_indicator' => 'none',
              ];
            }

            $serialized = ltrim(rtrim($matches[1], "\r"));
            $style = 'other';
            $chomping = 'none';
            $indent = 'none';

            if ($serialized !== '' && ($serialized[0] === '|' || $serialized[0] === '>')) {
              $style = $serialized[0] === '|' ? 'literal_block' : 'folded_block';
              $header = strtok($serialized, " \t") ?: $serialized;
              if (str_contains($header, '-')) {
                $chomping = 'strip';
              }
              elseif (str_contains($header, '+')) {
                $chomping = 'keep';
              }
              else {
                $chomping = 'clip';
              }
              if (preg_match('/[1-9]/', $header, $indentMatch) === 1) {
                $indent = (int) $indentMatch[0];
              }
            }
            elseif ($serialized !== '' && $serialized[0] === "'") {
              $style = 'single_quoted';
            }
            elseif ($serialized !== '' && $serialized[0] === '"') {
              $style = 'double_quoted';
            }
            elseif ($serialized !== '') {
              $style = 'plain';
            }

            return [
              'present' => TRUE,
              'style' => $style,
              'chomping' => $chomping,
              'indent_indicator' => $indent,
            ];
          };

          $files = [];
          foreach ($paths as $relativePath) {
            $absolutePath = $root . '/' . $relativePath;
            if (!is_file($absolutePath)) {
              throw new RuntimeException('Expected candidate config file is missing.');
            }
            $bytes = file_get_contents($absolutePath);
            if ($bytes === FALSE) {
              throw new RuntimeException('Unable to read candidate config file.');
            }
            $parsed = Yaml::parse($bytes);
            if (!is_array($parsed)) {
              throw new RuntimeException('Candidate YAML root must be a mapping.');
            }
            $semanticJson = json_encode(
              $normalize($parsed),
              JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE | JSON_THROW_ON_ERROR,
            );
            $endsWithNewline = $bytes !== '' && str_ends_with($bytes, "\n");
            $lineCount = substr_count($bytes, "\n");
            if ($bytes !== '' && !$endsWithNewline) {
              $lineCount++;
            }

            $representation = [];
            if ($relativePath === $paths[0]) {
              $representation['content'] = $scalarMetadata($bytes, 'content');
            }
            else {
              $representation['name'] = $scalarMetadata($bytes, 'name');
              $representation['description'] = $scalarMetadata($bytes, 'description');
            }

            $files[] = [
              'path' => $relativePath,
              'file_exists' => TRUE,
              'sha256' => hash('sha256', $bytes),
              'byte_count' => strlen($bytes),
              'line_count' => $lineCount,
              'ends_with_newline' => $endsWithNewline,
              'top_level_keys' => $topLevelKeys($bytes),
              'semantic_sha256' => hash('sha256', $semanticJson),
              'representation' => $representation,
            ];
          }

          echo json_encode([
            'schema_version' => 1,
            'stage' => $stage,
            'files' => $files,
            'raw_config_values_exposed' => FALSE,
          ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL;
          PHP

          (
            cd "$candidate"
            ddev exec env AGENCY_CANDIDATE_REPRESENTATION_STAGE=before \
              php /var/www/html/artifacts/config-language-roundtrip-candidate-1316/candidate-representation.php \
              > "$artifact/candidate-representation-before.json"
          )
          complete_phase

          begin_phase CANDIDATE_BUILD
          candidate_artifact="$candidate/artifacts/config-language-roundtrip-candidate-1316"
          mkdir -p "$candidate_artifact"
          cp "$artifact/target-fingerprints.php" "$candidate_artifact/target-fingerprints.php"

          cat > "$candidate_artifact/build-candidate.php" <<'PHP'
          <?php
          declare(strict_types=1);
          use Symfony\Component\Yaml\Yaml;

          $root = dirname(__DIR__, 2);
          require_once $root . '/vendor/autoload.php';
          $sync = $root . '/config/sync';
          $llmsSource = Yaml::parseFile($sync . '/llms_txt.settings.yml');
          $taxonomySource = Yaml::parseFile($sync . '/taxonomy.vocabulary.tags.yml');
          $taxonomyOverridePath = $sync . '/language/en/taxonomy.vocabulary.tags.yml';
          $taxonomyOverride = Yaml::parseFile($taxonomyOverridePath);

          foreach ([$llmsSource, $taxonomySource, $taxonomyOverride] as $data) {
            if (!is_array($data)) {
              throw new RuntimeException('Candidate source YAML is invalid.');
            }
          }
          if (!array_key_exists('content', $llmsSource)) {
            throw new RuntimeException('Missing canonical llms content.');
          }
          if (!array_key_exists('description', $taxonomySource)) {
            throw new RuntimeException('Missing canonical taxonomy description.');
          }

          $fingerprint = static fn(mixed $value): string => hash(
            'sha256',
            json_encode(
              $value,
              JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE | JSON_THROW_ON_ERROR,
            ),
          );

          $existingTaxonomyLeaves = array_keys($taxonomyOverride);
          sort($existingTaxonomyLeaves, SORT_STRING);
          $llmsCandidate = ['content' => $llmsSource['content']];
          $taxonomyCandidate = $taxonomyOverride;
          $taxonomyCandidate['description'] = $taxonomySource['description'];

          $llmsLeaves = array_keys($llmsCandidate);
          $taxonomyLeaves = array_keys($taxonomyCandidate);
          sort($llmsLeaves, SORT_STRING);
          sort($taxonomyLeaves, SORT_STRING);
          $expectedTaxonomyLeaves = array_values(array_unique([
            ...$existingTaxonomyLeaves,
            'description',
          ]));
          sort($expectedTaxonomyLeaves, SORT_STRING);
          if ($taxonomyLeaves !== $expectedTaxonomyLeaves) {
            throw new RuntimeException('Unexpected taxonomy candidate leaves.');
          }

          file_put_contents(
            $sync . '/language/en/llms_txt.settings.yml',
            Yaml::dump($llmsCandidate, 4, 2),
          );
          file_put_contents(
            $taxonomyOverridePath,
            Yaml::dump($taxonomyCandidate, 4, 2),
          );

          echo json_encode([
            'schema_version' => 1,
            'llms_en_leaf_paths' => $llmsLeaves,
            'taxonomy_existing_leaf_paths' => $existingTaxonomyLeaves,
            'taxonomy_en_leaf_paths' => $taxonomyLeaves,
            'taxonomy_leaf_set_valid' => TRUE,
            'llms' => [
              'source_sha256' => $fingerprint($llmsSource['content']),
              'candidate_sha256' => $fingerprint($llmsCandidate['content']),
            ],
            'taxonomy_description' => [
              'source_sha256' => $fingerprint($taxonomySource['description']),
              'candidate_sha256' => $fingerprint($taxonomyCandidate['description']),
            ],
            'taxonomy_name' => [
              'source_sha256' => $fingerprint($taxonomyOverride['name'] ?? NULL),
              'candidate_sha256' => $fingerprint($taxonomyCandidate['name'] ?? NULL),
            ],
            'raw_config_values_exposed' => FALSE,
          ], JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL;
          PHP

          (
            cd "$candidate"
            ddev exec php \
              /var/www/html/artifacts/config-language-roundtrip-candidate-1316/build-candidate.php \
              > "$artifact/candidate-build.json"
          )
          complete_phase

          begin_phase CANDIDATE_STRUCTURE_GATE
          jq -e '
            .schema_version == 1
            and .llms_en_leaf_paths == ["content"]
            and (.taxonomy_en_leaf_paths | index("name")) != null
            and (.taxonomy_en_leaf_paths | index("description")) != null
            and .taxonomy_leaf_set_valid == true
            and .llms.source_sha256 == .llms.candidate_sha256
            and .taxonomy_description.source_sha256 == .taxonomy_description.candidate_sha256
            and .taxonomy_name.source_sha256 == .taxonomy_name.candidate_sha256
            and .raw_config_values_exposed == false
          ' "$artifact/candidate-build.json" >/dev/null
          complete_phase

          begin_phase CANDIDATE_REPRESENTATION_AFTER
          (
            cd "$candidate"
            ddev exec env AGENCY_CANDIDATE_REPRESENTATION_STAGE=after \
              php /var/www/html/artifacts/config-language-roundtrip-candidate-1316/candidate-representation.php \
              > "$artifact/candidate-representation-after.json"
          )
          complete_phase

          begin_phase CANDIDATE_DIFF_DIAGNOSTIC
          llms_path='config/sync/language/en/llms_txt.settings.yml'
          taxonomy_path='config/sync/language/en/taxonomy.vocabulary.tags.yml'

          actual_diff_name_status="$(
            git -C "$candidate" diff --name-status -- "$llms_path" "$taxonomy_path"
          )"
          actual_diff_numstat="$(
            git -C "$candidate" diff --numstat -- "$llms_path" "$taxonomy_path"
          )"
          bounded_diff_sha256="$(
            git -C "$candidate" diff --no-ext-diff -- "$llms_path" "$taxonomy_path" \
              | sha256sum | awk '{print $1}'
          )"

          third_config_path='NONE'
          while IFS= read -r status_line; do
            [[ -n "$status_line" ]] || continue
            candidate_path="${status_line:3}"
            if [[ "$candidate_path" != "$llms_path" && "$candidate_path" != "$taxonomy_path" ]]; then
              if [[ "$third_config_path" == 'NONE' ]]; then
                third_config_path="$candidate_path"
              else
                third_config_path+=$'\n'"$candidate_path"
              fi
            fi
          done < <(git -C "$candidate" status --porcelain=v1 --untracked-files=all -- config/sync)

          before_json="$(cat "$artifact/candidate-representation-before.json")"
          after_json="$(cat "$artifact/candidate-representation-after.json")"

          jq -n \
            --arg head_sha "$HEAD_SHA" \
            --argjson before "$before_json" \
            --argjson after "$after_json" \
            --arg git_name_status "$actual_diff_name_status" \
            --arg git_numstat "$actual_diff_numstat" \
            --arg bounded_diff_sha256 "$bounded_diff_sha256" \
            --arg third_config_path "$third_config_path" \
            '{
              schema_version: 1,
              head_sha: $head_sha,
              raw_config_values_exposed: false,
              paths: [
                {
                  path: $before.files[0].path,
                  before: $before.files[0],
                  after: $after.files[0],
                  semantic_equal:
                    ($before.files[0].semantic_sha256 == $after.files[0].semantic_sha256)
                },
                {
                  path: $before.files[1].path,
                  before: $before.files[1],
                  after: $after.files[1],
                  semantic_equal:
                    ($before.files[1].semantic_sha256 == $after.files[1].semantic_sha256)
                }
              ],
              git_name_status: $git_name_status,
              git_numstat: $git_numstat,
              bounded_diff_sha256: $bounded_diff_sha256,
              third_config_path: $third_config_path
            }' > "$artifact/candidate-redump-diagnostic.json"

          jq -e '
            def sha256: type == "string" and test("^[0-9a-f]{64}$");
            def style:
              IN("literal_block","folded_block","single_quoted","double_quoted","plain","other");
            def chomping: IN("strip","clip","keep","none");
            def indent_indicator:
              . == "none"
              or (type == "number" and . >= 1 and . <= 9 and floor == .);
            def common_file:
              .file_exists == true
              and (.sha256 | sha256)
              and (.byte_count | type == "number" and . >= 0 and floor == .)
              and (.line_count | type == "number" and . >= 0 and floor == .)
              and (.ends_with_newline | type == "boolean")
              and (.top_level_keys | type == "array" and all(.[]; type == "string"))
