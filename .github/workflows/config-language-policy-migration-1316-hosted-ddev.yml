            and .config_import.attempted == true
            and .config_import.exit_code == 0
            and (.config_import.output_sha256 | test("^[0-9a-f]{64}$"))
            and .after_reimport.language_fr.match == true
            and .after_reimport.language_en.match == true
            and .after_reimport.strict_collection_gate == "PASS"
            and .after_reimport.config_status_count == 0
            and .llms_source_equals_candidate == true
            and .llms_candidate_equals_effective_en_after_reimport == true
            and .taxonomy_description_source_equals_candidate == true
            and .taxonomy_description_candidate_equals_effective_en_after_reimport == true
