          begin_phase PRIMARY_CONFIG_CLEAN_GATE
          final_candidate_diff="$(git -C "$candidate" diff --name-status -- config/sync)"
          [[ -z "$final_candidate_diff" ]]
          test -z "$(git -C "$candidate" status --porcelain -- config/sync)"
