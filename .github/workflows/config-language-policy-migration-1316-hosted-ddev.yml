      - name: Validate isolated roundtrip diagnostic safety
        if: ${{ always() && steps.mode.outputs.mode == 'VERIFY' }}
        shell: bash
        run: |
          set -euo pipefail
          artifact='artifacts/config-language-roundtrip-candidate-1316'
          test -f "$artifact/progress.json"

          if jq -e '.status == "FAIL"' "$artifact/progress.json" >/dev/null; then
            test -f "$artifact/failure.json"
          else
            test -f "$artifact/result.json"
          fi

          validate_collection_file() {
            local path="$1"
            jq -e '
              def sha256:
                type == "string"
                and test("^[0-9a-f]{64}$");
              def string_array:
                type == "array"
                and all(.[]; type == "string");
              def mismatch_fingerprints:
                type == "array"
                and all(.[];
                  (keys | sort) == ["active_sha256", "name", "sync_sha256"]
                  and (.name | type == "string")
                  and (.active_sha256 | sha256)
                  and (.sync_sha256 | sha256)
                );
              def non_negative_integer:
                type == "number"
                and . >= 0
                and floor == .;
              def collection_shape:
                type == "object"
                and (.active_count | non_negative_integer)
                and (.sync_count | non_negative_integer)
                and (.active_only_count | non_negative_integer)
                and (.active_only_names | string_array)
                and (.sync_only_count | non_negative_integer)
                and (.sync_only_names | string_array)
                and (.value_mismatch_count | non_negative_integer)
                and (.value_mismatch_names | string_array)
                and (.value_mismatch_fingerprints | mismatch_fingerprints)
                and (.active_names_sha256 | sha256)
                and (.sync_names_sha256 | sha256)
                and (.active_values_sha256 | sha256)
                and (.sync_values_sha256 | sha256)
                and (.match | type == "boolean")
                and (
                  .classification
                  | IN(
                      "MATCH",
                      "ACTIVE_ONLY",
                      "SYNC_ONLY",
                      "VALUE_MISMATCH",
                      "MIXED"
                    )
                );
              .schema_version == 1
              and .mode == "VERIFY"
              and .diagnostic_only == true
              and .raw_config_values_exposed == false
              and .prod_access == "NONE"
              and .preprod_access == "NONE"
              and (.collections["language.fr"] | collection_shape)
              and (.collections["language.en"] | collection_shape)
            ' "$path" >/dev/null
          }

          completed_phases="$(
            jq -c '.completed_phases' "$artifact/progress.json"
          )"

          if jq -e 'index("COLLECTION_DIAGNOSTIC") != null' <<<"$completed_phases" >/dev/null; then
            test -f "$artifact/isolated-collections-before-reimport.json"
            validate_collection_file "$artifact/isolated-collections-before-reimport.json"
          fi

          if jq -e 'index("PRE_REIMPORT_CONFIG_STATUS") != null' <<<"$completed_phases" >/dev/null; then
            test -f "$artifact/isolated-config-status-before-reimport.json"
            jq -e 'type == "array" or type == "object"' \
              "$artifact/isolated-config-status-before-reimport.json" >/dev/null
          fi

          if jq -e 'index("POST_REIMPORT_COLLECTION_DIAGNOSTIC") != null' <<<"$completed_phases" >/dev/null; then
            test -f "$artifact/isolated-collections-after-reimport.json"
            validate_collection_file "$artifact/isolated-collections-after-reimport.json"
          fi

          if jq -e 'index("POST_REIMPORT_CONFIG_STATUS") != null' <<<"$completed_phases" >/dev/null; then
            test -f "$artifact/isolated-config-status-after-reimport.json"
            jq -e 'type == "array" or type == "object"' \
              "$artifact/isolated-config-status-after-reimport.json" >/dev/null
          fi

          if grep -Eiq \
            '(password|passwd|api[_-]?key|access[_-]?token|refresh[_-]?token|secret)[[:space:]]*[:=][[:space:]]*["'"'"']?[^"'"'"',}[:space:]]+' \
            "$artifact"/*.json; then
            echo 'Unsafe secret-like value detected in roundtrip diagnostic artifact.' >&2
            exit 1
          fi

          if [[ -f "$artifact/candidate-redump-diagnostic.json" ]]; then
            jq -e '
              def sha256: type == "string" and test("^[0-9a-f]{64}$");
              def style:
                IN("literal_block","folded_block","single_quoted","double_quoted","plain","other");
              def chomping: IN("strip","clip","keep","none");
              def indent_indicator:
                . == "none"
                or (type == "number" and . >= 1 and . <= 9 and floor == .);
              .schema_version == 1
              and .raw_config_values_exposed == false
              and (.paths | length == 2)
              and .paths[0].path == "config/sync/language/en/llms_txt.settings.yml"
              and .paths[1].path == "config/sync/language/en/taxonomy.vocabulary.tags.yml"
              and ([.paths[].before.sha256, .paths[].after.sha256] | all(.[]; sha256))
              and ([.paths[].before.semantic_sha256, .paths[].after.semantic_sha256] | all(.[]; sha256))
              and ([.paths[].semantic_equal] | all(.[]; type == "boolean"))
              and (.paths[0].before.representation.content.style | style)
              and (.paths[0].after.representation.content.style | style)
              and (.paths[0].before.representation.content.chomping | chomping)
              and (.paths[0].after.representation.content.chomping | chomping)
              and (.paths[0].before.representation.content.indent_indicator | indent_indicator)
              and (.paths[0].after.representation.content.indent_indicator | indent_indicator)
              and (.paths[1].before.representation.name.style | style)
              and (.paths[1].after.representation.name.style | style)
              and (.paths[1].before.representation.description.style | style)
              and (.paths[1].after.representation.description.style | style)
              and (.bounded_diff_sha256 | sha256)
              and (.third_config_path | type == "string")
            ' "$artifact/candidate-redump-diagnostic.json" >/dev/null
          fi

      - name: Upload isolated roundtrip candidate proof
        if: ${{ always() && steps.mode.outputs.mode == 'VERIFY' }}
        uses: actions/upload-artifact@v4
        with:
          name: agency-config-language-roundtrip-candidate-1316-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/config-language-roundtrip-candidate-1316/progress.json
            artifacts/config-language-roundtrip-candidate-1316/candidate-redump-diagnostic.json
            artifacts/config-language-roundtrip-candidate-1316/failure.json
            artifacts/config-language-roundtrip-candidate-1316/result.json
            artifacts/config-language-roundtrip-candidate-1316/isolated-collections-before-reimport.json
            artifacts/config-language-roundtrip-candidate-1316/isolated-config-status-before-reimport.json
            artifacts/config-language-roundtrip-candidate-1316/isolated-collections-after-reimport.json
            artifacts/config-language-roundtrip-candidate-1316/isolated-config-status-after-reimport.json
