name: "#982 PREPROD config status runtime inventory"

on:
  workflow_call:
    secrets:
      PREPROD_SSH_PRIVATE_KEY:
        required: true
      PREPROD_SERVER_HOST:
        required: true
  pull_request:
    paths:
      - '.github/workflows/config-sync-runtime-diagnostic.yml'
      - '.github/workflows/agency-command-dispatch.yml'
      - 'scripts/runner/run-config-sync-runtime-diagnostic-961.sh'
      - 'scripts/runner/filter-config-status-metadata.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/AgencyCommandDispatchWorkflowTest.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/ConfigSyncRuntimeDiagnostic961WorkflowTest.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/ConfigStatusRuntimePreflight982Test.php'

permissions:
  contents: read

jobs:
  static-validation:
    name: "#982 static read-only PREPROD config status contract"
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate bounded diagnostic shell and workflow
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/runner/run-config-sync-runtime-diagnostic-961.sh
          php -l scripts/runner/filter-config-status-metadata.php
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.7 -color \
            .github/workflows/config-sync-runtime-diagnostic.yml
          git diff --check "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Install exact locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prove #982 PREPROD metadata-only contract
        run: >-
          vendor/bin/phpunit -c web/core/phpunit.xml.dist
          web/modules/custom/agency_project_tests/tests/src/Unit/ConfigStatusRuntimePreflight982Test.php
          web/modules/custom/agency_project_tests/tests/src/Unit/ConfigSyncRuntimeDiagnostic961WorkflowTest.php

  diagnose:
    name: Read-only PREPROD config status metadata inventory
    if: >-
      ${{
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        github.event.issue.number == 982 &&
        github.event.comment.body == '/agency-config-sync-runtime diagnose'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    concurrency:
      group: agency-config-status-runtime-preflight-982-preprod
      cancel-in-progress: false

    steps:
      - name: Validate owner, authority, issue, command and live main
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRIGGER_COMMENT: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          EVENT_DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'E-merging-digital' ]]
          [[ "$COMMENT_AUTHOR" == "$GITHUB_ACTOR" ]]
          [[ "$ISSUE_NUMBER" == '982' ]]
          [[ "$TRIGGER_COMMENT" == '/agency-config-sync-runtime diagnose' ]]

          issue_json="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER")"
          [[ "$(jq -r '.state' <<<"$issue_json")" == 'open' ]]
          [[ "$(jq -r '.pull_request // empty' <<<"$issue_json")" == '' ]]
          [[ "$(jq -r '.user.login' <<<"$issue_json")" == 'E-merging-digital' ]]

          authority_json="$(gh api 'repos/'"$GITHUB_REPOSITORY"'/issues/comments/5528251064')"
          [[ "$(jq -r '.user.login' <<<"$authority_json")" == 'E-merging-digital' ]]
          [[ "$(jq -r '.issue_url' <<<"$authority_json")" == \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/982" ]]

          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVENT_DEFAULT_SHA" == "$main_sha" ]] || {
            echo '#982 PREPROD inventory must execute the workflow revision currently on live main.' >&2
            exit 1
          }
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact trusted main
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.request.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable read-only implementation
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ steps.request.outputs.main_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN_SHA" ]]
          bash -n scripts/runner/run-config-sync-runtime-diagnostic-961.sh
          php -l scripts/runner/filter-config-status-metadata.php

      - name: JIT revalidate live main before PREPROD identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: ${{ steps.request.outputs.main_sha }}
        run: |
          set -euo pipefail
          live="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$live" == "$EXPECTED_MAIN" ]]
          [[ "$(git rev-parse HEAD)" == "$live" ]]

      - name: Materialize transient PREPROD identity after JIT
        env:
          PREPROD_KEY: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREPROD_KEY"
          printf '%s\n' "$PREPROD_KEY" > "$RUNNER_TEMP/agency-982-preprod.key"
          chmod 600 "$RUNNER_TEMP/agency-982-preprod.key"

      - name: Execute bounded read-only PREPROD inventory
        id: route
        shell: bash
        env:
          ISSUE_NUMBER: '982'
          PREPROD_SERVER_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
          PREPROD_SSH_KEY: ${{ runner.temp }}/agency-982-preprod.key
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts/config-status-runtime-preflight-982-preprod
        run: bash scripts/runner/run-config-sync-runtime-diagnostic-961.sh

      - name: Cleanup PREPROD identity
        if: ${{ always() }}
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/agency-982-preprod.key"

      - name: Materialize public metadata-only evidence
        if: ${{ steps.route.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          result='artifacts/config-status-runtime-preflight-982-preprod/result.json'
          public='artifacts/config-status-runtime-preflight-982-preprod/public-result.json'
          jq '.runtime_config_metadata' "$result" > "$public"
          jq -e '.environment == "PREPROD" and .config_values_exposed == false' "$public" >/dev/null

      - name: Upload metadata-only PREPROD evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agency-config-status-preflight-982-preprod-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/config-status-runtime-preflight-982-preprod/public-result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish bounded PREPROD result
        if: ${{ always() && steps.request.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTE_OUTCOME: ${{ steps.route.outcome }}
          TRUSTED_MAIN: ${{ steps.request.outputs.main_sha }}
        run: |
          set -euo pipefail
          result='artifacts/config-status-runtime-preflight-982-preprod/public-result.json'
          if [[ "$ROUTE_OUTCOME" != 'success' || ! -s "$result" ]] || \
            ! jq -e . "$result" >/dev/null 2>&1; then
            body="$(printf '%s\n' \
              '### Agency #982 PREPROD config drift inventory FAILURE' \
              '' \
              "trusted_main: \`$TRUSTED_MAIN\`" \
              "run_id: \`$GITHUB_RUN_ID\`" \
              '' \
              'CONFIG_VALUES_EXPOSED=NO' \
              'PREPROD_WRITE=NONE' \
              'PROD_ACCESS=NONE' \
              'PROD_WRITE=NONE')"
            gh issue comment 982 --repo "$GITHUB_REPOSITORY" --body "$body"
            exit 1
          fi

          items="$(jq -c '.items' "$result")"
          summary="$(jq -c '.summary' "$result")"
          body="$(cat <<EOF_BODY
          ### Agency #982 PREPROD config drift inventory PASS

          trusted_main: \`${TRUSTED_MAIN}\`
          run_id: \`${GITHUB_RUN_ID}\`
          environment: \`PREPROD\`
          metadata_schema: \`environment + config_name + operation/state\`
          items: \`${items}\`
          summary: \`${summary}\`

          CONFIG_VALUES_EXPOSED=NO
          PREPROD_ACCESS=READ_ONLY
          PREPROD_WRITE=NONE
          PROD_ACCESS=NONE
          PROD_WRITE=NONE
          EOF_BODY
          )"
          gh issue comment 982 --repo "$GITHUB_REPOSITORY" --body "$body"
