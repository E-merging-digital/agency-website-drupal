name: Agency dependency maintenance state

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - composer.json
      - composer.lock
      - package.json
      - package-lock.json
      - scripts/dependency-maintenance/**
      - scripts/runner/publish-agency-dependency-maintenance-handoff.sh
      - .github/workflows/dependency-maintenance-state.yml
  pull_request:
    paths:
      - composer.json
      - composer.lock
      - package.json
      - package-lock.json
      - scripts/dependency-maintenance/**
      - scripts/runner/publish-agency-dependency-maintenance-handoff.sh
      - .github/workflows/dependency-maintenance-state.yml

permissions:
  contents: read
concurrency:
  group: agency-dependency-maintenance-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot:
    name: Publish read-only dependency snapshot
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.handoff-proof.outputs.source_sha }}
      artifact_sha256: ${{ steps.handoff-proof.outputs.artifact_sha256 }}

    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record dependency file identities
        shell: bash
        run: |
          set -euo pipefail
          sha256sum composer.json composer.lock package.json package-lock.json \
            > "$RUNNER_TEMP/dependency-files.before"

      - name: Setup PHP 8.4 and locked Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: mbstring, dom, xml, xmlwriter

      - name: Setup project Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate dependency manifests
        run: composer validate --strict --no-check-all

      - name: Install exact existing Composer lockfile
        run: composer install --no-progress --prefer-dist --optimize-autoloader --no-interaction

      - name: Run deterministic collector tests
        run: php scripts/dependency-maintenance/tests/test.php

      - name: Collect normalized dependency state
        shell: bash
        run: |
          set -euo pipefail
          php scripts/dependency-maintenance/collect.php \
            --output="$RUNNER_TEMP/agency-dependency-maintenance-state.json"
          python3 -m json.tool \
            "$RUNNER_TEMP/agency-dependency-maintenance-state.json" >/dev/null

      - name: Prove read-only dependency files
        shell: bash
        run: |
          set -euo pipefail
          sha256sum composer.json composer.lock package.json package-lock.json \
            > "$RUNNER_TEMP/dependency-files.after"
          diff -u \
            "$RUNNER_TEMP/dependency-files.before" \
            "$RUNNER_TEMP/dependency-files.after"
          git diff --exit-code -- \
            composer.json composer.lock package.json package-lock.json

      - name: Prove snapshot contains no credential material
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/agency-dependency-maintenance-state.json"
          if grep -Eiq \
            'COMPOSER_AUTH|BEGIN [A-Z ]*PRIVATE KEY|github_pat_|gh[pousr]_|mysql://|mariadb://|postgres(ql)?://' \
            "$snapshot"; then
            echo "Sensitive material pattern detected in dependency snapshot." >&2
            exit 1
          fi
          echo "SECRET_SCAN=PASS"

      - name: Test private handoff contract without runner access
        shell: bash
        run: bash scripts/dependency-maintenance/tests/test_handoff.sh

      - name: Bind artifact to trusted source commit
        if: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
        id: handoff-proof
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'E-merging-digital/agency-website-drupal' ]]
          source_sha="$(git rev-parse HEAD)"
          [[ "$source_sha" == "$GITHUB_SHA" && "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          snapshot="$RUNNER_TEMP/agency-dependency-maintenance-state.json"
          [[ "$(jq -r '.repository_sha' "$snapshot")" == "$source_sha" ]]
          digest="$(sha256sum "$snapshot" | awk '{print $1}')"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Publish human-readable summary
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/agency-dependency-maintenance-state.json"
          {
            echo '## Agency dependency maintenance state'
            echo
            jq -r '"- Repository SHA: `\(.repository_sha)`"' "$snapshot"
            jq -r '"- Collected at: `\(.collected_at_utc)`"' "$snapshot"
            jq -r '"- Overall: **\(.overall)**"' "$snapshot"
            jq -r '"- Security advisories: \(.security.advisory_count)"' "$snapshot"
            jq -r '"- Abandoned packages: \(.abandoned.package_count)"' "$snapshot"
            echo
            echo '### Material items'
            jq -r '
              .components[]
              | select(.health != "OK")
              | "- " + .component
                + ": " + (.installed_version // "UNKNOWN")
                + " → latest " + (.latest_available_version // "UNKNOWN")
                + " [" + .health + " / " + .update_class + "] — "
                + .recommended_action
            ' "$snapshot"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload normalized dependency state
        uses: actions/upload-artifact@v4
        with:
          name: agency-dependency-maintenance-state
          path: ${{ runner.temp }}/agency-dependency-maintenance-state.json
          if-no-files-found: error
          retention-days: 14

  publish-private:
    name: Publish existing artifact to Agency private runner handoff
    if: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && github.repository == 'E-merging-digital/agency-website-drupal' && needs.snapshot.result == 'success' }}
    needs: snapshot
    runs-on:
      - self-hosted
      - linux
      - x64
      - agency
      - ddev
      - browser
    timeout-minutes: 5
    steps:
      - name: Checkout exact trusted main source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: false
          persist-credentials: false

      - name: Download this run's validated private artifact
        uses: actions/download-artifact@v4
        with:
          name: agency-dependency-maintenance-state
          path: ${{ runner.temp }}/agency-dependency-maintenance-handoff

      - name: Validate provenance and publish only the fixed private file
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.snapshot.outputs.source_sha }}
          EXPECTED_ARTIFACT_SHA256: ${{ needs.snapshot.outputs.artifact_sha256 }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" == "$EXPECTED_SOURCE_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE_SHA" ]]
          bash scripts/runner/publish-agency-dependency-maintenance-handoff.sh \
            "$RUNNER_TEMP/agency-dependency-maintenance-handoff/agency-dependency-maintenance-state.json"
          echo 'AGENCY_DEPENDENCY_PRIVATE_HANDOFF=PASS'
          echo "SOURCE_REPOSITORY_SHA=$EXPECTED_SOURCE_SHA"
          echo "ARTIFACT_SHA256=$EXPECTED_ARTIFACT_SHA256"
