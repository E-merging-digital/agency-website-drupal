name: '#1261 Infrastructure cockpit consumer proof'

on:
  workflow_call:
    secrets:
      PREPROD_PROVISIONING_SSH_PRIVATE_KEY:
        required: true
      PREPROD_SERVER_HOST:
        required: true
  pull_request:
    paths:
      - '.github/workflows/infrastructure-cockpit-consumer-proof.yml'
      - '.github/workflows/agency-command-dispatch.yml'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/AgencyCommandDispatchWorkflowTest.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/InfrastructureCockpitConsumerProofWorkflowTest.php'

concurrency:
  group: agency-infrastructure-cockpit-consumer-proof-1261
  cancel-in-progress: false

env:
  INFRA_ACTION_SHA: 78d0238d6018c2c0bcf29fdafb29ed5aae7d77ac
  DEPLOYED_AGENCY_SHA: a096d7acc682a355720e9102dd84d40780bae2f8

jobs:
  cross-repo-selftest:
    name: Prove private Infrastructure action access without secrets
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - id: consumer
        name: Execute immutable Infrastructure selftest
        uses: E-merging-digital/infrastructure/.github/actions/agency-preprod-consumer-proof@78d0238d6018c2c0bcf29fdafb29ed5aae7d77ac
        with:
          mode: selftest

      - name: Validate bounded selftest receipt
        shell: bash
        env:
          RECEIPT: ${{ steps.consumer.outputs.receipt_path }}
        run: |
          set -euo pipefail
          test -s "$RECEIPT"
          jq -e '
            .status == "PASS"
            and .consumer == "App\\Operations\\AgencyStateLoader"
            and .remote_source == "agency_preprod_http_projection"
            and .fail_closed_reason == "projection_transport_not_configured"
            and .local_fallback == "NONE"
            and .secret_content_exposed == false
          ' "$RECEIPT" >/dev/null

  live:
    name: Prove real Infrastructure cockpit consumer
    if: ${{ github.event_name == 'issue_comment' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - id: authority
        name: Validate exact direct-human #1261 authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_LOGIN: ${{ github.event.comment.user.login }}
          COMMENT_USER_TYPE: ${{ github.event.comment.user.type }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_VIA_APP: ${{ github.event.comment.performed_via_github_app != null }}
          WORKFLOW_SHA: ${{ github.sha }}
          EXPECTED_INFRA_SHA: ${{ env.INFRA_ACTION_SHA }}
          EXPECTED_RELEASE_SHA: ${{ env.DEPLOYED_AGENCY_SHA }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = 'issue_comment'
          test "$EVENT_ACTION" = 'created'
          test "$ISSUE_NUMBER" = '1261'
          test "$IS_PULL_REQUEST" = 'false'
          test "$COMMENT_LOGIN" = 'E-merging-digital'
          test "$COMMENT_USER_TYPE" = 'User'
          test "$COMMENT_ASSOCIATION" = 'OWNER'
          test "$COMMENT_VIA_APP" = 'false'

          issue_json="$(gh api "repos/$GITHUB_REPOSITORY/issues/1261")"
          test "$(jq -r '.state' <<<"$issue_json")" = 'open'

          if [[ ! "$COMMENT_BODY" =~ ^/agency-infra-cockpit-consumer\ prove\ main=([0-9a-f]{40})\ infra=([0-9a-f]{40})\ release=([0-9a-f]{40})$ ]]; then
            echo 'Unsupported #1261 consumer-proof syntax.' >&2
            exit 64
          fi
          requested_main="${BASH_REMATCH[1]}"
          requested_infra="${BASH_REMATCH[2]}"
          requested_release="${BASH_REMATCH[3]}"

          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$WORKFLOW_SHA" = "$main_sha"
          test "$requested_main" = "$main_sha"
          test "$requested_infra" = "$EXPECTED_INFRA_SHA"
          test "$requested_release" = "$EXPECTED_RELEASE_SHA"

          receipt_count="$(gh api "repos/$GITHUB_REPOSITORY/issues/1261/comments" --paginate --jq '[.[] | select(.body | startswith("INFRA_COCKPIT_CONSUMER_PROOF_RECEIPT="))] | length' | awk '{sum += $1} END {print sum + 0}')"
          test "$receipt_count" -eq 0

          {
            echo "main_sha=$main_sha"
            echo "infra_sha=$requested_infra"
            echo "release_sha=$requested_release"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout exact deployed Agency application source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.authority.outputs.release_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize existing PREPROD root identity and pinned trust
        shell: bash
        env:
          PREPROD_ROOT_KEY: ${{ secrets.PREPROD_PROVISIONING_SSH_PRIVATE_KEY }}
          PREPROD_SERVER_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
        run: |
          set -euo pipefail
          test -n "$PREPROD_ROOT_KEY"
          test -n "$PREPROD_SERVER_HOST"
          printf '%s\n' "$PREPROD_ROOT_KEY" > "$RUNNER_TEMP/agency-1261-root.key"
          chmod 600 "$RUNNER_TEMP/agency-1261-root.key"
          PREPROD_SERVER_HOST="$PREPROD_SERVER_HOST"             bash scripts/preproduction-ssh-trust/manage-known-host.sh PROVISION >/dev/null

      - id: consumer
        name: Execute immutable Infrastructure consumer proof
        uses: E-merging-digital/infrastructure/.github/actions/agency-preprod-consumer-proof@78d0238d6018c2c0bcf29fdafb29ed5aae7d77ac
        with:
          mode: live
          infra_sha: ${{ steps.authority.outputs.infra_sha }}
          expected_agency_sha: ${{ steps.authority.outputs.release_sha }}
          preprod_host: ${{ secrets.PREPROD_SERVER_HOST }}
          ssh_key_path: ${{ runner.temp }}/agency-1261-root.key
          known_hosts_file: ${{ env.HOME }}/.ssh/known_hosts
          agency_workspace: ${{ github.workspace }}

      - name: Validate bounded live receipt
        shell: bash
        env:
          RECEIPT: ${{ steps.consumer.outputs.receipt_path }}
          INFRA_SHA: ${{ steps.authority.outputs.infra_sha }}
          RELEASE_SHA: ${{ steps.authority.outputs.release_sha }}
        run: |
          set -euo pipefail
          test -s "$RECEIPT"
          jq -e --arg infra "$INFRA_SHA" --arg agency "$RELEASE_SHA" '
            .schema_version == 1
            and .status == "PASS"
            and .infrastructure_sha == $infra
            and .agency_sha == $agency
            and .consumer == "App\\Operations\\AgencyStateLoader"
            and .remote_source == "agency_preprod_http_projection"
            and .cockpit_status == "available"
            and .project_id == "agency-website"
            and .application_type == "drupal"
            and .adapter_id == "agency-drupal-environment-data"
            and .runtime_environment == "PREPROD"
            and .render_http_status == 200
            and .render_remote_source_marker == true
            and .local_fallback == "NONE"
            and .token_server_permissions_during_proof == "root:www-data:640"
            and .token_cleanup == "PASS"
            and .token_persisted == false
            and .post_cleanup_status == "unavailable"
            and .post_cleanup_reason == "projection_transport_not_configured"
            and .secret_content_exposed == false
            and .prod_access == "NONE"
            and .db_access == "NONE"
          ' "$RECEIPT" >/dev/null

      - name: Upload bounded non-secret receipt
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-cockpit-consumer-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.consumer.outputs.receipt_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish terminal bounded receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT: ${{ steps.consumer.outputs.receipt_path }}
        run: |
          set -euo pipefail
          receipt="$(jq -cS . "$RECEIPT")"
          body="INFRA_COCKPIT_CONSUMER_PROOF_RECEIPT=$receipt"
          gh api --method POST             "repos/$GITHUB_REPOSITORY/issues/1261/comments"             -f body="$body" >/dev/null

      - name: Remove ephemeral PREPROD root key
        if: ${{ always() }}
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/agency-1261-root.key"
