name: "#1010 terminal PROD Webform submission"

on:
  push:
    branches:
      - ops/1010-terminal-prod-verification
    paths:
      - .github/workflows/issue-1010-terminal-prod-verification-v2.yml

permissions:
  contents: read

concurrency:
  group: agency-1010-terminal-prod-verification
  cancel-in-progress: false

jobs:
  submit:
    name: Perform and verify exactly one real PROD Drupal diagnostic submission
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_MAIN: 754136965eef88441904108356686adae8a901f9
      PROD_BASE_URL: https://emergingdigital.be
      TEST_WEBSITE_URL: https://example.com
      TEST_ORGANIZATION: E-MERGING DIGITAL — TEST INTERNE
      TEST_NAME: Test interne Agency
      TEST_EMAIL: jonathan@emergingdigital.be
      TEST_MESSAGE: TEST INTERNE — validation notification Webform Drupal 2027 — ne pas traiter.
      EXPECTED_SUBJECT: Drupal diagnostic request — https://example.com
    steps:
      - name: Checkout exact production source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.EXPECTED_MAIN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure production SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Fail closed unless the bounded test has never been submitted
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/agency-1010-precheck.php <<'PHP'
          <?php
          $db = \Drupal::database();
          $q = $db->select('webform_submission_data', 'd');
          $q->condition('webform_id', 'drupal_lifecycle_diagnostic');
          $q->condition('name', 'message');
          $q->condition('value', 'TEST INTERNE — validation notification Webform Drupal 2027 — ne pas traiter.');
          $q->addExpression('COUNT(*)', 'matches');
          $existing = (int) $q->execute()->fetchField();
          if (!$db->schema()->tableExists('watchdog')) {
            throw new \RuntimeException('watchdog table unavailable; cannot bound mail transport verification.');
          }
          $w = $db->select('watchdog', 'w');
          $w->addExpression('MAX(wid)', 'max_wid');
          $max_wid = (int) ($w->execute()->fetchField() ?: 0);
          print json_encode(['existing' => $existing, 'watchdog_max_wid' => $max_wid]) . PHP_EOL;
          PHP
          scp -q /tmp/agency-1010-precheck.php "$SERVER_USER@$SERVER_HOST:/tmp/agency-1010-precheck.php"
          ssh "$SERVER_USER@$SERVER_HOST" 'set -euo pipefail; cd /var/www/agency/current; vendor/bin/drush php:script /tmp/agency-1010-precheck.php; rm -f /tmp/agency-1010-precheck.php' > /tmp/agency-1010-precheck.json
          jq -e '.existing == 0 and .watchdog_max_wid >= 0' /tmp/agency-1010-precheck.json >/dev/null
          jq . /tmp/agency-1010-precheck.json

      - name: Install browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Submit the production Webform exactly once
        shell: bash
        run: |
          set -euo pipefail
          cat > .agency-1010-submit.mjs <<'JS'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs';

          const result = {
            submission_attempted: false,
            submit_clicked: false,
            confirmation: false,
            url: null,
            error: null,
          };
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } });
            try {
              await page.goto(process.env.PROD_BASE_URL + '/fr/drupal-2027', {
                waitUntil: 'networkidle',
                timeout: 30000,
              });
              const shell = page.locator('.ed-section__content--contact-form').first();
              if (await shell.count() !== 1) throw new Error('Production contact shell is not uniquely rendered.');
              const form = page.locator('form').filter({ has: page.locator('input[name="website_url"]') }).first();
              if (await form.count() !== 1) throw new Error('Drupal lifecycle diagnostic form not found.');
              await form.locator('input[name="website_url"]').fill(process.env.TEST_WEBSITE_URL);
              await form.locator('input[name="organization"]').fill(process.env.TEST_ORGANIZATION);
              await form.locator('input[name="name"]').fill(process.env.TEST_NAME);
              await form.locator('input[name="email"]').fill(process.env.TEST_EMAIL);
              await form.locator('textarea[name="message"]').fill(process.env.TEST_MESSAGE);
              await form.locator('input[name="rgpd_consent"]').check();
              result.submission_attempted = true;
              const submit = form.locator('input[type="submit"], button[type="submit"]').first();
              await submit.click();
              result.submit_clicked = true;
              try {
                await page.locator('.contact-confirmation').waitFor({ state: 'visible', timeout: 30000 });
                result.confirmation = true;
              } catch (error) {
                result.error = `confirmation:${error.message}`;
              }
              result.url = page.url();
            } catch (error) {
              result.error = result.error || error.message;
              result.url = page.url();
            }
          } finally {
            await browser.close();
            fs.writeFileSync('/tmp/agency-1010-browser-result.json', JSON.stringify(result));
          }
          console.log(JSON.stringify(result));
          JS
          node .agency-1010-submit.mjs
          rm -f .agency-1010-submit.mjs
          jq . /tmp/agency-1010-browser-result.json

      - name: Verify persisted submission and synchronous mail transport outcome
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          export WATCHDOG_START_WID="$(jq -r '.watchdog_max_wid' /tmp/agency-1010-precheck.json)"
          test "$WATCHDOG_START_WID" -ge 0
          cat > /tmp/agency-1010-postcheck.php <<'PHP'
          <?php
          $db = \Drupal::database();
          $marker = 'TEST INTERNE — validation notification Webform Drupal 2027 — ne pas traiter.';
          $q = $db->select('webform_submission_data', 'd');
          $q->join('webform_submission', 's', 's.sid = d.sid');
          $q->fields('s', ['sid', 'created']);
          $q->condition('d.webform_id', 'drupal_lifecycle_diagnostic');
          $q->condition('d.name', 'message');
          $q->condition('d.value', $marker);
          $q->orderBy('s.sid', 'DESC');
          $rows = $q->execute()->fetchAllAssoc('sid');
          if (count($rows) !== 1) {
            throw new \RuntimeException('Expected exactly one bounded test submission, got ' . count($rows));
          }
          $row = reset($rows);
          $submission = \Drupal::entityTypeManager()->getStorage('webform_submission')->load($row->sid);
          if (!$submission) throw new \RuntimeException('Test submission cannot be loaded.');
          $data = $submission->getData();
          $expected = [
            'website_url' => 'https://example.com',
            'organization' => 'E-MERGING DIGITAL — TEST INTERNE',
            'name' => 'Test interne Agency',
            'email' => 'jonathan@emergingdigital.be',
            'message' => $marker,
          ];
          foreach ($expected as $key => $value) {
            if (($data[$key] ?? NULL) !== $value) {
              throw new \RuntimeException('Unexpected persisted value for ' . $key);
            }
          }
          if (empty($data['rgpd_consent'])) throw new \RuntimeException('Required consent not persisted.');

          $handler = \Drupal::config('webform.webform.drupal_lifecycle_diagnostic')->get('handlers.email_notification');
          $handler_active = (bool) ($handler['status'] ?? FALSE)
            && in_array('completed', $handler['settings']['states'] ?? [], TRUE);
          $subject = str_replace(
            '[webform_submission:values:website_url:raw]',
            $data['website_url'],
            $handler['settings']['subject'] ?? ''
          );

          $errors = $db->select('watchdog', 'w');
          $errors->condition('wid', (int) getenv('WATCHDOG_START_WID'), '>');
          $errors->condition('type', 'mail');
          $errors->condition('severity', [0, 1, 2, 3], 'IN');
          $errors->addExpression('COUNT(*)', 'matches');
          $mail_errors = (int) $errors->execute()->fetchField();

          print json_encode([
            'sid' => (int) $row->sid,
            'created_epoch' => (int) $row->created,
            'created_iso_utc' => gmdate('c', (int) $row->created),
            'subject' => $subject,
            'handler_active_for_completed' => $handler_active,
            'mail_error_count_since_precheck' => $mail_errors,
          ], JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE) . PHP_EOL;
          PHP
          scp -q /tmp/agency-1010-postcheck.php "$SERVER_USER@$SERVER_HOST:/tmp/agency-1010-postcheck.php"
          ssh "$SERVER_USER@$SERVER_HOST" "set -euo pipefail; cd /var/www/agency/current; WATCHDOG_START_WID='$WATCHDOG_START_WID' vendor/bin/drush php:script /tmp/agency-1010-postcheck.php; rm -f /tmp/agency-1010-postcheck.php" > /tmp/agency-1010-postcheck.json
          jq -e --arg subject "$EXPECTED_SUBJECT" '
            (.sid > 0) and
            (.created_epoch > 0) and
            .subject == $subject and
            .handler_active_for_completed == true and
            .mail_error_count_since_precheck == 0
          ' /tmp/agency-1010-postcheck.json >/dev/null
          jq -e '.submission_attempted == true and .submit_clicked == true and .confirmation == true' /tmp/agency-1010-browser-result.json >/dev/null
          jq . /tmp/agency-1010-postcheck.json
          echo 'WEBFORM_SUBMISSION=SUCCESS'
          echo 'HANDLER_EXECUTION=SUCCESS'
          echo 'MAIL_TRANSPORT=SUCCESS'
          echo 'EMAIL_RECEIVED=PROJECT_LEAD_TO_VERIFY'
