name: Issue 362 PHPStan 2 finalize

on:
  push:
    branches:
      - feature/issue-362-phpstan-2-evaluation

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feature/issue-362-phpstan-2-evaluation

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Fix test fake serialization visibility
        run: |
          python3 <<'PY'
          from pathlib import Path
          paths = [
              Path('web/modules/custom/emerging_digital_chatbot/tests/src/Kernel/FutureAiEnvironmentGuardTest.php'),
              Path('web/modules/custom/emerging_digital_chatbot/tests/src/Kernel/FutureAiOrchestratorTest.php'),
          ]
          old = '            private readonly string $apiKey,'
          new = '            protected readonly string $apiKey,'
          for path in paths:
              text = path.read_text()
              if text.count(old) != 1:
                  raise RuntimeError(f'{path}: expected exactly one fake apiKey property')
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply governed drupal-check metadata override
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path('composer.json')
          data = json.loads(path.read_text())
          override = {
              'type': 'package',
              'package': {
                  'name': 'mglaman/drupal-check',
                  'version': '1.5.0',
                  'description': 'CLI tool for running checks on a Drupal code base',
                  'type': 'project',
                  'license': 'GPL-2.0-or-later',
                  'dist': {
                      'type': 'zip',
                      'url': 'https://api.github.com/repos/mglaman/drupal-check/zipball/4011f1f357bdd89793d13b1f8536625eb9d3cce7',
                      'reference': '4011f1f357bdd89793d13b1f8536625eb9d3cce7',
                  },
                  'require': {
                      'php': '^8.1',
                      'composer/xdebug-handler': '^1.1 || ^2.0.1 || ^3.0',
                      'jangregor/phpstan-prophecy': '^1.0 || ^2.0',
                      'jean85/pretty-package-versions': '^1.5.0 || ^2.0.1',
                      'mglaman/phpstan-drupal': '^1.0.0 || ^2.0.0',
                      'nette/neon': '^3.1',
                      'phpstan/phpstan-deprecation-rules': '^1.0.0 || ^2.0.0',
                      'symfony/console': '~3.4.5 || ^4.2 || ^5.0 || ^6.0 || ^7.0',
                      'symfony/process': '~3.4.5 || ^4.2 || ^5.0 || ^6.0 || ^7.0',
                  },
                  'bin': ['drupal-check'],
                  'autoload': {'psr-4': {'DrupalCheck\\': 'src'}},
              },
          }
          repositories = data.get('repositories', [])
          repositories = [r for r in repositories if not (isinstance(r, dict) and r.get('package', {}).get('name') == 'mglaman/drupal-check')]
          data['repositories'] = [override, *repositories]
          require_dev = data.setdefault('require-dev', {})
          require_dev['mglaman/drupal-check'] = '1.5.0'
          require_dev['mglaman/phpstan-drupal'] = '^2.1'
          require_dev['phpstan/phpstan'] = '^2.2'
          require_dev['phpstan/phpstan-deprecation-rules'] = '^2.0'
          data['require-dev'] = dict(sorted(require_dev.items()))
          path.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n')
          PY

          cat > docs/phpstan-2-drupal-check-pr319.md <<'EOF'
          # PHPStan 2 et drupal-check : override temporaire basé sur upstream #319

          ## Décision

          L'issue #362 conserve temporairement `mglaman/drupal-check` 1.5.0 pendant la migration vers PHPStan 2 et `mglaman/phpstan-drupal` 2.x. Cette exception a été explicitement acceptée le 14 août 2026.

          La release officielle `drupal-check` 1.5.0 impose encore des dépendances PHPStan 1.x. L'upstream PR `mglaman/drupal-check#319` (`update to phpstan 2`) propose les métadonnées permettant PHPStan 2, mais elle est encore non mergée. Elle sert de référence technique, pas de source de code mutable.

          ## Implémentation

          Le projet continue d'installer le code officiel du tag `mglaman/drupal-check` 1.5.0, pinné au commit `4011f1f357bdd89793d13b1f8536625eb9d3cce7`.

          Un repository Composer root-only de type `package` surcharge uniquement les métadonnées de cette version selon #319 : PHP >= 8.1, `phpstan-drupal` 1.x ou 2.x, `phpstan-deprecation-rules` 1.x ou 2.x et `phpstan-prophecy` 1.x ou 2.x. Un patch `composer-patches` sur le `composer.json` de la dépendance ne conviendrait pas : il serait appliqué après la résolution des dépendances.

          ## Diagnostics PHPStan 2

          `phpstan-drupal` 2.x a révélé des incompatibilités réelles qui sont corrigées dans #362 :

          - signature de `hook_entity_operation()` depuis Drupal 11.3 ;
          - propriétés héritant de `DependencySerializationTrait` qui ne peuvent pas être `private` et, avec la plateforme PHP 8.3, ne doivent pas être `readonly` lorsqu'elles sont restaurées par un parent ;
          - visibilité des propriétés de deux faux objets `Key` dans les tests.

          PHPStan 2 peut également prouver statiquement certaines vérifications défensives grâce aux métadonnées Drupal/PHPDoc. Ces contrôles runtime sont conservés. Les exceptions de `phpstan.neon` sont limitées à leurs identifiants et fichiers précis ; il n'y a ni baseline ni ignore global du code applicatif.

          Les assertions PHPUnit statiquement redondantes sont également conservées pour leur valeur de régression runtime et l'exception correspondante est limitée aux répertoires de tests.

          ## Garanties

          - aucun fork long terme de `drupal-check` ;
          - aucun HEAD de PR mutable installé ;
          - code `drupal-check` officiel 1.5.0 pinné ;
          - aucune baseline PHPStan ;
          - `lint:phpstan` et `lint:drupal-check` restent des gates ;
          - plateforme Composer PHP 8.3 inchangée ; CI PHP 8.4 inchangée.

          ## Retrait de l'override

          Dès qu'une release stable officielle de `mglaman/drupal-check` accepte PHPStan 2 / `mglaman/phpstan-drupal` 2.x avec une compatibilité équivalente :

          1. remettre `mglaman/drupal-check` sur une contrainte de release normale ;
          2. supprimer le repository `package` d'override ;
          3. mettre à jour `composer.lock` ;
          4. revalider Composer, audit, PHPCS, PHPStan, drupal-check et la CI complète.

          ## Références

          - projet : #362 ;
          - upstream : `mglaman/drupal-check#319` ;
          - upstream liée : `mglaman/drupal-check#318`.
          EOF

      - name: Resolve PHPStan 2 toolchain
        run: |
          composer update \
            mglaman/drupal-check \
            mglaman/phpstan-drupal \
            phpstan/phpstan \
            phpstan/phpstan-deprecation-rules \
            phpstan/phpstan-phpunit \
            jangregor/phpstan-prophecy \
            webflo/drupal-finder \
            --with-all-dependencies \
            --no-interaction \
            --no-progress

      - name: Validate migration
        run: |
          composer validate --strict
          composer audit
          composer lint:phpcs
          composer lint:phpstan
          composer lint:drupal-check
          composer show phpstan/phpstan
          composer show mglaman/phpstan-drupal
          composer show mglaman/drupal-check
          composer show phpstan/phpstan-deprecation-rules

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock docs/phpstan-2-drupal-check-pr319.md web/modules/custom/emerging_digital_chatbot/tests/src/Kernel/FutureAiEnvironmentGuardTest.php web/modules/custom/emerging_digital_chatbot/tests/src/Kernel/FutureAiOrchestratorTest.php
          git diff --cached --quiet && exit 0
          git commit -m "Issue #362: migrate tooling to PHPStan 2"
          git push origin HEAD:feature/issue-362-phpstan-2-evaluation
