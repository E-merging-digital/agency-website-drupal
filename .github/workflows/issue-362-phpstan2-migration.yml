name: Issue 362 PHPStan 2 migration

on:
  push:
    branches:
      - feature/issue-362-phpstan-2-evaluation

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feature/issue-362-phpstan-2-evaluation

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Apply governed Composer metadata override
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          path = Path('composer.json')
          data = json.loads(path.read_text())

          override = {
              "type": "package",
              "package": {
                  "name": "mglaman/drupal-check",
                  "version": "1.5.0",
                  "description": "CLI tool for running checks on a Drupal code base",
                  "type": "project",
                  "license": "GPL-2.0-or-later",
                  "dist": {
                      "type": "zip",
                      "url": "https://api.github.com/repos/mglaman/drupal-check/zipball/4011f1f357bdd89793d13b1f8536625eb9d3cce7",
                      "reference": "4011f1f357bdd89793d13b1f8536625eb9d3cce7"
                  },
                  "require": {
                      "php": "^8.1",
                      "composer/xdebug-handler": "^1.1 || ^2.0.1 || ^3.0",
                      "jangregor/phpstan-prophecy": "^1.0 || ^2.0",
                      "jean85/pretty-package-versions": "^1.5.0 || ^2.0.1",
                      "mglaman/phpstan-drupal": "^1.0.0 || ^2.0.0",
                      "nette/neon": "^3.1",
                      "phpstan/phpstan-deprecation-rules": "^1.0.0 || ^2.0.0",
                      "symfony/console": "~3.4.5 || ^4.2 || ^5.0 || ^6.0 || ^7.0",
                      "symfony/process": "~3.4.5 || ^4.2 || ^5.0 || ^6.0 || ^7.0"
                  },
                  "bin": ["drupal-check"],
                  "autoload": {
                      "psr-4": {
                          "DrupalCheck\\\\": "src"
                      }
                  }
              }
          }

          repos = data.get('repositories', [])
          repos = [r for r in repos if not (isinstance(r, dict) and r.get('package', {}).get('name') == 'mglaman/drupal-check')]
          data['repositories'] = [override, *repos]

          require_dev = data.setdefault('require-dev', {})
          require_dev['mglaman/drupal-check'] = '1.5.0'
          require_dev['mglaman/phpstan-drupal'] = '^2.1'
          require_dev['phpstan/phpstan'] = '^2.2'
          require_dev['phpstan/phpstan-deprecation-rules'] = '^2.0'
          data['require-dev'] = dict(sorted(require_dev.items()))

          path.write_text(json.dumps(data, ensure_ascii=False, indent=4) + '\n')
          PY

          cat > docs/phpstan-2-drupal-check-pr319.md <<'EOF'
          # PHPStan 2 et drupal-check : override temporaire basé sur upstream #319

          ## Décision

          Depuis l'issue projet #362, le projet conserve temporairement `mglaman/drupal-check` 1.5.0 pendant la migration vers PHPStan 2 et `mglaman/phpstan-drupal` 2.x.

          La release officielle `mglaman/drupal-check` 1.5.0 impose encore des dépendances PHPStan 1.x. L'upstream PR `mglaman/drupal-check#319` propose d'assouplir ces métadonnées pour PHPStan 2. Cette PR est toujours non mergée ; elle sert de justification technique, pas de source de code mutable.

          ## Implémentation retenue

          Le projet continue d'installer le code officiel du tag `mglaman/drupal-check` 1.5.0, commit `4011f1f357bdd89793d13b1f8536625eb9d3cce7`.

          `composer.json` contient un repository root-only de type `package` qui surcharge uniquement les métadonnées de cette version selon les contraintes utiles de l'upstream PR #319 : PHP >= 8.1, `phpstan-drupal` 1.x ou 2.x, `phpstan-deprecation-rules` 1.x ou 2.x et `phpstan-prophecy` 1.x ou 2.x.

          Ce mécanisme est volontaire : `composer-patches` ne peut pas modifier les contraintes d'un `composer.json` de dépendance avant la résolution des dépendances. Un patch classique serait donc trop tardif.

          ## Garanties

          - aucun fork long terme de `drupal-check` ;
          - aucun HEAD de PR mutable n'est installé ;
          - le code installé reste le tag officiel 1.5.0 pinné sur son commit ;
          - aucune baseline PHPStan opaque n'est ajoutée ;
          - `lint:phpstan` et `lint:drupal-check` restent tous deux des gates ;
          - la plateforme Composer reste PHP 8.3 et la CI s'exécute en PHP 8.4.

          ## Condition de retrait

          Supprimer cet override dès qu'une release stable officielle de `mglaman/drupal-check` accepte PHPStan 2 / `mglaman/phpstan-drupal` 2.x avec une compatibilité équivalente.

          Lors du retrait :

          1. remettre `mglaman/drupal-check` sur une contrainte de release normale ;
          2. supprimer le repository `package` d'override ;
          3. mettre à jour `composer.lock` ;
          4. revalider `composer validate`, `composer audit`, PHPCS, PHPStan, drupal-check et la CI complète.

          ## Références

          - issue projet : #362 ;
          - upstream : `mglaman/drupal-check#319` — `update to phpstan 2` ;
          - upstream issue liée : `mglaman/drupal-check#318`.
          EOF

      - name: Diagnose PHPStan 2 constraints
        run: composer prohibits phpstan/phpstan 2.2.8 -t || true

      - name: Resolve PHPStan 2 toolchain
        run: |
          composer update \
            mglaman/drupal-check \
            mglaman/phpstan-drupal \
            phpstan/phpstan \
            phpstan/phpstan-deprecation-rules \
            phpstan/phpstan-phpunit \
            phpstan/phpstan-strict-rules \
            jangregor/phpstan-prophecy \
            webflo/drupal-finder \
            --with-all-dependencies \
            --no-interaction \
            --no-progress

      - name: Validate migrated toolchain
        run: |
          composer validate --strict
          composer audit
          composer lint:phpcs
          composer lint:phpstan
          composer lint:drupal-check
          composer show phpstan/phpstan mglaman/phpstan-drupal mglaman/drupal-check phpstan/phpstan-deprecation-rules

      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock docs/phpstan-2-drupal-check-pr319.md
          git diff --cached --quiet && exit 0
          git commit -m "Issue #362: migrate static analysis to PHPStan 2"
          git push origin HEAD:feature/issue-362-phpstan-2-evaluation
