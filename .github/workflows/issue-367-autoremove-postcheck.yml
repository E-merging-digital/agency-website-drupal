name: Issue 367 MariaDB Autoremove Safety Postcheck

on:
  push:
    branches:
      - feature/issue-367-production-mariadb-11-8

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Add server to known_hosts
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Simulate autoremove read-only
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" <<'EOF'
          set -Eeuo pipefail
          echo 'PROVIDER_PACKAGES_BEGIN'
          dpkg-query -W -f='${binary:Package}\t${Version}\n' \
            mariadb-plugin-provider-bzip2 mariadb-plugin-provider-lz4 \
            mariadb-plugin-provider-lzma mariadb-plugin-provider-lzo \
            mariadb-plugin-provider-snappy
          echo 'PROVIDER_PACKAGES_END'
          apt-get -s autoremove > /tmp/issue367-autoremove.txt
          echo 'AUTOREMOVE_REMOVALS_BEGIN'
          grep '^Remv ' /tmp/issue367-autoremove.txt || true
          echo 'AUTOREMOVE_REMOVALS_END'
          if grep -Eq '^Remv mariadb-(server|client|plugin-provider-|backup)|^Remv libmariadb' /tmp/issue367-autoremove.txt; then
            echo 'MARIADB_AUTOREMOVE_RISK=yes'
            exit 70
          fi
          echo 'MARIADB_AUTOREMOVE_RISK=no'
          rm -f /tmp/issue367-autoremove.txt
          EOF
