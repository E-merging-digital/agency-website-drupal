name: Issue 367 Root SSH Probe

on:
  push:
    branches:
      - feature/issue-367-production-mariadb-11-8

jobs:
  probe-root-ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Add server to known_hosts
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
      - name: Probe root SSH read-only
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set +e
          OUTPUT="$(ssh -o BatchMode=yes -o ConnectTimeout=10 root@$SERVER_HOST 'id -u' 2>&1)"
          RC=$?
          set -e
          if [ "$RC" -eq 0 ] && [ "$OUTPUT" = "0" ]; then
            echo 'ROOT_SSH_AVAILABLE=yes'
          else
            echo 'ROOT_SSH_AVAILABLE=no'
          fi
