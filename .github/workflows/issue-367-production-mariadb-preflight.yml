name: Issue 367 Production MariaDB Package Simulation Resume

on:
  push:
    branches:
      - feature/issue-367-production-mariadb-11-8

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add server to known_hosts
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Stage temporary sudo credential
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SUDO_PASSWORD: ${{ secrets.SERVER_SUDO_PASSWORD }}
        run: |
          test -n "$SERVER_SUDO_PASSWORD"
          REMOTE_PASS="/tmp/.issue367-sudo-${GITHUB_RUN_ID}"
          printf '%s' "$SERVER_SUDO_PASSWORD" | ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" "umask 077; cat > '$REMOTE_PASS'"
          echo "REMOTE_PASS=$REMOTE_PASS" >> "$GITHUB_ENV"

      - name: Simulate MariaDB 11.8 package migration from verified backups
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" "PASSFILE='$REMOTE_PASS' bash -s" <<'EOF'
          set -Eeuo pipefail
          cd /var/www/agency/current
          BACKUP_ROOT='/var/www/agency/shared/backups/issue367-mariadb-20260814162501'
          APT_STATE="${BACKUP_ROOT}-apt-state.tar.gz"
          REPO_TOUCHED=0

          cleanup() {
            if [[ "$REPO_TOUCHED" -eq 1 ]]; then
              sudo -S -p '' rm -rf /etc/apt < "$PASSFILE" || true
              sudo -S -p '' tar -C / -xzf "$APT_STATE" < "$PASSFILE" || true
              sudo -S -p '' apt-get update >/dev/null 2>&1 < "$PASSFILE" || true
            fi
            rm -f "$PASSFILE" /tmp/mariadb_repo_setup /tmp/issue367-apt-sim.txt || true
          }
          trap cleanup EXIT

          sudo_cmd() {
            sudo -S -p '' "$@" < "$PASSFILE"
          }

          VERSION="$(vendor/bin/drush sqlq 'SELECT VERSION();' | tr -d '\r')"
          case "$VERSION" in 10.11.*) ;; *) echo "Unexpected source: $VERSION" >&2; exit 40 ;; esac
          sudo_cmd test -s "$APT_STATE"
          sudo_cmd test -s "${BACKUP_ROOT}-physical/xtrabackup_checkpoints"
          test -s "${BACKUP_ROOT}.sql.gz"
          echo 'RESUME_GATES=ok'

          curl -fsSL https://r.mariadb.com/downloads/mariadb_repo_setup -o /tmp/mariadb_repo_setup
          chmod 700 /tmp/mariadb_repo_setup
          REPO_TOUCHED=1
          sudo_cmd bash /tmp/mariadb_repo_setup \
            --mariadb-server-version=mariadb-11.8 \
            --os-type=ubuntu \
            --os-version=noble \
            --skip-maxscale
          sudo_cmd env DEBIAN_FRONTEND=noninteractive apt-get update

          CANDIDATE="$(apt-cache policy mariadb-server | awk '/Candidate:/ && !seen {print $2; seen=1} END {if (!seen) exit 1}')"
          echo "MARIADB_SERVER_CANDIDATE=$CANDIDATE"
          case "$CANDIDATE" in *11.8*) ;; *) echo '11.8 candidate missing' >&2; exit 41 ;; esac

          apt-get -s install mariadb-server mariadb-client mariadb-backup > /tmp/issue367-apt-sim.txt
          echo 'APT_SIMULATION_SUMMARY_BEGIN'
          grep -E '^(Inst|Remv|Conf) ' /tmp/issue367-apt-sim.txt || true
          echo 'APT_SIMULATION_SUMMARY_END'

          if grep -Eq '^Remv (nginx|openssh-server|php8\.4-fpm|php8\.4-cli|php8\.4-common)\b' /tmp/issue367-apt-sim.txt; then
            echo 'CRITICAL_PACKAGE_REMOVAL=yes' >&2
            exit 42
          fi
          if grep -Eq '^Remv mariadb-server($|[-: ])' /tmp/issue367-apt-sim.txt; then
            echo 'MARIADB_SERVER_REMOVAL=yes' >&2
            exit 43
          fi

          VERSION_AFTER="$(vendor/bin/drush sqlq 'SELECT VERSION();' | tr -d '\r')"
          case "$VERSION_AFTER" in 10.11.*) ;; *) echo "Server mutated during simulation: $VERSION_AFTER" >&2; exit 44 ;; esac
          echo "SERVER_STILL_SOURCE_VERSION=$VERSION_AFTER"
          echo 'PACKAGE_SIMULATION_GREEN=yes'
          EOF

      - name: Cleanup temporary sudo credential
        if: always()
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          if [ -n "${REMOTE_PASS:-}" ]; then
            ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" "rm -f '$REMOTE_PASS'" || true
          fi
