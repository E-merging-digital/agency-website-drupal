name: Issue 367 Production MariaDB Post-Simulation Verification

on:
  push:
    branches:
      - feature/issue-367-production-mariadb-11-8

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add server to known_hosts
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Stage temporary sudo credential
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SUDO_PASSWORD: ${{ secrets.SERVER_SUDO_PASSWORD }}
        run: |
          test -n "$SERVER_SUDO_PASSWORD"
          REMOTE_PASS="/tmp/.issue367-sudo-${GITHUB_RUN_ID}"
          printf '%s' "$SERVER_SUDO_PASSWORD" | ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" "umask 077; cat > '$REMOTE_PASS'"
          echo "REMOTE_PASS=$REMOTE_PASS" >> "$GITHUB_ENV"

      - name: Verify source state and backups read-only
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" "PASSFILE='$REMOTE_PASS' bash -s" <<'EOF'
          set -Eeuo pipefail
          cd /var/www/agency/current
          BACKUP_ROOT='/var/www/agency/shared/backups/issue367-mariadb-20260814162501'

          VERSION="$(vendor/bin/drush sqlq 'SELECT VERSION();' | tr -d '\r')"
          echo "DB_VERSION=$VERSION"
          case "$VERSION" in 10.11.*) ;; *) exit 30 ;; esac
          echo "SERVICE_ACTIVE=$(systemctl is-active mariadb)"
          vendor/bin/drush status --fields=bootstrap,db-status,drupal-version --format=list

          echo "BACKUP_TOOL_VERSION=$(mariadb-backup --version 2>&1 | sed -n '1p')"
          test -s "${BACKUP_ROOT}.sql.gz"
          gzip -t "${BACKUP_ROOT}.sql.gz"
          sudo -S -p '' test -s "${BACKUP_ROOT}-physical/xtrabackup_checkpoints" < "$PASSFILE"
          sudo -S -p '' test -s "${BACKUP_ROOT}-etc-mysql.tar.gz" < "$PASSFILE"
          test -s "${BACKUP_ROOT}-packages.txt"
          sudo -S -p '' test -s "${BACKUP_ROOT}-apt-state.tar.gz" < "$PASSFILE"
          echo 'BACKUPS_VERIFIED=yes'

          if grep -RqsE 'dlm\.mariadb\.com/repo/mariadb-server/11\.8|mariadb-server/11\.8' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null; then
            echo 'MARIADB_11_8_REPO_ACTIVE=yes'
            exit 31
          else
            echo 'MARIADB_11_8_REPO_ACTIVE=no'
          fi

          CANDIDATE="$(apt-cache policy mariadb-server | awk '/Candidate:/ && !seen {print $2; seen=1} END {if (!seen) exit 1}')"
          echo "APT_CANDIDATE=$CANDIDATE"
          case "$CANDIDATE" in *10.11*) ;; *) exit 32 ;; esac
          echo 'SOURCE_STATE_RESTORED=yes'
          EOF

      - name: Cleanup temporary sudo credential
        if: always()
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          if [ -n "${REMOTE_PASS:-}" ]; then
            ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" "rm -f '$REMOTE_PASS'" || true
          fi
