name: Issue 367 Production MariaDB Unprivileged Postcheck

on:
  push:
    branches:
      - feature/issue-367-production-mariadb-11-8

jobs:
  postcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add server to known_hosts
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify production without sudo
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh -o BatchMode=yes "$SERVER_USER@$SERVER_HOST" <<'EOF'
          set -Eeuo pipefail
          cd /var/www/agency/current

          VERSION="$(vendor/bin/drush sqlq 'SELECT VERSION();' | tr -d '\r')"
          echo "DB_VERSION=$VERSION"
          case "$VERSION" in 11.8.*) ;; *) exit 60 ;; esac

          echo "SERVICE_ACTIVE=$(systemctl is-active mariadb)"
          [[ "$(systemctl is-active mariadb)" == 'active' ]]
          vendor/bin/drush status --fields=bootstrap,db-status,drupal-version --format=list

          TABLES="$(vendor/bin/drush sqlq 'SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE();' | tr -d '\r')"
          echo "APP_TABLES=$TABLES"
          [[ "$TABLES" == '140' ]]

          MAINTENANCE="$(vendor/bin/drush state:get system.maintenance_mode 2>/dev/null | tr -d '\r[:space:]')"
          echo "DRUPAL_MAINTENANCE=$MAINTENANCE"
          [[ "$MAINTENANCE" == '0' ]]

          CANDIDATE="$(apt-cache policy mariadb-server | awk '/Candidate:/ && !seen {print $2; seen=1} END {if (!seen) exit 1}')"
          INSTALLED="$(dpkg-query -W -f='${Version}' mariadb-server)"
          echo "MARIADB_PACKAGE_INSTALLED=$INSTALLED"
          echo "MARIADB_PACKAGE_CANDIDATE=$CANDIDATE"
          case "$INSTALLED" in *11.8.8*) ;; *) exit 61 ;; esac
          case "$CANDIDATE" in *11.8.8*) ;; *) exit 62 ;; esac

          grep -RqsE 'dlm\.mariadb\.com/repo/mariadb-server/11\.8|mariadb-server/11\.8' /etc/apt/sources.list /etc/apt/sources.list.d
          echo 'MARIADB_11_8_REPO_ACTIVE=yes'
          echo "MARIADB_BACKUP_VERSION=$(mariadb-backup --version 2>&1 | sed -n '1p')"

          if [[ -e /etc/sudoers.d/issue367-deploy ]]; then
            echo 'TEMP_SUDOERS_PRESENT=yes'
            exit 63
          else
            echo 'TEMP_SUDOERS_PRESENT=no'
          fi

          HOME_STATUS="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 https://emergingdigital.be/)"
          CONTACT_STATUS="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 https://emergingdigital.be/contact)"
          echo "HOMEPAGE_HTTP=$HOME_STATUS"
          echo "CONTACT_HTTP=$CONTACT_STATUS"
          [[ "$HOME_STATUS" == '200' ]]
          [[ "$CONTACT_STATUS" == '200' ]]
          echo 'UNPRIVILEGED_POSTCHECK=green'
          EOF
