name: Issue 374 PHPStan 2 rescan

on:
  push:
    branches:
      - feature/issue-374-phpstan2-application-cleanup

# Temporary diagnostic harness for #374; delete before merge.
jobs:
  rescan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Rescan application diagnostics without application ignores
        run: |
          cat > /tmp/phpstan-374.neon <<'EOF'
          parameters:
            level: 5

            paths:
              - web/modules/custom
              - web/themes/custom
              - web/profiles/custom

            excludePaths:
              - web/core
              - web/modules/contrib
              - web/themes/contrib (?)
              - web/profiles/contrib (?)
              - vendor

            ignoreErrors:
              -
                identifiers:
                  - staticMethod.alreadyNarrowedType
                  - instanceof.alwaysTrue
                  - dependencySerializationTraitProperty.unsupportedPrivateProperty
                path: web/modules/custom/*/tests/*
                reportUnmatched: false
          EOF

          set +e
          vendor/bin/phpstan analyse -c /tmp/phpstan-374.neon --error-format=json > /tmp/phpstan-374.json
          RC=$?
          set -e

          python3 <<'PY'
          import json
          from collections import Counter

          with open('/tmp/phpstan-374.json') as fh:
              data = json.load(fh)

          targeted = {'function.alreadyNarrowedType', 'instanceof.alwaysTrue', 'nullCoalesce.offset'}
          findings = []
          for path, detail in data.get('files', {}).items():
              for msg in detail.get('messages', []):
                  ident = msg.get('identifier', '<none>')
                  if ident in targeted:
                      findings.append((path, msg.get('line', 0), ident, msg.get('message', '')))

          counts = Counter(item[2] for item in findings)
          print(f'TARGETED_TOTAL={len(findings)}')
          for ident in sorted(counts):
              print(f'TARGETED_{ident}={counts[ident]}')
          print('TARGETED_FINDINGS_BEGIN')
          for path, line, ident, message in findings:
              print(f'{path}|{line}|{ident}|{message}')
          print('TARGETED_FINDINGS_END')
          print(f'PHPSTAN_TOTAL_ERRORS={data.get("totals", {}).get("file_errors", 0)}')
          PY

          echo "PHPSTAN_RC=$RC"
