name: Issue 381 Clean Config Proof

on:
  push:
    branches:
      - feature/issue-381-ai-automators-article-field-widget

permissions:
  contents: write

jobs:
  prove:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout clean issue branch
        uses: actions/checkout@v5
        with:
          ref: feature/issue-381-ai-automators-article-field-widget
          fetch-depth: 0

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          version: 1.25.3
          autostart: false

      - name: Fresh install from canonical config
        shell: bash
        run: |
          set -euo pipefail
          ddev start
          ddev composer install --no-interaction --prefer-dist --no-progress
          if ! ddev drush site:install --existing-config -y > /tmp/issue-381-clean-install.log 2>&1; then
            cat /tmp/issue-381-clean-install.log >&2
            exit 1
          fi
          echo 'Fresh Drupal install succeeded; generated administrator credentials intentionally suppressed.'
          rm -f /tmp/issue-381-clean-install.log

      - name: Verify Automators contract
        shell: bash
        run: |
          set -euo pipefail
          ddev drush pm:list --status=enabled --type=module --field=name | grep -Fx ai_automators
          ddev drush pm:list --status=enabled --type=module --field=name | grep -Fx field_widget_actions

          ddev drush php:eval '
          $short = \Drupal::config("ai_automators.ai_automator.node.article.field_short_description.default");
          $image = \Drupal::config("ai_automators.ai_automator.node.article.field_feature_image.default");
          $display = \Drupal::config("core.entity_form_display.node.article.default");

          $short_data = $short->getRawData();
          $image_data = $image->getRawData();
          $content = $display->get("content") ?? [];
          $short_actions = $content["field_short_description"]["third_party_settings"]["field_widget_actions"] ?? [];
          $image_actions = $content["field_feature_image"]["third_party_settings"]["field_widget_actions"] ?? [];

          print "SHORT_AUTOMATOR=" . json_encode($short_data, JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE) . "\n";
          print "IMAGE_AUTOMATOR=" . json_encode($image_data, JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE) . "\n";
          print "SHORT_ACTIONS=" . json_encode($short_actions, JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE) . "\n";
          print "IMAGE_ACTIONS=" . json_encode($image_actions, JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE) . "\n";

          $require = static function (bool $condition, string $message): void {
            if (!$condition) {
              throw new \RuntimeException($message);
            }
          };

          $short_plugin = $short_data["plugin_config"] ?? [];
          $image_plugin = $image_data["plugin_config"] ?? [];

          $require(($short_data["rule"] ?? NULL) === "llm_simple_text_long", "Unexpected short-description Automator plugin.");
          $require(($image_data["rule"] ?? NULL) === "llm_image_alt_text", "Unexpected image-alt Automator plugin.");
          $require(($short_data["worker_type"] ?? NULL) === "field_widget_actions", "Short-description worker is not Field Widget.");
          $require(($image_data["worker_type"] ?? NULL) === "field_widget_actions", "Feature-image worker is not Field Widget.");
          $require(($short_plugin["automator_worker_type"] ?? NULL) === "field_widget_actions", "Short-description plugin config is not Field Widget.");
          $require(($image_plugin["automator_worker_type"] ?? NULL) === "field_widget_actions", "Feature-image plugin config is not Field Widget.");
          $require(($short_data["base_field"] ?? NULL) === "body", "Short description does not use the Article body as source.");
          $require(($short_data["input_mode"] ?? NULL) === "base", "Short description is not in Base input mode.");
          $require(($image_data["input_mode"] ?? NULL) === "base", "Feature image is not in Base input mode.");
          $require(($short_plugin["automator_ai_provider"] ?? NULL) === "default_json", "Short description does not keep provider selection environment-owned.");
          $require(($image_plugin["automator_ai_provider"] ?? NULL) === "default_json", "Feature image does not keep provider selection environment-owned.");
          $require(!array_key_exists("automator_ai_model", $short_plugin) || $short_plugin["automator_ai_model"] === "", "Short description hard-codes an AI model.");
          $require(!array_key_exists("automator_ai_model", $image_plugin) || $image_plugin["automator_ai_model"] === "", "Feature image hard-codes an AI model.");

          $require(count($short_actions) === 1, "Expected exactly one short-description Field Widget Action.");
          $require(count($image_actions) === 1, "Expected exactly one feature-image Field Widget Action.");
          $short_action = reset($short_actions);
          $image_action = reset($image_actions);
          $require(($short_action["plugin_id"] ?? NULL) === "automator_text", "Unexpected short-description action plugin.");
          $require(($image_action["plugin_id"] ?? NULL) === "automator_alt_text", "Unexpected feature-image action plugin.");
          $require(($short_action["automatic"] ?? NULL) === false, "Short-description action must remain manual.");
          $require(($image_action["automatic"] ?? NULL) === false, "Feature-image action must remain manual.");
          $require(($short_action["settings"]["automator_id"] ?? NULL) === "node.article.field_short_description.default", "Short-description action is not linked to its Automator.");
          $require(($image_action["settings"]["automator_id"] ?? NULL) === "node.article.field_feature_image.default", "Feature-image action is not linked to its Automator.");

          print "Active #381 Automators contract verified.\n";
          '

      - name: Prove canonical configuration is clean
        shell: bash
        run: |
          set -euo pipefail
          ddev drush cr
          status="$(ddev drush config:status --format=list 2>/dev/null || true)"
          if [[ -n "$status" ]]; then
            echo 'Unexpected configuration drift after fresh install:' >&2
            echo "$status" >&2
            exit 1
          fi
          git diff --check
          git status --short

      - name: Remove temporary proof workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-381-clean-config-proof.yml
          git commit -m 'Issue #381: record clean canonical config proof'
          git push origin HEAD:feature/issue-381-ai-automators-article-field-widget

      - name: Stop DDEV
        if: always()
        run: ddev delete -Oy || true
