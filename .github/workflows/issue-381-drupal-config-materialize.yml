name: Issue 381 Drupal Config Materialization

on:
  push:
    branches:
      - feature/issue-381-ai-automators-article-field-widget

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout issue branch
        uses: actions/checkout@v5
        with:
          ref: feature/issue-381-ai-automators-article-field-widget
          fetch-depth: 0

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          version: 1.25.3
          autostart: false

      - name: Rebuild Drupal from repository state
        shell: bash
        run: |
          set -euo pipefail
          ddev start
          ddev composer install --no-interaction --prefer-dist --no-progress
          if ! ddev drush site:install --existing-config -y > /tmp/issue-381-site-install.log 2>&1; then
            cat /tmp/issue-381-site-install.log >&2
            exit 1
          fi
          echo 'Drupal installation completed; generated administrator credentials intentionally suppressed.'
          rm -f /tmp/issue-381-site-install.log
          ddev drush en ai_automators field_widget_actions -y
          ddev drush cr

      - name: Setup Node and Chromium
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install browser dependencies
        run: |
          npm ci
          npx playwright install chromium

      - name: Configure Automators through Drupal UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/issue-381-materialization
          BASE_URL="$(ddev describe -j | jq -r '.. | objects | .primary_url? // empty' | head -n 1)"
          test -n "$BASE_URL"
          LOGIN_URL="$(ddev drush uli --uid=1 --uri="$BASE_URL" --no-browser)"
          export BASE_URL LOGIN_URL

          cat > .issue-381-materialize.mjs <<'NODE'
          import { chromium } from '@playwright/test';
          import { mkdir } from 'node:fs/promises';
          import path from 'node:path';

          const baseURL = process.env.BASE_URL.replace(/\/+$/, '');
          const loginURL = process.env.LOGIN_URL.trim();
          const artifactDir = path.resolve('artifacts/issue-381-materialization');
          await mkdir(artifactDir, { recursive: true });

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1100 }, ignoreHTTPSErrors: true });

          async function firstVisible(locator) {
            for (let i = 0; i < await locator.count(); i += 1) {
              const item = locator.nth(i);
              if (await item.isVisible().catch(() => false)) return item;
            }
            return null;
          }

          async function shot(name) {
            await page.screenshot({ path: path.join(artifactDir, `${name}.png`), fullPage: true });
          }

          async function fail(message, scope = page.locator('body')) {
            console.error(message);
            console.error('URL:', page.url());
            console.error('TEXT:', (await scope.innerText().catch(() => '')).slice(0, 16000));
            console.error('LABELS:', await scope.locator('label').allTextContents().catch(() => []));
            console.error('INPUTS:', await scope.locator('input').evaluateAll((nodes) => nodes.map((node) => ({ type: node.type, name: node.name, id: node.id, value: node.value, checked: node.checked }))).catch(() => []));
            console.error('SELECTS:', await scope.locator('select').evaluateAll((nodes) => nodes.map((node) => ({
              name: node.name,
              id: node.id,
              value: node.value,
              visible: !!(node.offsetWidth || node.offsetHeight || node.getClientRects().length),
              options: [...node.options].map((option) => ({ value: option.value, label: option.textContent.trim() })),
            }))).catch(() => []));
            await shot('failure');
            throw new Error(message);
          }

          async function settle() {
            await page.waitForLoadState('domcontentloaded', { timeout: 8000 }).catch(() => {});
            await page.locator('.ajax-progress, .ajax-progress-throbber').waitFor({ state: 'hidden', timeout: 5000 }).catch(() => {});
            await page.waitForLoadState('networkidle', { timeout: 3000 }).catch(() => {});
            await page.waitForTimeout(200);
          }

          async function gotoStable(url, description) {
            await settle();
            let lastError;
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              try {
                await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 15000 });
                return;
              } catch (error) {
                lastError = error;
                if (!String(error).includes('ERR_ABORTED') || attempt === 3) break;
                console.log(`Navigation aborted for ${description}; retry ${attempt}/3.`);
                await page.waitForTimeout(500 * attempt);
              }
            }
            await fail(`Navigation failed for ${description}: ${String(lastError)}`);
          }

          async function dismissCookies() {
            const banner = page.locator('#ed-cookie-banner');
            if (!(await banner.isVisible().catch(() => false))) return;
            const reject = await firstVisible(banner.getByRole('button', { name: /Refuser|Reject|Decline/i }));
            if (!reject) await fail('Cookie banner visible without reject control.', banner);
            await reject.click();
            await banner.waitFor({ state: 'hidden', timeout: 5000 }).catch(() => {});
          }

          async function openDetails(scope, pattern, description) {
            const summary = await firstVisible(scope.locator('summary').filter({ hasText: pattern }));
            if (!summary) await fail(`Missing ${description}.`, scope);
            const details = summary.locator('xpath=ancestor::details[1]');
            if ((await details.getAttribute('open')) === null) {
              await summary.click();
              await page.waitForTimeout(200);
            }
            return details;
          }

          async function expandVisibleDetails(scope) {
            for (let pass = 0; pass < 8; pass += 1) {
              let changed = false;
              const closed = scope.locator('details:not([open])');
              for (let i = 0; i < await closed.count(); i += 1) {
                const details = closed.nth(i);
                const summary = details.locator(':scope > summary');
                if (!(await summary.isVisible().catch(() => false))) continue;
                await summary.click();
                await page.waitForTimeout(100);
                changed = true;
              }
              if (!changed) return;
            }
          }

          async function optionMatch(select, pattern) {
            const options = await select.locator('option').evaluateAll((nodes) => nodes.map((node) => ({ value: node.value, label: node.textContent.trim() })));
            return options.find((option) => pattern.test(option.label));
          }

          async function choose(select, pattern, description) {
            const match = await optionMatch(select, pattern);
            if (!match) await fail(`Missing option for ${description}: ${pattern}`);
            if (!(await select.isVisible().catch(() => false))) await fail(`${description} select exists but is still hidden.`);
            await select.selectOption(match.value);
          }

          async function findSelectWithOption(scope, pattern, description) {
            const selects = scope.locator('select');
            for (let i = 0; i < await selects.count(); i += 1) {
              const select = selects.nth(i);
              if (await optionMatch(select, pattern)) return select;
            }
            await fail(`No select contains ${description}.`, scope);
          }

          async function configureAutomator({ route, typePattern, baseValue, prompt, screenshotName }) {
            await gotoStable(`${baseURL}${route}`, route);
            await dismissCookies();

            const enabled = await firstVisible(page.getByLabel(/Enable AI Automator|Activer.*AI Automator/i));
            if (!enabled) await fail('Enable AI Automator control not found.');
            if (!(await enabled.isChecked())) await enabled.check();

            const type = await firstVisible(page.getByLabel(/Choose AI Automator Type|AI Automator Type|Type.*AI Automator/i));
            if (!type) await fail('AI Automator Type control not found.');
            await choose(type, typePattern, 'AI Automator Type');

            const advancedSummary = page.locator('summary').filter({ hasText: /Advanced Settings|Paramètres Avancés/i }).last();
            await advancedSummary.waitFor({ state: 'visible', timeout: 15000 }).catch(() => fail('Automator AJAX did not finish.'));
            await settle();

            const baseMode = await firstVisible(page.getByLabel(/Base Mode|Mode de base/i));
            if (baseMode && (await baseMode.getAttribute('type')) === 'radio' && !(await baseMode.isChecked())) await baseMode.check();

            if (baseValue) {
              const base = await firstVisible(page.getByLabel(/Automator Base Field|Champ de base.*Automator/i));
              if (!base) await fail('Automator Base Field control not found.');
              const values = await base.locator('option').evaluateAll((nodes) => nodes.map((node) => node.value));
              if (!values.includes(baseValue)) await fail(`Automator Base Field machine value missing: ${baseValue}`);
              await base.selectOption(baseValue);
            }

            const promptField = await firstVisible(page.getByLabel(/Automator Prompt|Prompt.*Automator|Invite.*Automator/i));
            if (promptField) await promptField.fill(prompt);

            const advanced = await openDetails(page.locator('body'), /Advanced Settings|Paramètres Avancés/i, 'Automator Advanced Settings');
            const fieldWidget = await firstVisible(advanced.getByLabel(/^Field Widget\b/i));
            if (!fieldWidget || (await fieldWidget.getAttribute('type')) !== 'radio') await fail('Field Widget worker radio not found.', advanced);
            if (!(await fieldWidget.isChecked())) await fieldWidget.check();

            await shot(screenshotName);
            const save = await firstVisible(page.getByRole('button', { name: /Save settings|Enregistrer les paramètres|Save|Enregistrer/i }));
            if (!save) await fail('Field settings save button not found.');
            await save.click();
            await settle();
            const errors = await page.locator('.messages--error, [data-drupal-messages] .messages--error').allInnerTexts().catch(() => []);
            if (errors.length) await fail(`Drupal rejected Automator configuration: ${errors.join(' | ')}`);
          }

          async function openWidgetRow(fieldName, fallbackText) {
            await gotoStable(`${baseURL}/admin/structure/types/manage/article/form-display`, 'Article form display');
            await dismissCookies();
            let row = await firstVisible(page.locator(`tr[data-drupal-selector*="${fieldName.replaceAll('_', '-')}"]`));
            if (!row) row = await firstVisible(page.locator('tr').filter({ hasText: fallbackText }));
            if (!row) await fail(`Form display row missing for ${fieldName}`);

            let trigger = await firstVisible(row.locator('[data-drupal-selector$="settings-edit"], input[value="Edit"], input[value="Modifier"]'));
            if (!trigger) trigger = await firstVisible(row.getByRole('button', { name: /settings|paramètres|configure|configurer|edit|modifier/i }));
            if (!trigger) await fail(`Widget settings trigger missing for ${fieldName}`, row);
            await trigger.click();
            await page.waitForTimeout(700);
            return row;
          }

          async function configureWidgetAction({ fieldName, fallbackText, actionPattern, automatorPattern, buttonLabel, screenshotName }) {
            const row = await openWidgetRow(fieldName, fallbackText);
            const actions = await openDetails(row, /Field Widget Actions/i, `Field Widget Actions settings for ${fieldName}`);
            const actionSelect = await findSelectWithOption(actions, actionPattern, `action ${actionPattern}`);
            await choose(actionSelect, actionPattern, `Field Widget Action for ${fieldName}`);

            const add = await firstVisible(actions.getByRole('button', { name: /Add action|Add|Ajouter/i }));
            if (!add) await fail(`Add action button missing for ${fieldName}`, actions);
            await add.click();
            await page.waitForTimeout(700);

            // The action plugin nests its settings in one or more closed <details> elements.
            // Open every currently visible level exactly as a user would before selecting its Automator.
            await expandVisibleDetails(row);

            const enable = await firstVisible(row.getByLabel(/Enable Automators|Activer.*Automator/i));
            if (enable && !(await enable.isChecked())) await enable.check();

            const labelInput = await firstVisible(row.getByLabel(/Button label|Libellé.*bouton/i));
            if (labelInput) await labelInput.fill(buttonLabel);

            await expandVisibleDetails(row);
            const automatorSelect = await findSelectWithOption(row, automatorPattern, `Automator ${automatorPattern}`);
            if (!(await automatorSelect.isVisible().catch(() => false))) {
              await expandVisibleDetails(row);
              await automatorSelect.waitFor({ state: 'visible', timeout: 3000 }).catch(() => fail(`Automator select still hidden for ${fieldName}.`, row));
            }
            await choose(automatorSelect, automatorPattern, `Automator for ${fieldName}`);

            await shot(screenshotName);
            const update = await firstVisible(row.getByRole('button', { name: /Update|Mettre à jour|Apply|Appliquer/i }));
            if (update) {
              await update.click();
              await settle();
            }

            const save = await firstVisible(page.getByRole('button', { name: /^Save$|^Enregistrer$/i }));
            if (!save) await fail('Form display Save button missing.');
            await save.click();
            await settle();
          }

          try {
            await gotoStable(loginURL, 'one-time administrator login');
            if (!/\/user\//.test(page.url()) && !/admin/.test(page.url())) await fail('One-time administrator login failed.');
            await dismissCookies();

            await configureAutomator({
              route: '/admin/structure/types/manage/article/fields/node.article.field_short_description',
              typePattern: /LLM:\s*Text.*simple/i,
              baseValue: 'body',
              prompt: 'Create a concise editorial short description from the article body in the same language as the source. Return one or two short sentences only. Do not invent facts. Return plain text without Markdown or HTML.',
              screenshotName: 'short-description-field-config',
            });

            await configureAutomator({
              route: '/admin/structure/types/manage/article/fields/node.article.field_feature_image',
              typePattern: /Image Alt Text/i,
              baseValue: null,
              prompt: 'Write concise, meaningful alternative text in the same language as the article. Describe only relevant visible information. Do not start with “image of” and do not invent details or add SEO keyword stuffing.',
              screenshotName: 'feature-image-field-config',
            });

            await configureWidgetAction({
              fieldName: 'field_short_description',
              fallbackText: /Description courte/i,
              actionPattern: /Automator Text Suggestion|Automator Text/i,
              automatorPattern: /Description courte.*Default|Short description.*Default|field_short_description/i,
              buttonLabel: 'Générer le résumé',
              screenshotName: 'short-description-widget-action',
            });

            await configureWidgetAction({
              fieldName: 'field_feature_image',
              fallbackText: /Image principale/i,
              actionPattern: /Alt Text|Alternative text|texte alternatif/i,
              automatorPattern: /Image principale.*Default|Feature image.*Default|field_feature_image/i,
              buttonLabel: 'Générer le texte alternatif',
              screenshotName: 'feature-image-widget-action',
            });

            await gotoStable(`${baseURL}/node/add/article`, 'Article creation form');
            await dismissCookies();
            await shot('article-form-after-config');
          } finally {
            await browser.close();
          }
          NODE

          node ./.issue-381-materialize.mjs
          rm -f .issue-381-materialize.mjs

      - name: Export canonical Drupal configuration
        run: |
          set -euo pipefail
          ddev drush cex -y
          ddev drush cr
          status="$(ddev drush config:status --format=list 2>/dev/null || true)"
          if [[ -n "$status" ]]; then
            echo "$status" >&2
            exit 1
          fi
          git diff --check
          git status --short
          git diff -- config/sync composer.json composer.lock

      - name: Upload diagnostic UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-381-drupal-config-materialization-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/issue-381-materialization
          if-no-files-found: warn
          retention-days: 7

      - name: Commit Drupal-generated configuration and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue-381-drupal-config-materialize.yml
          git add config/sync composer.json composer.lock
          git diff --cached --check
          git commit -m 'Issue #381: configure Article Field Widget Automators'
          git push origin HEAD:feature/issue-381-ai-automators-article-field-widget

      - name: Stop DDEV
        if: always()
        run: ddev delete -Oy || true
