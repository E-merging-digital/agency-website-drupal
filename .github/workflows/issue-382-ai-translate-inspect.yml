name: Issue 382 AI Translate inspection

on:
  push:
    branches:
      - feature/issue-382-ai-translate-parity-proof

permissions:
  contents: read

jobs:
  inspect-ai-translate:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_DIR: artifacts/issue-382-ai-translate

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: sqlite3

      - name: Install repository dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader --no-interaction

      - name: Prove Composer dry-run resolution
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          composer require 'drupal/ai_translate:^1.3' --dry-run --no-interaction --no-progress 2>&1 | tee "$ARTIFACT_DIR/composer-dry-run.txt"

      - name: Materialize standalone package only in disposable workspace
        run: |
          set -euo pipefail
          composer require 'drupal/ai_translate:^1.3' --no-interaction --no-progress
          composer show drupal/ai_translate --all > "$ARTIFACT_DIR/composer-show.txt"
          composer show drupal/ai --all > "$ARTIFACT_DIR/composer-show-ai-core.txt"
          test -d web/modules/contrib/ai_translate
          find web/modules/contrib/ai_translate -maxdepth 4 -type f -print | sort > "$ARTIFACT_DIR/source-files.txt"
          cp -a web/modules/contrib/ai_translate "$ARTIFACT_DIR/standalone-source"
          if [ -d web/modules/contrib/ai/modules/ai_translate ]; then
            cp -a web/modules/contrib/ai/modules/ai_translate "$ARTIFACT_DIR/bundled-deprecated-source"
          fi

      - name: Record parity-relevant source signals
        run: |
          set -euo pipefail
          {
            echo '=== routing ==='
            cat web/modules/contrib/ai_translate/ai_translate.routing.yml
            echo
            echo '=== permissions ==='
            cat web/modules/contrib/ai_translate/ai_translate.permissions.yml 2>/dev/null || true
            echo
            echo '=== services ==='
            cat web/modules/contrib/ai_translate/ai_translate.services.yml
            echo
            echo '=== info ==='
            cat web/modules/contrib/ai_translate/ai_translate.info.yml
            echo
            echo '=== translation/status/path/reference signals ==='
            grep -RniE 'addTranslation|hasTranslation|status|publish|path|alias|reference|paragraph|batch|permission|access|redirect|save\(' web/modules/contrib/ai_translate/src || true
          } > "$ARTIFACT_DIR/parity-signals.txt"

      - name: Verify repository files were not mutated intentionally
        run: |
          set -euo pipefail
          git restore composer.json composer.lock
          git clean -fd -- web/modules/contrib/ai_translate
          git status --short

      - name: Upload inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: issue-382-ai-translate-inspection-${{ github.run_id }}
          path: artifacts/issue-382-ai-translate
          retention-days: 14
