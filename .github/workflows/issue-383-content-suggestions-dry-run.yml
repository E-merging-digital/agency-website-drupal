name: Issue 383 AI Content Suggestions compatibility

on:
  push:
    branches:
      - feature/issue-383-ai-content-suggestions-verdict

permissions:
  contents: read

jobs:
  composer-compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate lock, install standalone temporarily and capture source evidence
        shell: bash
        run: |
          set -euo pipefail
          cp composer.json /tmp/issue-383-composer.json
          cp composer.lock /tmp/issue-383-composer.lock

          {
            echo "BASE_SHA=${GITHUB_SHA}"
            composer validate --strict
            echo "--- locked Drupal AI ---"
            composer show drupal/ai --locked
            echo "--- locked Field Widget Actions ---"
            composer show drupal/field_widget_actions --locked
            echo "--- package repository metadata before install ---"
            composer show drupal/ai_content_suggestions 1.5.0 --all || true
            echo "--- install standalone into disposable workspace ---"
          } | tee issue-383-proof.txt

          composer require 'drupal/ai_content_suggestions:^1.4' --with-all-dependencies --no-interaction 2>&1 | tee -a issue-383-proof.txt

          {
            echo "COMPATIBILITY=COMPATIBLE"
            echo "--- installed standalone ---"
            composer show drupal/ai_content_suggestions
            echo "--- installed dependency invariants ---"
            composer show drupal/ai | grep -E '^(versions|name)' || true
            composer show drupal/field_widget_actions | grep -E '^(versions|name)' || true
          } | tee -a issue-383-proof.txt

          mkdir -p issue-383-package
          cp web/modules/contrib/ai_content_suggestions/composer.json issue-383-package/ 2>/dev/null || true
          cp web/modules/contrib/ai_content_suggestions/*.info.yml issue-383-package/ 2>/dev/null || true
          cp web/modules/contrib/ai_content_suggestions/*.permissions.yml issue-383-package/ 2>/dev/null || true
          cp web/modules/contrib/ai_content_suggestions/*.routing.yml issue-383-package/ 2>/dev/null || true
          cp web/modules/contrib/ai_content_suggestions/*.services.yml issue-383-package/ 2>/dev/null || true
          cp -R web/modules/contrib/ai_content_suggestions/config issue-383-package/ 2>/dev/null || true
          cp -R web/modules/contrib/ai_content_suggestions/src issue-383-package/ 2>/dev/null || true

          cp /tmp/issue-383-composer.json composer.json
          cp /tmp/issue-383-composer.lock composer.lock
          git diff --exit-code -- composer.json composer.lock

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: issue-383-content-suggestions-inspection-${{ github.run_id }}
          path: |
            issue-383-proof.txt
            issue-383-package
