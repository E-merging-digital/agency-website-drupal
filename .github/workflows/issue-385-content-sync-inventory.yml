name: Issue 385 Content Sync inventory

on:
  push:
    branches:
      - feature/issue-385-governed-content-trajectory

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Inventory current Content Sync catalogue
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY' | tee issue-385-inventory.txt
          require 'yaml'
          require 'json'

          root = 'web/modules/custom/emerging_digital_content/content_sync'
          catalog_path = File.join(root, 'catalog.yml')
          catalog = YAML.safe_load(File.read(catalog_path), permitted_classes: [], aliases: false)
          contents = catalog.fetch('contents')

          puts "CATALOG_VERSION=#{catalog['version']}"
          puts "CATALOG_COUNT=#{contents.length}"
          counts = contents.group_by { |entry| entry['bundle'] }.transform_values(&:length)
          puts "BUNDLE_COUNTS=#{JSON.generate(counts.sort.to_h)}"
          puts
          puts "id\tbundle\tfile\tlegacy_uuid\tfr_alias\ten_alias\tclassification_candidate"

          legal_ids = %w[mentions-legales politique-confidentialite politique-cookies cookies]
          contents.each do |entry|
            id = entry.fetch('id')
            translations = entry.fetch('translations', {})
            fr_alias = translations.dig('fr', 'alias') || ''
            en_alias = translations.dig('en', 'alias') || ''
            classification = legal_ids.include?(id) || id.match?(/legal|privacy|confidential|cookie/) ? 'governed-legal-candidate' : 'ordinary-candidate'
            puts [id, entry['bundle'], entry['file'], entry['legacy_uuid'] || '', fr_alias, en_alias, classification].join("\t")
          end

          referenced = contents.map { |entry| File.expand_path(File.join(root, entry.fetch('file'))) }.sort
          actual = Dir.glob(File.join(root, 'node', '*.yml')).map { |path| File.expand_path(path) }.sort
          missing = referenced.reject { |path| File.file?(path) }
          unreferenced = actual - referenced
          duplicate_ids = contents.group_by { |entry| entry['id'] }.select { |_id, entries| entries.length > 1 }.keys

          puts
          puts "MISSING_REFERENCED_FILES=#{JSON.generate(missing)}"
          puts "UNREFERENCED_NODE_FILES=#{JSON.generate(unreferenced.map { |path| File.basename(path) })}"
          puts "DUPLICATE_IDS=#{JSON.generate(duplicate_ids)}"
          puts "ALL_HAVE_FR_EN=#{contents.all? { |entry| %w[fr en].all? { |lang| entry.fetch('translations', {}).key?(lang) } }}"
          puts "LEGACY_UUID_COUNT=#{contents.count { |entry| entry['legacy_uuid'] }}"
          RUBY

          {
            echo
            echo '--- Content Sync code footprint ---'
            find web/modules/custom/emerging_digital_content/src/ContentSync -type f -print | sort
            echo
            echo '--- Content Sync tests ---'
            find web/modules/custom/emerging_digital_content/tests -type f -print 2>/dev/null | grep -i 'ContentSync\|content_sync' | sort || true
            echo
            echo '--- Content Sync command/service references ---'
            grep -RInE 'emerging:content-sync|ContentSync|content_sync' \
              web/modules/custom/emerging_digital_content/*.yml \
              web/modules/custom/emerging_digital_content/src \
              web/modules/custom/emerging_digital_content/tests \
              scripts docs/operations AGENTS.md 2>/dev/null | head -n 400 || true
          } | tee -a issue-385-inventory.txt

          git diff --exit-code

      - name: Upload proof
        uses: actions/upload-artifact@v4
        with:
          name: issue-385-content-sync-inventory-${{ github.run_id }}
          path: issue-385-inventory.txt
          if-no-files-found: error
