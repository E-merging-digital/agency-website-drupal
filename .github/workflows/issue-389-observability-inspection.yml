name: Issue 389 observability inspection

on:
  push:
    branches:
      - feature/issue-389-ai-observability
    paths:
      - '.github/workflows/issue-389-observability-inspection.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Install DDEV
        uses: ddev/github-action-setup-ddev@v1
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Rebuild disposable Drupal
        shell: bash
        run: |
          set -euo pipefail
          ddev start -y
          admin_pass="$(openssl rand -hex 24)"
          ddev drush site:install --existing-config -y --account-pass="$admin_pass" >/dev/null
          unset admin_pass
          ddev drush cim -y >/dev/null
          ddev drush cr >/dev/null
          ddev drush config:status
      - name: Inspect exact AI Observability source and local activation
        shell: bash
        run: |
          set -euo pipefail
          out=artifacts/issue-389-observability
          mkdir -p "$out/source" "$out/config" "$out/reflection"
          module=web/modules/contrib/ai/modules/ai_observability
          ai=web/modules/contrib/ai
          test -d "$module"

          for f in \
            "$module/README.md" \
            "$module/ai_observability.info.yml" \
            "$module/ai_observability.services.yml" \
            "$module/ai_observability.install" \
            "$module/config/install/ai_observability.settings.yml" \
            "$module/config/schema/ai_observability.schema.yml" \
            "$module/src/AiLogEventType.php" \
            "$module/src/AiObservabilityUtils.php" \
            "$module/src/EventSubscriber/AiLoggingEventSubscriber.php" \
            "$module/src/Form/SettingsForm.php" \
            "$ai/src/Event/AiProviderRequestBaseEvent.php" \
            "$ai/src/Event/AiProviderResponseBaseEvent.php" \
            "$ai/src/Event/PreGenerateResponseEvent.php" \
            "$ai/src/Event/PostGenerateResponseEvent.php" \
            "$ai/src/Event/PostStreamingResponseEvent.php" \
            "$ai/src/Event/ProviderDisabledEvent.php"; do
            if [[ -f "$f" ]]; then
              cp "$f" "$out/source/$(echo "$f" | sed 's#/#__#g')"
            fi
          done

          find "$module" -maxdepth 4 -type f | sort > "$out/source/file-list.txt"
          find "$ai" -type f | grep -Ei '(test|mock|fake).*(provider)|(provider).*(test|mock|fake)' | sort > "$out/source/test-provider-candidates.txt" || true
          grep -RniE 'class .*Provider|provider_id|providerId' "$ai/tests" "$ai/modules" 2>/dev/null | head -1000 > "$out/source/provider-test-search.txt" || true

          ddev drush en dblog ai_observability -y
          ddev drush cr >/dev/null
          ddev drush pm:list --status=enabled --type=module --format=list | grep -E '^(ai_observability|dblog)$' | sort > "$out/config/enabled-modules.txt"
          ddev drush config:get ai_observability.settings --format=yaml > "$out/config/ai_observability.settings.yml"

          cat > "$out/reflection/probe.php" <<'PHP'
          <?php
          $classes = [
            'Drupal\\ai\\Event\\AiProviderRequestBaseEvent',
            'Drupal\\ai\\Event\\AiProviderResponseBaseEvent',
            'Drupal\\ai\\Event\\PreGenerateResponseEvent',
            'Drupal\\ai\\Event\\PostGenerateResponseEvent',
            'Drupal\\ai\\Event\\PostStreamingResponseEvent',
            'Drupal\\ai\\Event\\ProviderDisabledEvent',
            'Drupal\\ai\\OperationType\\Chat\\ChatInput',
            'Drupal\\ai\\OperationType\\Chat\\ChatOutput',
            'Drupal\\ai\\OperationType\\Chat\\ChatMessage',
          ];
          foreach ($classes as $class) {
            if (!class_exists($class)) {
              print "MISSING {$class}\n\n";
              continue;
            }
            $reflection = new ReflectionClass($class);
            print "CLASS {$class}\n";
            $constructor = $reflection->getConstructor();
            if (!$constructor) {
              print "  constructor: none\n\n";
              continue;
            }
            foreach ($constructor->getParameters() as $parameter) {
              $type = $parameter->getType();
              print '  $' . $parameter->getName() . ' : ' . ($type ? (string) $type : 'mixed') . ($parameter->isOptional() ? ' optional' : ' required') . "\n";
            }
            print "\n";
          }
          PHP
          ddev drush scr "$out/reflection/probe.php" > "$out/reflection/constructors.txt"

          ddev drush cex -y >/dev/null
          git status --short config/sync > "$out/config/export-status.txt"
          git diff -- config/sync > "$out/config/export.patch"
          grep -RniE 'prompt|input|output|token|duration|provider|model|logger|context|request|response|configuration|guardrail' "$module" > "$out/source/relevant-lines.txt" || true
          ddev drush config:status > "$out/config/status-after-export.txt" || true
      - name: Upload inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-389-observability-inspection-${{ github.run_id }}
          path: artifacts/issue-389-observability
          retention-days: 14
      - name: Cleanup DDEV
        if: always()
        run: ddev delete --omit-snapshot --yes || true
