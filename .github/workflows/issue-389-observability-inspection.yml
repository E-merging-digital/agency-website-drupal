name: Issue 389 observability inspection

on:
  push:
    branches:
      - feature/issue-389-ai-observability
    paths:
      - '.github/workflows/issue-389-observability-inspection.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - name: Install DDEV
        uses: ddev/github-action-setup-ddev@v1
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Rebuild disposable Drupal
        shell: bash
        run: |
          set -euo pipefail
          ddev start -y
          admin_pass="$(openssl rand -hex 24)"
          ddev drush site:install --existing-config -y --account-pass="$admin_pass" >/dev/null
          unset admin_pass
          ddev drush cim -y >/dev/null
          ddev drush cr >/dev/null
          ddev drush config:status
      - name: Prove AI Observability privacy-first runtime
        shell: bash
        run: |
          set -euo pipefail
          out=artifacts/issue-389-observability
          mkdir -p "$out/source" "$out/config" "$out/runtime"
          module=web/modules/contrib/ai/modules/ai_observability
          ai=web/modules/contrib/ai
          test -d "$module"

          for f in \
            "$module/README.md" \
            "$module/ai_observability.info.yml" \
            "$module/ai_observability.services.yml" \
            "$module/ai_observability.install" \
            "$module/config/install/ai_observability.settings.yml" \
            "$module/config/schema/ai_observability.schema.yml" \
            "$module/src/AiLogEventType.php" \
            "$module/src/AiObservabilityUtils.php" \
            "$module/src/EventSubscriber/AiLoggingEventSubscriber.php" \
            "$module/src/Form/SettingsForm.php" \
            "$ai/src/Event/AiProviderRequestBaseEvent.php" \
            "$ai/src/Event/AiProviderResponseBaseEvent.php" \
            "$ai/src/Event/PreGenerateResponseEvent.php" \
            "$ai/src/Event/PostGenerateResponseEvent.php"; do
            if [[ -f "$f" ]]; then
              cp "$f" "$out/source/$(echo "$f" | sed 's#/#__#g')"
            fi
          done
          grep -Rni -B20 -A35 'new PreGenerateResponseEvent' "$ai/src" > "$out/source/pre-event-construction.txt" || true

          ddev drush en dblog ai_observability -y
          ddev drush cr >/dev/null
          ddev drush config:get ai_observability.settings --format=yaml > "$out/config/ai_observability.settings.yml"

          cat > "$out/runtime/probe.php" <<'PHP'
          <?php
          use Drupal\ai\Event\PreGenerateResponseEvent;
          use Drupal\ai\OperationType\Chat\ChatInput;
          use Drupal\ai\OperationType\Chat\ChatMessage;
          use Drupal\Core\Database\Database;

          $settings = \Drupal::configFactory()->getEditable('ai_observability.settings');
          $settings
            ->set('logging_enabled', TRUE)
            ->set('log_input', FALSE)
            ->set('log_output', FALSE)
            ->set('otel_enabled', FALSE)
            ->save();

          $database = Database::getConnection();
          $database->delete('watchdog')->condition('type', 'ai_observability')->execute();

          $input = new ChatInput([
            new ChatMessage('user', 'ISSUE389_PRIVATE_INPUT_MARKER'),
          ]);
          $event = new PreGenerateResponseEvent(
            'issue389-thread',
            'issue389-provider',
            'chat',
            [
              'temperature' => 0.2,
              'max_tokens' => 64,
              'probe' => 'ISSUE389_CONFIG_VISIBLE',
            ],
            $input,
            'issue389-model',
            ['issue389-probe'],
          );
          \Drupal::service('event_dispatcher')->dispatch($event, PreGenerateResponseEvent::EVENT_NAME);

          $row = $database->select('watchdog', 'w')
            ->fields('w', ['message', 'variables'])
            ->condition('type', 'ai_observability')
            ->orderBy('wid', 'DESC')
            ->range(0, 1)
            ->execute()
            ->fetchObject();
          if (!$row) {
            throw new RuntimeException('Expected an ai_observability watchdog row.');
          }
          $raw = (string) $row->variables;
          if (str_contains($raw, 'ISSUE389_PRIVATE_INPUT_MARKER')) {
            throw new RuntimeException('Private input marker leaked into observability variables.');
          }
          foreach (['issue389-provider', 'issue389-model'] as $expected) {
            if (!str_contains($raw, $expected)) {
              throw new RuntimeException("Expected persisted marker missing: {$expected}");
            }
          }
          print "PRIVACY_FIRST_LOG=PASS\n";
          print 'MESSAGE=' . $row->message . "\n";
          print 'INPUT_MARKER_PRESENT=' . (str_contains($raw, 'ISSUE389_PRIVATE_INPUT_MARKER') ? 'yes' : 'no') . "\n";
          print 'PROVIDER_PRESENT=' . (str_contains($raw, 'issue389-provider') ? 'yes' : 'no') . "\n";
          print 'MODEL_PRESENT=' . (str_contains($raw, 'issue389-model') ? 'yes' : 'no') . "\n";
          print 'CONFIGURATION_PERSISTED_BY_DBLOG=' . (str_contains($raw, 'ISSUE389_CONFIG_VISIBLE') ? 'yes' : 'no') . "\n";

          $before = (int) $database->select('watchdog', 'w')
            ->condition('type', 'ai_observability')
            ->countQuery()
            ->execute()
            ->fetchField();
          $settings->set('logging_enabled', FALSE)->save();
          $disabledEvent = new PreGenerateResponseEvent(
            'issue389-disabled-thread',
            'issue389-disabled-provider',
            'chat',
            [],
            new ChatInput([new ChatMessage('user', 'ISSUE389_DISABLED_INPUT')]),
            'issue389-disabled-model',
          );
          \Drupal::service('event_dispatcher')->dispatch($disabledEvent, PreGenerateResponseEvent::EVENT_NAME);
          $after = (int) $database->select('watchdog', 'w')
            ->condition('type', 'ai_observability')
            ->countQuery()
            ->execute()
            ->fetchField();
          if ($after !== $before) {
            throw new RuntimeException('Logging-disabled event unexpectedly created an observability row.');
          }
          print "DISABLED_LOGGING_BYPASS=PASS\n";
          PHP
          ddev drush scr "$out/runtime/probe.php" > "$out/runtime/result.txt"
          cat "$out/runtime/result.txt"

          ddev drush cex -y >/dev/null
          git status --short config/sync > "$out/config/export-status.txt"
          git diff -- config/sync > "$out/config/export.patch"
      - name: Upload inspection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-389-observability-inspection-${{ github.run_id }}
          path: artifacts/issue-389-observability
          retention-days: 14
      - name: Cleanup DDEV
        if: always()
        run: ddev delete --omit-snapshot --yes || true
