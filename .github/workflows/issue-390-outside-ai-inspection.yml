name: Issue 390 Outside AI compatibility inspection

on:
  push:
    branches:
      - feature/issue-390-outside-ai-readonly-pilot

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Probe and inspect exact packages
        id: probe
        shell: bash
        run: |
          set -u
          cp composer.json /tmp/issue-390-composer.json
          cp composer.lock /tmp/issue-390-composer.lock
          : > issue-390-proof.txt

          {
            echo "BASE_SHA=${GITHUB_SHA}"
            composer validate --strict
            echo "--- project lock ---"
            composer show drupal/ai --locked
            echo "--- repository metadata: Tool API beta3 ---"
            composer show drupal/tool 1.0.0-beta3 --all || true
            echo "--- repository metadata: MCP Server beta1 ---"
            composer show drupal/mcp_server 2.0.0-beta1 --all || true
            echo "--- repository metadata: AI Agents 1.3.3 ---"
            composer show drupal/ai_agents 1.3.3 --all || true
            echo "--- dry-run combined compatibility ---"
          } | tee -a issue-390-proof.txt

          set +e
          composer require \
            'drupal/tool:^1.0@beta' \
            'drupal/mcp_server:^2.0@beta' \
            'drupal/ai_agents:^1.3' \
            --with-all-dependencies --dry-run --no-interaction 2>&1 | tee -a issue-390-proof.txt
          dry_status=${PIPESTATUS[0]}
          set -e
          echo "DRY_RUN_EXIT=${dry_status}" | tee -a issue-390-proof.txt

          install_status=99
          if [ "${dry_status}" -eq 0 ]; then
            set +e
            composer require \
              'drupal/tool:^1.0@beta' \
              'drupal/mcp_server:^2.0@beta' \
              'drupal/ai_agents:^1.3' \
              --with-all-dependencies --no-interaction 2>&1 | tee -a issue-390-proof.txt
            install_status=${PIPESTATUS[0]}
            set -e
          fi
          echo "INSTALL_EXIT=${install_status}" | tee -a issue-390-proof.txt

          if [ "${install_status}" -eq 0 ]; then
            {
              echo "COMPATIBILITY=COMPATIBLE"
              echo "--- installed exact versions ---"
              composer show drupal/tool
              composer show drupal/mcp_server
              composer show drupal/ai_agents
              composer show drupal/ai | grep -E '^(name|versions)' || true
            } | tee -a issue-390-proof.txt

            mkdir -p issue-390-package/tool issue-390-package/mcp_server issue-390-package/ai_agents
            cp web/modules/contrib/tool/composer.json issue-390-package/tool/ 2>/dev/null || true
            cp web/modules/contrib/tool/*.info.yml issue-390-package/tool/ 2>/dev/null || true
            cp web/modules/contrib/tool/*.permissions.yml issue-390-package/tool/ 2>/dev/null || true
            cp web/modules/contrib/tool/*.services.yml issue-390-package/tool/ 2>/dev/null || true
            cp -R web/modules/contrib/tool/src issue-390-package/tool/ 2>/dev/null || true
            cp -R web/modules/contrib/tool/modules issue-390-package/tool/ 2>/dev/null || true

            cp web/modules/contrib/mcp_server/composer.json issue-390-package/mcp_server/ 2>/dev/null || true
            cp web/modules/contrib/mcp_server/*.info.yml issue-390-package/mcp_server/ 2>/dev/null || true
            cp web/modules/contrib/mcp_server/*.permissions.yml issue-390-package/mcp_server/ 2>/dev/null || true
            cp web/modules/contrib/mcp_server/*.routing.yml issue-390-package/mcp_server/ 2>/dev/null || true
            cp web/modules/contrib/mcp_server/*.services.yml issue-390-package/mcp_server/ 2>/dev/null || true
            cp -R web/modules/contrib/mcp_server/src issue-390-package/mcp_server/ 2>/dev/null || true
            cp -R web/modules/contrib/mcp_server/config issue-390-package/mcp_server/ 2>/dev/null || true

            cp web/modules/contrib/ai_agents/composer.json issue-390-package/ai_agents/ 2>/dev/null || true
            cp web/modules/contrib/ai_agents/*.info.yml issue-390-package/ai_agents/ 2>/dev/null || true
          else
            echo "COMPATIBILITY=INCOMPATIBLE" | tee -a issue-390-proof.txt
          fi

          cp /tmp/issue-390-composer.json composer.json
          cp /tmp/issue-390-composer.lock composer.lock
          git checkout -- web/robots.txt 2>/dev/null || true
          git diff --exit-code -- composer.json composer.lock web/robots.txt

          echo "dry_status=${dry_status}" >> "$GITHUB_OUTPUT"
          echo "install_status=${install_status}" >> "$GITHUB_OUTPUT"

      - name: Upload inspection proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-390-outside-ai-inspection-${{ github.run_id }}
          path: |
            issue-390-proof.txt
            issue-390-package

      - name: Enforce compatibility result
        shell: bash
        run: |
          test '${{ steps.probe.outputs.dry_status }}' = '0'
          test '${{ steps.probe.outputs.install_status }}' = '0'
