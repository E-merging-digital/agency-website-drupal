name: Issue 439 PHPCS fix

on:
  push:
    branches:
      - feature/issue-439-governed-content-release-mapping

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/issue-439-governed-content-release-mapping

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Fix only the new release manager coding standard
        shell: bash
        run: |
          set -euo pipefail
          target='web/modules/custom/emerging_digital_content/src/ContentSync/ContentSyncReleaseManager.php'

          python <<'PY'
          from pathlib import Path
          path = Path('web/modules/custom/emerging_digital_content/src/ContentSync/ContentSyncReleaseManager.php')
          text = path.read_text()
          old = """  /**\n   * Builds a compact structured lifecycle report.\n   *\n   * @param list<string> $actions\n"""
          new = """  /**\n   * Builds a compact structured lifecycle report.\n   *\n   * @param string $content_id\n   *   Stable Content Sync business identifier.\n   * @param bool $dry_run\n   *   Whether the operation is read-only.\n   * @param string $operation\n   *   Lifecycle operation name.\n   * @param \\Drupal\\emerging_digital_content\\ContentSync\\Entity\\ContentSyncMappingRecord|null $mapping\n   *   Current mapping, when available.\n   * @param list<string> $actions\n"""
          if old not in text:
              raise SystemExit('Lifecycle report PHPDoc anchor not found')
          path.write_text(text.replace(old, new, 1))
          PY

          composer install --no-progress --prefer-dist --no-interaction
          set +e
          vendor/bin/phpcbf --standard=phpcs.xml "$target"
          status=$?
          set -e
          if [[ "$status" -gt 1 ]]; then
            exit "$status"
          fi
          vendor/bin/phpcs --standard=phpcs.xml "$target"
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'Issue #439: satisfy release manager coding standard'
          git push origin HEAD:feature/issue-439-governed-content-release-mapping
