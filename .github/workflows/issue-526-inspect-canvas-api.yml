name: Issue 526 inspect Canvas API

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/issue-526-inspect-canvas-api.yml

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect installed Canvas page APIs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install locked dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Print focused Canvas page and component-tree examples
        shell: bash
        run: |
          set -euo pipefail
          root='web/modules/contrib/canvas'

          echo '=== PAGE ENTITY ==='
          sed -n '1,360p' "$root/src/Entity/Page.php"

          echo '=== PAGE TEST COMPONENT TREE ==='
          sed -n '110,190p' "$root/tests/src/Kernel/Entity/PageTest.php"

          echo '=== COMPONENT TREE ITEM VALID VALUES ==='
          sed -n '70,150p' "$root/tests/src/Kernel/Plugin/Field/FieldType/ComponentTreeItemTest.php"

          echo '=== CANVAS DOCTOR VALID PAGE HELPER ==='
          line="$(grep -n 'createValidPage' "$root/tests/src/Kernel/Health/CanvasDoctorTest.php" | tail -n 1 | cut -d: -f1)"
          start=$((line - 15))
          end=$((line + 45))
          sed -n "${start},${end}p" "$root/tests/src/Kernel/Health/CanvasDoctorTest.php"

          echo '=== COMPONENT VERSION AND INPUT EXAMPLES ==='
          grep -R -n -B12 -A35 "'component_version' =>" "$root/tests/src" \
            --include='*.php' | head -n 480 || true

          echo '=== COMPONENT INPUTS DATA TYPE ==='
          inputs_file="$root/src/Plugin/DataType/ComponentInputs.php"
          if [[ -f "$inputs_file" ]]; then
            sed -n '1,420p' "$inputs_file"
          fi

          echo '=== STATIC PROP SOURCE SERIALIZATION ==='
          grep -R -n -B8 -A30 -E "StaticPropSource|sourceType.*static|toArray\(\).*source" \
            "$root/tests/src/Kernel" --include='*.php' | head -n 420 || true
