name: Issue 526 materialize Canvas lock

on:
  push:
    branches:
      - feature/issue-526-canvas-baseline
    paths:
      - composer.json
      - .github/workflows/issue-526-materialize-canvas-lock.yml
  pull_request:
    branches:
      - main
    paths:
      - composer.json
      - .github/workflows/issue-526-materialize-canvas-lock.yml

permissions:
  contents: write

jobs:
  materialize-lock:
    name: Materialize Canvas composer.lock on hosted runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Setup PHP 8.4 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Materialize locked Canvas dependency
        run: |
          set -euo pipefail
          composer update drupal/canvas --with-dependencies --no-interaction --no-progress
          composer validate --strict
          composer show drupal/canvas --locked

      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: issue-526-canvas-lock
          path: composer.lock
          if-no-files-found: error
          retention-days: 1

      - name: Commit only the generated lockfile to the issue branch
        if: github.event_name == 'push'
        env:
          EXPECTED_BRANCH: feature/issue-526-canvas-baseline
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          changed="$(git diff --cached --name-only)"
          test "$changed" = "composer.lock"
          git commit -m "Issue #526: lock Drupal Canvas dependency"
          git push origin "HEAD:$GITHUB_REF_NAME"
