name: Issue 526 materialize Canvas page

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/issue-526-materialize-canvas-page.yml

permissions:
  contents: read

jobs:
  materialize-page:
    name: Create and export governed Canvas page
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout exact issue branch
        uses: actions/checkout@v6
        with:
          ref: feature/issue-526-canvas-baseline
          persist-credentials: false

      - name: Setup PHP 8.4 and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mysqli,pdo_mysql
          coverage: none

      - name: Install locked project dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader --no-interaction

      - name: Rebuild canonical Agency state
        run: |
          set -euo pipefail
          vendor/bin/drush site:install --existing-config -y \
            --db-url='mysql://root:root@127.0.0.1:3306/db'
          vendor/bin/drush config:import -y
          vendor/bin/drush config:status

      - name: Create native governed Canvas page
        run: |
          set -euo pipefail
          vendor/bin/drush php:eval '
            $page = \Drupal\canvas\Entity\Page::create([
              "uuid" => "52600000-0000-4000-8000-000000000001",
              "langcode" => "fr",
              "status" => TRUE,
              "title" => "Canvas gouverné — baseline SDC",
              "description" => "Preuve de composition Drupal Canvas bornée aux composants SDC approuvés du design system Agency.",
              "path" => [
                "alias" => "/canvas-governed-sdc-baseline",
                "pathauto" => FALSE,
              ],
              "components" => [
                [
                  "uuid" => "52600000-0000-4000-8000-000000000101",
                  "component_id" => "sdc.emerging_digital.hero",
                  "component_version" => "f6ebbdd7632bea80",
                  "inputs" => [
                    "heading" => "Canvas gouverné par le design system Agency",
                    "heading_level" => "h1",
                    "variant" => "home",
                  ],
                ],
                [
                  "uuid" => "52600000-0000-4000-8000-000000000102",
                  "component_id" => "sdc.emerging_digital.trust-list",
                  "component_version" => "61b25a47f367765e",
                  "inputs" => [
                    "heading" => "Contrôles de composition",
                    "items" => [
                      "Composants SDC approuvés",
                      "Props typées et variantes bornées",
                      "Validation desktop et mobile",
                    ],
                  ],
                ],
                [
                  "uuid" => "52600000-0000-4000-8000-000000000103",
                  "component_id" => "sdc.emerging_digital.cta",
                  "component_version" => "b4f165563eb02357",
                  "inputs" => [
                    "heading" => "Composition Canvas bornée",
                    "heading_level" => "h2",
                  ],
                ],
              ],
            ]);
            $violations = $page->validate();
            if (count($violations) > 0) {
              foreach ($violations as $violation) {
                fwrite(STDERR, $violation->getPropertyPath() . ": " . $violation->getMessage() . PHP_EOL);
              }
              throw new \RuntimeException("Canvas page validation failed.");
            }
            $page->save();
          '

      - name: Export native Canvas page with Drupal core API
        run: |
          set -euo pipefail
          rm -rf web/modules/custom/emerging_digital_content/core_default_content
          vendor/bin/drush php:eval '
            $storage = \Drupal::entityTypeManager()->getStorage("canvas_page");
            $ids = $storage->getQuery()
              ->accessCheck(FALSE)
              ->condition("uuid", "52600000-0000-4000-8000-000000000001")
              ->execute();
            if (count($ids) !== 1) {
              throw new \RuntimeException("Expected exactly one governed Canvas page.");
            }
            $page = $storage->load(reset($ids));
            if ($page === NULL) {
              throw new \RuntimeException("Governed Canvas page could not be loaded.");
            }
            $directory = DRUPAL_ROOT . "/modules/custom/emerging_digital_content/core_default_content";
            $exporter = \Drupal::service(\Drupal\Core\DefaultContent\Exporter::class);
            $exporter->exportToFile($page, $directory);
          '
          find web/modules/custom/emerging_digital_content/core_default_content \
            -maxdepth 4 -type f -print -exec sed -n '1,260p' {} \;

      - name: Upload core-native Canvas page export
        uses: actions/upload-artifact@v4
        with:
          name: issue-526-core-canvas-page
          path: web/modules/custom/emerging_digital_content/core_default_content
          if-no-files-found: error
          retention-days: 1
