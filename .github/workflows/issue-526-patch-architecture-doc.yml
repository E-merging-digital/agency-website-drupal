name: Issue 526 patch architecture documentation

on:
  push:
    branches:
      - feature/issue-526-canvas-baseline
    paths:
      - .github/workflows/issue-526-patch-architecture-doc.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Patch durable architecture state
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/governed-ai-experience.md')
          text = path.read_text(encoding='utf-8')

          start = text.index('### Déjà présent\n')
          end = text.index('Ce document ne doit jamais présenter', start)
          replacement = '''### Déjà présent\n\n- Drupal 11.4.x ;\n- Drupal AI stable dans le projet ;\n- thème custom `emerging_digital` ;\n- Paragraphs et templates Twig explicites ;\n- tokens CSS dans `web/themes/custom/emerging_digital/css/base.css` ;\n- catalogue SDC gouverné et admission machine-readable issus de #519 ;\n- Hero, CTA et Trust list admis pour composition ;\n- Drupal Canvas verrouillé par Composer et configuration Canvas/Media versionnée ;\n- allowlist Canvas dérivée du catalogue Agency approuvé ;\n- Canvas Page de preuve core-native `/canvas-governed-sdc-baseline` ;\n- validation Playwright réelle desktop/mobile ;\n- Playwright MCP et Chrome DevTools MCP disponibles sur le runner ;\n- preuve DEV-ONLY de `drupal/ai_playwright` ;\n- contrat de contexte partagé dans `docs/drupal-ai-context-architecture.md`.\n\n### Pas encore présent\n\n- intégration technique Figma ;\n- Context Control Center en production ;\n- génération de pages Canvas AI activée comme capacité produit.\n\n'''
          text = text[:start] + replacement + text[end:]

          text = text.replace(
              'Le catalogue d’admission sera matérialisé dans #519. Il doit rester dérivable du\ncode et ne pas devenir une seconde implémentation des composants.',
              'Le catalogue d’admission est matérialisé depuis #519 dans\n`docs/design-system/component-catalog.yml`. Il reste dérivable du code et ne\ndevient pas une seconde implémentation des composants.',
          )
          text = text.replace(
              'À mesure que #519 matérialise le catalogue :',
              'Avec le catalogue matérialisé par #519 :',
          )
          text = text.replace(
              '4. **Canvas** : vertical slice de composition visuelle avec les SDC approuvés.\n5. **Canvas AI** : pilote borné de sélection/composition de ces mêmes composants.',
              '4. **#526 / Canvas** : baseline de composition visuelle avec les SDC approuvés ; voir `docs/canvas-baseline.md`.\n5. **Canvas AI** : seulement après admission finale de #526, pilote borné de sélection/composition de ces mêmes composants.',
          )

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = "docs/governed-ai-experience.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/governed-ai-experience.md
          git commit -m "Issue #526: record Canvas baseline in target architecture"
          git push origin "HEAD:$GITHUB_REF_NAME"
