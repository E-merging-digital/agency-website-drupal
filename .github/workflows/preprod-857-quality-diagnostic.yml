name: "TEMP #857 quality diagnostic"

on:
  pull_request:
    paths:
      - '.github/workflows/preprod-857-quality-diagnostic.yml'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/PreproductionMariaDbStagingSanitizationTest.php'

permissions:
  contents: read

jobs:
  quality-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader --no-interaction

      - name: Capture PHPCS diagnostic
        shell: bash
        run: |
          set +e
          vendor/bin/phpcs --standard=phpcs.xml --report=json \
            web/modules/custom/agency_project_tests/tests/src/Unit/PreproductionMariaDbStagingSanitizationTest.php \
            > /tmp/phpcs.json
          code=$?
          printf '%s\n' "$code" > /tmp/phpcs.exit
          exit 0

      - name: Capture PHPStan diagnostic
        shell: bash
        run: |
          set +e
          vendor/bin/phpstan analyse -c phpstan.neon --error-format=json \
            web/modules/custom/agency_project_tests/tests/src/Unit/PreproductionMariaDbStagingSanitizationTest.php \
            > /tmp/phpstan.json 2>/tmp/phpstan.stderr
          code=$?
          printf '%s\n' "$code" > /tmp/phpstan.exit
          exit 0

      - name: Capture Drupal Check diagnostic
        shell: bash
        run: |
          set +e
          php -d error_reporting=8191 vendor/bin/drupal-check \
            web/modules/custom/agency_project_tests/tests/src/Unit/PreproductionMariaDbStagingSanitizationTest.php \
            > /tmp/drupal-check.txt 2>&1
          code=$?
          printf '%s\n' "$code" > /tmp/drupal-check.exit
          exit 0

      - name: Upload diagnostic reports
        uses: actions/upload-artifact@v4
        with:
          name: preprod-857-quality-diagnostic
          path: |
            /tmp/phpcs.json
            /tmp/phpcs.exit
            /tmp/phpstan.json
            /tmp/phpstan.stderr
            /tmp/phpstan.exit
            /tmp/drupal-check.txt
            /tmp/drupal-check.exit
          retention-days: 1
