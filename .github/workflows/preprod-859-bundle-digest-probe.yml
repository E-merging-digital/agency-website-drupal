name: "TEMP #859 bundle digest probe"

on:
  pull_request:
    paths:
      - '.github/workflows/preprod-859-bundle-digest-probe.yml'
      - 'scripts/preproduction-refresh/sanitization-policy.json'
      - 'scripts/preproduction-staging-import/privileged/agency-preprod-staging-db'
      - 'scripts/preproduction-staging-import/privileged/agency-preprod-staging-sanitizer.py'

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compute bundle digests
        shell: bash
        run: |
          sha256sum \
            scripts/preproduction-staging-import/privileged/agency-preprod-staging-db \
            scripts/preproduction-staging-import/privileged/agency-preprod-staging-sanitizer.py \
            scripts/preproduction-refresh/sanitization-policy.json \
            > /tmp/bundle.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: preprod-859-bundle-digests
          path: /tmp/bundle.sha256
          retention-days: 1
