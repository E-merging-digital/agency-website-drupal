name: "TEMP #859 one-shot phase diagnostic"

on:
  pull_request:
    paths:
      - '.github/workflows/preprod-859-phase-diagnostic.yml'
      - 'scripts/preproduction-staging-import/privileged/**'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Start isolated MariaDB after fixed client installation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mariadb-client
          sudo install -d -m 0777 /run/mysqld
          docker run -d --name agency-859-diag -e MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=1 -v /run/mysqld:/run/mysqld mariadb:11.8 --skip-networking=1 --socket=/run/mysqld/mysqld.sock
          for i in $(seq 1 40); do
            docker exec agency-859-diag mariadb-admin --protocol=socket --socket=/run/mysqld/mysqld.sock -uroot ping >/dev/null 2>&1 && exit 0
            sleep 1
          done
          exit 1
      - name: Prove socket lifetime without helper execution
        shell: bash
        run: |
          set +e
          : > /tmp/phase.env
          for delay in 0 1 2 5 10; do
            if [[ "$delay" -gt 0 ]]; then sleep "$delay"; fi
            test -S /run/mysqld/mysqld.sock
            socket_rc="$?"
            docker exec agency-859-diag mariadb-admin --protocol=socket --socket=/run/mysqld/mysqld.sock -uroot ping >/dev/null 2>&1
            ping_rc="$?"
            process_count="$(docker top agency-859-diag -eo comm 2>/dev/null | grep -c '^mariadbd$')"
            printf 'AFTER_%s_SECONDS_SOCKET_EXIT=%s\n' "$delay" "$socket_rc" >> /tmp/phase.env
            printf 'AFTER_%s_SECONDS_PING_EXIT=%s\n' "$delay" "$ping_rc" >> /tmp/phase.env
            printf 'AFTER_%s_SECONDS_MARIADBD_COUNT=%s\n' "$delay" "$process_count" >> /tmp/phase.env
          done
          docker_state="$(docker inspect -f '{{.State.Status}}|{{.State.ExitCode}}|{{.State.OOMKilled}}' agency-859-diag 2>/dev/null)"
          printf 'FINAL_DOCKER_STATE=%s\n' "$docker_state" >> /tmp/phase.env
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: preprod-859-phase-diagnostic
          path: /tmp/phase.env
          retention-days: 1
      - if: always()
        run: docker rm -f agency-859-diag >/dev/null 2>&1 || true
