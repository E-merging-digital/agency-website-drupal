name: "Validate #866 real one-shot route and mutation-free PLAN"

on:
  pull_request:
    paths:
      - '.github/workflows/preprod-866-real-one-shot.yml'
      - '.github/workflows/preprod-866-real-one-shot-validation.yml'
      - 'scripts/preproduction-staging-import/real-one-shot/**'
      - 'scripts/preproduction-staging-import/remote-preprod-stage.sh'
      - 'scripts/preproduction-staging-import/privileged/**'
      - 'scripts/preproduction-staging-import/provisioning/remote-plan-readonly.sh'
      - 'scripts/production-readonly-snapshot/remote-stream.sh'
      - 'scripts/production-ssh-trust/**'
      - 'scripts/preproduction-refresh/sanitization-policy.json'

permissions:
  contents: read

jobs:
  route-contract:
    name: Prove #866 composition and fail-closed PLAN boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate syntax and exact contract
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-staging-import/real-one-shot'
          bash -n \
            "$base/run-plan.sh" \
            "$base/run-apply.sh" \
            "$base/remote-prod-plan-readonly.sh" \
            "$base/remote-preprod-privilege-plan-readonly.sh"
          python3 -m py_compile "$base/test-contract.py"
          python3 "$base/test-contract.py"
          jq -e '
            .issue_number == 866 and
            .parent_issue == 816 and
            .profile_id == "agency-preprod-real-one-shot-sanitize-v1" and
            .prod.role == "READ_ONLY_SNAPSHOT_SOURCE_ONLY" and
            .prod.write == "FORBIDDEN" and
            .capability.apply_action == "IMPORT_SANITIZE_PROVE" and
            .capability.detached_import == "FORBIDDEN" and
            .preprod.runtime_db_switch == "FORBIDDEN" and
            .preprod.activation == "FORBIDDEN" and
            .transfer.raw_temp_mode == "0600" and
            .transfer.raw_github_artifact == "FORBIDDEN" and
            .transfer.raw_log_output == "FORBIDDEN" and
            .transfer.cleanup_mandatory == true
          ' "$base/profile.json" >/dev/null

      - name: Prove PLAN cannot perform data movement or mutation
        shell: bash
        run: |
          set -euo pipefail
          plan='scripts/preproduction-staging-import/real-one-shot/run-plan.sh'
          prod_plan='scripts/preproduction-staging-import/real-one-shot/remote-prod-plan-readonly.sh'
          ! grep -Fq 'production-readonly-snapshot/remote-stream.sh' "$plan"
          ! grep -Fq 'sql:dump' "$plan"
          ! grep -Eq "sudo -n -- .* (IMPORT|IMPORT_SANITIZE_PROVE) " "$plan"
          ! grep -Fq 'vendor/bin/drush' "$prod_plan"
          ! grep -Fqi 'mariadb' "$prod_plan"
          grep -Fq 'prod_db_content_read=NONE' "$plan"
          grep -Fq 'prod_snapshot=NOT_PERFORMED' "$plan"
          grep -Fq 'prod_data_transfer=NONE' "$plan"
          grep -Fq 'preprod_mutation=NONE' "$plan"
          grep -Fq 'runtime_db_switch=NONE' "$plan"
          grep -Fq 'activation=NOT_PERFORMED' "$plan"

      - name: Prove effective sudo authority is tested without execution
        shell: bash
        run: |
          set -euo pipefail
          probe='scripts/preproduction-staging-import/real-one-shot/remote-preprod-privilege-plan-readonly.sh'
          grep -Fq 'sudo -n -l -- "$HELPER_PATH" PRECHECK "$REQUEST_ID" 0' "$probe"
          grep -Fq '/usr/bin/mariadb' "$probe"
          grep -Fq '/bin/bash' "$probe"
          grep -Fq '/usr/bin/python3' "$probe"
          grep -Fq '/usr/bin/env' "$probe"
          ! grep -Eq 'sudo -n -- ' "$probe"
          grep -Fq 'direct_mariadb_sudo=FORBIDDEN' "$probe"
          grep -Fq 'generic_shell_sudo=FORBIDDEN' "$probe"
          grep -Fq 'generic_python_sudo=FORBIDDEN' "$probe"
          grep -Fq 'generic_env_sudo=FORBIDDEN' "$probe"

      - name: Prove future APPLY is atomic helper composition only
        shell: bash
        run: |
          set -euo pipefail
          apply='scripts/preproduction-staging-import/real-one-shot/run-apply.sh'
          grep -Fq "PROD_REMOTE='scripts/production-readonly-snapshot/remote-stream.sh'" "$apply"
          grep -Fq "PREPROD_REMOTE='scripts/preproduction-staging-import/remote-preprod-stage.sh'" "$apply"
          grep -Fq "IMPORT_SANITIZE_PROVE '\$REQUEST_ID' '\$snapshot_bytes'" "$apply"
          ! grep -Eq "'\$HELPER_PATH' IMPORT '" "$apply"
          ! grep -Fq 'sanitize-staging-fixture.py' "$apply"
          ! grep -Fq 'sanitize-staging-mariadb-proof.py' "$apply"
          grep -Fq 'one_shot_import_sanitize_prove_cleanup=PASS' "$apply"
          grep -Fq 'staging_db_present_after_cleanup=NO' "$apply"
          grep -Fq 'staging_account_present_after_cleanup=NO' "$apply"
          grep -Fq 'raw_snapshot_after=ABSENT' "$apply"
          grep -Fq 'preprod_runtime_db_touched=NO' "$apply"
          grep -Fq 'activation=NOT_PERFORMED' "$apply"

      - name: Prove no generic privilege or activation surface
        shell: bash
        run: |
          set -euo pipefail
          route='scripts/preproduction-staging-import/real-one-shot'
          apply="$route/run-apply.sh"
          ! grep -REq 'NOPASSWD:[[:space:]]*ALL|sudo[[:space:]]+(-n[[:space:]]+)?(mariadb|bash|sh|python)([[:space:]]|$)' "$route"
          ! grep -Eq 'settings\.php.*(>|sed|perl)|ln[[:space:]]+-s|systemctl|drush[[:space:]]+(sql:cli|config:import|updatedb)|public.*(rsync|scp)|private.*(rsync|scp)' "$apply"
          grep -Fq '.apply.runtime_db_switch == "FORBIDDEN"' "$apply"
          grep -Fq '.apply.activation == "FORBIDDEN"' "$apply"
          grep -Fq 'public_files=NONE' "$apply"
          grep -Fq 'private_files=NONE' "$apply"

      - name: Emit bounded regression result
        shell: bash
        run: |
          printf '%s\n' \
            'ISSUE_866_ROUTE_PLAN_REGRESSION=PASS' \
            'REUSED_834_COMPONENTS=PASS' \
            'REUSED_859_861_COMPONENTS=PASS' \
            'NEW_EXECUTION_MECHANISM=NONE' \
            'PLAN_MUTATION_FREE=PASS' \
            'PROD_DB_CONTENT_READ_IN_PLAN=NONE' \
            'FIXED_HELPER_EFFECTIVE_SUDO=PASS' \
            'GENERIC_PRIVILEGE_WIDENING=FORBIDDEN' \
            'APPLY_PATH=IMPORT_SANITIZE_PROVE' \
            'DETACHED_IMPORT=FORBIDDEN' \
            'RAW_PROD_DATA_IN_GITHUB=NONE' \
            'RUNTIME_DB_SWITCH=FORBIDDEN' \
            'ACTIVATION=FORBIDDEN'
