name: Governed #866 real PROD to sanitized staging one-shot

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: agency-preprod-866-real-one-shot
  cancel-in-progress: false

jobs:
  validate-authority:
    name: Validate fresh #866 owner authority
    if: >-
      ${{
        github.event.issue.pull_request == null &&
        github.event.issue.number == 866 &&
        startsWith(github.event.comment.body, '/agency-preprod-real-one-shot ')
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    outputs:
      mode: ${{ steps.authority.outputs.mode }}
      request_id: ${{ steps.authority.outputs.request_id }}
      main_sha: ${{ steps.authority.outputs.main_sha }}
      prod_release_sha: ${{ steps.authority.outputs.prod_release_sha }}
      operation_profile: ${{ steps.authority.outputs.operation_profile }}
    steps:
      - name: Validate exact #866 authority and fresh request identity
        id: authority
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRIGGER_COMMENT: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          EVENT_DEFAULT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'E-merging-digital' ]]
          [[ "$COMMENT_AUTHOR" == "$GITHUB_ACTOR" ]]
          [[ "$ISSUE_NUMBER" == '866' ]]
          [[ "$GITHUB_RUN_ATTEMPT" == '1' ]] || { echo '#866 authority cannot be replayed through rerun.' >&2; exit 1; }
          read -r command mode request_id requested_main requested_prod profile extra <<< "$TRIGGER_COMMENT"
          [[ -z "${extra:-}" ]]
          [[ "$command" == '/agency-preprod-real-one-shot' ]]
          [[ "$mode" == 'plan' || "$mode" == 'apply' ]]
          [[ "$requested_main" =~ ^[0-9a-f]{40}$ ]]
          [[ "$profile" == 'agency-preprod-real-one-shot-sanitize-v1' ]]
          if [[ "$mode" == 'plan' ]]; then
            [[ "$request_id" =~ ^plan-866-[A-Za-z0-9._-]{1,64}$ ]]
            [[ "$requested_prod" == 'AUTO' ]]
          else
            [[ "$request_id" =~ ^apply-866-[A-Za-z0-9._-]{1,64}$ ]]
            [[ "$requested_prod" =~ ^[0-9a-f]{40}$ ]]
          fi
          expected="/agency-preprod-real-one-shot $mode $request_id $requested_main $requested_prod $profile"
          [[ "$TRIGGER_COMMENT" == "$expected" ]]
          for consumed in apply-834-a1340af5-r1 apply-834-7082d432-r2 plan-861-eabfcefe-r1 plan-861-eabfcefe-r2 plan-861-eabfcefe-r3 apply-861-eabfcefe-r1 plan-861-eabfcefe-r4; do
            [[ "$request_id" != "$consumed" ]]
          done
          issue_json="$(gh api "repos/$GITHUB_REPOSITORY/issues/866")"
          [[ "$(jq -r '.state' <<< "$issue_json")" == 'open' ]]
          [[ "$(jq -r '.user.login' <<< "$issue_json")" == 'E-merging-digital' ]]
          live_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$requested_main" == "$live_main" ]]
          [[ "$EVENT_DEFAULT_SHA" == "$live_main" ]]
          comments="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/866/comments?per_page=100" --jq '.[].body')"
          count=0
          while IFS= read -r body; do
            [[ "$body" == *" $request_id "* ]] && count=$((count + 1)) || true
          done <<< "$comments"
          [[ "$count" -eq 1 ]] || { echo '#866 request identity must occur in exactly one authority comment.' >&2; exit 1; }
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "main_sha=$live_main" >> "$GITHUB_OUTPUT"
          echo "prod_release_sha=$requested_prod" >> "$GITHUB_OUTPUT"
          echo "operation_profile=$profile" >> "$GITHUB_OUTPUT"

      - name: Checkout exact trusted live main route
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.authority.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact #866 route contract
        shell: bash
        run: |
          set -euo pipefail
          profile='scripts/preproduction-staging-import/real-one-shot/profile.json'
          jq -e '
            .issue_number == 866 and
            .profile_id == "agency-preprod-real-one-shot-sanitize-v1" and
            .capability.apply_action == "IMPORT_SANITIZE_PROVE" and
            .capability.detached_import == "FORBIDDEN" and
            .preprod.runtime_db_switch == "FORBIDDEN" and
            .preprod.activation == "FORBIDDEN"
          ' "$profile" >/dev/null

  plan:
    name: Mutation-free real #866 PLAN
    needs: validate-authority
    if: ${{ needs.validate-authority.outputs.mode == 'plan' }}
    runs-on: [self-hosted, linux, x64, agency]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact trusted live main route
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-authority.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure transient read-only route credentials
        env:
          PROD_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PREPROD_PRIVATE_KEY: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_NAME" == 'agency-browser-runner-01' ]]
          test -n "$PROD_PRIVATE_KEY"
          test -n "$PREPROD_PRIVATE_KEY"
          prod_key="$RUNNER_TEMP/agency-866-plan-prod-${GITHUB_RUN_ID}.key"
          preprod_key="$RUNNER_TEMP/agency-866-plan-preprod-${GITHUB_RUN_ID}.key"
          printf '%s\n' "$PROD_PRIVATE_KEY" > "$prod_key"
          printf '%s\n' "$PREPROD_PRIVATE_KEY" > "$preprod_key"
          chmod 600 "$prod_key" "$preprod_key"
          echo "AGENCY_866_PROD_KEY=$prod_key" >> "$GITHUB_ENV"
          echo "AGENCY_866_PREPROD_KEY=$preprod_key" >> "$GITHUB_ENV"

      - name: Execute mutation-free real route PLAN
        env:
          REQUEST_ID: ${{ needs.validate-authority.outputs.request_id }}
          REPOSITORY_SHA: ${{ needs.validate-authority.outputs.main_sha }}
          SOURCE_PROD_RELEASE_SHA: ${{ needs.validate-authority.outputs.prod_release_sha }}
          OPERATION_PROFILE: ${{ needs.validate-authority.outputs.operation_profile }}
          PROD_SSH_HOST: ${{ secrets.SERVER_HOST }}
          PROD_SSH_USER: ${{ secrets.SERVER_USER }}
          PREPROD_SSH_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
          PREPROD_SSH_USER: ${{ secrets.PREPROD_SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          export PROD_SSH_KEY="$AGENCY_866_PROD_KEY"
          export PREPROD_SSH_KEY="$AGENCY_866_PREPROD_KEY"
          bash scripts/preproduction-staging-import/real-one-shot/run-plan.sh

      - name: Remove transient PLAN credentials
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          for key in "${AGENCY_866_PROD_KEY:-}" "${AGENCY_866_PREPROD_KEY:-}"; do
            [[ -z "$key" ]] || rm -f -- "$key"
            [[ -z "$key" ]] || test ! -e "$key"
          done

      - name: Validate metadata-only mutation-free PLAN evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence='artifacts/preprod-real-one-shot/evidence.env'
          test -f "$evidence"
          for required in \
            'execution_mode=PLAN' 'plan_result=PASS' 'plan_mutation_free=YES' \
            'prod_credential_readiness=PASS' 'preprod_credential_readiness=PASS' \
            'prod_pinned_trust=PASS' 'preprod_pinned_trust=PASS' \
            'installed_helper_identity=PASS' 'installed_sanitizer_identity=PASS' \
            'sanitization_policy_identity=PASS' 'sudoers_scope=FIXED_HELPER_ONLY' \
            'capacity_preflight=PASS' 'staging_db_present=NO' 'staging_account_present=NO' \
            'apply_path=IMPORT_SANITIZE_PROVE' 'detached_import=FORBIDDEN' \
            'raw_prod_data_in_github=NONE' 'raw_prod_data_in_logs=NONE' \
            'prod_db_content_read=NONE' 'prod_snapshot=NOT_PERFORMED' \
            'prod_data_transfer=NONE' 'real_import_sanitize_prove=NOT_PERFORMED' \
            'preprod_mutation=NONE' 'runtime_db_switch=NONE' 'activation=NOT_PERFORMED' \
            'public_files=NONE' 'private_files=NONE' 'scheduler=NONE' 'prod_write=NONE'; do
            grep -Fxq "$required" "$evidence"
          done

      - name: Upload metadata-only PLAN evidence
        uses: actions/upload-artifact@v4
        with:
          name: agency-866-real-one-shot-plan-${{ needs.validate-authority.outputs.request_id }}-${{ github.run_id }}
          path: artifacts/preprod-real-one-shot/evidence.env
          if-no-files-found: error
          retention-days: 14

  apply:
    name: Project-Lead-only future real #866 APPLY
    needs: validate-authority
    if: ${{ needs.validate-authority.outputs.mode == 'apply' }}
    runs-on: [self-hosted, linux, x64, agency]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact trusted live main route
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-authority.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure transient bounded APPLY credentials
        env:
          PROD_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PREPROD_PRIVATE_KEY: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROD_PRIVATE_KEY"
          test -n "$PREPROD_PRIVATE_KEY"
          prod_key="$RUNNER_TEMP/agency-866-apply-prod-${GITHUB_RUN_ID}.key"
          preprod_key="$RUNNER_TEMP/agency-866-apply-preprod-${GITHUB_RUN_ID}.key"
          printf '%s\n' "$PROD_PRIVATE_KEY" > "$prod_key"
          printf '%s\n' "$PREPROD_PRIVATE_KEY" > "$preprod_key"
          chmod 600 "$prod_key" "$preprod_key"
          echo "AGENCY_866_PROD_KEY=$prod_key" >> "$GITHUB_ENV"
          echo "AGENCY_866_PREPROD_KEY=$preprod_key" >> "$GITHUB_ENV"

      - name: Execute exact repository-owned atomic one-shot APPLY
        env:
          REQUEST_ID: ${{ needs.validate-authority.outputs.request_id }}
          REPOSITORY_SHA: ${{ needs.validate-authority.outputs.main_sha }}
          SOURCE_PROD_RELEASE_SHA: ${{ needs.validate-authority.outputs.prod_release_sha }}
          OPERATION_PROFILE: ${{ needs.validate-authority.outputs.operation_profile }}
          PROD_SSH_HOST: ${{ secrets.SERVER_HOST }}
          PROD_SSH_USER: ${{ secrets.SERVER_USER }}
          PREPROD_SSH_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
          PREPROD_SSH_USER: ${{ secrets.PREPROD_SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          export PROD_SSH_KEY="$AGENCY_866_PROD_KEY"
          export PREPROD_SSH_KEY="$AGENCY_866_PREPROD_KEY"
          bash scripts/preproduction-staging-import/real-one-shot/run-apply.sh

      - name: Remove transient APPLY credentials
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          for key in "${AGENCY_866_PROD_KEY:-}" "${AGENCY_866_PREPROD_KEY:-}"; do
            [[ -z "$key" ]] || rm -f -- "$key"
            [[ -z "$key" ]] || test ! -e "$key"
          done

      - name: Validate metadata-only terminal APPLY evidence
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          evidence='artifacts/preprod-real-one-shot/evidence.env'
          test -f "$evidence"
          grep -Fxq 'execution_mode=APPLY' "$evidence"
          grep -Fxq 'fresh_prod_snapshot=PASS' "$evidence"
          grep -Fxq 'prod_access_mode=READ_ONLY' "$evidence"
          grep -Fxq 'encrypted_transient_transfer=PASS' "$evidence"
          grep -Fxq 'import_sanitize_prove=PASS' "$evidence"
          grep -Fxq 'sanitization_policy=agency-preprod-refresh-v1' "$evidence"
          grep -Fxq 'raw_prod_data_in_github=NONE' "$evidence"
          grep -Fxq 'raw_snapshot_after=ABSENT' "$evidence"
          grep -Fxq 'staging_db_after=ABSENT' "$evidence"
          grep -Fxq 'staging_account_after=ABSENT' "$evidence"
          grep -Fxq 'preprod_runtime_db_touched=NO' "$evidence"
          grep -Fxq 'prod_write=NONE' "$evidence"
          grep -Fxq 'activation=NOT_PERFORMED' "$evidence"

      - name: Upload metadata-only APPLY evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agency-866-real-one-shot-apply-${{ needs.validate-authority.outputs.request_id }}-${{ github.run_id }}
          path: artifacts/preprod-real-one-shot/evidence.env
          if-no-files-found: error
          retention-days: 30
