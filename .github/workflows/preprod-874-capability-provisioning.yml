name: "#874 Governed PREPROD activation capability provisioning"

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: agency-preprod-874-capability-provisioning
  cancel-in-progress: false

jobs:
  validate-authority:
    name: Validate successor execution authority for #874 capability
    if: >-
      ${{
        github.event.issue.pull_request == null &&
        startsWith(github.event.comment.body, '/agency-preprod-refresh-capability-provision ')
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    outputs:
      mode: ${{ steps.authority.outputs.mode }}
      request_id: ${{ steps.authority.outputs.request_id }}
      main_sha: ${{ steps.authority.outputs.main_sha }}
      operation_profile: ${{ steps.authority.outputs.operation_profile }}
      authority_issue: ${{ steps.authority.outputs.authority_issue }}
    steps:
      - name: Resolve exact live main
        id: live
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          live_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$live_main" =~ ^[0-9a-f]{40}$ ]]
          echo "main_sha=$live_main" >> "$GITHUB_OUTPUT"

      - name: Checkout exact trusted live main
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.live.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate owner, successor issue marker, exact main, mode and request identity
        id: authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITY_ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          EVENT_ACTION: ${{ github.event.action }}
          LIVE_MAIN: ${{ steps.live.outputs.main_sha }}
        run: |
          set -euo pipefail
          [[ "$AUTHORITY_ISSUE_NUMBER" =~ ^[0-9]+$ ]]
          issue_json="$RUNNER_TEMP/agency-preprod-capability-authority-issue.json"
          comments_json="$RUNNER_TEMP/agency-preprod-capability-authority-comments.json"
          gh api "repos/$GITHUB_REPOSITORY/issues/$AUTHORITY_ISSUE_NUMBER" > "$issue_json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$AUTHORITY_ISSUE_NUMBER/comments?per_page=100" \
            > "$comments_json"
          python3 scripts/preproduction-refresh/activation-capability/provisioning/validate-successor-authority.py \
            --issue-json "$issue_json" \
            --comments-json "$comments_json" \
            --authority-issue-number "$AUTHORITY_ISSUE_NUMBER" \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-action "$EVENT_ACTION" \
            --github-actor "$GITHUB_ACTOR" \
            --comment-author "$COMMENT_AUTHOR" \
            --comment-body "$COMMENT_BODY" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --live-main "$LIVE_MAIN" \
            --github-output "$GITHUB_OUTPUT"
          rm -f -- "$issue_json" "$comments_json"

      - name: Bind source profile lineage and disabled data authority
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-refresh/activation-capability'
          jq -e '
            .issue_number == 874 and
            .profile_id == "agency-preprod-refresh-capability-v1" and
            .data_activation_authority.installed_state == "DISABLED" and
            .data_activation_authority.issue_874_grants_activation_authority == false
          ' "$base/profile.json" >/dev/null
          jq -e '
            .issue_number == 874 and
            .apply.data_activation_authority_after_apply == "DISABLED" and
            .apply.real_data_activation == "FORBIDDEN"
          ' "$base/provisioning/profile.json" >/dev/null
          test "${{ steps.authority.outputs.implementation_issue }}" = '874'
          test "${{ steps.authority.outputs.authority_issue }}" != '874'

  plan:
    name: Mutation-free PREPROD capability provisioning PLAN
    needs: validate-authority
    if: ${{ needs.validate-authority.outputs.mode == 'plan' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact trusted main
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-authority.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Configure transient deploy identity
        shell: bash
        env:
          PREPROD_PRIVATE_KEY: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_OS" == 'Linux' ]]
          [[ "$RUNNER_ARCH" == 'X64' ]]
          [[ "$RUNNER_ENVIRONMENT" == 'github-hosted' ]]
          test -n "$PREPROD_PRIVATE_KEY"
          key="$RUNNER_TEMP/agency-874-plan-${GITHUB_RUN_ID}.key"
          plan_home="$RUNNER_TEMP/agency-874-plan-home-${GITHUB_RUN_ID}"
          echo "AGENCY_874_PLAN_KEY=$key" >> "$GITHUB_ENV"
          echo "AGENCY_874_PLAN_HOME=$plan_home" >> "$GITHUB_ENV"
          umask 077
          mkdir -p "$plan_home"
          AGENCY_874_PLAN_KEY="$key"
          AGENCY_874_PLAN_HOME="$plan_home"
          chmod 700 "$AGENCY_874_PLAN_HOME"
          printf '%s\n' "$PREPROD_PRIVATE_KEY" > "$AGENCY_874_PLAN_KEY"
          chmod 600 "$AGENCY_874_PLAN_KEY"
          test "$(stat -c '%a' "$AGENCY_874_PLAN_KEY")" = '600'

      - name: Provision ephemeral repository-pinned PREPROD host trust
        shell: bash
        env:
          PREPROD_SSH_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
        run: |
          set -euo pipefail
          test -n "$PREPROD_SSH_HOST"
          HOME="$AGENCY_874_PLAN_HOME" \
            PREPROD_SERVER_HOST="$PREPROD_SSH_HOST" \
            bash scripts/preproduction-ssh-trust/manage-known-host.sh PROVISION >/dev/null
          known_hosts="$AGENCY_874_PLAN_HOME/.ssh/known_hosts"
          [[ -f "$known_hosts" && ! -L "$known_hosts" ]]
          test "$(stat -c '%a' "$known_hosts")" = '600'
          HOME="$AGENCY_874_PLAN_HOME" \
            PREPROD_SERVER_HOST="$PREPROD_SSH_HOST" \
            PREPROD_KNOWN_HOSTS_FILE="$known_hosts" \
            bash scripts/preproduction-staging-import/verify-preprod-pinned-trust.sh >/dev/null

      - name: Execute fixed metadata-only PLAN
        shell: bash
        env:
          REQUEST_ID: ${{ needs.validate-authority.outputs.request_id }}
          REPOSITORY_SHA: ${{ needs.validate-authority.outputs.main_sha }}
          OPERATION_PROFILE: ${{ needs.validate-authority.outputs.operation_profile }}
          PREPROD_SSH_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
          PREPROD_SSH_USER: agency-preprod
        run: |
          set -euo pipefail
          export PREPROD_SSH_KEY="$AGENCY_874_PLAN_KEY"
          export PREPROD_KNOWN_HOSTS_FILE="$AGENCY_874_PLAN_HOME/.ssh/known_hosts"
          bash scripts/preproduction-refresh/activation-capability/provisioning/run-plan.sh

      - name: Remove transient PLAN identity and trust
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$AGENCY_874_PLAN_KEY"
          rm -rf -- "$AGENCY_874_PLAN_HOME"

  apply:
    name: Project-Lead-authorized capability-only provisioning APPLY
    needs: validate-authority
    if: ${{ needs.validate-authority.outputs.mode == 'apply' }}
    runs-on: [self-hosted, linux, x64, agency]
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout exact trusted main
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-authority.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: JIT revalidate live main and successor authority before root secret materialization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITY_ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          EVENT_ACTION: ${{ github.event.action }}
          EXPECTED_MAIN: ${{ needs.validate-authority.outputs.main_sha }}
          EXPECTED_AUTHORITY_ISSUE: ${{ needs.validate-authority.outputs.authority_issue }}
          EXPECTED_REQUEST_ID: ${{ needs.validate-authority.outputs.request_id }}
          EXPECTED_MODE: ${{ needs.validate-authority.outputs.mode }}
          EXPECTED_PROFILE: ${{ needs.validate-authority.outputs.operation_profile }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == '1' ]]
          [[ "$AUTHORITY_ISSUE_NUMBER" =~ ^[0-9]+$ ]]
          test "$EXPECTED_AUTHORITY_ISSUE" = "$AUTHORITY_ISSUE_NUMBER"
          test "$EXPECTED_MODE" = 'apply'
          test "$EXPECTED_PROFILE" = 'agency-preprod-refresh-capability-provision-v1'

          current_live_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$current_live_main" =~ ^[0-9a-f]{40}$ ]]
          test "$current_live_main" = "$EXPECTED_MAIN"
          checked_out_head="$(git rev-parse HEAD)"
          test "$checked_out_head" = "$current_live_main"

          issue_json="$RUNNER_TEMP/agency-874-jit-authority-issue.json"
          comments_json="$RUNNER_TEMP/agency-874-jit-authority-comments.json"
          jit_output="$RUNNER_TEMP/agency-874-jit-authority-output.txt"
          cleanup_jit() {
            rm -f -- "$issue_json" "$comments_json" "$jit_output"
          }
          trap cleanup_jit EXIT

          gh api "repos/$GITHUB_REPOSITORY/issues/$AUTHORITY_ISSUE_NUMBER" > "$issue_json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$AUTHORITY_ISSUE_NUMBER/comments?per_page=100" \
            > "$comments_json"
          : > "$jit_output"
          python3 scripts/preproduction-refresh/activation-capability/provisioning/validate-successor-authority.py \
            --issue-json "$issue_json" \
            --comments-json "$comments_json" \
            --authority-issue-number "$AUTHORITY_ISSUE_NUMBER" \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-action "$EVENT_ACTION" \
            --github-actor "$GITHUB_ACTOR" \
            --comment-author "$COMMENT_AUTHOR" \
            --comment-body "$COMMENT_BODY" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --live-main "$current_live_main" \
            --github-output "$jit_output"

          read_jit_output() {
            local key="$1"
            local count value
            count="$(grep -c "^${key}=" "$jit_output" || true)"
            test "$count" = '1'
            value="$(sed -n "s/^${key}=//p" "$jit_output")"
            test -n "$value"
            printf '%s' "$value"
          }

          test "$(read_jit_output main_sha)" = "$EXPECTED_MAIN"
          test "$(read_jit_output authority_issue)" = "$EXPECTED_AUTHORITY_ISSUE"
          test "$(read_jit_output request_id)" = "$EXPECTED_REQUEST_ID"
          test "$(read_jit_output mode)" = "$EXPECTED_MODE"
          test "$(read_jit_output operation_profile)" = "$EXPECTED_PROFILE"

          base='scripts/preproduction-refresh/activation-capability'
          jq -e '
            .issue_number == 874 and
            .profile_id == "agency-preprod-refresh-capability-v1" and
            .data_activation_authority.installed_state == "DISABLED" and
            .data_activation_authority.issue_874_grants_activation_authority == false
          ' "$base/profile.json" >/dev/null
          jq -e '
            .issue_number == 874 and
            .apply.data_activation_authority_after_apply == "DISABLED" and
            .apply.real_data_activation == "FORBIDDEN"
          ' "$base/provisioning/profile.json" >/dev/null

          printf '%s\n' \
            "CURRENT_LIVE_MAIN=$current_live_main" \
            "CHECKED_OUT_HEAD=$checked_out_head" \
            "AUTHORITY_ISSUE=$EXPECTED_AUTHORITY_ISSUE" \
            'AUTHORITY_ISSUE_STATE=OPEN' \
            'AUTHORITY_MARKER=EXACT' \
            'AUTHORIZATION_COMMENT=UNIQUE_UNCHANGED_EXACT' \
            "REQUEST_ID=$EXPECTED_REQUEST_ID" \
            'MODE=apply' \
            'PROFILE=agency-preprod-refresh-capability-provision-v1' \
            'RUN_ATTEMPT=1' \
            'DATA_ACTIVATION_AUTHORITY=DISABLED' \
            'JIT_SUCCESSOR_AUTHORITY=PASS'

      - name: Configure dedicated transient root provisioning identity
        shell: bash
        env:
          PROVISIONING_PRIVATE_KEY: ${{ secrets.PREPROD_PROVISIONING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_NAME" == 'agency-browser-runner-01' ]]
          test -n "$PROVISIONING_PRIVATE_KEY"
          key="$RUNNER_TEMP/agency-874-apply-${GITHUB_RUN_ID}.key"
          printf '%s\n' "$PROVISIONING_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          echo "AGENCY_874_APPLY_KEY=$key" >> "$GITHUB_ENV"

      - name: Execute fixed capability-only APPLY
        shell: bash
        env:
          REQUEST_ID: ${{ needs.validate-authority.outputs.request_id }}
          REPOSITORY_SHA: ${{ needs.validate-authority.outputs.main_sha }}
          OPERATION_PROFILE: ${{ needs.validate-authority.outputs.operation_profile }}
          PREPROD_SSH_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
        run: |
          set -euo pipefail
          export PREPROD_PROVISIONING_SSH_KEY="$AGENCY_874_APPLY_KEY"
          bash scripts/preproduction-refresh/activation-capability/provisioning/run-apply.sh

      - name: Remove transient APPLY identity
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "${AGENCY_874_APPLY_KEY:-}" ]] || rm -f -- "$AGENCY_874_APPLY_KEY"
