name: "#877/#910 successor authority regression after #915"

on:
  pull_request:
    paths:
      - ".github/workflows/preprod-874-capability-provisioning.yml"
      - ".github/workflows/preprod-877-successor-authority-validation.yml"
      - ".github/workflows/preprod-915-fixed-refresh-capability-validation.yml"
      - "docs/operations/preproduction-refresh-activation-capability.md"
      - "scripts/preproduction-refresh/activation-capability/provisioning/validate-successor-authority.py"
      - "scripts/preproduction-refresh/activation-capability/provisioning/test-successor-authority.py"
      - "scripts/preproduction-refresh/activation-capability/provisioning/run-plan.sh"
      - "scripts/preproduction-refresh/activation-capability/provisioning/run-apply.sh"
      - "scripts/preproduction-refresh/activation-capability/provisioning/remote-provision-root.sh"
      - "scripts/preproduction-refresh/activation-capability/agency-preprod-refresh-authority-install"
      - "scripts/preproduction-refresh/activation-capability/agency-preprod-refresh-ingress"
      - "scripts/preproduction-refresh/activation-capability/profile.json"
      - "scripts/preproduction-refresh/activation-capability/bundle.json"

permissions:
  contents: read

jobs:
  successor-authority-contract:
    name: "#877 successor authority + #915 transaction isolation"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate successor provisioning authority matrix
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-refresh/activation-capability'
          python3 -m py_compile \
            "$base/provisioning/validate-successor-authority.py" \
            "$base/provisioning/test-successor-authority.py"
          python3 "$base/provisioning/test-successor-authority.py"
          ! grep -Fq 'agency-preprod-refresh-authority-install' \
            "$base/provisioning/agency-preprod-refresh-control.sudoers" \
            "$base/provisioning/agency-preprod-refresh-ingress.sudoers"
          jq -e '
            .revision_issue == 915 and
            .data_activation_authority.installed_state == "DISABLED" and
            .data_activation_authority.caller_self_authorization == "IMPOSSIBLE" and
            .transaction_authority.installer_in_agency_preprod_sudoers == false
          ' "$base/profile.json" >/dev/null
          jq -e '
            .data_activation_authority_after_provisioning == "DISABLED" and
            .persistent_data_activation_authority_after_provisioning == "DISABLED" and
            .transaction_authority_after_provisioning == "ABSENT"
          ' "$base/bundle.json" >/dev/null
          printf '%s\n' \
            '#874_LIVE_EXECUTION_AUTHORITY=FORBIDDEN' \
            'SUCCESSOR_EVENT_ISSUE_AUTHORITY=PASS' \
            'CALLER_SELF_AUTHORIZATION=IMPOSSIBLE' \
            'PERMANENT_ENABLE=NONE' \
            'TRANSACTION_AUTHORITY_AFTER_PROVISIONING=ABSENT'

  jit-delayed-apply-authority:
    name: "#910 JIT authority before privileged PREPROD secret"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove checkout-JIT-secret-APPLY-cleanup order and revised APPLY contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          workflow = Path('.github/workflows/preprod-874-capability-provisioning.yml').read_text()
          assert '\n  plan:\n' in workflow and '\n  apply:\n' in workflow
          plan = workflow.split('\n  plan:\n', 1)[1].split('\n  apply:\n', 1)[0]
          apply = '  apply:\n' + workflow.split('\n  apply:\n', 1)[1]
          checkout = apply.index('      - name: Checkout exact trusted main')
          jit = apply.index('      - name: JIT revalidate live main and successor authority before root secret materialization')
          secret = apply.index('PREPROD_PROVISIONING_SSH_PRIVATE_KEY')
          execute = apply.index('run-apply.sh')
          cleanup = apply.index('      - name: Remove transient APPLY identity')
          assert checkout < jit < secret < execute < cleanup
          assert 'PREPROD_PROVISIONING_SSH_PRIVATE_KEY' not in apply[:jit]
          jit_block = apply[jit:apply.index('      - name: Configure dedicated transient root provisioning identity')]
          assert 'secrets.' not in jit_block
          assert 'repos/$GITHUB_REPOSITORY/branches/main' in jit_block
          assert 'validate-successor-authority.py' in jit_block
          assert 'test "$checked_out_head" = "$current_live_main"' in jit_block
          assert '.data_activation_authority.installed_state == "DISABLED"' in jit_block
          assert 'runs-on: ubuntu-24.04' in plan and 'self-hosted' not in plan
          assert 'runs-on: [self-hosted, linux, x64, agency]' in apply

          base = Path('scripts/preproduction-refresh/activation-capability')
          run_apply = (base / 'provisioning/run-apply.sh').read_text()
          assert 'TRANSACTION_AUTHORITY=ABSENT' in run_apply
          assert 'agency-preprod-refresh-authority-install' in run_apply
          profile = json.loads((base / 'provisioning/profile.json').read_text())
          assert profile['apply']['data_activation_authority_after_apply'] == 'DISABLED'
          assert profile['apply']['transaction_authority_after_apply'] == 'ABSENT'
          print('#910_JIT_BEFORE_SECRET=PRESERVED')
          print('ROOT_SECRET_BEFORE_JIT=IMPOSSIBLE')
          print('MAIN_OR_AUTHORITY_CHANGE=FAIL_BEFORE_SECRET')
          print('PROVISIONING_CAPABILITY_NE_EXECUTION_AUTHORITY=PASS')
          print('REAL_PREPROD_EXECUTION=NONE')
          PY
