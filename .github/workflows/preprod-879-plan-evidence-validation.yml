name: "#879 PREPROD provisioning PLAN evidence validation"

on:
  pull_request:
    paths:
      - ".github/workflows/preprod-874-capability-provisioning.yml"
      - ".github/workflows/preprod-877-successor-authority-validation.yml"
      - ".github/workflows/preprod-879-plan-evidence-validation.yml"
      - "scripts/preproduction-refresh/activation-capability/provisioning/run-plan.sh"
      - "scripts/preproduction-refresh/activation-capability/provisioning/observe-host-state.sh"
      - "scripts/preproduction-refresh/activation-capability/provisioning/evaluate-plan-evidence.py"
      - "scripts/preproduction-refresh/activation-capability/provisioning/test-plan-evidence.py"

permissions:
  contents: read

jobs:
  plan-evidence-contract:
    name: "#879 read-only host-state evidence / classification"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate syntax and pinned source bundle
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-refresh/activation-capability/provisioning'
          bash -n "$base/run-plan.sh" "$base/observe-host-state.sh"
          python3 -m py_compile "$base/evaluate-plan-evidence.py" "$base/test-plan-evidence.py"
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('scripts/preproduction-refresh/activation-capability/provisioning/evaluate-plan-evidence.py')
          spec = importlib.util.spec_from_file_location('plan_evidence', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          expected = module.build_expected(Path('.').resolve())
          assert expected['runtime_db'] == 'agency_preprod'
          assert expected['source_digests']['provisioning_profile']
          print('PINNED_SOURCE_BUNDLE_DIGESTS=PASS')
          print('PROVISIONING_PROFILE_DIGEST=PASS')
          PY

      - name: Prove #884 canonical sudoers source and null-path regression
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-refresh/activation-capability/provisioning'
          plan="$base/run-plan.sh"
          sudoers="$base/agency-preprod-refresh-control.sudoers"
          [[ -f "$sudoers" && ! -L "$sudoers" ]]
          test "$(git rev-parse "HEAD:$sudoers")" = '193f05b9dc0422d62e0104e95a8f5444f34ec17c'
          test "$(sha256sum "$sudoers" | awk '{print $1}')" = 'd3997b2f9b3a0b615d082bbc65b7a49abef38f3e1523506a23083f9d4f217b9b'
          python3 - <<'PY'
          from pathlib import Path
          plan = Path('scripts/preproduction-refresh/activation-capability/provisioning/run-plan.sh').read_text()
          assignments = [line for line in plan.splitlines() if line.startswith('SUDOERS_SOURCE=')]
          assert assignments == ['SUDOERS_SOURCE="$BASE/provisioning/agency-preprod-refresh-control.sudoers"']
          assert '.apply.sudoers_path' not in plan
          assert 'null.sudoers' not in plan
          assert "SUDOERS_SOURCE_BLOB='193f05b9dc0422d62e0104e95a8f5444f34ec17c'" in plan
          assert "SUDOERS_SOURCE_SHA256='d3997b2f9b3a0b615d082bbc65b7a49abef38f3e1523506a23083f9d4f217b9b'" in plan
          assert 'git rev-parse "HEAD:$SUDOERS_SOURCE"' in plan
          assert 'sha256sum "$SUDOERS_SOURCE"' in plan
          print('SUDOERS_SOURCE=scripts/preproduction-refresh/activation-capability/provisioning/agency-preprod-refresh-control.sudoers')
          print('NULL_SUDOERS_PATH=IMPOSSIBLE')
          print('CALLER_CONTROLLED_SUDOERS_PATH=FORBIDDEN')
          PY

      - name: Execute #879 synthetic classification and fail-closed matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/preproduction-refresh/activation-capability/provisioning/test-plan-evidence.py

      - name: Prove PLAN route is fixed, non-root and mutation-free
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-refresh/activation-capability/provisioning'
          plan="$base/run-plan.sh"
          observer="$base/observe-host-state.sh"
          grep -Fq '[[ "$PREPROD_SSH_USER" == '\''agency-preprod'\'' ]]' "$plan"
          grep -Fq 'env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin /bin/bash -s --' "$plan"
          grep -Fq '< "$OBSERVER" > "$observation"' "$plan"
          grep -Fq '[[ "$(id -u)" -ne 0 ]]' "$observer"
          ! grep -Eq '(^|[;&|()[:space:]])sudo[[:space:]]' "$plan" "$observer"
          ! grep -Eq '(^|[;&|()[:space:]])scp[[:space:]]' "$plan" "$observer"
          ! grep -Fq 'root@$PREPROD_SSH_HOST' "$plan"
          ! grep -Eq '(^|[;&|()[:space:]])(install|chmod|chown|mkdir|rmdir|mv|cp|touch|truncate)[[:space:]]' "$observer"
          ! grep -Eq '(^|[;&|()[:space:]])rm[[:space:]]' "$observer"
          ! grep -Fq 'agency-preprod-refresh-control PRECHECK' "$plan" "$observer"
          ! grep -Fq 'settings.php' "$observer"
          ! grep -Fq 'runtime.env' "$observer"
          ! grep -Fq 'auth_basic' "$observer"
          printf '%s\n' \
            'PLAN_MUTATION=NONE' \
            'HELPER_EXECUTION=NONE' \
            'SUDO_EXECUTION=NONE' \
            'PROD_ACCESS=NONE' \
            'PREPROD_DB_MUTATION=NONE' \
            'PREPROD_BACKUP=NONE' \
            'FENCE_MUTATION=NONE' \
            'NGINX_MUTATION=NONE' \
            'METADATA_ONLY_OUTPUT=PASS' \
            'SECRET_VALUE_OUTPUT=ABSENT'

      - name: Prove #881 GitHub-hosted PLAN runner and pinned transient SSH boundary
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-refresh/activation-capability/provisioning'
          workflow='.github/workflows/preprod-874-capability-provisioning.yml'
          plan="$base/run-plan.sh"
          trust='scripts/preproduction-ssh-trust/manage-known-host.sh'
          verify='scripts/preproduction-staging-import/verify-preprod-pinned-trust.sh'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          text = Path('.github/workflows/preprod-874-capability-provisioning.yml').read_text()
          assert '\n  plan:\n' in text and '\n  apply:\n' in text
          plan = text.split('\n  plan:\n', 1)[1].split('\n  apply:\n', 1)[0]
          apply = '  apply:\n' + text.split('\n  apply:\n', 1)[1]
          assert 'runs-on: ubuntu-24.04' in plan
          assert 'self-hosted' not in plan
          assert 'PREPROD_SSH_USER: agency-preprod' in plan
          assert 'RUNNER_ENVIRONMENT' in plan and 'github-hosted' in plan
          assert 'RUNNER_OS' in plan and 'Linux' in plan
          assert 'RUNNER_ARCH' in plan and 'X64' in plan
          assert 'manage-known-host.sh PROVISION' in plan
          assert 'verify-preprod-pinned-trust.sh' in plan
          assert 'runs-on: [self-hosted, linux, x64, agency]' in apply
          assert "[[ \"$RUNNER_NAME\" == 'agency-browser-runner-01' ]]" in apply
          assert 'PREPROD_PROVISIONING_SSH_PRIVATE_KEY' in apply
          assert 'run-apply.sh' in apply
          assert hashlib.sha256(apply.encode()).hexdigest() == '3ef411d776606ec1fdab04a9ba10995617294789a078330c5dd10c31b215516f'
          print('PLAN_RUNNER=ubuntu-24.04')
          print('APPLY_RUNNER_PATH_UNCHANGED=PASS')
          PY
          test "$(git rev-parse "HEAD:$trust")" = 'e10f8576b0fb5b6bd47b707fbdddf06a1651ae9f'
          test "$(git rev-parse "HEAD:$verify")" = '2487aba1cbece4aa00cc77a968e5e34fd48c7c5a'
          grep -Fq '[[ "${RUNNER_ENVIRONMENT:-}" == '\''github-hosted'\'' ]]' "$plan"
          grep -Fq '[[ "${RUNNER_OS:-}" == '\''Linux'\'' ]]' "$plan"
          grep -Fq '[[ "${RUNNER_ARCH:-}" == '\''X64'\'' ]]' "$plan"
          grep -Fq '[[ "$PREPROD_SSH_KEY" == "$RUNNER_TEMP/"* ]]' "$plan"
          grep -Fq '[[ "$PREPROD_KNOWN_HOSTS_FILE" == "$RUNNER_TEMP/"* ]]' "$plan"
          grep -Fq 'StrictHostKeyChecking=yes' "$plan"
          grep -Fq 'IdentitiesOnly=yes' "$plan"
          grep -Fq 'BatchMode=yes' "$plan"
          grep -Fq 'key="$RUNNER_TEMP/agency-874-plan-${GITHUB_RUN_ID}.key"' "$workflow"
          grep -Fq 'plan_home="$RUNNER_TEMP/agency-874-plan-home-${GITHUB_RUN_ID}"' "$workflow"
          grep -Fq 'chmod 600 "$AGENCY_874_PLAN_KEY"' "$workflow"
          grep -Fq 'rm -f -- "$AGENCY_874_PLAN_KEY"' "$workflow"
          grep -Fq 'rm -rf -- "$AGENCY_874_PLAN_HOME"' "$workflow"
          ! grep -R -F 'ssh-keyscan' "$workflow" "$plan" "$trust" "$verify"
          ! grep -R -F 'accept-new' "$workflow" "$plan" "$trust" "$verify"
          ! grep -R -F 'StrictHostKeyChecking=no' "$workflow" "$plan" "$trust" "$verify"
          ! grep -Eq '(^|[;&|()[:space:]])(mysqldump|mariadb-dump|mysql|mariadb|scp|rsync)[[:space:]]' "$plan" "$base/observe-host-state.sh"
          ! grep -Fq 'PROD_SSH' "$plan" "$base/observe-host-state.sh"
          ! grep -Fq 'PROD_SERVER' "$plan" "$base/observe-host-state.sh"
          printf '%s\n' \
            'PINNED_HOST_TRUST=PASS' \
            'SSH_KEYSCAN=ABSENT' \
            'TOFU=ABSENT' \
            'STRICT_HOST_KEY_CHECKING=YES' \
            'PREPROD_SSH_USER=agency-preprod' \
            'ROOT_PLAN_EXECUTION=FORBIDDEN' \
            'PLAN_SUDO_EXECUTION=NONE' \
            'PLAN_HELPER_EXECUTION=NONE' \
            'TRANSIENT_PRIVATE_KEY_CLEANUP=PASS' \
            'EPHEMERAL_KNOWN_HOSTS=PASS' \
            'OBSERVER_ARGUMENTS=NONE' \
            'RAW_PROD_DATA_ON_GITHUB_HOSTED=FORBIDDEN'

      - name: Preserve #874 implementation and #877 successor authority model
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-refresh/activation-capability'
          test "$(git rev-parse "HEAD:$base/agency-preprod-refresh-control")" = 'a8f9d05d7776f27c141ce549f87b6b854ac3aeb1'
          test "$(git rev-parse "HEAD:$base/side_effect_hardening.py")" = 'd38fc9d1f1480b91048a0ae8081272f22a952d01'
          test "$(git rev-parse "HEAD:$base/runtime_state_digest.py")" = 'ae282a893d68877dbbc36d03ab481ed9a9aafc6e'
          test "$(git rev-parse "HEAD:$base/nginx")" = 'ba0ecbe23b82dd3fafc2fd1275e36f18761d2707'
          test "$(git rev-parse "HEAD:$base/provisioning/agency-preprod-refresh-control.sudoers")" = '193f05b9dc0422d62e0104e95a8f5444f34ec17c'
          test "$(git rev-parse "HEAD:$base/provisioning/profile.json")" = '6103f8f316771d837652a7758af35a89291cee1b'
          test "$(git rev-parse "HEAD:$base/provisioning/remote-provision-root.sh")" = 'a0e6b46ed1e3cee89c591007fae6c447f4736bb3'
          test "$(git rev-parse "HEAD:$base/provisioning/run-apply.sh")" = '79d698cff3ad5f8de4db8da5ba669119d84caa51'
          test "$(git rev-parse "HEAD:$base/provisioning/validate-successor-authority.py")" = '183af3ec4276cb7b5c87217fbe8b96ef1ff8afb6'
          test "$(git rev-parse "HEAD:$base/provisioning/test-successor-authority.py")" = 'b4aba6dce888ae29b51c670ef91bf6bb2bf35452'
          test "$(sha256sum scripts/preproduction-staging-import/privileged/agency-preprod-staging-sanitizer.py | awk '{print $1}')" = 'fcdb1e42b8fd50db8e8190dea61eca66544149dc53a762affdb33bf96d2d481f'
          python3 "$base/provisioning/test-successor-authority.py" >/dev/null
          jq -e '
            .issue_number == 874 and
            .data_activation_authority.installed_state == "DISABLED" and
            .data_activation_authority.issue_874_grants_activation_authority == false
          ' "$base/profile.json" >/dev/null
          printf '%s\n' \
            '#874_REGRESSION=PASS' \
            '#877_SUCCESSOR_AUTHORITY_REGRESSION=PASS' \
            '#879_REGRESSION=PASS' \
            '#876_FUTURE_PLAN_CONTRACT=PASS' \
            'NO_PRIVILEGE_WIDENING=PASS' \
            'NO_HELPER_SEMANTIC_CHANGE=PASS' \
            'NO_SANITIZER_CHANGE=PASS' \
            'NO_NGINX_RUNTIME_BEHAVIOR_CHANGE=PASS' \
            'DATA_ACTIVATION_AUTHORITY_DISABLED=PASS' \
            'NO_REAL_PLAN=PASS' \
            'NO_PREPROD_MUTATION=PASS' \
            'NO_PROD_ACCESS=PASS' \
            'NEW_879_PLAN_EVIDENCE_TESTS=SUCCESS'
