name: "#881 GitHub-hosted PREPROD PLAN portability validation"

on:
  pull_request:
    paths:
      - ".github/workflows/preprod-874-capability-provisioning.yml"
      - ".github/workflows/preprod-877-successor-authority-validation.yml"
      - ".github/workflows/preprod-881-plan-portability-validation.yml"
      - "scripts/preproduction-refresh/activation-capability/provisioning/run-plan.sh"

permissions:
  contents: read

jobs:
  plan-portability-contract:
    name: "#881 PLAN runner isolation / ephemeral pinned trust"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate shell syntax and runner isolation
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/preprod-874-capability-provisioning.yml'
          plan='scripts/preproduction-refresh/activation-capability/provisioning/run-plan.sh'
          bash -n "$plan"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          text = Path('.github/workflows/preprod-874-capability-provisioning.yml').read_text()
          assert '\n  plan:\n' in text and '\n  apply:\n' in text
          plan = text.split('\n  plan:\n', 1)[1].split('\n  apply:\n', 1)[0]
          apply = '  apply:\n' + text.split('\n  apply:\n', 1)[1]
          assert 'runs-on: ubuntu-24.04' in plan
          assert 'self-hosted' not in plan
          assert "PREPROD_SSH_USER: agency-preprod" in plan
          assert "RUNNER_ENVIRONMENT" in plan and "github-hosted" in plan
          assert "RUNNER_OS" in plan and "Linux" in plan
          assert "RUNNER_ARCH" in plan and "X64" in plan
          assert "runs-on: [self-hosted, linux, x64, agency]" in apply
          assert "[[ \"$RUNNER_NAME\" == 'agency-browser-runner-01' ]]" in apply
          assert 'PREPROD_PROVISIONING_SSH_PRIVATE_KEY' in apply
          assert 'run-apply.sh' in apply
          assert hashlib.sha256(apply.encode()).hexdigest() == '3ef411d776606ec1fdab04a9ba10995617294789a078330c5dd10c31b215516f'
          print('PLAN_RUNNER=ubuntu-24.04')
          print('APPLY_RUNNER_PATH_UNCHANGED=PASS')
          PY
          grep -Fq '[[ "${RUNNER_ENVIRONMENT:-}" == '\''github-hosted'\'' ]]' "$plan"
          grep -Fq '[[ "${RUNNER_OS:-}" == '\''Linux'\'' ]]' "$plan"
          grep -Fq '[[ "${RUNNER_ARCH:-}" == '\''X64'\'' ]]' "$plan"

      - name: Prove ephemeral repository-pinned SSH trust only
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/preprod-874-capability-provisioning.yml'
          plan='scripts/preproduction-refresh/activation-capability/provisioning/run-plan.sh'
          trust='scripts/preproduction-ssh-trust/manage-known-host.sh'
          verify='scripts/preproduction-staging-import/verify-preprod-pinned-trust.sh'
          test "$(git rev-parse "HEAD:$trust")" = 'e10f8576b0fb5b6bd47b707fbdddf06a1651ae9f'
          test "$(git rev-parse "HEAD:$verify")" = '2487aba1cbece4aa00cc77a968e5e34fd48c7c5a'
          grep -Fq 'manage-known-host.sh PROVISION' "$workflow"
          grep -Fq 'verify-preprod-pinned-trust.sh' "$workflow"
          grep -Fq 'PREPROD_KNOWN_HOSTS_FILE="$known_hosts"' "$workflow"
          grep -Fq 'plan_home="$RUNNER_TEMP/agency-874-plan-home-${GITHUB_RUN_ID}"' "$workflow"
          grep -Fq 'rm -rf -- "$AGENCY_874_PLAN_HOME"' "$workflow"
          grep -Fq 'PREPROD_KNOWN_HOSTS_FILE="${PREPROD_KNOWN_HOSTS_FILE:-$HOME/.ssh/known_hosts}"' "$plan"
          grep -Fq '[[ "$PREPROD_KNOWN_HOSTS_FILE" == "$RUNNER_TEMP/"* ]]' "$plan"
          grep -Fq 'StrictHostKeyChecking=yes' "$plan"
          grep -Fq 'IdentitiesOnly=yes' "$plan"
          grep -Fq 'BatchMode=yes' "$plan"
          ! grep -R -F 'ssh-keyscan' "$workflow" "$plan" "$trust" "$verify"
          ! grep -R -F 'accept-new' "$workflow" "$plan" "$trust" "$verify"
          ! grep -R -F 'StrictHostKeyChecking=no' "$workflow" "$plan" "$trust" "$verify"
          printf '%s\n' \
            'PINNED_HOST_TRUST=PASS' \
            'SSH_KEYSCAN=ABSENT' \
            'TOFU=ABSENT' \
            'STRICT_HOST_KEY_CHECKING=YES' \
            'EPHEMERAL_KNOWN_HOSTS=PASS'

      - name: Prove transient private-key lifecycle and fixed non-root observer
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/preprod-874-capability-provisioning.yml'
          plan='scripts/preproduction-refresh/activation-capability/provisioning/run-plan.sh'
          observer='scripts/preproduction-refresh/activation-capability/provisioning/observe-host-state.sh'
          grep -Fq 'key="$RUNNER_TEMP/agency-874-plan-${GITHUB_RUN_ID}.key"' "$workflow"
          grep -Fq 'chmod 600 "$AGENCY_874_PLAN_KEY"' "$workflow"
          grep -Fq 'if: ${{ always() }}' "$workflow"
          grep -Fq 'rm -f -- "$AGENCY_874_PLAN_KEY"' "$workflow"
          grep -Fq '[[ "$PREPROD_SSH_KEY" == "$RUNNER_TEMP/"* ]]' "$plan"
          grep -Fq '[[ "$(stat -c '\''%a'\'' "$PREPROD_SSH_KEY")" == '\''600'\'' ]]' "$plan"
          grep -Fq '[[ "$PREPROD_SSH_USER" == '\''agency-preprod'\'' ]]' "$plan"
          grep -Fq '"$PREPROD_SSH_USER@$PREPROD_SSH_HOST"' "$plan"
          ! grep -Fq 'root@$PREPROD_SSH_HOST' "$plan"
          grep -Fq '"env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin /bin/bash -s --"' "$plan"
          grep -Fq '< "$OBSERVER" > "$observation"' "$plan"
          ! grep -Eq '(^|[;&|()[:space:]])sudo[[:space:]]' "$plan" "$observer"
          ! grep -Eq '(^|[;&|()[:space:]])scp[[:space:]]' "$plan" "$observer"
          ! grep -Fq 'agency-preprod-refresh-control PRECHECK' "$plan" "$observer"
          printf '%s\n' \
            'TRANSIENT_PRIVATE_KEY_CLEANUP=PASS' \
            'PREPROD_SSH_USER=agency-preprod' \
            'ROOT_PLAN_EXECUTION=FORBIDDEN' \
            'PLAN_SUDO_EXECUTION=NONE' \
            'PLAN_HELPER_EXECUTION=NONE' \
            'OBSERVER_ARGUMENTS=NONE'

      - name: Preserve metadata-only and raw-data boundaries
        shell: bash
        run: |
          set -euo pipefail
          plan='scripts/preproduction-refresh/activation-capability/provisioning/run-plan.sh'
          observer='scripts/preproduction-refresh/activation-capability/provisioning/observe-host-state.sh'
          python3 scripts/preproduction-refresh/activation-capability/provisioning/test-plan-evidence.py >/dev/null
          ! grep -Eq '(^|[;&|()[:space:]])(mysqldump|mariadb-dump|mysql|mariadb|scp|rsync)[[:space:]]' "$plan" "$observer"
          ! grep -Fq 'PROD_SSH' "$plan" "$observer"
          ! grep -Fq 'PROD_SERVER' "$plan" "$observer"
          ! grep -Fq 'settings.php' "$observer"
          ! grep -Fq 'runtime.env' "$observer"
          printf '%s\n' \
            'PLAN_MUTATION=NONE' \
            'PROD_ACCESS=NONE' \
            'RAW_PROD_DATA_ON_GITHUB_HOSTED=FORBIDDEN' \
            'PREPROD_DB_MUTATION=NONE' \
            'PREPROD_BACKUP=NONE' \
            'FENCE_MUTATION=NONE' \
            'NGINX_MUTATION=NONE'

      - name: Preserve APPLY and #874/#877/#879 regressions
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-refresh/activation-capability'
          test "$(git rev-parse "HEAD:$base/provisioning/run-apply.sh")" = '79d698cff3ad5f8de4db8da5ba669119d84caa51'
          test "$(git rev-parse "HEAD:$base/provisioning/remote-provision-root.sh")" = 'a0e6b46ed1e3cee89c591007fae6c447f4736bb3'
          test "$(git rev-parse "HEAD:$base/agency-preprod-refresh-control")" = 'a8f9d05d7776f27c141ce549f87b6b854ac3aeb1'
          test "$(git rev-parse "HEAD:$base/side_effect_hardening.py")" = 'd38fc9d1f1480b91048a0ae8081272f22a952d01'
          test "$(git rev-parse "HEAD:$base/runtime_state_digest.py")" = 'ae282a893d68877dbbc36d03ab481ed9a9aafc6e'
          test "$(git rev-parse "HEAD:$base/nginx")" = 'ba0ecbe23b82dd3fafc2fd1275e36f18761d2707'
          test "$(git rev-parse "HEAD:$base/provisioning/agency-preprod-refresh-control.sudoers")" = '193f05b9dc0422d62e0104e95a8f5444f34ec17c'
          python3 "$base/provisioning/test-successor-authority.py" >/dev/null
          python3 "$base/provisioning/test-plan-evidence.py" >/dev/null
          jq -e '
            .issue_number == 874 and
            .parent_issue == 816 and
            .data_activation_authority.installed_state == "DISABLED" and
            .data_activation_authority.issue_874_grants_activation_authority == false
          ' "$base/profile.json" >/dev/null
          printf '%s\n' \
            '#874_REGRESSION=PASS' \
            '#877_REGRESSION=PASS' \
            '#879_REGRESSION=PASS' \
            'APPLY_RUNNER_PATH_UNCHANGED=PASS' \
            'DATA_ACTIVATION_AUTHORITY_DISABLED=PASS' \
            'NO_REAL_PLAN=PASS' \
            'NO_APPLY=PASS' \
            'NO_PREPROD_MUTATION=PASS' \
            'NO_PROD_ACCESS=PASS'
