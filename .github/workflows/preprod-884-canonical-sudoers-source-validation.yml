name: "#884 Canonical PREPROD PLAN sudoers source validation"

on:
  pull_request:
    paths:
      - ".github/workflows/preprod-874-capability-provisioning.yml"
      - ".github/workflows/preprod-877-successor-authority-validation.yml"
      - ".github/workflows/preprod-879-plan-evidence-validation.yml"
      - ".github/workflows/preprod-884-canonical-sudoers-source-validation.yml"
      - "scripts/preproduction-refresh/activation-capability/provisioning/run-plan.sh"

permissions:
  contents: read

jobs:
  canonical-sudoers-source:
    name: "#884 canonical sudoers source / predecessor regressions"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove canonical fixed sudoers source and null-path regression
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-refresh/activation-capability/provisioning'
          plan="$base/run-plan.sh"
          sudoers="$base/agency-preprod-refresh-control.sudoers"
          bash -n "$plan"
          [[ -f "$sudoers" && ! -L "$sudoers" ]]
          test "$(git rev-parse "HEAD:$sudoers")" = '193f05b9dc0422d62e0104e95a8f5444f34ec17c'
          test "$(sha256sum "$sudoers" | awk '{print $1}')" = 'd3997b2f9b3a0b615d082bbc65b7a49abef38f3e1523506a23083f9d4f217b9b'
          python3 - <<'PY'
          from pathlib import Path
          plan = Path('scripts/preproduction-refresh/activation-capability/provisioning/run-plan.sh').read_text()
          assignments = [line for line in plan.splitlines() if line.startswith('SUDOERS_SOURCE=')]
          assert assignments == ['SUDOERS_SOURCE="$BASE/provisioning/agency-preprod-refresh-control.sudoers"']
          assert '.apply.sudoers_path' not in plan
          assert 'null.sudoers' not in plan
          assert "SUDOERS_SOURCE_BLOB='193f05b9dc0422d62e0104e95a8f5444f34ec17c'" in plan
          assert "SUDOERS_SOURCE_SHA256='d3997b2f9b3a0b615d082bbc65b7a49abef38f3e1523506a23083f9d4f217b9b'" in plan
          assert 'git rev-parse "HEAD:$SUDOERS_SOURCE"' in plan
          assert 'sha256sum "$SUDOERS_SOURCE"' in plan
          print('SUDOERS_SOURCE=scripts/preproduction-refresh/activation-capability/provisioning/agency-preprod-refresh-control.sudoers')
          print('NULL_SUDOERS_PATH=IMPOSSIBLE')
          print('CALLER_CONTROLLED_SUDOERS_PATH=FORBIDDEN')
          PY

      - name: Preserve #881 GitHub-hosted PLAN portability and APPLY boundary
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/preprod-874-capability-provisioning.yml'
          plan='scripts/preproduction-refresh/activation-capability/provisioning/run-plan.sh'
          trust='scripts/preproduction-ssh-trust/manage-known-host.sh'
          verify='scripts/preproduction-staging-import/verify-preprod-pinned-trust.sh'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          text = Path('.github/workflows/preprod-874-capability-provisioning.yml').read_text()
          assert '\n  plan:\n' in text and '\n  apply:\n' in text
          plan = text.split('\n  plan:\n', 1)[1].split('\n  apply:\n', 1)[0]
          apply = '  apply:\n' + text.split('\n  apply:\n', 1)[1]
          assert 'runs-on: ubuntu-24.04' in plan
          assert 'self-hosted' not in plan
          assert 'PREPROD_SSH_USER: agency-preprod' in plan
          assert 'RUNNER_ENVIRONMENT' in plan and 'github-hosted' in plan
          assert 'manage-known-host.sh PROVISION' in plan
          assert 'verify-preprod-pinned-trust.sh' in plan
          assert 'runs-on: [self-hosted, linux, x64, agency]' in apply
          assert "[[ \"$RUNNER_NAME\" == 'agency-browser-runner-01' ]]" in apply
          assert 'PREPROD_PROVISIONING_SSH_PRIVATE_KEY' in apply
          assert 'run-apply.sh' in apply
          assert hashlib.sha256(apply.encode()).hexdigest() == '3ef411d776606ec1fdab04a9ba10995617294789a078330c5dd10c31b215516f'
          PY
          test "$(git rev-parse "HEAD:$trust")" = 'e10f8576b0fb5b6bd47b707fbdddf06a1651ae9f'
          test "$(git rev-parse "HEAD:$verify")" = '2487aba1cbece4aa00cc77a968e5e34fd48c7c5a'
          grep -Fq '[[ "${RUNNER_ENVIRONMENT:-}" == '\''github-hosted'\'' ]]' "$plan"
          grep -Fq '[[ "${RUNNER_OS:-}" == '\''Linux'\'' ]]' "$plan"
          grep -Fq '[[ "${RUNNER_ARCH:-}" == '\''X64'\'' ]]' "$plan"
          grep -Fq '[[ "$PREPROD_SSH_USER" == '\''agency-preprod'\'' ]]' "$plan"
          grep -Fq 'StrictHostKeyChecking=yes' "$plan"
          grep -Fq 'IdentitiesOnly=yes' "$plan"
          grep -Fq 'BatchMode=yes' "$plan"
          ! grep -R -F 'ssh-keyscan' "$workflow" "$plan" "$trust" "$verify"
          ! grep -R -F 'accept-new' "$workflow" "$plan" "$trust" "$verify"
          ! grep -R -F 'StrictHostKeyChecking=no' "$workflow" "$plan" "$trust" "$verify"
          printf '%s\n' \
            'PLAN_RUNNER=ubuntu-24.04' \
            'APPLY_RUNNER_PATH_UNCHANGED=PASS' \
            'PREPROD_SSH_USER=agency-preprod' \
            'PINNED_HOST_TRUST=PRESERVED' \
            'SSH_KEYSCAN=ABSENT' \
            'TOFU=ABSENT'

      - name: Preserve #874 #877 #879 safety contracts
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-refresh/activation-capability'
          provisioning="$base/provisioning"
          observer="$provisioning/observe-host-state.sh"
          plan="$provisioning/run-plan.sh"
          test "$(git rev-parse "HEAD:$base/agency-preprod-refresh-control")" = 'a8f9d05d7776f27c141ce549f87b6b854ac3aeb1'
          test "$(git rev-parse "HEAD:$base/side_effect_hardening.py")" = 'd38fc9d1f1480b91048a0ae8081272f22a952d01'
          test "$(git rev-parse "HEAD:$base/runtime_state_digest.py")" = 'ae282a893d68877dbbc36d03ab481ed9a9aafc6e'
          test "$(git rev-parse "HEAD:$base/nginx")" = 'ba0ecbe23b82dd3fafc2fd1275e36f18761d2707'
          test "$(git rev-parse "HEAD:$provisioning/agency-preprod-refresh-control.sudoers")" = '193f05b9dc0422d62e0104e95a8f5444f34ec17c'
          test "$(git rev-parse "HEAD:$provisioning/profile.json")" = '6103f8f316771d837652a7758af35a89291cee1b'
          test "$(git rev-parse "HEAD:$provisioning/remote-provision-root.sh")" = 'a0e6b46ed1e3cee89c591007fae6c447f4736bb3'
          test "$(git rev-parse "HEAD:$provisioning/run-apply.sh")" = '79d698cff3ad5f8de4db8da5ba669119d84caa51'
          python3 "$provisioning/test-successor-authority.py" >/dev/null
          python3 "$provisioning/test-plan-evidence.py" >/dev/null
          jq -e '
            .issue_number == 874 and
            .parent_issue == 816 and
            .activation.runtime_database == "agency_preprod" and
            .sudoers.deploy_identity == "agency-preprod" and
            .data_activation_authority.installed_state == "DISABLED" and
            .data_activation_authority.issue_874_grants_activation_authority == false
          ' "$base/profile.json" >/dev/null
          jq -e '
            .issue_number == 874 and
            .parent_issue == 816 and
            .plan.preprod_mutation == "NONE" and
            .plan.helper_execution == "NONE" and
            .plan.sudo_execution == "NONE" and
            .apply.data_activation_authority_after_apply == "DISABLED" and
            .apply.real_data_activation == "FORBIDDEN"
          ' "$provisioning/profile.json" >/dev/null
          ! grep -Eq '(^|[;&|()[:space:]])sudo[[:space:]]' "$plan" "$observer"
          ! grep -Fq 'root@$PREPROD_SSH_HOST' "$plan"
          ! grep -Fq 'PROD_SSH' "$plan" "$observer"
          ! grep -Fq 'PROD_SERVER' "$plan" "$observer"
          test "$(sha256sum scripts/preproduction-staging-import/privileged/agency-preprod-staging-sanitizer.py | awk '{print $1}')" = 'fcdb1e42b8fd50db8e8190dea61eca66544149dc53a762affdb33bf96d2d481f'
          printf '%s\n' \
            '#874_REGRESSION=PASS' \
            '#877_REGRESSION=PASS' \
            '#879_REGRESSION=PASS' \
            '#881_REGRESSION=PASS' \
            'PLAN_MUTATION=NONE' \
            'PLAN_SUDO_EXECUTION=NONE' \
            'PLAN_HELPER_EXECUTION=NONE' \
            'PROD_ACCESS=NONE' \
            'RAW_PROD_DATA_ON_GITHUB_HOSTED=FORBIDDEN' \
            'DATA_ACTIVATION_AUTHORITY_DISABLED=PASS' \
            'NO_PRIVILEGE_WIDENING=PASS' \
            'NO_REAL_PLAN=PASS' \
            'NO_APPLY=PASS'
