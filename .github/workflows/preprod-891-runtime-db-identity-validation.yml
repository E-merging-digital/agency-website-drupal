name: "#891 PREPROD runtime DB identity proof validation"

on:
  pull_request:
    paths:
      - ".github/workflows/preprod-877-successor-authority-validation.yml"
      - ".github/workflows/preprod-891-runtime-db-identity-validation.yml"
      - "composer.lock"
      - "scripts/preproduction-refresh/activation-capability/provisioning/run-plan.sh"
      - "scripts/preproduction-refresh/activation-capability/provisioning/observe-host-state.sh"
      - "scripts/preproduction-refresh/activation-capability/provisioning/evaluate-plan-evidence.py"
      - "scripts/preproduction-refresh/activation-capability/provisioning/runtime-db-identity-probe.py"
      - "scripts/preproduction-refresh/activation-capability/provisioning/test-runtime-db-identity-probe.py"
      - "scripts/preproduction-refresh/activation-capability/provisioning/test-plan-evidence.py"

permissions:
  contents: read

jobs:
  runtime-db-identity-proof:
    name: "#891 bounded runtime DB identity proof"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate syntax and focused synthetic matrices
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-refresh/activation-capability/provisioning'
          bash -n "$base/run-plan.sh" "$base/observe-host-state.sh"
          python3 -m py_compile \
            "$base/evaluate-plan-evidence.py" \
            "$base/runtime-db-identity-probe.py" \
            "$base/test-runtime-db-identity-probe.py" \
            "$base/test-plan-evidence.py" \
            "$base/nginx-vhost-selector.py" \
            "$base/test-nginx-vhost-selector.py"
          python3 "$base/test-runtime-db-identity-probe.py"
          python3 "$base/test-plan-evidence.py"
          python3 "$base/test-nginx-vhost-selector.py"

      - name: Prove exact Drush contract and fixed effective-runtime query
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          lock = json.loads(Path('composer.lock').read_text())
          packages = lock['packages'] + lock.get('packages-dev', [])
          drush = [package for package in packages if package.get('name') == 'drush/drush']
          assert len(drush) == 1
          assert drush[0]['version'] == '13.7.6'
          assert drush[0]['source']['reference'] == '051f6b4909728e0d3363aedab19d393f64438de4'

          base = Path('scripts/preproduction-refresh/activation-capability/provisioning')
          probe = (base / 'runtime-db-identity-probe.py').read_text()
          assert 'CURRENT = Path("/var/www/agency-preprod/current")' in probe
          assert 'DRUSH = CURRENT / "vendor/bin/drush"' in probe
          assert '[str(DRUSH), "--quiet", "status", "--field=db-name"]' in probe
          assert 'stderr=subprocess.DEVNULL' in probe
          assert 'stdout=subprocess.PIPE' in probe
          assert 'shell=True' not in probe
          assert 'settings.php' not in probe
          assert 'runtime.env' not in probe
          assert 'os.environ' not in probe
          assert 'printenv' not in probe
          assert 'DRUSH_FAILED' in probe
          assert 'DRUSH_MISSING' in probe
          assert 'DRUSH_NOT_EXECUTABLE' in probe
          assert 'OUTPUT_EMPTY' in probe
          assert 'OUTPUT_INVALID' in probe
          print('DRUSH_VERSION=13.7.6')
          print('DRUSH_DB_NAME_COMMAND_CONTRACT=VALID')
          print('EFFECTIVE_RUNTIME_QUERY=FIXED')
          print('DRUSH_STDERR_OUTPUT=FORBIDDEN')
          PY

      - name: Prove r6 lossy observation defect is removed
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-refresh/activation-capability/provisioning'
          observer="$base/observe-host-state.sh"
          evaluator="$base/evaluate-plan-evidence.py"
          probe="$base/runtime-db-identity-probe.py"
          plan="$base/run-plan.sh"
          ! grep -Fq "tr -d '\\r\\n'" "$observer"
          ! grep -Fq 'runtime_db_name_state' "$observer" "$evaluator"
          grep -Fq 'runtime_db_probe_state' "$evaluator"
          grep -Fq 'runtime database identity mismatch' "$evaluator"
          grep -Fq 'runtime database identity probe unavailable:' "$evaluator"
          grep -Fq "RUNTIME_DB_PROBE_BLOB='cb94aaa970441bfc03108b04b5bd7544d3f49414'" "$plan"
          test "$(git rev-parse "HEAD:$probe")" = 'cb94aaa970441bfc03108b04b5bd7544d3f49414'
          grep -Fq '< "$RUNTIME_DB_PROBE" >> "$observation"' "$plan"
          grep -Fq 'env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin python3 -I -' "$plan"
          printf '%s\n' \
            '#891_LOSSY_UNAVAILABLE_NONE_COLLAPSE=REMOVED' \
            '#891_MULTILINE_FLATTENING=FORBIDDEN' \
            '#891_OBSERVED_MISMATCH=FAIL_CLOSED' \
            '#891_UNAVAILABLE_REASON=BOUNDED'

      - name: Preserve PLAN non-privileged and APPLY boundary
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-refresh/activation-capability/provisioning'
          plan="$base/run-plan.sh"
          observer="$base/observe-host-state.sh"
          probe="$base/runtime-db-identity-probe.py"
          workflow='.github/workflows/preprod-874-capability-provisioning.yml'
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          text = Path('.github/workflows/preprod-874-capability-provisioning.yml').read_text()
          assert '\n  plan:\n' in text and '\n  apply:\n' in text
          plan = text.split('\n  plan:\n', 1)[1].split('\n  apply:\n', 1)[0]
          apply = '  apply:\n' + text.split('\n  apply:\n', 1)[1]
          assert 'runs-on: ubuntu-24.04' in plan
          assert 'PREPROD_SSH_USER: agency-preprod' in plan
          assert 'self-hosted' not in plan
          assert 'runs-on: [self-hosted, linux, x64, agency]' in apply
          assert "[[ \"$RUNNER_NAME\" == 'agency-browser-runner-01' ]]" in apply
          assert 'PREPROD_PROVISIONING_SSH_PRIVATE_KEY' in apply
          assert 'run-apply.sh' in apply
          assert hashlib.sha256(apply.encode()).hexdigest() == '3ef411d776606ec1fdab04a9ba10995617294789a078330c5dd10c31b215516f'
          print('PLAN_RUNNER=ubuntu-24.04')
          print('APPLY_RUNNER=[self-hosted,linux,x64,agency]')
          print('APPLY_RUNNER_PATH_UNCHANGED=PASS')
          PY
          grep -Fq '[[ "$PREPROD_SSH_USER" == '\''agency-preprod'\'' ]]' "$plan"
          ! grep -Eq '(^|[;&|()[:space:]])sudo[[:space:]]' "$plan" "$observer"
          ! grep -Fq 'root@$PREPROD_SSH_HOST' "$plan"
          ! grep -Fq 'sudo' "$probe"
          ! grep -Fq 'settings.php' "$probe"
          ! grep -Fq 'runtime.env' "$probe"
          ! grep -Fq 'PROD_' "$probe" "$observer"
          printf '%s\n' \
            'PREPROD_SSH_USER=agency-preprod' \
            'PLAN_MUTATION=NONE' \
            'PLAN_SUDO_EXECUTION=NONE' \
            'PLAN_HELPER_EXECUTION=NONE' \
            'ROOT_REMOTE_EXECUTION=FORBIDDEN' \
            'PRIVILEGE_WIDENING=NONE' \
            'PROD_ACCESS=NONE' \
            'DATA_ACTIVATION_AUTHORITY=DISABLED'

      - name: Preserve #887 and #889 regressions and frozen privileged surface
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-refresh/activation-capability'
          test "$(git rev-parse "HEAD:$base/agency-preprod-refresh-control")" = 'a8f9d05d7776f27c141ce549f87b6b854ac3aeb1'
          test "$(git rev-parse "HEAD:$base/side_effect_hardening.py")" = 'd38fc9d1f1480b91048a0ae8081272f22a952d01'
          test "$(git rev-parse "HEAD:$base/runtime_state_digest.py")" = 'ae282a893d68877dbbc36d03ab481ed9a9aafc6e'
          test "$(git rev-parse "HEAD:$base/nginx")" = 'ba0ecbe23b82dd3fafc2fd1275e36f18761d2707'
          test "$(git rev-parse "HEAD:$base/provisioning/agency-preprod-refresh-control.sudoers")" = '193f05b9dc0422d62e0104e95a8f5444f34ec17c'
          test "$(git rev-parse "HEAD:$base/provisioning/profile.json")" = '6103f8f316771d837652a7758af35a89291cee1b'
          test "$(git rev-parse "HEAD:$base/provisioning/remote-provision-root.sh")" = '6c3059615d912dc999f3741a667bd7601a7f4eb3'
          test "$(git rev-parse "HEAD:$base/provisioning/run-apply.sh")" = '4779e8ee7c2104dc38bf8c6ff1f1bcb5a2e0be3c'
          test "$(git rev-parse "HEAD:$base/provisioning/nginx-vhost-selector.py")" = 'a17e3f932b9a5e7ec4978f3758ff0bf5bbae9c79'
          test "$(sha256sum scripts/preproduction-staging-import/privileged/agency-preprod-staging-sanitizer.py | awk '{print $1}')" = 'fcdb1e42b8fd50db8e8190dea61eca66544149dc53a762affdb33bf96d2d481f'
          python3 "$base/provisioning/test-plan-evidence.py" >/dev/null
          python3 "$base/provisioning/test-nginx-vhost-selector.py" >/dev/null
          jq -e '
            .issue_number == 874 and
            .data_activation_authority.installed_state == "DISABLED" and
            .data_activation_authority.issue_874_grants_activation_authority == false
          ' "$base/profile.json" >/dev/null
          printf '%s\n' \
            '#874_REGRESSION=PASS' \
            '#877_REGRESSION=PASS' \
            '#879_REGRESSION=PASS' \
            '#881_REGRESSION=PASS' \
            '#884_REGRESSION=PASS' \
            '#887_REGRESSION=PASS' \
            '#889_REGRESSION=PASS' \
            '#891_REGRESSION=PASS' \
            'NO_SANITIZER_CHANGE=PASS' \
            'NO_NGINX_FENCE_BEHAVIOR_CHANGE=PASS' \
            'DATA_ACTIVATION_AUTHORITY_DISABLED=PASS' \
            'NO_REAL_PLAN=PASS' \
            'NO_PREPROD_MUTATION=PASS' \
            'NO_PROD_ACCESS=PASS'
