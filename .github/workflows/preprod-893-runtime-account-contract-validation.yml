name: "#893 PREPROD runtime account contract validation"

on:
  pull_request:
    paths:
      - "scripts/preproduction/bootstrap-host.sh"
      - "scripts/preproduction/settings.php.template"
      - "scripts/preproduction/runtime-db-account/**"
      - "docs/operations/preproduction-runtime-db-account.md"
      - ".github/workflows/preprod-893-runtime-account-contract-validation.yml"

permissions:
  contents: read

jobs:
  runtime-account-contract:
    name: "#893 bounded runtime account contract"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate #893 source and synthetic contract
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction/runtime-db-account'
          bash -n scripts/preproduction/bootstrap-host.sh
          python3 -m py_compile \
            "$base/agency-preprod-runtime-db-account" \
            "$base/test-contract.py"
          python3 "$base/test-contract.py"
          printf '%s\n' \
            'REAL_PREPROD_MUTATION=NONE' \
            'REAL_MARIADB_MUTATION=NONE' \
            'CAPABILITY_INSTALLATION=NONE' \
            'CAPABILITY_EXECUTION=NONE' \
            'REAL_PROD_ACCESS=NONE'

      - name: Preserve #849 staging-only privileged boundary
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-staging-import/privileged'
          test "$(git rev-parse "HEAD:$base/agency-preprod-staging-db")" = \
            'cd8e5a5dea9ab3ef45a7f9753af5933f4156c9db'
          python3 "$base/test-contract.py"
          printf '%s\n' \
            '#849_CAN_TARGET_agency_preprod=NO' \
            '#849_PRIVILEGE_WIDENING=NONE'

      - name: Preserve #891 fail-closed runtime DB identity
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-refresh/activation-capability/provisioning'
          python3 -m py_compile \
            "$base/runtime-db-identity-probe.py" \
            "$base/evaluate-plan-evidence.py" \
            "$base/nginx-vhost-selector.py" \
            "$base/test-runtime-db-identity-probe.py" \
            "$base/test-plan-evidence.py" \
            "$base/test-nginx-vhost-selector.py"
          python3 "$base/test-runtime-db-identity-probe.py"
          python3 "$base/test-plan-evidence.py"
          python3 "$base/test-nginx-vhost-selector.py"
          printf '%s\n' '#891_FAIL_CLOSED=PRESERVED'

      - name: Preserve PLAN, #887, #889, and disabled activation authority
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-refresh/activation-capability'
          provisioning="$base/provisioning"
          plan="$provisioning/run-plan.sh"
          observer="$provisioning/observe-host-state.sh"
          probe="$provisioning/runtime-db-identity-probe.py"

          test "$(git rev-parse "HEAD:$base/agency-preprod-refresh-control")" = \
            '37ce38be18ad417ed3fe4386775cc6d29532ebcb'
          test "$(git rev-parse "HEAD:$provisioning/agency-preprod-refresh-control.sudoers")" = \
            '193f05b9dc0422d62e0104e95a8f5444f34ec17c'
          test "$(git rev-parse "HEAD:$provisioning/nginx-vhost-selector.py")" = \
            'a17e3f932b9a5e7ec4978f3758ff0bf5bbae9c79'

          python3 - <<'PY'
          from pathlib import Path
          import json

          workflow = Path(
              '.github/workflows/preprod-874-capability-provisioning.yml'
          ).read_text()
          assert '\n  plan:\n' in workflow and '\n  apply:\n' in workflow
          plan_job = workflow.split('\n  plan:\n', 1)[1].split('\n  apply:\n', 1)[0]
          assert 'runs-on: ubuntu-24.04' in plan_job
          assert 'PREPROD_SSH_USER: agency-preprod' in plan_job
          assert 'self-hosted' not in plan_job

          profile = json.loads(Path(
              'scripts/preproduction-refresh/activation-capability/profile.json'
          ).read_text())
          assert profile['data_activation_authority']['installed_state'] == 'DISABLED'
          assert profile['data_activation_authority']['issue_874_grants_activation_authority'] is False
          PY

          grep -Fq '[[ "$PREPROD_SSH_USER" == '\''agency-preprod'\'' ]]' "$plan"
          ! grep -Eq '(^|[;&|()[:space:]])sudo[[:space:]]' "$plan" "$observer"
          ! grep -Fq 'sudo' "$probe"
          ! grep -Fq 'PROD_SSH' "$probe" "$observer"
          ! grep -Fq 'PROD_SERVER' "$probe" "$observer"

          printf '%s\n' \
            'PLAN_RUNNER=ubuntu-24.04' \
            'PLAN_IDENTITY=agency-preprod' \
            'PLAN_SUDO_EXECUTION=NONE' \
            'PLAN_HELPER_EXECUTION=NONE' \
            'PLAN_MUTATION=NONE' \
            '#887_SUDOERS=PRESERVED' \
            '#889_VHOST=PRESERVED' \
            'DATA_ACTIVATION_AUTHORITY=DISABLED'