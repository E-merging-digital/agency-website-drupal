name: "#905 PREPROD runtime DB probe HOME regression"

on:
  pull_request:
    paths:
      - ".github/workflows/preprod-905-runtime-db-home-validation.yml"
      - ".github/workflows/preprod-891-runtime-db-identity-validation.yml"
      - ".github/workflows/preprod-877-successor-authority-validation.yml"
      - ".github/workflows/preprod-895-runtime-db-precheck-validation.yml"
      - ".github/workflows/preprod-902-runtime-db-probe-validation.yml"
      - "scripts/preproduction-refresh/activation-capability/provisioning/run-plan.sh"
      - "scripts/preproduction-refresh/activation-capability/provisioning/runtime-db-identity-probe.py"

permissions:
  contents: read

jobs:
  runtime-db-home-regression:
    name: "#905 fixed HOME on runtime DB probe only"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prove exact root-cause correction
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-refresh/activation-capability/provisioning'
          plan="$base/run-plan.sh"
          probe="$base/runtime-db-identity-probe.py"

          bash -n "$plan"
          python3 -m py_compile "$probe" "$base/test-runtime-db-identity-probe.py"
          python3 "$base/test-runtime-db-identity-probe.py"

          test "$(git rev-parse "HEAD:$plan")" = '981a719eb29f485a41500531e0ff24b0e2187470'
          test "$(git rev-parse "HEAD:$probe")" = '197a2da8173f902eb5f43b96f2f14399d00df220'

          runtime='env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin HOME=/home/agency-preprod python3 -I -'
          observer='env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin /bin/bash -s --'
          vhost='env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin python3 -I - OBSERVE'

          grep -Fq "$runtime" "$plan"
          test "$(grep -Fc 'HOME=/home/agency-preprod' "$plan")" = '1'
          grep -Fq "$observer" "$plan"
          grep -Fq "$vhost" "$plan"
          ! grep -Fq 'HOME=$HOME' "$plan"
          ! grep -Fq 'HOME=${HOME' "$plan"

          printf '%s\n' \
            'ROOT_CAUSE_FIX=IMPLEMENTED' \
            'RUNTIME_DB_PROBE_ENV_I=PRESERVED' \
            'RUNTIME_DB_PROBE_FIXED_PATH=PRESERVED' \
            'RUNTIME_DB_PROBE_HOME=/home/agency-preprod' \
            'CALLER_HOME_INHERITANCE=FORBIDDEN' \
            'OTHER_REMOTE_PROBE_ENVIRONMENTS=UNCHANGED' \
            'ROOT_CAUSE_REGRESSION_TEST=GREEN'

      - name: Prove security and authority boundaries remain closed
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-refresh/activation-capability'
          plan="$base/provisioning/run-plan.sh"
          probe="$base/provisioning/runtime-db-identity-probe.py"
          workflow='.github/workflows/preprod-874-capability-provisioning.yml'

          grep -Fq '[[ "$PREPROD_SSH_USER" == '\''agency-preprod'\'' ]]' "$plan"
          grep -Fq 'PREPROD_SSH_USER: agency-preprod' "$workflow"
          grep -Fq 'runs-on: ubuntu-24.04' "$workflow"
          ! grep -Eq '(^|[;&|()[:space:]])sudo[[:space:]]' "$plan"
          ! grep -Fq 'root@$PREPROD_SSH_HOST' "$plan"
          ! grep -Fq 'PREPROD_PROVISIONING_SSH_PRIVATE_KEY' "$plan"
          ! grep -Fq 'runtime.env' "$plan" "$probe"
          ! grep -Fq 'DB_PASSWORD' "$plan" "$probe"
          ! grep -Fq 'settings.php' "$plan" "$probe"

          jq -e '
            .data_activation_authority.installed_state == "DISABLED" and
            .data_activation_authority.issue_874_grants_activation_authority == false
          ' "$base/profile.json" >/dev/null

          printf '%s\n' \
            'PREPROD_SSH_USER=agency-preprod' \
            'PLAN_RUNNER=GITHUB_HOSTED_UBUNTU_24_04' \
            'ROOT_REMOTE_EXECUTION=FORBIDDEN' \
            'SUDO_EXECUTION=NONE' \
            'RUNTIME_ENV_READ=NONE' \
            'DB_PASSWORD_READ=NONE' \
            'SETTINGS_PHP_READ=NONE' \
            'APPLY_AUTHORITY=NOT_WIDENED' \
            'DATA_ACTIVATION_AUTHORITY=DISABLED' \
            'REAL_PREPROD_EXECUTION=NONE' \
            'R9=NOT_EXECUTED' \
            'PROD_ACCESS=NONE'
