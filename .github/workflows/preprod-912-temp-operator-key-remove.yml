name: "#912 Governed temporary PREPROD operator key REMOVE"

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: agency-preprod-912-temp-key-remove
  cancel-in-progress: false

jobs:
  validate-authority:
    name: Validate successor authority for temporary key REMOVE
    if: >-
      ${{
        github.event.issue.pull_request == null &&
        startsWith(github.event.comment.body, '/agency-preprod-temp-key-remove ')
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    outputs:
      request_id: ${{ steps.authority.outputs.request_id }}
      main_sha: ${{ steps.authority.outputs.main_sha }}
      operation_profile: ${{ steps.authority.outputs.operation_profile }}
      authority_issue: ${{ steps.authority.outputs.authority_issue }}
      implementation_issue: ${{ steps.authority.outputs.implementation_issue }}
    steps:
      - name: Resolve exact live main
        id: live
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          live_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$live_main" =~ ^[0-9a-f]{40}$ ]]
          echo "main_sha=$live_main" >> "$GITHUB_OUTPUT"

      - name: Checkout exact trusted live main
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.live.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate owner, successor marker, exact main and one-shot request
        id: authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITY_ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          EVENT_ACTION: ${{ github.event.action }}
          LIVE_MAIN: ${{ steps.live.outputs.main_sha }}
        run: |
          set -euo pipefail
          issue_json="$RUNNER_TEMP/agency-912-authority-issue.json"
          comments_json="$RUNNER_TEMP/agency-912-authority-comments.json"
          cleanup_authority() { rm -f -- "$issue_json" "$comments_json"; }
          trap cleanup_authority EXIT HUP INT TERM
          gh api "repos/$GITHUB_REPOSITORY/issues/$AUTHORITY_ISSUE_NUMBER" > "$issue_json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$AUTHORITY_ISSUE_NUMBER/comments?per_page=100" > "$comments_json"
          python3 scripts/preproduction/temp-operator-access/validate-remove-successor-authority.py \
            --issue-json "$issue_json" \
            --comments-json "$comments_json" \
            --authority-issue-number "$AUTHORITY_ISSUE_NUMBER" \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-action "$EVENT_ACTION" \
            --github-actor "$GITHUB_ACTOR" \
            --comment-author "$COMMENT_AUTHOR" \
            --comment-body "$COMMENT_BODY" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --live-main "$LIVE_MAIN" \
            --github-output "$GITHUB_OUTPUT"
          cleanup_authority
          trap - EXIT HUP INT TERM

      - name: Bind fixed #912 REMOVE profile
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .issue_number == 912 and
            .profile_id == "agency-preprod-temp-key-remove-v1" and
            .implementation_only == true and
            .fixed_target.ssh_user == "agency-preprod" and
            .fixed_target.authorized_keys == "/home/agency-preprod/.ssh/authorized_keys" and
            .fixed_target.fingerprint == "SHA256:xMkx4EF3Hu7b77DAYNwSW5iO0/VHwT/k2Ff25FhNxYg" and
            .fixed_target.action == "REMOVE" and
            .future_execution.root_secret == "FORBIDDEN" and
            .future_execution.provisioning_root_secret == "FORBIDDEN" and
            .future_execution.sudo == "FORBIDDEN" and
            .boundaries.data_activation_authority == "DISABLED"
          ' scripts/preproduction/temp-operator-access/remove-profile.json >/dev/null
          test "${{ steps.authority.outputs.implementation_issue }}" = '912'
          test "${{ steps.authority.outputs.authority_issue }}" != '912'

  remove-key:
    name: Remove exact temporary operator key as agency-preprod
    needs: validate-authority
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout exact trusted main
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-authority.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: JIT revalidate live main and successor authority before SSH secret materialization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITY_ISSUE_NUMBER: ${{ needs.validate-authority.outputs.authority_issue }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          EVENT_ACTION: ${{ github.event.action }}
          EXPECTED_MAIN: ${{ needs.validate-authority.outputs.main_sha }}
          EXPECTED_REQUEST_ID: ${{ needs.validate-authority.outputs.request_id }}
          EXPECTED_PROFILE: ${{ needs.validate-authority.outputs.operation_profile }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == '1' ]]
          [[ "$AUTHORITY_ISSUE_NUMBER" =~ ^[0-9]+$ ]]
          current_live_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$current_live_main" =~ ^[0-9a-f]{40}$ ]]
          test "$current_live_main" = "$EXPECTED_MAIN"
          checked_out_head="$(git rev-parse HEAD)"
          test "$checked_out_head" = "$current_live_main"

          issue_json="$RUNNER_TEMP/agency-912-jit-authority-issue.json"
          comments_json="$RUNNER_TEMP/agency-912-jit-authority-comments.json"
          jit_output="$RUNNER_TEMP/agency-912-jit-authority-output.txt"
          cleanup_jit() { rm -f -- "$issue_json" "$comments_json" "$jit_output"; }
          trap cleanup_jit EXIT HUP INT TERM

          gh api "repos/$GITHUB_REPOSITORY/issues/$AUTHORITY_ISSUE_NUMBER" > "$issue_json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$AUTHORITY_ISSUE_NUMBER/comments?per_page=100" > "$comments_json"
          : > "$jit_output"
          python3 scripts/preproduction/temp-operator-access/validate-remove-successor-authority.py \
            --issue-json "$issue_json" \
            --comments-json "$comments_json" \
            --authority-issue-number "$AUTHORITY_ISSUE_NUMBER" \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-action "$EVENT_ACTION" \
            --github-actor "$GITHUB_ACTOR" \
            --comment-author "$COMMENT_AUTHOR" \
            --comment-body "$COMMENT_BODY" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --live-main "$current_live_main" \
            --github-output "$jit_output"

          read_jit_output() {
            local key="$1"
            local count value
            count="$(grep -c "^${key}=" "$jit_output" || true)"
            test "$count" = '1'
            value="$(sed -n "s/^${key}=//p" "$jit_output")"
            test -n "$value"
            printf '%s' "$value"
          }

          test "$(read_jit_output main_sha)" = "$EXPECTED_MAIN"
          test "$(read_jit_output authority_issue)" = "$AUTHORITY_ISSUE_NUMBER"
          test "$(read_jit_output request_id)" = "$EXPECTED_REQUEST_ID"
          test "$(read_jit_output operation_profile)" = "$EXPECTED_PROFILE"
          test "$(read_jit_output implementation_issue)" = '912'

          jq -e '
            .issue_number == 912 and
            .profile_id == "agency-preprod-temp-key-remove-v1" and
            .fixed_target.action == "REMOVE" and
            .boundaries.data_activation_authority == "DISABLED"
          ' scripts/preproduction/temp-operator-access/remove-profile.json >/dev/null
          jq -e '
            .data_activation_authority.installed_state == "DISABLED" and
            .data_activation_authority.issue_874_grants_activation_authority == false
          ' scripts/preproduction-refresh/activation-capability/profile.json >/dev/null

          printf '%s\n' \
            "CURRENT_LIVE_MAIN=$current_live_main" \
            "CHECKED_OUT_HEAD=$checked_out_head" \
            "AUTHORITY_ISSUE=$AUTHORITY_ISSUE_NUMBER" \
            'AUTHORITY_ISSUE_STATE=OPEN' \
            'AUTHORITY_MARKER=EXACT' \
            'AUTHORIZATION_COMMENT=UNIQUE_UNCHANGED_EXACT' \
            "REQUEST_ID=$EXPECTED_REQUEST_ID" \
            'ACTION=remove' \
            'PROFILE=agency-preprod-temp-key-remove-v1' \
            'RUN_ATTEMPT=1' \
            'DATA_ACTIVATION_AUTHORITY=DISABLED' \
            'JIT_REMOVE_AUTHORITY=PASS'

          cleanup_jit
          trap - EXIT HUP INT TERM

      - name: Configure transient non-root identity and pinned PREPROD trust
        shell: bash
        env:
          PREPROD_PRIVATE_KEY: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}
          PREPROD_SSH_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == 'github-hosted' ]]
          [[ "$RUNNER_OS" == 'Linux' ]]
          [[ "$RUNNER_ARCH" == 'X64' ]]
          test -n "$PREPROD_PRIVATE_KEY"
          test -n "$PREPROD_SSH_HOST"

          key=''
          home=''
          handed_off=0
          cleanup_config() {
            if [[ "$handed_off" -eq 0 ]]; then
              [[ -z "$key" ]] || rm -f -- "$key"
              [[ -z "$home" ]] || rm -rf -- "$home"
            fi
          }
          trap cleanup_config EXIT
          trap 'cleanup_config; exit 129' HUP
          trap 'cleanup_config; exit 130' INT
          trap 'cleanup_config; exit 143' TERM

          umask 077
          key="$(mktemp "$RUNNER_TEMP/agency-912-key-${GITHUB_RUN_ID}.XXXXXX.key")"
          home="$(mktemp -d "$RUNNER_TEMP/agency-912-home-${GITHUB_RUN_ID}.XXXXXX")"
          chmod 600 "$key"
          chmod 700 "$home"
          printf '%s\n' "$PREPROD_PRIVATE_KEY" > "$key"
          test "$(stat -c '%a' "$key")" = '600'

          HOME="$home" PREPROD_SERVER_HOST="$PREPROD_SSH_HOST" \
            bash scripts/preproduction-ssh-trust/manage-known-host.sh PROVISION >/dev/null
          known_hosts="$home/.ssh/known_hosts"
          [[ -f "$known_hosts" && ! -L "$known_hosts" ]]
          test "$(stat -c '%a' "$known_hosts")" = '600'
          HOME="$home" PREPROD_SERVER_HOST="$PREPROD_SSH_HOST" \
          PREPROD_KNOWN_HOSTS_FILE="$known_hosts" \
            bash scripts/preproduction-staging-import/verify-preprod-pinned-trust.sh >/dev/null

          echo "AGENCY_912_KEY=$key" >> "$GITHUB_ENV"
          echo "AGENCY_912_HOME=$home" >> "$GITHUB_ENV"
          handed_off=1
          trap - EXIT HUP INT TERM

      - name: Execute fixed non-root temporary key REMOVE
        shell: bash
        env:
          REQUEST_ID: ${{ needs.validate-authority.outputs.request_id }}
          REPOSITORY_SHA: ${{ needs.validate-authority.outputs.main_sha }}
          OPERATION_PROFILE: ${{ needs.validate-authority.outputs.operation_profile }}
          PREPROD_SSH_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
        run: |
          set -euo pipefail
          export PREPROD_SSH_KEY="$AGENCY_912_KEY"
          export PREPROD_KNOWN_HOSTS_FILE="$AGENCY_912_HOME/.ssh/known_hosts"
          bash scripts/preproduction/temp-operator-access/run-remove.sh

      - name: Remove transient non-root identity and trust
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          key="${AGENCY_912_KEY:-}"
          home="${AGENCY_912_HOME:-}"
          if [[ -n "$key" ]]; then
            [[ "$key" == "$RUNNER_TEMP/agency-912-key-${GITHUB_RUN_ID}."*".key" ]]
            [[ -f "$key" && ! -L "$key" ]]
            rm -f -- "$key"
            [[ ! -e "$key" && ! -L "$key" ]]
          fi
          if [[ -n "$home" ]]; then
            [[ "$home" == "$RUNNER_TEMP/agency-912-home-${GITHUB_RUN_ID}."* ]]
            [[ -d "$home" && ! -L "$home" ]]
            rm -rf -- "$home"
            [[ ! -e "$home" && ! -L "$home" ]]
          fi
