name: "#914 Governed PREPROD refresh successor validation"

on:
  pull_request:
    paths:
      - ".github/workflows/preprod-914-governed-successor.yml"
      - ".github/workflows/preprod-914-governed-successor-validation.yml"
      - "docs/operations/preproduction-refresh-governed-successor.md"
      - "scripts/preproduction-refresh/governed-successor/**"
      - "scripts/preproduction-refresh/activation-capability/**"
      - "scripts/production-readonly-snapshot/**"
      - "scripts/preproduction-staging-import/real-one-shot/**"

permissions:
  contents: read

jobs:
  successor-contract:
    name: "#914 authority / PLAN / APPLY / RECOVER_ABORT composition"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate syntax and exact successor profile
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-refresh/governed-successor'
          python3 -m py_compile \
            "$base/validate-execution-authority.py" \
            "$base/orchestration-contract.py" \
            "$base/test-authority.py" \
            "$base/test-orchestration.py"
          bash -n \
            "$base/run-plan.sh" \
            "$base/run-apply.sh" \
            "$base/run-recover-abort.sh" \
            "$base/remote-plan-observe.sh"
          jq -e '
            .issue_number == 914 and
            .parent_issue == 816 and
            .state == "SOURCE_ONLY_NOT_EXECUTION_AUTHORITY" and
            .execution_authority.implementation_issue_may_execute == false and
            .execution_authority.authority_issue_must_be_greater_than == 917 and
            .execution_authority.modes == ["PLAN","APPLY","RECOVER_ABORT"] and
            .authority_marker.schema_version == 3 and
            .capability_precondition.revision_lineage == [915,917] and
            .capability_precondition.persistent_data_activation_authority == "DISABLED" and
            .plan.mutation == "NONE" and
            .apply.prod_write == "NONE" and
            .recover_abort.prod_access == "NONE" and
            .recover_abort.normal_preprod_deploy_secret == "NONE" and
            .recover_abort.fixed_helper == "/usr/local/sbin/agency-preprod-refresh-authority-abort" and
            .fixed_capability.normal_sudo_authority_installer == "NONE" and
            .fixed_capability.normal_sudo_authority_abort == "NONE" and
            .abort_semantics.aborted_is_rolled_back == false and
            .delivery_boundary.real_recover_abort == "NONE" and
            .delivery_boundary.data_activation_authority == "DISABLED"
          ' "$base/profile.json" >/dev/null
          python3 "$base/orchestration-contract.py" verify-repository

      - name: Execute successor authority matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/preproduction-refresh/governed-successor/test-authority.py

      - name: Execute #915/#917 orchestration, hard-loss and trusted recovery-record matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/preproduction-refresh/governed-successor/test-orchestration.py

      - name: Prove PLAN/APPLY/RECOVER_ABORT JIT ordering and least-secret boundaries statically
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          w = Path('.github/workflows/preprod-914-governed-successor.yml').read_text()
          base = Path('scripts/preproduction-refresh/governed-successor')
          assert "runs-on: [self-hosted, linux, x64, agency]" in w

          plan = "  plan:\n" + w.split("\n  plan:\n", 1)[1].split("\n  apply:\n", 1)[0]
          apply = "  apply:\n" + w.split("\n  apply:\n", 1)[1].split("\n  recover-abort:\n", 1)[0]
          recovery = "  recover-abort:\n" + w.split("\n  recover-abort:\n", 1)[1]
          validate = "  validate-authority:\n" + w.split("\n  validate-authority:\n", 1)[1].split("\n  plan:\n", 1)[0]

          for chunk, secret_token, execute_token, cleanup_token in (
              (plan, "secrets.SSH_PRIVATE_KEY", "run-plan.sh", "Cleanup PLAN identities always"),
              (apply, "secrets.SSH_PRIVATE_KEY", "run-apply.sh", "Cleanup APPLY identities always"),
              (recovery, "secrets.PREPROD_PROVISIONING_SSH_PRIVATE_KEY", "run-recover-abort.sh", "Cleanup RECOVER_ABORT root identity always"),
          ):
              checkout = chunk.index("Checkout exact")
              jit = chunk.index("JIT revalidate")
              secret = chunk.index(secret_token)
              execute = chunk.index(execute_token)
              cleanup = chunk.index(cleanup_token)
              assert checkout < jit < secret < execute < cleanup
              assert secret_token not in chunk[:jit]

          assert "secrets.SSH_PRIVATE_KEY" not in recovery
          assert "secrets.PREPROD_SSH_PRIVATE_KEY" not in recovery
          assert "secrets.SERVER_HOST" not in recovery
          assert "secrets.SERVER_USER" not in recovery
          assert "PREPROD_SSH_PRIVATE_KEY" not in recovery
          assert "PREPROD_PROVISIONING_SSH_PRIVATE_KEY" in recovery
          assert "RECOVERY_ROOT_SECRET_BEFORE_JIT=IMPOSSIBLE" in recovery

          # Recovery trust is bound to one immutable GitHub comment id. Neither
          # validation nor JIT scans the target issue's arbitrary comments.
          for chunk in (validate, recovery):
              assert 'issues/comments/$TARGET_RECORD_COMMENT_ID' in chunk
              assert 'verify-recovery-target-comment' in chunk
              assert 'issues/$TARGET_ISSUE/comments?per_page=100' not in chunk
          assert 'target_recovery_record_comment_id' in validate
          assert 'RECOVERY_RECORD_COMMENT_ID_BINDING=PASS' in recovery
          assert 'RECOVERY_RECORD_AUTHOR_AUTHENTICATION=PASS' in recovery
          assert 'UNTRUSTED_RECOVERY_PREFIX=IGNORED' in recovery

          run_apply = (base / 'run-apply.sh').read_text()
          metadata = run_apply.index('RECOVERY_TARGET_METADATA=RECORDED_BEFORE_AUTHORITY_ARM')
          install = run_apply.index('install_output=')
          assert metadata < install
          assert 'AGENCY_PREPROD_REFRESH_RECOVERY_TARGET=' in run_apply
          assert 'RECOVERY_TARGET_COMMENT_ID=' in run_apply
          assert 'verify-recovery-target-comment' in run_apply
          assert 'issues/comments/$record_id' in run_apply
          assert 'record_is_execution_authority' not in run_apply
          assert 'raw="$temp_abs/' in run_apply
          assert 'RUNNER_TEMP must be outside workspace' in run_apply
          assert "actions/upload-artifact" not in apply

          contract = (base / 'orchestration-contract.py').read_text()
          assert 'TRUSTED_RECOVERY_RECORD_LOGIN = "github-actions[bot]"' in contract
          assert 'TRUSTED_RECOVERY_RECORD_TYPE = "Bot"' in contract
          assert 'def verify_recovery_target_comment' in contract
          assert 'def verify_recovery_target_comments' not in contract

          run_recovery = (base / 'run-recover-abort.sh').read_text()
          assert '/usr/local/sbin/agency-preprod-refresh-authority-abort' in run_recovery
          for forbidden in (
              'agency-preprod-refresh-authority-install',
              'agency-preprod-refresh-ingress',
              'agency-preprod-refresh-control',
              'PROD_SSH_KEY=', 'PROD_REMOTE=', 'scripts/production-readonly-snapshot',
              'IMPORT_SANITIZE_HARDEN_RETAIN',
              'BACKUP_ACTIVATE_CONVERGE_VALIDATE',
              'ROLLBACK_RECORDED',
          ):
              assert forbidden not in run_recovery

          print("JIT_BEFORE_PROD_SECRET=PASS")
          print("JIT_BEFORE_PREPROD_SECRET=PASS")
          print("JIT_BEFORE_ROOT_SECRET=PASS")
          print("RECOVERY_ROOT_SECRET_BEFORE_JIT=IMPOSSIBLE")
          print("RECOVERY_PROD_ACCESS=NONE")
          print("RECOVERY_RECORD_COMMENT_ID_BINDING=PASS")
          print("RECOVERY_RECORD_AUTHOR_AUTHENTICATION=PASS")
          print("UNTRUSTED_RECOVERY_PREFIX=IGNORED")
          print("UNTRUSTED_DUPLICATE_RECORD=IGNORED")
          print("RECOVERY_FIXED_HELPER=agency-preprod-refresh-authority-abort_ONLY")
          print("RAW_PROD_GITHUB_HOSTED=IMPOSSIBLE")
          print("RAW_PROD_GITHUB_ARTIFACT=NONE")
          PY

  predecessor-regressions:
    name: "#816/#834/#866/#868/#910/#915/#917 regressions"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Execute non-runtime predecessor contract tests
        shell: bash
        run: |
          set -euo pipefail
          cap='scripts/preproduction-refresh/activation-capability'
          python3 scripts/preproduction-staging-import/real-one-shot/test-contract.py
          python3 scripts/preproduction-refresh/activation-boundary/test-contract.py
          python3 "$cap/test-915-contract.py"
          python3 "$cap/test-917-contract.py"
          python3 "$cap/test-917-provisioning.py"
          php "$cap/test-915-admin-reconcile.php" absent
          php "$cap/test-915-admin-reconcile.php" present
          python3 "$cap/provisioning/test-successor-authority.py"
          python3 "$cap/provisioning/test-runtime-db-identity-probe.py"
          python3 "$cap/provisioning/test-plan-evidence.py"
          printf '%s\n' \
            '#816_REGRESSION=PASS' \
            '#834_866_SNAPSHOT_LINEAGE=PASS' \
            '#868_ROLLBACK_LINEAGE=PASS' \
            '#915_REGRESSION=PASS' \
            '#917_REGRESSION=PASS'

      - name: Execute #917 root-only abort composition regression
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
          sudo --preserve-env=RUNNER_ENVIRONMENT \
            bash scripts/preproduction-refresh/activation-capability/test-917-root-abort.sh
          sudo --preserve-env=RUNNER_ENVIRONMENT \
            bash scripts/preproduction-refresh/activation-capability/test-915-root-ingress.sh
          printf '%s\n' '#917_REGRESSION=PASS'

      - name: Prove #910 JIT-before-secret predecessor remains unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/preprod-874-capability-provisioning.yml').read_text()
          apply = '  apply:\n' + workflow.split('\n  apply:\n',1)[1]
          checkout = apply.index('Checkout exact trusted main')
          jit = apply.index('JIT revalidate live main and successor authority before root secret materialization')
          secret = apply.index('PREPROD_PROVISIONING_SSH_PRIVATE_KEY')
          execute = apply.index('run-apply.sh')
          cleanup = apply.index('Remove transient APPLY identity')
          assert checkout < jit < secret < execute < cleanup
          assert 'PREPROD_PROVISIONING_SSH_PRIVATE_KEY' not in apply[:jit]
          print('#910_REGRESSION=PASS')
          print('SECRET_BEFORE_JIT=IMPOSSIBLE')
          PY
