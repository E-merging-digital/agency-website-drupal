name: "#914 Governed PREPROD refresh successor"

on:
  workflow_call:
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      PREPROD_SSH_PRIVATE_KEY:
        required: true
      PREPROD_PROVISIONING_SSH_PRIVATE_KEY:
        required: true
      SERVER_HOST:
        required: true
      SERVER_USER:
        required: true
      PREPROD_SERVER_HOST:
        required: true

permissions:
  contents: read

concurrency:
  group: agency-preprod-governed-successor
  cancel-in-progress: false

jobs:
  validate-authority:
    if: >-
      ${{ github.event.issue.pull_request == null
          && ((github.event_name == 'issue_comment'
               && startsWith(github.event.comment.body, '/agency-preprod-refresh-successor '))
              || (github.event_name == 'issues' && github.event.action == 'opened')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    outputs:
      mode: ${{ steps.authority.outputs.mode }}
      request_id: ${{ steps.authority.outputs.request_id }}
      main_sha: ${{ steps.authority.outputs.main_sha }}
      prod_release_sha: ${{ steps.authority.outputs.prod_release_sha }}
      operation_profile: ${{ steps.authority.outputs.operation_profile }}
      authority_issue: ${{ steps.authority.outputs.authority_issue }}
    steps:
      - id: live
        name: Resolve exact live main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          live="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$live" =~ ^[0-9a-f]{40}$ ]]
          echo "main_sha=$live" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.live.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false
      - id: authority
        name: Validate fresh one-shot authority
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITY_ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          LIVE_MAIN: ${{ steps.live.outputs.main_sha }}
          EVENT_ACTION: ${{ github.event.action }}
        shell: bash
        run: |
          set -euo pipefail
          issue="$RUNNER_TEMP/issue.json"
          comments="$RUNNER_TEMP/comments.json"
          trap 'rm -f -- "$issue" "$comments"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/issues/$AUTHORITY_ISSUE_NUMBER" > "$issue"
          if [[ "$GITHUB_EVENT_NAME" == issue_comment ]]; then
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/issues/$AUTHORITY_ISSUE_NUMBER/comments?per_page=100" \
              > "$comments"
            python3 scripts/preproduction-refresh/governed-successor/validate-execution-authority.py \
              --issue-json "$issue" --comments-json "$comments" \
              --authority-issue-number "$AUTHORITY_ISSUE_NUMBER" \
              --comment-body "$COMMENT_BODY" --comment-author "$COMMENT_AUTHOR" \
              --github-actor "$GITHUB_ACTOR" --event-name "$GITHUB_EVENT_NAME" \
              --event-action "$EVENT_ACTION" --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --live-main "$LIVE_MAIN" --github-output "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == issues ]]; then
            python3 scripts/preproduction-refresh/governed-successor/validate-cockpit-plan-authority.py \
              --issue-json "$issue" \
              --authority-issue-number "$AUTHORITY_ISSUE_NUMBER" \
              --github-actor "$GITHUB_ACTOR" --event-name "$GITHUB_EVENT_NAME" \
              --event-action "$EVENT_ACTION" --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --live-main "$LIVE_MAIN" --github-output "$GITHUB_OUTPUT"
          else
            exit 80
          fi

  plan:
    needs: validate-authority
    if: ${{ needs.validate-authority.outputs.mode == 'PLAN' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    outputs:
      observed_prod_release_sha: ${{ steps.plan_result.outputs.observed_prod_release_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-authority.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: JIT revalidate before PLAN SSH secrets
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITY_ISSUE_NUMBER: ${{ needs.validate-authority.outputs.authority_issue }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          EVENT_ACTION: ${{ github.event.action }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          live="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$live" = "${{ needs.validate-authority.outputs.main_sha }}"
          test "$(git rev-parse HEAD)" = "$live"
          issue="$RUNNER_TEMP/jit-issue.json"
          comments="$RUNNER_TEMP/jit-comments.json"
          trap 'rm -f -- "$issue" "$comments"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/issues/$AUTHORITY_ISSUE_NUMBER" > "$issue"
          if [[ "$GITHUB_EVENT_NAME" == issue_comment ]]; then
            gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/issues/$AUTHORITY_ISSUE_NUMBER/comments?per_page=100" \
              > "$comments"
            python3 scripts/preproduction-refresh/governed-successor/validate-execution-authority.py \
              --issue-json "$issue" --comments-json "$comments" \
              --authority-issue-number "$AUTHORITY_ISSUE_NUMBER" \
              --comment-body "$COMMENT_BODY" --comment-author "$COMMENT_AUTHOR" \
              --github-actor "$GITHUB_ACTOR" --event-name "$GITHUB_EVENT_NAME" \
              --event-action "$EVENT_ACTION" --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --live-main "$live" --checked-out-head "$live" --expected-mode PLAN \
              --expected-request-id "${{ needs.validate-authority.outputs.request_id }}" \
              --expected-main "$live" \
              --expected-profile "${{ needs.validate-authority.outputs.operation_profile }}"
          elif [[ "$GITHUB_EVENT_NAME" == issues ]]; then
            python3 scripts/preproduction-refresh/governed-successor/validate-cockpit-plan-authority.py \
              --issue-json "$issue" \
              --authority-issue-number "$AUTHORITY_ISSUE_NUMBER" \
              --github-actor "$GITHUB_ACTOR" --event-name "$GITHUB_EVENT_NAME" \
              --event-action "$EVENT_ACTION" --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --live-main "$live" --checked-out-head "$live" \
              --expected-request-id "${{ needs.validate-authority.outputs.request_id }}" \
              --expected-main "$live" \
              --expected-profile "${{ needs.validate-authority.outputs.operation_profile }}"
          else
            exit 80
          fi
      - name: Materialize transient PLAN identities after JIT
        env:
          PROD_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PREPROD_KEY: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$PROD_KEY" > "$RUNNER_TEMP/agency-914-plan-prod.key"
          printf '%s\n' "$PREPROD_KEY" > "$RUNNER_TEMP/agency-914-plan-preprod.key"
          chmod 600 "$RUNNER_TEMP"/agency-914-plan-*.key
      - id: plan_result
        name: Execute mutation-free PLAN
        env:
          AUTHORITY_ISSUE: ${{ needs.validate-authority.outputs.authority_issue }}
          REQUEST_ID: ${{ needs.validate-authority.outputs.request_id }}
          REPOSITORY_SHA: ${{ needs.validate-authority.outputs.main_sha }}
          SOURCE_PROD_RELEASE_SHA: ${{ needs.validate-authority.outputs.prod_release_sha }}
          OPERATION_PROFILE: ${{ needs.validate-authority.outputs.operation_profile }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          PROD_SSH_HOST: ${{ secrets.SERVER_HOST }}
          PROD_SSH_USER: ${{ secrets.SERVER_USER }}
          PROD_SSH_KEY: ${{ runner.temp }}/agency-914-plan-prod.key
          PREPROD_SSH_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
          PREPROD_SSH_KEY: ${{ runner.temp }}/agency-914-plan-preprod.key
        shell: bash
        run: |
          set -euo pipefail
          result_file="$RUNNER_TEMP/agency-914-plan-result.env"
          trap 'rm -f -- "$result_file"' EXIT
          bash scripts/preproduction-refresh/governed-successor/run-plan.sh \
            | tee "$result_file"
          for required in \
            'PLAN_RESULT=PASS' \
            'PROD_DB_CONTENT_READ=NONE' \
            'PROD_SNAPSHOT=NOT_PERFORMED' \
            'PROD_DATA_TRANSFER=NONE' \
            'PREPROD_DB_MUTATION=NONE' \
            'PROD_WRITE=NONE' \
            'DATA_ACTIVATION_AUTHORITY=DISABLED'; do
            test "$(grep -Fxc "$required" "$result_file")" = '1'
          done
          observed_prod_release_sha="$(
            sed -n 's/^OBSERVED_PROD_RELEASE_SHA=//p' "$result_file"
          )"
          [[ "$observed_prod_release_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(grep -c '^OBSERVED_PROD_RELEASE_SHA=' "$result_file")" = '1'
          echo "observed_prod_release_sha=$observed_prod_release_sha" \
            >> "$GITHUB_OUTPUT"
      - if: ${{ always() }}
        name: Cleanup PLAN identities
        run: rm -f -- "$RUNNER_TEMP"/agency-914-plan-*.key

  publish-cockpit-plan-receipt:
    needs:
      - validate-authority
      - plan
    if: >-
      ${{ github.event_name == 'issues'
          && github.event.action == 'opened'
          && needs.validate-authority.outputs.mode == 'PLAN'
          && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Publish canonical evidence-only PLAN receipt
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITY_ISSUE: ${{ needs.validate-authority.outputs.authority_issue }}
          REQUEST_ID: ${{ needs.validate-authority.outputs.request_id }}
          MAIN_SHA: ${{ needs.validate-authority.outputs.main_sha }}
          PROFILE_ID: ${{ needs.validate-authority.outputs.operation_profile }}
          OBSERVED_PROD_RELEASE_SHA: ${{ needs.plan.outputs.observed_prod_release_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AUTHORITY_ISSUE" =~ ^[0-9]+$ ]]
          [[ "$REQUEST_ID" == "plan-${AUTHORITY_ISSUE}-cockpit-v1-r1" ]]
          [[ "$MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OBSERVED_PROD_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$PROFILE_ID" = 'agency-preprod-refresh-simple-v1'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          completed_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          receipt="$(jq -cn \
            --argjson authority_issue "$AUTHORITY_ISSUE" \
            --argjson dispatch_run "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg request_id "$REQUEST_ID" \
            --arg profile_id "$PROFILE_ID" \
            --arg main_sha "$MAIN_SHA" \
            --arg observed_prod_release_sha "$OBSERVED_PROD_RELEASE_SHA" \
            --arg completed_at "$completed_at" \
            '{schema_version:1,receipt_source:"WORKFLOW",authority_issue:$authority_issue,dispatch_run:$dispatch_run,run_attempt:$run_attempt,request_id:$request_id,mode:"PLAN",profile_id:$profile_id,main_sha:$main_sha,jit_main_revalidation:"PASS",plan_result:"PASS",observed_prod_release_sha:$observed_prod_release_sha,prod_db_content_read:"NONE",prod_snapshot:"NOT_PERFORMED",prod_data_transfer:"NONE",preprod_db_mutation:"NONE",prod_write:"NONE",data_activation_authority:"DISABLED",apply_job:"SKIPPED",issue_open_apply:"IMPOSSIBLE",completed_at:$completed_at}')"
          body="AGENCY_PREPROD_COCKPIT_PLAN_RECEIPT=$receipt"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$AUTHORITY_ISSUE/comments" \
            -f body="$body" >/dev/null

  apply:
    needs: validate-authority
    if: >-
      ${{ github.event_name == 'issue_comment'
          && needs.validate-authority.outputs.mode == 'APPLY' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-authority.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: JIT revalidate before APPLY SSH secrets
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORITY_ISSUE_NUMBER: ${{ needs.validate-authority.outputs.authority_issue }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          EVENT_ACTION: ${{ github.event.action }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          live="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$live" = "${{ needs.validate-authority.outputs.main_sha }}"
          test "$(git rev-parse HEAD)" = "$live"
          issue="$RUNNER_TEMP/jit-issue.json"; comments="$RUNNER_TEMP/jit-comments.json"
          trap 'rm -f -- "$issue" "$comments"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/issues/$AUTHORITY_ISSUE_NUMBER" > "$issue"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$AUTHORITY_ISSUE_NUMBER/comments?per_page=100" > "$comments"
          python3 scripts/preproduction-refresh/governed-successor/validate-execution-authority.py \
            --issue-json "$issue" --comments-json "$comments" --authority-issue-number "$AUTHORITY_ISSUE_NUMBER" \
            --comment-body "$COMMENT_BODY" --comment-author "$COMMENT_AUTHOR" --github-actor "$GITHUB_ACTOR" \
            --event-name "$GITHUB_EVENT_NAME" --event-action "$EVENT_ACTION" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --live-main "$live" --checked-out-head "$live" --expected-mode APPLY \
            --expected-request-id "${{ needs.validate-authority.outputs.request_id }}" \
            --expected-main "$live" --expected-profile "${{ needs.validate-authority.outputs.operation_profile }}"
      - name: Materialize transient APPLY identities after JIT
        env:
          PROD_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PREPROD_KEY: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}
          PREPROD_ROOT_KEY: ${{ secrets.PREPROD_PROVISIONING_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$PROD_KEY" > "$RUNNER_TEMP/agency-914-apply-prod.key"
          printf '%s\n' "$PREPROD_KEY" > "$RUNNER_TEMP/agency-914-apply-preprod.key"
          printf '%s\n' "$PREPROD_ROOT_KEY" > "$RUNNER_TEMP/agency-914-apply-preprod-root.key"
          chmod 600 "$RUNNER_TEMP"/agency-914-apply-*.key
      - name: Execute temporary controlled server-to-server APPLY
        env:
          AUTHORITY_ISSUE: ${{ needs.validate-authority.outputs.authority_issue }}
          REQUEST_ID: ${{ needs.validate-authority.outputs.request_id }}
          REPOSITORY_SHA: ${{ needs.validate-authority.outputs.main_sha }}
          SOURCE_PROD_RELEASE_SHA: ${{ needs.validate-authority.outputs.prod_release_sha }}
          OPERATION_PROFILE: ${{ needs.validate-authority.outputs.operation_profile }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          PROD_SSH_HOST: ${{ secrets.SERVER_HOST }}
          PROD_SSH_USER: ${{ secrets.SERVER_USER }}
          PROD_SSH_KEY: ${{ runner.temp }}/agency-914-apply-prod.key
          PREPROD_SSH_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
          PREPROD_SSH_KEY: ${{ runner.temp }}/agency-914-apply-preprod.key
          PREPROD_ROOT_KEY: ${{ runner.temp }}/agency-914-apply-preprod-root.key
        run: bash scripts/preproduction-refresh/governed-successor/run-server-to-server-apply.sh
      - if: ${{ always() }}
        name: Cleanup APPLY identities
        run: rm -f -- "$RUNNER_TEMP"/agency-914-apply-*.key
