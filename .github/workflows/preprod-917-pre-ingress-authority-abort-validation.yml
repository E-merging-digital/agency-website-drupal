name: "#917 PREPROD pre-ingress authority abort validation"

on:
  pull_request:
    paths:
      - ".github/workflows/preprod-917-pre-ingress-authority-abort-validation.yml"
      - ".github/workflows/preprod-915-fixed-refresh-capability-validation.yml"
      - "docs/operations/preproduction-refresh-activation-capability.md"
      - "scripts/preproduction-refresh/activation-capability/**"

permissions:
  contents: read

jobs:
  source-digests:
    name: "#917 exact source digest inventory"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Emit exact metadata-only SHA-256 inventory
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-refresh/activation-capability'
          for pair in \
            "helper:$base/agency-preprod-refresh-control" \
            "ingress:$base/agency-preprod-refresh-ingress" \
            "authority_installer:$base/agency-preprod-refresh-authority-install" \
            "authority_abort:$base/agency-preprod-refresh-authority-abort" \
            "transaction_contract:$base/transaction_contract.py" \
            "capability_profile:$base/profile.json" \
            "bundle_manifest:$base/bundle.json" \
            "run_apply:$base/provisioning/run-apply.sh" \
            "remote_provision_root:$base/provisioning/remote-provision-root.sh"; do
            key="${pair%%:*}"; path="${pair#*:}"
            printf 'SOURCE_SHA256_%s=%s\n' "$key" "$(sha256sum "$path" | awk '{print $1}')"
          done
          printf 'EXACT_PR_HEAD=%s\n' "$(git rev-parse HEAD)"

  abort-contract:
    name: "#917 exact binding / absence / crash-safe abort"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate syntax and pure contract matrix
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-refresh/activation-capability'
          bash -n \
            "$base/test-917-root-abort.sh" \
            "$base/test-915-root-ingress.sh" \
            "$base/provisioning/run-apply.sh" \
            "$base/provisioning/remote-provision-root.sh"
          python3 -m py_compile \
            "$base/transaction_contract.py" \
            "$base/agency-preprod-refresh-authority-install" \
            "$base/agency-preprod-refresh-authority-abort" \
            "$base/agency-preprod-refresh-ingress" \
            "$base/agency-preprod-refresh-control" \
            "$base/test-917-contract.py" \
            "$base/test-915-contract.py"
          python3 "$base/test-917-contract.py"

      - name: Execute root-only abort state-machine proof
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
          sudo --preserve-env=RUNNER_ENVIRONMENT \
            bash scripts/preproduction-refresh/activation-capability/test-917-root-abort.sh

      - name: Execute ingress-failure to ABORTED composition proof
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
          sudo --preserve-env=RUNNER_ENVIRONMENT \
            bash scripts/preproduction-refresh/activation-capability/test-915-root-ingress.sh

      - name: Prove least privilege and persistent disabled authority
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-refresh/activation-capability'
          control="$base/provisioning/agency-preprod-refresh-control.sudoers"
          ingress="$base/provisioning/agency-preprod-refresh-ingress.sudoers"
          grep -Fxq 'agency-preprod ALL=(root) NOPASSWD: NOSETENV: /usr/local/sbin/agency-preprod-refresh-control' "$control"
          grep -Fxq 'agency-preprod ALL=(root) NOPASSWD: NOSETENV: /usr/local/sbin/agency-preprod-refresh-ingress' "$ingress"
          ! grep -Eq 'NOPASSWD:[[:space:]]*ALL|(^|[[:space:]])SETENV:|[[:space:]](bash|sh|python|python3|mariadb|env)([[:space:]]|$)' "$control" "$ingress"
          ! grep -REq 'agency-preprod-refresh-authority-(install|abort)' "$control" "$ingress"
          jq -e '
            .revision_issue == 915 and
            .abort_revision_issue == 917 and
            .data_activation_authority.installed_state == "DISABLED" and
            .data_activation_authority.permanent_enabled_state == "NONE" and
            .pre_ingress_abort.target_state == "ABORTED" and
            .pre_ingress_abort.target_phase == "TERMINAL" and
            .pre_ingress_abort.normal_agency_preprod_sudo_exposure == "NONE" and
            .privilege.authority_abort_in_sudo == false
          ' "$base/profile.json" >/dev/null
          printf '%s\n' \
            'NORMAL_SUDO_EXPOSURE=NONE' \
            'NOPASSWD_ALL=NONE' \
            'GENERIC_ROOT=NONE' \
            'GENERIC_SHELL=NONE' \
            'GENERIC_PYTHON=NONE' \
            'GENERIC_MARIADB=NONE' \
            'GENERIC_ENV=NONE' \
            'DATA_ACTIVATION_AUTHORITY=DISABLED'

  predecessor-regressions:
    name: "#915/#910 semantic regressions"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Execute #915 non-runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-refresh/activation-capability'
          python3 "$base/test-915-contract.py"
          php "$base/test-915-admin-reconcile.php" absent
          php "$base/test-915-admin-reconcile.php" present
          python3 scripts/preproduction-refresh/activation-boundary/test-contract.py
          python3 "$base/provisioning/test-successor-authority.py"
          python3 "$base/provisioning/test-runtime-db-identity-probe.py"
          python3 "$base/provisioning/test-plan-evidence.py"
          printf '%s\n' '#915_REGRESSIONS=PASS'

      - name: Prove #910 JIT-before-secret workflow ordering unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/preprod-874-capability-provisioning.yml').read_text()
          apply = '  apply:\n' + workflow.split('\n  apply:\n',1)[1]
          checkout = apply.index('      - name: Checkout exact trusted main')
          jit = apply.index('      - name: JIT revalidate live main and successor authority before root secret materialization')
          secret = apply.index('PREPROD_PROVISIONING_SSH_PRIVATE_KEY')
          execute = apply.index('run-apply.sh')
          cleanup = apply.index('      - name: Remove transient APPLY identity')
          assert checkout < jit < secret < execute < cleanup
          assert 'PREPROD_PROVISIONING_SSH_PRIVATE_KEY' not in apply[:jit]
          jit_block = apply[jit:apply.index('      - name: Configure dedicated transient root provisioning identity')]
          assert 'secrets.' not in jit_block
          print('#910_JIT_BEFORE_SECRET=PRESERVED')
          print('ROOT_SECRET_BEFORE_JIT=IMPOSSIBLE')
          PY
