name: "Validate #851 governed PREPROD capability provisioning"

on:
  pull_request:
    paths:
      - '.github/workflows/preprod-capability-provisioning.yml'
      - '.github/workflows/preprod-capability-provisioning-validation.yml'
      - '.github/workflows/preprod-861-provisioning-authority-validation.yml'
      - '.github/workflows/preprod-ssh-trust-validation.yml'
      - 'scripts/preproduction-staging-import/provisioning/**'
      - 'scripts/preproduction-staging-import/privileged/**'
      - 'scripts/preproduction-refresh/sanitization-policy.json'
      - 'scripts/preproduction-staging-import/verify-preprod-pinned-trust.sh'

permissions:
  contents: read

jobs:
  provisioning-governance:
    name: Prove #851 origin #859 bundle and #861 execution authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate syntax exact bundle digests and authority lineage
        shell: bash
        run: |
          set -euo pipefail
          base='scripts/preproduction-staging-import/provisioning'
          privileged='scripts/preproduction-staging-import/privileged'
          bash -n "$base/remote-plan-readonly.sh" "$base/remote-provision-root.sh" "$base/run-plan.sh" "$base/run-apply.sh"
          python3 -m py_compile "$base/validate-provisioning-authority.py" "$base/test-authority-route.py" "$base/test-contract.py"
          python3 "$base/test-contract.py"
          python3 "$base/test-authority-route.py"
          jq -e '
            .schema_version == 1 and
            .issue_number == 851 and
            .revision_issue_number == 859 and
            .profile_id == "agency-preprod-capability-provision-v1" and
            .authority_lineage.provisioning_contract_origin_issue == 851 and
            .authority_lineage.capability_revision_issue == 859 and
            .authority_lineage.current_execution_authority_issue == 861 and
            .authority.execution_authority_issue == 861
          ' "$base/profile.json" >/dev/null
          test "$(sha256sum "$privileged/agency-preprod-staging-db" | awk '{print $1}')" = 'a3eaf545abc448004f7c1136bf4e19a5728b1e16784c700ffca24e91e2e82b71'
          test "$(sha256sum "$privileged/agency-preprod-staging-sanitizer.py" | awk '{print $1}')" = 'fcdb1e42b8fd50db8e8190dea61eca66544149dc53a762affdb33bf96d2d481f'
          test "$(sha256sum scripts/preproduction-refresh/sanitization-policy.json | awk '{print $1}')" = 'cf98b09b6f2c038aed0f82bd9a61553bff9c9cba4fee14d56eaf233cc3da98cb'

      - name: Prove PLAN remains mutation-free and bundle-aware
        shell: bash
        run: |
          set -euo pipefail
          plan='scripts/preproduction-staging-import/provisioning/run-plan.sh'
          remote='scripts/preproduction-staging-import/provisioning/remote-plan-readonly.sh'
          profile='scripts/preproduction-staging-import/provisioning/profile.json'
          grep -Fq "RUNNER_NAME\" == 'agency-browser-runner-01'" "$plan"
          grep -Fq 'verify-preprod-pinned-trust.sh' "$plan"
          grep -Fq 'StrictHostKeyChecking=yes' "$plan"
          grep -Fq "BUNDLE_DIR='/usr/local/lib/agency-preprod-staging'" "$remote"
          grep -Fq 'sudo -n -l -- "$HELPER_PATH" PRECHECK "$REQUEST_ID" 0' "$remote"
          ! grep -Fq 'sudo -n -- "$HELPER_PATH"' "$remote"
          ! grep -Eq '(^|[[:space:]])scp([[:space:]]|$)' "$plan"
          jq -e '.plan.preprod_mutation == "NONE" and .plan.helper_execution == "NONE" and .plan.sudo_execution == "NONE" and .plan.state_detection == "METADATA_ONLY"' "$profile" >/dev/null
          jq -e '.real_plan_performed_in_issue_861_phase_a == false and .real_provisioning_performed_in_issue_861_phase_a == false' "$profile" >/dev/null

      - name: Prove APPLY installs only exact root-owned bundle and keeps zero-data proofs
        shell: bash
        run: |
          set -euo pipefail
          apply='scripts/preproduction-staging-import/provisioning/run-apply.sh'
          remote='scripts/preproduction-staging-import/provisioning/remote-provision-root.sh'
          profile='scripts/preproduction-staging-import/provisioning/profile.json'
          grep -Fq "ROOT_USER='root'" "$apply"
          grep -Fq "HELPER_PATH='/usr/local/sbin/agency-preprod-staging-db'" "$remote"
          grep -Fq "BUNDLE_DIR='/usr/local/lib/agency-preprod-staging'" "$remote"
          grep -Fq "EXPECTED_HELPER_DIGEST='a3eaf545abc448004f7c1136bf4e19a5728b1e16784c700ffca24e91e2e82b71'" "$remote"
          grep -Fq "EXPECTED_SANITIZER_DIGEST='fcdb1e42b8fd50db8e8190dea61eca66544149dc53a762affdb33bf96d2d481f'" "$remote"
          grep -Fq "EXPECTED_POLICY_DIGEST='cf98b09b6f2c038aed0f82bd9a61553bff9c9cba4fee14d56eaf233cc3da98cb'" "$remote"
          grep -Fq 'rollback_on_exit' "$remote"
          grep -Fq 'PRECHECK "$REQUEST_ID" 0' "$remote"
          grep -Fq 'VERIFY_ABSENCE "$REQUEST_ID" 0' "$remote"
          ! grep -Eq 'runuser.*sudo.*IMPORT_SANITIZE_PROVE' "$remote"
          ! grep -Eq 'runuser.*sudo.*[[:space:]]IMPORT[[:space:]]' "$remote"
          jq -e '.apply.allowed_helper_proofs == ["PRECHECK","VERIFY_ABSENCE"] and .apply.snapshot_bytes == 0 and .apply.import == "FORBIDDEN" and .apply.import_sanitize_prove == "FORBIDDEN"' "$profile" >/dev/null
          jq -e '.apply.bundle_atomic_install == true and .apply.rollback_on_post_install_failure == true and .real_provisioning_performed_in_issue_859 == false' "$profile" >/dev/null
          jq -e '.authority.plan_authority_does_not_authorize_apply == true and .authority.apply_requires_fresh_separate_owner_comment == true and .authority.request_mode_binding == "REQUIRED"' "$profile" >/dev/null

      - name: Prove sudoers unchanged and no generic privileged surface
        shell: bash
        run: |
          set -euo pipefail
          remote='scripts/preproduction-staging-import/provisioning/remote-provision-root.sh'
          profile='scripts/preproduction-staging-import/provisioning/profile.json'
          grep -Fq 'desired_policy="${deploy_user} ALL=(root) NOPASSWD: NOSETENV: ${HELPER_PATH}"' "$remote"
          ! grep -Eq 'desired_policy=.*\*' "$remote"
          ! grep -Eq 'desired_policy=.*mariadb' "$remote"
          ! grep -Eq 'desired_policy=.*NOPASSWD:[[:space:]]*ALL' "$remote"
          ! grep -Eq '(^|[[:space:]])SETENV:' "$remote"
          ! grep -Fq 'eval ' "$remote"
          jq -e '.sudoers.change_required_for_issue_859 == false and .sudoers.nopasswd_scope == "FIXED_HELPER_ONLY" and .sudoers.direct_mariadb == "FORBIDDEN"' "$profile" >/dev/null
          jq -e '.sudoers.generic_root_executor_for_deploy_user == "NONE" and .sudoers.shell == "FORBIDDEN" and .sudoers.setenv == "FORBIDDEN"' "$profile" >/dev/null
          candidate="$(mktemp)"
          trap 'rm -f "$candidate"' EXIT
          printf '%s\n' 'root ALL=(root) NOPASSWD: NOSETENV: /usr/local/sbin/agency-preprod-staging-db' > "$candidate"
          chmod 0440 "$candidate"
          visudo -cf "$candidate" >/dev/null

      - name: Emit provisioning regression result
        shell: bash
        run: |
          printf '%s\n' \
            'PROVISIONING_ROUTE=PASS' \
            'ORIGIN_PROVISIONING_ISSUE=851' \
            'CAPABILITY_REVISION_ISSUE=859' \
            'CURRENT_EXECUTION_AUTHORITY_ISSUE=861' \
            'HELPER_BUNDLE_DIGEST_BOUND=PASS' \
            'PLAN_MUTATION_ROUTE=NONE' \
            'PLAN_HELPER_EXECUTION=NONE' \
            'PLAN_SUDO_EXECUTION=NONE' \
            'PLAN_APPLY_AUTHORITY_SEPARATION=PASS' \
            'SUDOERS_CHANGE_REQUIRED=NO' \
            'SUDOERS_FIXED_HELPER_ONLY=PASS' \
            'DIRECT_MARIADB_SUDO=FORBIDDEN' \
            'GENERIC_ROOT_EXECUTOR=NONE' \
            'ROLLBACK_FAIL_CLOSE=PASS' \
            'PRECHECK_ZERO_DATA=PASS' \
            'VERIFY_ABSENCE_ZERO_DATA=PASS' \
            'REAL_PREPROD_PLAN_EXECUTION=NOT_PERFORMED' \
            'REAL_PREPROD_MUTATION=NOT_PERFORMED' \
            'REAL_PROVISIONING_PERFORMED=NO'
