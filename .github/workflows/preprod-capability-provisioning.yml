name: Governed PREPROD bounded capability provisioning

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: agency-preprod-capability-provisioning
  cancel-in-progress: false

jobs:
  validate-authority:
    name: Validate fresh #861 owner provisioning authority
    if: >-
      ${{
        github.event.issue.pull_request == null &&
        github.event.issue.number == 861 &&
        startsWith(github.event.comment.body, '/agency-preprod-capability-provision ')
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    outputs:
      mode: ${{ steps.authority.outputs.mode }}
      request_id: ${{ steps.authority.outputs.request_id }}
      main_sha: ${{ steps.authority.outputs.main_sha }}
      operation_profile: ${{ steps.authority.outputs.operation_profile }}
      helper_sha256: ${{ steps.profile.outputs.helper_sha256 }}
    steps:
      - name: Resolve exact #861 event envelope and live main
        id: envelope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          EVENT_DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'E-merging-digital' ]]
          [[ "$COMMENT_AUTHOR" == "$GITHUB_ACTOR" ]]
          [[ "$ISSUE_NUMBER" == '861' ]]
          [[ "$GITHUB_RUN_ATTEMPT" == '1' ]] || {
            echo 'Provisioning authority cannot be replayed through workflow rerun.' >&2
            exit 1
          }
          issue_json="$(gh api "repos/$GITHUB_REPOSITORY/issues/861")"
          issue_state="$(jq -r '.state' <<< "$issue_json")"
          issue_owner="$(jq -r '.user.login' <<< "$issue_json")"
          [[ "$issue_state" == 'open' ]]
          [[ "$issue_owner" == 'E-merging-digital' ]]
          live_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$EVENT_DEFAULT_SHA" == "$live_main" ]]
          echo "main_sha=$live_main" >> "$GITHUB_OUTPUT"
          echo "issue_state=$issue_state" >> "$GITHUB_OUTPUT"
          echo "issue_owner=$issue_owner" >> "$GITHUB_OUTPUT"

      - name: Checkout exact trusted live main provisioning source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.envelope.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact repository lineage bundle and profile authority
        id: profile
        shell: bash
        run: |
          set -euo pipefail
          profile='scripts/preproduction-staging-import/provisioning/profile.json'
          privileged='scripts/preproduction-staging-import/privileged'
          helper="$privileged/agency-preprod-staging-db"
          sanitizer="$privileged/agency-preprod-staging-sanitizer.py"
          policy='scripts/preproduction-refresh/sanitization-policy.json'
          jq -e '
            .profile_id == "agency-preprod-capability-provision-v1" and
            .authority_lineage.provisioning_contract_origin_issue == 851 and
            .authority_lineage.capability_revision_issue == 859 and
            .authority_lineage.current_execution_authority_issue == 861 and
            .authority.execution_authority_issue == 861
          ' "$profile" >/dev/null
          helper_sha="$(jq -r '.helper.expected_sha256' "$profile")"
          sanitizer_sha="$(jq -r '.bundle.sanitizer.expected_sha256' "$profile")"
          policy_sha="$(jq -r '.bundle.policy.expected_sha256' "$profile")"
          test "$helper_sha" = 'a3eaf545abc448004f7c1136bf4e19a5728b1e16784c700ffca24e91e2e82b71'
          test "$sanitizer_sha" = 'fcdb1e42b8fd50db8e8190dea61eca66544149dc53a762affdb33bf96d2d481f'
          test "$policy_sha" = 'cf98b09b6f2c038aed0f82bd9a61553bff9c9cba4fee14d56eaf233cc3da98cb'
          test "$helper_sha" = "$(sha256sum "$helper" | awk '{print $1}')"
          test "$sanitizer_sha" = "$(sha256sum "$sanitizer" | awk '{print $1}')"
          test "$policy_sha" = "$(sha256sum "$policy" | awk '{print $1}')"
          test "$helper_sha" = "$(tr -d '\r\n' < "$privileged/agency-preprod-staging-db.sha256")"
          test "$sanitizer_sha" = "$(tr -d '\r\n' < "$privileged/agency-preprod-staging-sanitizer.py.sha256")"
          test "$policy_sha" = "$(tr -d '\r\n' < "$privileged/sanitization-policy.sha256")"
          echo "helper_sha256=$helper_sha" >> "$GITHUB_OUTPUT"

      - name: Validate exact command uniqueness historical non-reuse and mode binding
        id: authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_STATE: ${{ steps.envelope.outputs.issue_state }}
          ISSUE_OWNER: ${{ steps.envelope.outputs.issue_owner }}
          TRIGGER_COMMENT: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          LIVE_MAIN: ${{ steps.envelope.outputs.main_sha }}
          EVENT_DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          profile='scripts/preproduction-staging-import/provisioning/profile.json'
          validator='scripts/preproduction-staging-import/provisioning/validate-provisioning-authority.py'
          current="$RUNNER_TEMP/agency-861-current-comments.json"
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/861/comments?per_page=100" > "$current"
          args=(--profile "$profile" --current-comments-json "$current")
          while IFS= read -r historical_issue; do
            historical="$RUNNER_TEMP/agency-861-historical-${historical_issue}.json"
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/${historical_issue}/comments?per_page=100" > "$historical"
            args+=(--historical-comments-json "$historical")
          done < <(jq -r '.authority.historical_request_issues[]' "$profile")
          python3 "$validator" "${args[@]}" >> "$GITHUB_OUTPUT"

  plan:
    name: Mutation-free real PREPROD provisioning PLAN
    needs: validate-authority
    if: ${{ needs.validate-authority.outputs.mode == 'plan' }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - agency
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact trusted main provisioning source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-authority.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact trusted runner and pinned PREPROD trust
        shell: bash
        env:
          PREPROD_SERVER_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_NAME" == 'agency-browser-runner-01' ]]
          test -n "$PREPROD_SERVER_HOST"
          PREPROD_KNOWN_HOSTS_FILE="$HOME/.ssh/known_hosts" \
            bash scripts/preproduction-staging-import/verify-preprod-pinned-trust.sh >/dev/null

      - name: Require dedicated provisioning credential readiness
        id: provisioning-readiness
        env:
          PREPROD_PROVISIONING_SSH_PRIVATE_KEY: ${{ secrets.PREPROD_PROVISIONING_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/preproduction-staging-import/provisioning/check-provisioning-credential-ready.sh >> "$GITHUB_OUTPUT"

      - name: Configure transient PREPROD deploy SSH identity
        env:
          PREPROD_PRIVATE_KEY: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PREPROD_PRIVATE_KEY"
          key="$RUNNER_TEMP/agency-861-plan-${GITHUB_RUN_ID}.key"
          printf '%s\n' "$PREPROD_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          echo "AGENCY_861_PLAN_SSH_KEY=$key" >> "$GITHUB_ENV"

      - name: Execute fixed mutation-free PLAN
        env:
          REQUEST_ID: ${{ needs.validate-authority.outputs.request_id }}
          REPOSITORY_SHA: ${{ needs.validate-authority.outputs.main_sha }}
          OPERATION_PROFILE: ${{ needs.validate-authority.outputs.operation_profile }}
          PREPROD_SSH_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
          PREPROD_SSH_USER: ${{ secrets.PREPROD_SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AGENCY_861_PLAN_SSH_KEY:-}"
          export PREPROD_SSH_KEY="$AGENCY_861_PLAN_SSH_KEY"
          bash scripts/preproduction-staging-import/provisioning/run-plan.sh

      - name: Remove transient PLAN SSH identity
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "${AGENCY_861_PLAN_SSH_KEY:-}" ]] || rm -f -- "$AGENCY_861_PLAN_SSH_KEY"
          [[ -z "${AGENCY_861_PLAN_SSH_KEY:-}" ]] || test ! -e "$AGENCY_861_PLAN_SSH_KEY"

      - name: Validate metadata-only PLAN evidence
        env:
          PROVISIONING_CREDENTIAL_READY: ${{ steps.provisioning-readiness.outputs.provisioning_credential_ready }}
        shell: bash
        run: |
          set -euo pipefail
          evidence='artifacts/preprod-capability-provisioning/evidence.env'
          test -f "$evidence"
          [[ "$PROVISIONING_CREDENTIAL_READY" == 'PASS' ]]
          grep -Fxq 'provisioning_credential_ready=PASS' "$evidence" || printf '%s\n' 'provisioning_credential_ready=PASS' >> "$evidence"
          grep -Fxq 'execution_mode=PLAN' "$evidence"
          grep -Fxq 'plan_result=PASS' "$evidence"
          grep -Fxq 'provisioning_credential_ready=PASS' "$evidence"
          grep -Fxq 'preprod_mutation=NONE' "$evidence"
          grep -Fxq 'privileged_helper_execution=NONE' "$evidence"
          grep -Fxq 'prod_access=NONE' "$evidence"
          grep -Fxq 'issue_834_apply=NOT_PERFORMED' "$evidence"

      - name: Upload metadata-only PLAN evidence
        uses: actions/upload-artifact@v4
        with:
          name: agency-preprod-capability-plan-${{ needs.validate-authority.outputs.request_id }}-${{ github.run_id }}
          path: artifacts/preprod-capability-provisioning/evidence.env
          if-no-files-found: error
          retention-days: 14

  apply:
    name: Project-Lead-only bounded PREPROD provisioning APPLY
    needs: validate-authority
    if: ${{ needs.validate-authority.outputs.mode == 'apply' }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - agency
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact trusted main provisioning source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-authority.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact trusted runner and pinned PREPROD trust
        shell: bash
        env:
          PREPROD_SERVER_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
        run: |
          set -euo pipefail
          [[ "$RUNNER_NAME" == 'agency-browser-runner-01' ]]
          test -n "$PREPROD_SERVER_HOST"
          PREPROD_KNOWN_HOSTS_FILE="$HOME/.ssh/known_hosts" \
            bash scripts/preproduction-staging-import/verify-preprod-pinned-trust.sh >/dev/null

      - name: Configure dedicated transient provisioning SSH identity
        env:
          PROVISIONING_PRIVATE_KEY: ${{ secrets.PREPROD_PROVISIONING_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROVISIONING_PRIVATE_KEY"
          key="$RUNNER_TEMP/agency-861-provision-${GITHUB_RUN_ID}.key"
          printf '%s\n' "$PROVISIONING_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          echo "AGENCY_861_PROVISIONING_SSH_KEY=$key" >> "$GITHUB_ENV"

      - name: Execute fixed repository-owned one-shot APPLY
        env:
          REQUEST_ID: ${{ needs.validate-authority.outputs.request_id }}
          REPOSITORY_SHA: ${{ needs.validate-authority.outputs.main_sha }}
          OPERATION_PROFILE: ${{ needs.validate-authority.outputs.operation_profile }}
          PREPROD_SSH_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AGENCY_861_PROVISIONING_SSH_KEY:-}"
          export PREPROD_PROVISIONING_SSH_KEY="$AGENCY_861_PROVISIONING_SSH_KEY"
          bash scripts/preproduction-staging-import/provisioning/run-apply.sh

      - name: Remove transient provisioning SSH identity
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "${AGENCY_861_PROVISIONING_SSH_KEY:-}" ]] || rm -f -- "$AGENCY_861_PROVISIONING_SSH_KEY"
          [[ -z "${AGENCY_861_PROVISIONING_SSH_KEY:-}" ]] || test ! -e "$AGENCY_861_PROVISIONING_SSH_KEY"

      - name: Validate metadata-only APPLY evidence against canonical contract
        if: ${{ always() }}
        shell: bash
        env:
          EXPECTED_REQUEST_ID: ${{ needs.validate-authority.outputs.request_id }}
          EXPECTED_REPOSITORY_SHA: ${{ needs.validate-authority.outputs.main_sha }}
          EXPECTED_OPERATION_PROFILE: ${{ needs.validate-authority.outputs.operation_profile }}
        run: |
          set -euo pipefail
          evidence='artifacts/preprod-capability-provisioning/evidence.env'
          contract='scripts/preproduction-staging-import/provisioning/apply-evidence-contract.json'
          validator='scripts/preproduction-staging-import/provisioning/validate-apply-evidence.py'
          test -f "$evidence"
          test -f "$contract"
          test -f "$validator"
          python3 "$validator" evidence \
            --contract "$contract" \
            --input "$evidence" \
            --expected-request-id "$EXPECTED_REQUEST_ID" \
            --expected-repository-sha "$EXPECTED_REPOSITORY_SHA" \
            --expected-operation-profile "$EXPECTED_OPERATION_PROFILE"

      - name: Upload metadata-only provisioning evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agency-preprod-capability-provision-${{ needs.validate-authority.outputs.request_id }}-${{ github.run_id }}
          path: artifacts/preprod-capability-provisioning/evidence.env
          if-no-files-found: error
          retention-days: 30
