name: '#1218 PREPROD cockpit transport convergence'

on:
  workflow_call:
    secrets:
      PREPROD_SSH_PRIVATE_KEY:
        required: true
      PREPROD_PROVISIONING_SSH_PRIVATE_KEY:
        required: true
      PREPROD_SERVER_HOST:
        required: true

concurrency:
  group: agency-preprod-cockpit-transport-1218
  cancel-in-progress: false

jobs:
  validate-authority:
    name: Validate exact #1218 PLAN authority
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    outputs:
      main_sha: ${{ steps.authority.outputs.main_sha }}
      plan_id: ${{ steps.authority.outputs.plan_id }}
    steps:
      - id: authority
        name: Validate bounded owner PLAN request and exact live main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_LOGIN: ${{ github.event.comment.user.login }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_VIA_APP: ${{ github.event.comment.performed_via_github_app != null }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = 'issue_comment'
          test "$EVENT_ACTION" = 'created'
          test "$ISSUE_NUMBER" = '1218'
          test "$COMMENT_LOGIN" = 'E-merging-digital'
          test "$COMMENT_ASSOCIATION" = 'OWNER'
          test "$COMMENT_VIA_APP" = 'false'
          test "$COMMENT_BODY" = '/agency-cockpit-transport-1218 plan'

          issue_json="$(gh api "repos/$GITHUB_REPOSITORY/issues/1218")"
          test "$(jq -r '.state' <<<"$issue_json")" = 'open'

          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_SHA" = "$main_sha"

          plan_id="plan-1218-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "main_sha=$main_sha"
            echo "plan_id=$plan_id"
          } >> "$GITHUB_OUTPUT"

  plan:
    name: Observe real PREPROD cockpit transport state
    needs: validate-authority
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out exact live main
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-authority.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize transient PREPROD read-only identity and pinned trust
        shell: bash
        env:
          PREPROD_SSH_PRIVATE_KEY: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}
          PREPROD_SERVER_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
        run: |
          set -euo pipefail
          test -n "$PREPROD_SSH_PRIVATE_KEY"
          test -n "$PREPROD_SERVER_HOST"
          printf '%s\n' "$PREPROD_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/agency-1218-plan.key"
          chmod 600 "$RUNNER_TEMP/agency-1218-plan.key"
          PREPROD_SERVER_HOST="$PREPROD_SERVER_HOST" \
            bash scripts/preproduction-ssh-trust/manage-known-host.sh PROVISION >/dev/null

      - name: Materialize transient exact-path PREPROD root metadata identity
        shell: bash
        env:
          PREPROD_ROOT_KEY: ${{ secrets.PREPROD_PROVISIONING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$PREPROD_ROOT_KEY"
          printf '%s\n' "$PREPROD_ROOT_KEY" > "$RUNNER_TEMP/agency-1218-plan-root.key"
          chmod 600 "$RUNNER_TEMP/agency-1218-plan-root.key"

      - id: plan
        name: Capture immutable read-only PLAN from PREPROD
        shell: bash
        env:
          PREPROD_SERVER_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
          MAIN_SHA: ${{ needs.validate-authority.outputs.main_sha }}
          PLAN_ID: ${{ needs.validate-authority.outputs.plan_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/preprod-cockpit-transport-1218
          ssh_args=(
            -i "$RUNNER_TEMP/agency-1218-plan.key"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=15
          )
          timeout 60s ssh "${ssh_args[@]}" "agency-preprod@$PREPROD_SERVER_HOST" \
            "bash -s -- '$MAIN_SHA' '$PLAN_ID'" \
            < scripts/preproduction-cockpit-transport-1218/remote-plan.sh \
            > artifacts/preprod-cockpit-transport-1218/plan.json

          root_ssh_args=(
            -i "$RUNNER_TEMP/agency-1218-plan-root.key"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=15
          )
          legacy_json="$(timeout 20s ssh "${root_ssh_args[@]}" "root@$PREPROD_SERVER_HOST" '/usr/bin/python3 -I -' <<'PY'
import grp
import json
import os
import pwd
import stat

path = '/root/agency-1218-35221860275-1'
try:
    metadata = os.lstat(path)
except FileNotFoundError:
    result = {'path': path, 'presence': 'ABSENT', 'access': 'OK', 'type': 'ABSENT', 'owner': 'ABSENT', 'group': 'ABSENT', 'mode': 'ABSENT'}
else:
    if stat.S_ISLNK(metadata.st_mode):
        kind = 'SYMLINK'
    elif stat.S_ISDIR(metadata.st_mode):
        kind = 'DIRECTORY'
    elif stat.S_ISREG(metadata.st_mode):
        kind = 'REGULAR'
    else:
        kind = 'OTHER'
    try:
        owner = pwd.getpwuid(metadata.st_uid).pw_name
    except KeyError:
        owner = str(metadata.st_uid)
    try:
        group = grp.getgrgid(metadata.st_gid).gr_name
    except KeyError:
        group = str(metadata.st_gid)
    result = {
        'path': path,
        'presence': 'PRESENT',
        'access': 'OK',
        'type': kind,
        'owner': owner,
        'group': group,
        'mode': format(stat.S_IMODE(metadata.st_mode), 'o'),
    }
print(json.dumps(result, separators=(',', ':'), sort_keys=True))
PY
)"
          jq -e '
            .path == "/root/agency-1218-35221860275-1"
            and (.presence == "PRESENT" or .presence == "ABSENT")
            and .access == "OK"
            and (.type | test("^(ABSENT|DIRECTORY|REGULAR|SYMLINK|OTHER)$"))
            and (.owner | type == "string")
            and (.mode | type == "string")
          ' <<<"$legacy_json" >/dev/null

          plan='artifacts/preprod-cockpit-transport-1218/plan.json'
          merged_plan="$(mktemp)"
          jq --argjson legacy "$legacy_json" '.STATE.legacy_failed_staging = $legacy' "$plan" > "$merged_plan"
          canonical="$(jq -cS '.STATE' "$merged_plan")"
          digest="$(printf '%s' "$canonical" | sha256sum | awk '{print $1}')"
          jq --arg digest "$digest" '.PLAN_DIGEST = $digest' "$merged_plan" > "$plan"
          rm -f -- "$merged_plan"
          jq -e \
            --arg main "$MAIN_SHA" \
            --arg plan_id "$PLAN_ID" '
              .STATUS == "PASS"
              and .ISSUE == 1218
              and .TARGET == "PREPROD"
              and .MODE == "PLAN"
              and .MAIN_SHA == $main
              and .PLAN_ID == $plan_id
              and (.PLAN_DIGEST | test("^[0-9a-f]{64}$"))
              and .PREPROD_MUTATION == "NONE"
              and .PROD_ACCESS == "NONE"
              and .SECRET_CONTENT_EXPOSED == false
              and (.STATE.current_target | startswith("/var/www/agency-preprod/releases/"))
              and (.STATE.settings.sha256 | test("^[0-9a-f]{64}$"))
              and (.STATE.nginx.sha256 | test("^[0-9a-f]{64}$"))
              and (.STATE.http.no_auth.status | test("^[0-9]{3}$"))
              and (.STATE.http.fake_bearer.status | test("^[0-9]{3}$"))
              and .STATE.legacy_failed_staging.path == "/root/agency-1218-35221860275-1"
              and (.STATE.legacy_failed_staging.presence | test("^(PRESENT|ABSENT)$"))
              and .STATE.legacy_failed_staging.access == "OK"
            ' "$plan" >/dev/null

          echo "digest=$(jq -r '.PLAN_DIGEST' "$plan")" >> "$GITHUB_OUTPUT"

      - name: Upload immutable PLAN evidence
        uses: actions/upload-artifact@v4
        with:
          name: preprod-cockpit-transport-1218-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/preprod-cockpit-transport-1218/plan.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish non-sensitive PLAN summary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_ID: ${{ needs.validate-authority.outputs.plan_id }}
          PLAN_DIGEST: ${{ steps.plan.outputs.digest }}
          MAIN_SHA: ${{ needs.validate-authority.outputs.main_sha }}
        run: |
          set -euo pipefail
          plan='artifacts/preprod-cockpit-transport-1218/plan.json'
          release="$(jq -r '.STATE.current_release' "$plan")"
          settings_reader="$(jq -r '.STATE.settings.cockpit_token_reader' "$plan")"
          nginx_count="$(jq -r '.STATE.nginx.machine_location_count' "$plan")"
          nginx_basic="$(jq -r '.STATE.nginx.auth_basic_off' "$plan")"
          auth_forward="$(jq -r '.STATE.nginx.authorization_forwarded' "$plan")"
          token_state="$(jq -r '.STATE.token_file.state' "$plan")"
          legacy_presence="$(jq -r '.STATE.legacy_failed_staging.presence' "$plan")"
          legacy_access="$(jq -r '.STATE.legacy_failed_staging.access' "$plan")"
          legacy_type="$(jq -r '.STATE.legacy_failed_staging.type' "$plan")"
          legacy_owner="$(jq -r '.STATE.legacy_failed_staging.owner' "$plan")"
          legacy_mode="$(jq -r '.STATE.legacy_failed_staging.mode' "$plan")"
          no_auth="$(jq -r '.STATE.http.no_auth.status + "/" + .STATE.http.no_auth.body_kind' "$plan")"
          fake="$(jq -r '.STATE.http.fake_bearer.status + "/" + .STATE.http.fake_bearer.body_kind' "$plan")"
          body="$(cat <<EOF_BODY
          #1218 PREPROD cockpit transport PLAN completed.

          \`MODE=PLAN\`
          \`RUN=${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}\`
          \`MAIN_SHA=${MAIN_SHA}\`
          \`PLAN_ID=${PLAN_ID}\`
          \`PLAN_DIGEST=${PLAN_DIGEST}\`
          \`CURRENT_RELEASE=${release}\`
          \`SETTINGS_TOKEN_READER=${settings_reader}\`
          \`NGINX_MACHINE_LOCATION_COUNT=${nginx_count}\`
          \`NGINX_AUTH_BASIC_OFF=${nginx_basic}\`
          \`NGINX_AUTHORIZATION_FORWARDED=${auth_forward}\`
          \`TOKEN_FILE_STATE=${token_state}\`
          \`LEGACY_FAILED_STAGE_PRESENCE=${legacy_presence}\`
          \`LEGACY_FAILED_STAGE_ACCESS=${legacy_access}\`
          \`LEGACY_FAILED_STAGE_TYPE=${legacy_type}\`
          \`LEGACY_FAILED_STAGE_OWNER=${legacy_owner}\`
          \`LEGACY_FAILED_STAGE_MODE=${legacy_mode}\`
          \`NO_AUTH=${no_auth}\`
          \`FAKE_BEARER=${fake}\`
          \`PREPROD_MUTATION=NONE\`
          \`PROD_ACCESS=NONE\`

          APPLY is not implemented or authorized by this PLAN tranche. Review the immutable artifact before the bounded APPLY tranche is added.
          EOF_BODY
          )"
          gh issue comment 1218 --body "$body"

      - name: Remove transient PLAN identities
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/agency-1218-plan.key" "$RUNNER_TEMP/agency-1218-plan-root.key"
