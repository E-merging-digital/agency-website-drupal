name: Governed PREPROD isolated staging import

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: agency-preprod-isolated-staging-import
  cancel-in-progress: false

jobs:
  validate-authority:
    name: Validate fresh owner staging import authority
    if: >-
      ${{
        github.event.issue.pull_request == null &&
        github.event.issue.number == 834 &&
        startsWith(github.event.comment.body, '/agency-preprod-staging-import ')
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    outputs:
      mode: ${{ steps.authority.outputs.mode }}
      request_id: ${{ steps.authority.outputs.request_id }}
      main_sha: ${{ steps.authority.outputs.main_sha }}
      prod_release_sha: ${{ steps.authority.outputs.prod_release_sha }}
      operation_profile: ${{ steps.authority.outputs.operation_profile }}
      profile_sha256: ${{ steps.profile.outputs.profile_sha256 }}
    steps:
      - name: Validate actor, one-shot request and exact live main
        id: authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRIGGER_COMMENT: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          EVENT_DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'E-merging-digital' ]]
          [[ "$COMMENT_AUTHOR" == "$GITHUB_ACTOR" ]]
          [[ "$ISSUE_NUMBER" == '834' ]]
          [[ "$GITHUB_RUN_ATTEMPT" == '1' ]] || {
            echo 'Staging import authority cannot be replayed through workflow rerun.' >&2
            exit 1
          }

          read -r command mode request_id requested_main requested_prod profile extra <<< "$TRIGGER_COMMENT"
          [[ -z "${extra:-}" ]]
          [[ "$command" == '/agency-preprod-staging-import' ]]
          [[ "$mode" == 'plan' || "$mode" == 'apply' ]]
          [[ "$request_id" =~ ^[A-Za-z0-9._-]{8,80}$ ]]
          [[ "$requested_main" =~ ^[0-9a-f]{40}$ ]]
          [[ "$requested_prod" =~ ^[0-9a-f]{40}$ ]]
          [[ "$profile" == 'agency-preprod-isolated-staging-import-v1' ]]
          expected="/agency-preprod-staging-import $mode $request_id $requested_main $requested_prod $profile"
          [[ "$TRIGGER_COMMENT" == "$expected" ]]

          issue_json="$(gh api "repos/$GITHUB_REPOSITORY/issues/834")"
          [[ "$(jq -r '.state' <<< "$issue_json")" == 'open' ]]
          [[ "$(jq -r '.user.login' <<< "$issue_json")" == 'E-merging-digital' ]]
          live_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$requested_main" == "$live_main" ]]
          [[ "$EVENT_DEFAULT_SHA" == "$live_main" ]]

          comments="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/834/comments?per_page=100" --jq '.[].body')"
          request_prefix="/agency-preprod-staging-import $mode $request_id "
          count=0
          while IFS= read -r body; do
            [[ "$body" == "$request_prefix"* ]] && count=$((count + 1)) || true
          done <<< "$comments"
          [[ "$count" -eq 1 ]] || {
            echo 'request_id must be fresh and occur in exactly one matching owner authority comment.' >&2
            exit 1
          }

          [[ "$request_id" != 'snapshot-826-f936b72b-r2' ]]
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "main_sha=$live_main" >> "$GITHUB_OUTPUT"
          echo "prod_release_sha=$requested_prod" >> "$GITHUB_OUTPUT"
          echo "operation_profile=$profile" >> "$GITHUB_OUTPUT"

      - name: Checkout exact trusted main tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.authority.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact repository-owned operation profile
        id: profile
        shell: bash
        env:
          EXPECTED_PROFILE: ${{ steps.authority.outputs.operation_profile }}
        run: |
          set -euo pipefail
          profile='scripts/preproduction-staging-import/profile.json'
          jq -e --arg id "$EXPECTED_PROFILE" '.profile_id == $id and .issue_number == 834' "$profile" >/dev/null
          digest="$(sha256sum "$profile" | awk '{print $1}')"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          echo "profile_sha256=$digest" >> "$GITHUB_OUTPUT"

  plan:
    name: Prove mutation-free staging import PLAN
    needs: validate-authority
    if: ${{ needs.validate-authority.outputs.mode == 'plan' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout exact trusted main tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-authority.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Execute PLAN without PROD or PREPROD access
        env:
          REQUEST_ID: ${{ needs.validate-authority.outputs.request_id }}
          REPOSITORY_SHA: ${{ needs.validate-authority.outputs.main_sha }}
          SOURCE_PROD_RELEASE_SHA: ${{ needs.validate-authority.outputs.prod_release_sha }}
          OPERATION_PROFILE: ${{ needs.validate-authority.outputs.operation_profile }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/preproduction-staging-import/run-proof.sh PLAN
          evidence='artifacts/preprod-staging-import/evidence.env'
          grep -Fxq 'plan_result=PASS' "$evidence"
          grep -Fxq 'apply_readiness=BLOCKED_PREPROD_PINNED_TRUST' "$evidence"
          grep -Fxq 'github_hosted_raw_path=NONE' "$evidence"
          grep -Fxq 'raw_github_artifact_path=NONE' "$evidence"
          grep -Fxq 'sanitization_path=NONE' "$evidence"
          grep -Fxq 'activation_path=NONE' "$evidence"

      - name: Upload metadata-only PLAN evidence
        uses: actions/upload-artifact@v4
        with:
          name: agency-preprod-staging-plan-${{ needs.validate-authority.outputs.request_id }}-${{ github.run_id }}
          path: artifacts/preprod-staging-import/evidence.env
          if-no-files-found: error
          retention-days: 14

  apply:
    name: Future bounded snapshot transfer and isolated staging import
    needs: validate-authority
    if: ${{ needs.validate-authority.outputs.mode == 'apply' }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - agency
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout exact trusted main tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-authority.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fail closed until PREPROD out-of-band host trust is pinned
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_NAME" == 'agency-browser-runner-01' ]]
          jq -e '.preprod_trust.current_state == "PINNED"' scripts/preproduction-staging-import/profile.json >/dev/null || {
            echo 'PREPROD pinned host identity is absent. Real #834 APPLY is blocked before any PROD DB read or PREPROD mutation.' >&2
            exit 1
          }

      - name: Configure transient PROD and PREPROD SSH credentials
        env:
          PROD_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          PREPROD_PRIVATE_KEY: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROD_PRIVATE_KEY"
          test -n "$PREPROD_PRIVATE_KEY"
          prod_key="$RUNNER_TEMP/agency-834-prod-${GITHUB_RUN_ID}.key"
          preprod_key="$RUNNER_TEMP/agency-834-preprod-${GITHUB_RUN_ID}.key"
          printf '%s\n' "$PROD_PRIVATE_KEY" > "$prod_key"
          printf '%s\n' "$PREPROD_PRIVATE_KEY" > "$preprod_key"
          chmod 600 "$prod_key" "$preprod_key"
          echo "AGENCY_834_PROD_SSH_KEY=$prod_key" >> "$GITHUB_ENV"
          echo "AGENCY_834_PREPROD_SSH_KEY=$preprod_key" >> "$GITHUB_ENV"

      - name: Execute fixed repository-owned APPLY operation
        env:
          REQUEST_ID: ${{ needs.validate-authority.outputs.request_id }}
          REPOSITORY_SHA: ${{ needs.validate-authority.outputs.main_sha }}
          SOURCE_PROD_RELEASE_SHA: ${{ needs.validate-authority.outputs.prod_release_sha }}
          OPERATION_PROFILE: ${{ needs.validate-authority.outputs.operation_profile }}
          PROD_SSH_HOST: ${{ secrets.SERVER_HOST }}
          PROD_SSH_USER: ${{ secrets.SERVER_USER }}
          PREPROD_SSH_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
          PREPROD_SSH_USER: ${{ secrets.PREPROD_SERVER_USER }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AGENCY_834_PROD_SSH_KEY:-}"
          test -n "${AGENCY_834_PREPROD_SSH_KEY:-}"
          export PROD_SSH_KEY="$AGENCY_834_PROD_SSH_KEY"
          export PREPROD_SSH_KEY="$AGENCY_834_PREPROD_SSH_KEY"
          bash scripts/preproduction-staging-import/run-apply.sh

      - name: Remove transient SSH credentials
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          for key in "${AGENCY_834_PROD_SSH_KEY:-}" "${AGENCY_834_PREPROD_SSH_KEY:-}"; do
            [[ -z "$key" ]] || rm -f -- "$key"
            [[ -z "$key" ]] || test ! -e "$key"
          done

      - name: Validate fixed-key metadata evidence only
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          evidence='artifacts/preprod-staging-import/evidence.env'
          test -f "$evidence"
          expected="$(jq -r '.evidence.allowlist[]' scripts/preproduction-staging-import/profile.json | sort)"
          actual="$(cut -d= -f1 "$evidence" | sort)"
          test "$expected" = "$actual"
          grep -Fxq 'prod_write_path=NONE' "$evidence"
          grep -Fxq 'github_hosted_raw_path=NONE' "$evidence"
          grep -Fxq 'raw_github_artifact_path=NONE' "$evidence"
          grep -Fxq 'raw_snapshot_present_after_cleanup=NO' "$evidence"
          grep -Fxq 'staging_db_present_after_cleanup=NO' "$evidence"
          grep -Fxq 'sanitization_path=NONE' "$evidence"
          grep -Fxq 'activation_path=NONE' "$evidence"

      - name: Upload metadata-only staging evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agency-preprod-staging-import-${{ needs.validate-authority.outputs.request_id }}-${{ github.run_id }}
          path: artifacts/preprod-staging-import/evidence.env
          if-no-files-found: error
          retention-days: 14
