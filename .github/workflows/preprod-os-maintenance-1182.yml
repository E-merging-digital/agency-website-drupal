name: '#1182 governed PREPROD OS maintenance'

on:
  workflow_call:
    secrets:
      PREPROD_SSH_PRIVATE_KEY:
        required: false
      PREPROD_PROVISIONING_SSH_PRIVATE_KEY:
        required: false
      PREPROD_SERVER_HOST:
        required: true

concurrency:
  group: agency-preprod-os-maintenance-1182
  cancel-in-progress: false

jobs:
  validate-authority:
    name: Validate exact #1182 PLAN/APPLY authority
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: read
    outputs:
      mode: ${{ steps.authority.outputs.mode }}
      main_sha: ${{ steps.authority.outputs.main_sha }}
      plan_id: ${{ steps.authority.outputs.plan_id }}
      plan_run: ${{ steps.authority.outputs.plan_run }}
      plan_digest: ${{ steps.authority.outputs.plan_digest }}
      snapshot_ref: ${{ steps.authority.outputs.snapshot_ref }}
    steps:
      - id: authority
        name: JIT validate direct owner command and live main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_LOGIN: ${{ github.event.comment.user.login }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_VIA_APP: ${{ github.event.comment.performed_via_github_app != null }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = 'issue_comment'
          test "$EVENT_ACTION" = 'created'
          test "$ISSUE_NUMBER" = '1182'
          test "$IS_PULL_REQUEST" = 'false'
          test "$COMMENT_LOGIN" = 'E-merging-digital'
          test "$COMMENT_ASSOCIATION" = 'OWNER'
          test "$COMMENT_VIA_APP" = 'false'

          issue_json="$(gh api "repos/$GITHUB_REPOSITORY/issues/1182")"
          test "$(jq -r '.state' <<<"$issue_json")" = 'open'
          jq -e '[.labels[].name] | index("P1") != null' <<<"$issue_json" >/dev/null
          jq -e '[.labels[].name] | index("status:in-progress") != null' <<<"$issue_json" >/dev/null

          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_SHA" = "$main_sha"

          mode=''
          plan_run=''
          plan_digest=''
          snapshot_ref=''
          if [[ "$COMMENT_BODY" == '/agency-preprod-os-maintenance-1182 plan' ]]; then
            mode='PLAN'
          elif [[ "$COMMENT_BODY" =~ ^/agency-preprod-os-maintenance-1182\ apply\ plan_run=([1-9][0-9]*)\ plan_digest=([0-9a-f]{64})\ snapshot_ref=([A-Za-z0-9._:@/-]{8,160})$ ]]; then
            mode='APPLY'
            plan_run="${BASH_REMATCH[1]}"
            plan_digest="${BASH_REMATCH[2]}"
            snapshot_ref="${BASH_REMATCH[3]}"
          else
            printf '%s\n' 'Unsupported #1182 command syntax.' >&2
            exit 64
          fi

          plan_id="plan-1182-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "mode=$mode"
            echo "main_sha=$main_sha"
            echo "plan_id=$plan_id"
            echo "plan_run=$plan_run"
            echo "plan_digest=$plan_digest"
            echo "snapshot_ref=$snapshot_ref"
          } >> "$GITHUB_OUTPUT"

  plan:
    name: Build fresh bounded PREPROD maintenance PLAN
    if: ${{ needs.validate-authority.outputs.mode == 'PLAN' }}
    needs: validate-authority
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout exact live main
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-authority.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize pinned PREPROD read-only identity and trust
        shell: bash
        env:
          PREPROD_SSH_PRIVATE_KEY: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}
          PREPROD_SERVER_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
        run: |
          set -euo pipefail
          test -n "$PREPROD_SSH_PRIVATE_KEY"
          test -n "$PREPROD_SERVER_HOST"
          printf '%s\n' "$PREPROD_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/agency-1182-plan.key"
          chmod 600 "$RUNNER_TEMP/agency-1182-plan.key"
          PREPROD_SERVER_HOST="$PREPROD_SERVER_HOST" \
            bash scripts/preproduction-ssh-trust/manage-known-host.sh PROVISION >/dev/null

      - id: plan_result
        name: Run read-only PLAN on PREPROD
        shell: bash
        env:
          PREPROD_SERVER_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
          MAIN_SHA: ${{ needs.validate-authority.outputs.main_sha }}
          PLAN_ID: ${{ needs.validate-authority.outputs.plan_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/preprod-os-maintenance-1182
          ssh_args=(
            -i "$RUNNER_TEMP/agency-1182-plan.key"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=15
          )
          ssh "${ssh_args[@]}" "agency-preprod@$PREPROD_SERVER_HOST" \
            "bash -s -- '$MAIN_SHA' '$PLAN_ID'" \
            < scripts/preproduction-maintenance-1182/remote-plan.sh \
            > artifacts/preprod-os-maintenance-1182/plan.json
          jq -e \
            --arg main "$MAIN_SHA" \
            --arg plan_id "$PLAN_ID" '
            .STATUS == "PASS"
            and .ISSUE == 1182
            and .TARGET == "PREPROD"
            and .MODE == "PLAN"
            and .MAIN_SHA == $main
            and .PLAN_ID == $plan_id
            and (.PLAN_DIGEST | test("^[0-9a-f]{64}$"))
            and .SAFETY_GATE == "PASS"' \
            artifacts/preprod-os-maintenance-1182/plan.json >/dev/null
          echo "digest=$(jq -r '.PLAN_DIGEST' artifacts/preprod-os-maintenance-1182/plan.json)" >> "$GITHUB_OUTPUT"

      - name: Upload immutable PLAN evidence
        uses: actions/upload-artifact@v4
        with:
          name: preprod-os-maintenance-1182-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/preprod-os-maintenance-1182/plan.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish bounded PLAN summary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_ID: ${{ needs.validate-authority.outputs.plan_id }}
          PLAN_DIGEST: ${{ steps.plan_result.outputs.digest }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF_BODY
          #1182 PREPROD OS maintenance PLAN completed.

          \`MODE=PLAN\`
          \`RUN=${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}\`
          \`PLAN_ID=${PLAN_ID}\`
          \`PLAN_DIGEST=${PLAN_DIGEST}\`
          \`TARGET=PREPROD\`
          \`REAL_PREPROD_PACKAGE_MUTATION=NONE\`
          \`REAL_PREPROD_REBOOT=NONE\`

          APPLY remains separately authorized. Review the immutable PLAN artifact before posting an APPLY command.
          EOF_BODY
          )"
          gh issue comment 1182 --body "$body"

      - name: Remove transient PLAN key
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/agency-1182-plan.key"

  apply:
    name: Apply exact approved PREPROD maintenance plan
    if: ${{ needs.validate-authority.outputs.mode == 'APPLY' }}
    needs: validate-authority
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout exact live main
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-authority.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Load and validate immutable approved PLAN
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN: ${{ needs.validate-authority.outputs.plan_run }}
          PLAN_DIGEST: ${{ needs.validate-authority.outputs.plan_digest }}
          MAIN_SHA: ${{ needs.validate-authority.outputs.main_sha }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/preprod-os-maintenance-1182/approved
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN")"
          test "$(jq -r '.conclusion' <<<"$run_json")" = 'success'
          test "$(jq -r '.event' <<<"$run_json")" = 'issue_comment'
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$MAIN_SHA"
          mapfile -t artifacts < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN/artifacts" \
              --jq ".artifacts[] | select(.expired == false) | select(.name | startswith(\"preprod-os-maintenance-1182-plan-${PLAN_RUN}-\")) | .name"
          )
          test "${#artifacts[@]}" -eq 1
          gh run download "$PLAN_RUN" --name "${artifacts[0]}" \
            --dir artifacts/preprod-os-maintenance-1182/approved
          plan='artifacts/preprod-os-maintenance-1182/approved/plan.json'
          test -s "$plan"
          jq -e \
            --arg main "$MAIN_SHA" \
            --arg digest "$PLAN_DIGEST" '
            .STATUS == "PASS"
            and .ISSUE == 1182
            and .TARGET == "PREPROD"
            and .MODE == "PLAN"
            and .MAIN_SHA == $main
            and .PLAN_DIGEST == $digest
            and .SAFETY_GATE == "PASS"' "$plan" >/dev/null

      - name: Materialize pinned PREPROD root identity and trust
        shell: bash
        env:
          PREPROD_ROOT_KEY: ${{ secrets.PREPROD_PROVISIONING_SSH_PRIVATE_KEY }}
          PREPROD_SERVER_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
        run: |
          set -euo pipefail
          test -n "$PREPROD_ROOT_KEY"
          test -n "$PREPROD_SERVER_HOST"
          printf '%s\n' "$PREPROD_ROOT_KEY" > "$RUNNER_TEMP/agency-1182-root.key"
          chmod 600 "$RUNNER_TEMP/agency-1182-root.key"
          PREPROD_SERVER_HOST="$PREPROD_SERVER_HOST" \
            bash scripts/preproduction-ssh-trust/manage-known-host.sh PROVISION >/dev/null

      - name: Execute exact stale-checked APPLY and reconcile reboot
        shell: bash
        env:
          PREPROD_SERVER_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
          MAIN_SHA: ${{ needs.validate-authority.outputs.main_sha }}
          PLAN_DIGEST: ${{ needs.validate-authority.outputs.plan_digest }}
          SNAPSHOT_REF: ${{ needs.validate-authority.outputs.snapshot_ref }}
        run: |
          set -euo pipefail
          root_ssh=(
            ssh
            -i "$RUNNER_TEMP/agency-1182-root.key"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=15
          )
          root_scp=(
            scp -q
            -i "$RUNNER_TEMP/agency-1182-root.key"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )
          remote_dir="/root/agency-1182-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          plan='artifacts/preprod-os-maintenance-1182/approved/plan.json'
          mkdir -p artifacts/preprod-os-maintenance-1182/apply

          "${root_ssh[@]}" "root@$PREPROD_SERVER_HOST" \
            "umask 077; rm -rf -- '$remote_dir'; install -d -m 700 '$remote_dir'"
          "${root_scp[@]}" \
            scripts/preproduction-maintenance-1182/remote-plan.sh \
            scripts/preproduction-maintenance-1182/remote-apply-root.sh \
            "$plan" \
            "root@$PREPROD_SERVER_HOST:$remote_dir/"

          set +e
          "${root_ssh[@]}" "root@$PREPROD_SERVER_HOST" \
            "chmod 700 '$remote_dir/remote-plan.sh' '$remote_dir/remote-apply-root.sh'; '$remote_dir/remote-apply-root.sh' '$remote_dir/plan.json' '$PLAN_DIGEST' '$SNAPSHOT_REF'" \
            > artifacts/preprod-os-maintenance-1182/apply/pre-reboot.json \
            2> artifacts/preprod-os-maintenance-1182/apply/pre-reboot.stderr
          apply_rc=$?
          set -e

          pre='artifacts/preprod-os-maintenance-1182/apply/pre-reboot.json'
          test -s "$pre"
          jq -e \
            --arg main "$MAIN_SHA" \
            --arg digest "$PLAN_DIGEST" \
            --arg snapshot "$SNAPSHOT_REF" '
            .STATUS == "PASS"
            and .ISSUE == 1182
            and .TARGET == "PREPROD"
            and .MODE == "APPLY"
            and .MAIN_SHA == $main
            and .PLAN_DIGEST == $digest
            and .STALE_PLAN == "PASS"
            and .PACKAGE_APPLY_SUCCESS == "YES"
            and .PROVIDER_SNAPSHOT_REF == $snapshot
            and .PROVIDER_SNAPSHOT_AUTOMATED_VERIFICATION == "UNAVAILABLE"
            and .KEEP_PREVIOUS_KERNEL == "YES"
            and .DRUPAL_DEPLOY == "NONE"
            and .DRUPAL_CONFIG_IMPORT == "NONE"
            and .PROD_ACCESS == "NONE"' "$pre" >/dev/null

          reboot_initiated="$(jq -r '.REBOOT_INITIATED' "$pre")"
          if [[ "$reboot_initiated" == 'YES' ]]; then
            [[ "$apply_rc" -eq 0 || "$apply_rc" -eq 255 ]]
            saw_down=0
            for _ in $(seq 1 30); do
              if ! "${root_ssh[@]}" "root@$PREPROD_SERVER_HOST" true >/dev/null 2>&1; then
                saw_down=1
                break
              fi
              sleep 2
            done
            test "$saw_down" -eq 1
            reachable=0
            for _ in $(seq 1 60); do
              if "${root_ssh[@]}" "root@$PREPROD_SERVER_HOST" true >/dev/null 2>&1; then
                reachable=1
                break
              fi
              sleep 5
            done
            test "$reachable" -eq 1
          else
            test "$apply_rc" -eq 0
          fi

          plan_id="$(jq -r '.PLAN_ID' "$plan")"
          "${root_ssh[@]}" "root@$PREPROD_SERVER_HOST" \
            "bash -s -- '$MAIN_SHA' '$plan_id'" \
            < scripts/preproduction-maintenance-1182/remote-plan.sh \
            > artifacts/preprod-os-maintenance-1182/apply/post.json

          python3 - "$plan" artifacts/preprod-os-maintenance-1182/apply/post.json \
            artifacts/preprod-os-maintenance-1182/apply/result.json <<'PY'
          import json
          import sys
          from pathlib import Path

          approved = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          post = json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          target_kernel = '6.8.0-139-generic'
          required = {
              'status': post.get('STATUS') == 'PASS',
              'os': post.get('VERSION_ID') == '24.04',
              'kernel_running': post.get('KERNEL_RUNNING') == target_kernel,
              'kernel_latest': post.get('KERNEL_INSTALLED_LATEST') == target_kernel,
              'reboot_required': post.get('REBOOT_REQUIRED') == 'NO',
              'failed_units': post.get('FAILED_SYSTEMD_UNITS') == [],
              'nginx': post.get('NGINX_SERVICE') == 'ACTIVE',
              'php': post.get('PHP_FPM_SERVICE') == 'ACTIVE',
              'mariadb': post.get('MARIADB_SERVICE') == 'ACTIVE',
              'drupal': post.get('DRUPAL_HEALTH') == 'PASS',
              'public': post.get('PUBLIC_HEALTH') == 'PASS',
              'php_branch': post.get('PHP_BRANCH') == '8.4',
              'mariadb_branch': post.get('MARIADB_BRANCH') == '11.8',
          }
          planned = {item['name'] for item in approved.get('PACKAGE_UPGRADES', [])}
          remaining = {item['name'] for item in post.get('UPGRADABLE_PACKAGES', [])}
          required['approved_packages_converged'] = not (planned & remaining)
          failed = sorted(name for name, ok in required.items() if not ok)
          if failed:
              raise SystemExit('Post-reboot validation failed: ' + ','.join(failed))
          new_updates = sorted(remaining - planned)
          result = {
              'STATUS': 'PASS',
              'ISSUE': 1182,
              'TARGET': 'PREPROD',
              'MODE': 'APPLY',
              'MAIN_SHA': approved['MAIN_SHA'],
              'PLAN_ID': approved['PLAN_ID'],
              'PLAN_DIGEST': approved['PLAN_DIGEST'],
              'PACKAGE_APPLY_SUCCESS': 'YES',
              'REBOOT_RECONCILIATION': 'PASS',
              'HOST_REACHABLE_AFTER_REBOOT': 'YES',
              'POST_REBOOT_VALIDATION': 'PASS',
              'KERNEL_RUNNING': post['KERNEL_RUNNING'],
              'KERNEL_INSTALLED_LATEST': post['KERNEL_INSTALLED_LATEST'],
              'REBOOT_REQUIRED': post['REBOOT_REQUIRED'],
              'SECURITY_UPDATES_TOTAL': post['SECURITY_UPDATES_TOTAL'],
              'NEW_UPDATES_AFTER_PLAN': new_updates,
              'FAILED_SYSTEMD_UNITS': post['FAILED_SYSTEMD_UNITS'],
              'NGINX_SERVICE': post['NGINX_SERVICE'],
              'PHP_FPM_SERVICE': post['PHP_FPM_SERVICE'],
              'MARIADB_SERVICE': post['MARIADB_SERVICE'],
              'DRUPAL_HEALTH': post['DRUPAL_HEALTH'],
              'PUBLIC_HEALTH': post['PUBLIC_HEALTH'],
              'PROD_ACCESS': 'NONE',
          }
          Path(sys.argv[3]).write_text(json.dumps(result, sort_keys=True, separators=(',', ':')) + '\n', encoding='utf-8')
          PY

          "${root_ssh[@]}" "root@$PREPROD_SERVER_HOST" "rm -rf -- '$remote_dir'" >/dev/null

      - name: Upload bounded APPLY evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: preprod-os-maintenance-1182-apply-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/preprod-os-maintenance-1182
          if-no-files-found: error
          retention-days: 30

      - name: Publish bounded APPLY summary
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result='artifacts/preprod-os-maintenance-1182/apply/result.json'
          new_updates="$(jq -c '.NEW_UPDATES_AFTER_PLAN' "$result")"
          security="$(jq -r '.SECURITY_UPDATES_TOTAL' "$result")"
          body="$(cat <<EOF_BODY
          #1182 PREPROD OS maintenance APPLY completed.

          \`STATUS=PASS\`
          \`RUN=${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}\`
          \`KERNEL_RUNNING=$(jq -r '.KERNEL_RUNNING' "$result")\`
          \`REBOOT_REQUIRED=$(jq -r '.REBOOT_REQUIRED' "$result")\`
          \`SECURITY_UPDATES_TOTAL=${security}\`
          \`NEW_UPDATES_AFTER_PLAN=${new_updates}\`
          \`POST_REBOOT_VALIDATION=PASS\`
          \`PROD_ACCESS=NONE\`
          EOF_BODY
          )"
          gh issue comment 1182 --body "$body"

      - name: Remove transient APPLY key
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/agency-1182-root.key"
