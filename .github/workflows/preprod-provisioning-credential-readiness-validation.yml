name: Validate #853 PREPROD provisioning credential readiness guard

on:
  pull_request:
    paths:
      - '.github/workflows/preprod-capability-provisioning.yml'
      - '.github/workflows/preprod-provisioning-credential-readiness-validation.yml'
      - 'scripts/preproduction-staging-import/provisioning/check-provisioning-credential-ready.sh'

permissions:
  contents: read

jobs:
  credential-readiness-governance:
    name: Prove #853 PLAN fail-close without private-key exposure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prove missing provisioning credential fails closed
        shell: bash
        run: |
          set -euo pipefail
          guard='scripts/preproduction-staging-import/provisioning/check-provisioning-credential-ready.sh'
          bash -n "$guard"
          stdout="$(mktemp)"
          stderr="$(mktemp)"
          trap 'rm -f "$stdout" "$stderr"' EXIT
          set +e
          env -u PREPROD_PROVISIONING_SSH_PRIVATE_KEY bash "$guard" >"$stdout" 2>"$stderr"
          rc=$?
          set -e
          test "$rc" -eq 78
          test ! -s "$stdout"
          grep -Fxq 'Provisioning PLAN fail closed: PREPROD_PROVISIONING_SSH_PRIVATE_KEY is absent or empty.' "$stderr"

      - name: Prove empty provisioning credential fails closed
        shell: bash
        run: |
          set -euo pipefail
          guard='scripts/preproduction-staging-import/provisioning/check-provisioning-credential-ready.sh'
          stdout="$(mktemp)"
          stderr="$(mktemp)"
          trap 'rm -f "$stdout" "$stderr"' EXIT
          set +e
          PREPROD_PROVISIONING_SSH_PRIVATE_KEY='' bash "$guard" >"$stdout" 2>"$stderr"
          rc=$?
          set -e
          test "$rc" -eq 78
          test ! -s "$stdout"
          grep -Fxq 'Provisioning PLAN fail closed: PREPROD_PROVISIONING_SSH_PRIVATE_KEY is absent or empty.' "$stderr"

      - name: Prove present credential emits bounded metadata only
        shell: bash
        run: |
          set -euo pipefail
          guard='scripts/preproduction-staging-import/provisioning/check-provisioning-credential-ready.sh'
          sentinel='DO-NOT-LEAK-853-PRIVATE-KEY-SENTINEL'
          stdout="$(mktemp)"
          stderr="$(mktemp)"
          trap 'rm -f "$stdout" "$stderr"' EXIT
          PREPROD_PROVISIONING_SSH_PRIVATE_KEY="$sentinel" bash "$guard" >"$stdout" 2>"$stderr"
          grep -Fxq 'provisioning_credential_ready=PASS' "$stdout"
          test "$(wc -l < "$stdout")" -eq 1
          test ! -s "$stderr"
          ! grep -Fq "$sentinel" "$stdout"
          ! grep -Fq "$sentinel" "$stderr"

      - name: Prove guard performs presence test only
        shell: bash
        run: |
          set -euo pipefail
          guard='scripts/preproduction-staging-import/provisioning/check-provisioning-credential-ready.sh'
          grep -Fq '[[ -z "${PREPROD_PROVISIONING_SSH_PRIVATE_KEY:-}" ]]' "$guard"
          for forbidden in ssh-keygen sha256sum sha1sum md5sum openssl base64 xxd hexdump sftp scp 'ssh ' python perl ruby node jq awk sed 'tee ' 'cat '; do
            ! grep -Fq "$forbidden" "$guard"
          done
          ! grep -Eq 'PREPROD_PROVISIONING_SSH_PRIVATE_KEY[^]]*=' "$guard"
          ! grep -Eq '(echo|printf).*\$\{?PREPROD_PROVISIONING_SSH_PRIVATE_KEY' "$guard"
          grep -Fxq "printf '%s\\n' 'provisioning_credential_ready=PASS'" "$guard"

      - name: Prove PLAN binds only dedicated credential and no fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/preprod-capability-provisioning.yml').read_text(encoding='utf-8')
          plan = workflow.split('\n  plan:\n', 1)[1].split('\n  apply:\n', 1)[0]
          guard_name = 'Require dedicated provisioning credential readiness'
          deploy_name = 'Configure transient PREPROD deploy SSH identity'
          execute_name = 'Execute fixed mutation-free PLAN'
          assert plan.index(guard_name) < plan.index(deploy_name) < plan.index(execute_name)
          assert plan.count('secrets.PREPROD_PROVISIONING_SSH_PRIVATE_KEY') == 1
          readiness = plan.split(guard_name, 1)[1].split(deploy_name, 1)[0]
          assert 'PREPROD_PROVISIONING_SSH_PRIVATE_KEY: ${{ secrets.PREPROD_PROVISIONING_SSH_PRIVATE_KEY }}' in readiness
          assert 'PREPROD_SSH_PRIVATE_KEY' not in readiness
          assert 'PREPROD_PROVISIONING_SSH_KEY' not in plan
          assert 'AGENCY_851_PROVISIONING_SSH_KEY' not in plan
          assert 'ROOT_USER' not in plan
          assert 'run-apply.sh' not in plan
          assert 'provisioning_credential_ready=PASS' in plan
          assert 'PREPROD_SUDO_PASSWORD' not in workflow
          assert 'SUDO_PASSWORD' not in workflow
          PY

      - name: Prove repository-only delivery boundary
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            'PLAN_CREDENTIAL_READINESS_GUARD=PASS' \
            'PRIVATE_KEY_EXPOSURE=NONE' \
            'PLAN_ROOT_SSH=NONE' \
            'PLAN_MUTATION=NONE' \
            'FALLBACK_DEPLOY_KEY=NONE' \
            'REAL_PREPROD_PROVISIONING=NOT_PERFORMED' \
            'PROD_ACCESS=NONE' \
            'ISSUE_851_APPLY=NOT_PERFORMED' \
            'ISSUE_834=NOT_PERFORMED'
