name: "#980 PROD config sync runtime diagnostic"

on:
  workflow_call:
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      SERVER_HOST:
        required: true
      SERVER_USER:
        required: true
  pull_request:
    paths:
      - '.github/workflows/prod-config-sync-runtime-diagnostic.yml'
      - '.github/workflows/agency-command-dispatch.yml'
      - 'scripts/runner/run-prod-config-sync-runtime-diagnostic-980.sh'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/AgencyCommandDispatchWorkflowTest.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/ProdConfigSyncRuntimeDiagnostic980WorkflowTest.php'

permissions:
  contents: read

jobs:
  static-validation:
    name: "#980 static read-only PROD config sync diagnostic contract"
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate bounded diagnostic shell and workflow
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/runner/run-prod-config-sync-runtime-diagnostic-980.sh
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.7 -color \
            .github/workflows/prod-config-sync-runtime-diagnostic.yml
          git diff --check "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Install exact locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prove #980 PROD and #961 PREPROD read-only contracts
        run: >-
          vendor/bin/phpunit -c web/core/phpunit.xml.dist
          web/modules/custom/agency_project_tests/tests/src/Unit/ProdConfigSyncRuntimeDiagnostic980WorkflowTest.php
          web/modules/custom/agency_project_tests/tests/src/Unit/ConfigSyncRuntimeDiagnostic961WorkflowTest.php

  diagnose:
    name: Read-only PROD config sync runtime diagnosis
    if: >-
      ${{
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        github.event.issue.number == 980 &&
        github.event.comment.body == '/agency-config-sync-prod-runtime diagnose'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    concurrency:
      group: agency-config-sync-prod-runtime-diagnostic-980
      cancel-in-progress: false

    steps:
      - name: Validate owner, issue, command and live main
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRIGGER_COMMENT: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          EVENT_DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'E-merging-digital' ]]
          [[ "$COMMENT_AUTHOR" == "$GITHUB_ACTOR" ]]
          [[ "$ISSUE_NUMBER" == '980' ]]
          [[ "$TRIGGER_COMMENT" == '/agency-config-sync-prod-runtime diagnose' ]]

          issue_json="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER")"
          [[ "$(jq -r '.state' <<<"$issue_json")" == 'open' ]]
          [[ "$(jq -r '.pull_request // empty' <<<"$issue_json")" == '' ]]
          [[ "$(jq -r '.user.login' <<<"$issue_json")" == 'E-merging-digital' ]]

          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVENT_DEFAULT_SHA" == "$main_sha" ]] || {
            echo '#980 diagnostic must execute the workflow revision currently on live main.' >&2
            exit 1
          }
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact trusted main
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.request.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable read-only implementation
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ steps.request.outputs.main_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN_SHA" ]]
          bash -n scripts/runner/run-prod-config-sync-runtime-diagnostic-980.sh
          bash -n scripts/production-ssh-trust/manage-known-host.sh

      - name: JIT revalidate live main before PROD identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: ${{ steps.request.outputs.main_sha }}
        run: |
          set -euo pipefail
          live="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$live" == "$EXPECTED_MAIN" ]]
          [[ "$(git rev-parse HEAD)" == "$live" ]]

      - name: Materialize transient PROD identity after JIT
        env:
          PROD_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROD_KEY"
          printf '%s\n' "$PROD_KEY" > "$RUNNER_TEMP/agency-980-prod.key"
          chmod 600 "$RUNNER_TEMP/agency-980-prod.key"

      - name: Execute bounded read-only PROD diagnosis
        id: route
        shell: bash
        env:
          ISSUE_NUMBER: '980'
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          PROD_SSH_KEY: ${{ runner.temp }}/agency-980-prod.key
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts/prod-config-sync-runtime-diagnostic
        run: bash scripts/runner/run-prod-config-sync-runtime-diagnostic-980.sh

      - name: Cleanup PROD identity
        if: ${{ always() }}
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/agency-980-prod.key"

      - name: Upload metadata-only diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agency-config-sync-prod-runtime-980-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/prod-config-sync-runtime-diagnostic/result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish bounded diagnostic result
        if: ${{ always() && steps.request.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROUTE_OUTCOME: ${{ steps.route.outcome }}
          TRUSTED_MAIN: ${{ steps.request.outputs.main_sha }}
        run: |
          set -euo pipefail
          result='artifacts/prod-config-sync-runtime-diagnostic/result.json'
          if [[ "$ROUTE_OUTCOME" != 'success' || ! -s "$result" ]] || \
            ! jq -e . "$result" >/dev/null 2>&1; then
            body="$(printf '%s\n' \
              '### Agency #980 PROD config sync runtime diagnostic FAILURE' \
              '' \
              "trusted_main: \`$TRUSTED_MAIN\`" \
              "run_id: \`$GITHUB_RUN_ID\`" \
              "route_outcome: \`${ROUTE_OUTCOME:-unknown}\`" \
              '' \
              'PROD_MUTATION=NONE' \
              'PROD_WRITE=NONE' \
              'PREPROD_ACCESS=NONE' \
              'PREPROD_WRITE=NONE')"
            gh issue comment 980 --repo "$GITHUB_REPOSITORY" --body "$body"
            exit 1
          fi

          current_release="$(jq -r '.current_release' "$result")"
          current_target="$(jq -r '.current_symlink_target' "$result")"
          drupal_root="$(jq -r '.drupal_root' "$result")"
          settings_target="$(jq -r '.settings_symlink_target' "$result")"
          settings_sha="$(jq -r '.shared_settings_sha256' "$result")"
          effective="$(jq -r '.effective_config_sync_directory' "$result")"
          resolved="$(jq -r '.resolved_config_sync_path' "$result")"
          exists="$(jq -r '.resolved_path_exists' "$result")"
          count="$(jq -r '.config_sync_entry_count' "$result")"
          bootstrap="$(jq -r '.drush_bootstrap' "$result")"
          config_status="$(jq -r '.drush_config_status' "$result")"
          warning="$(jq -r '.drupal_status_config_sync_warning' "$result")"

          body="$(cat <<EOF_BODY
          ### Agency #980 PROD config sync runtime diagnostic PASS

          trusted_main: \`${TRUSTED_MAIN}\`
          run_id: \`${GITHUB_RUN_ID}\`
          CURRENT_RELEASE=\`${current_release}\`
          CURRENT_SYMLINK_TARGET=\`${current_target}\`
          DRUPAL_ROOT=\`${drupal_root}\`
          SETTINGS_SYMLINK_TARGET=\`${settings_target}\`
          SHARED_SETTINGS_SHA256=\`${settings_sha}\`
          EFFECTIVE_CONFIG_SYNC_DIRECTORY=\`${effective}\`
          RESOLVED_CONFIG_SYNC_PATH=\`${resolved}\`
          RESOLVED_PATH_EXISTS=\`${exists}\`
          CONFIG_SYNC_ENTRY_COUNT=\`${count}\`
          DRUSH_BOOTSTRAP=\`${bootstrap}\`
          DRUSH_CONFIG_STATUS=\`${config_status}\`
          DRUPAL_STATUS_CONFIG_SYNC_WARNING=\`${warning}\`

          PROD_ACCESS=READ_ONLY
          PROD_MUTATION=NONE
          PROD_WRITE=NONE
          PREPROD_ACCESS=NONE
          PREPROD_WRITE=NONE
          EOF_BODY
          )"
          gh issue comment 980 --repo "$GITHUB_REPOSITORY" --body "$body"
