name: "#982/#995 PROD config runtime diagnostic"

on:
  workflow_call:
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      SERVER_HOST:
        required: true
      SERVER_USER:
        required: true
  pull_request:
    paths:
      - '.github/workflows/prod-config-sync-runtime-diagnostic.yml'
      - '.github/workflows/agency-command-dispatch.yml'
      - '.github/workflows/canvas-runtime-diff-paths-995-validation.yml'
      - 'scripts/runner/run-prod-config-sync-runtime-diagnostic-980.sh'
      - 'scripts/runner/filter-config-status-metadata.php'
      - 'scripts/runner/canvas-runtime-diff-paths-995.php'
      - 'scripts/runner/language-lock-runtime-state-1311.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/AgencyCommandDispatchWorkflowTest.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/ProdConfigSyncRuntimeDiagnostic980WorkflowTest.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/ConfigStatusRuntimePreflight982Test.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/CanvasRuntimeDiffPaths995Test.php'

permissions:
  contents: read

jobs:
  static-validation:
    name: "#982/#995 static read-only PROD config contract"
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate bounded diagnostic shell and workflow
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/runner/run-prod-config-sync-runtime-diagnostic-980.sh
          php -l scripts/runner/filter-config-status-metadata.php
          php -l scripts/runner/canvas-runtime-diff-paths-995.php
          php -l scripts/runner/language-lock-runtime-state-1311.php
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint:1.7.7 -color \
            .github/workflows/prod-config-sync-runtime-diagnostic.yml
          git diff --check "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Install exact locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Prove PROD metadata and #995 path-only contracts
        run: >-
          vendor/bin/phpunit -c web/core/phpunit.xml.dist
          web/modules/custom/agency_project_tests/tests/src/Unit/ConfigStatusRuntimePreflight982Test.php
          web/modules/custom/agency_project_tests/tests/src/Unit/CanvasRuntimeDiffPaths995Test.php
          web/modules/custom/agency_project_tests/tests/src/Unit/ProdConfigSyncRuntimeDiagnostic980WorkflowTest.php

  diagnose:
    name: Read-only PROD config diagnostic
    if: >-
      ${{
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request == null &&
        (
          (
            (github.event.issue.number == 982 || github.event.issue.number == 995 || github.event.issue.number == 1301) &&
            github.event.comment.body == '/agency-config-sync-prod-runtime diagnose'
          ) ||
          (
            github.event.issue.number == 1302 &&
            github.event.comment.body == '/agency-config-language-lock-prod diagnose'
          )
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    concurrency:
      group: agency-config-runtime-${{ github.event.issue.number }}-prod
      cancel-in-progress: false

    steps:
      - name: Validate owner, authority, issue, command and live main
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRIGGER_COMMENT: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
          EVENT_DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'E-merging-digital' ]]
          [[ "$COMMENT_AUTHOR" == "$GITHUB_ACTOR" ]]
          [[ "$ISSUE_NUMBER" == '982' || "$ISSUE_NUMBER" == '995' || "$ISSUE_NUMBER" == '1301' || "$ISSUE_NUMBER" == '1302' ]]
          expected_command='/agency-config-sync-prod-runtime diagnose'
          if [[ "$ISSUE_NUMBER" == '1302' ]]; then
            expected_command='/agency-config-language-lock-prod diagnose'
          fi
          [[ "$TRIGGER_COMMENT" == "$expected_command" ]]

          issue_json="$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER")"
          [[ "$(jq -r '.state' <<<"$issue_json")" == 'open' ]]
          [[ "$(jq -r '.pull_request // empty' <<<"$issue_json")" == '' ]]

          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVENT_DEFAULT_SHA" == "$main_sha" ]] || {
            echo 'PROD diagnostic must execute the workflow revision on live main.' >&2
            exit 1
          }

          if [[ "$ISSUE_NUMBER" == '1302' ]]; then
            [[ "$COMMENT_AUTHOR_ASSOCIATION" == 'OWNER' ]]
            [[ "$TRIGGER_COMMENT_ID" =~ ^[1-9][0-9]*$ ]]
            command_json="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$TRIGGER_COMMENT_ID")"
            [[ "$(jq -r '.user.login' <<<"$command_json")" == 'E-merging-digital' ]]
            [[ "$(jq -r '.author_association' <<<"$command_json")" == 'OWNER' ]]
            jq -e '.performed_via_github_app == null' <<<"$command_json" >/dev/null
            [[ "$(jq -r '.issue_url' <<<"$command_json")" == \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/1302" ]]
            [[ "$(jq -r '.body' <<<"$command_json")" == "$TRIGGER_COMMENT" ]]

            authority_json="$(
              gh api --paginate --slurp \
                "repos/$GITHUB_REPOSITORY/issues/1302/comments?per_page=100" \
                | jq -c \
                  --arg command "$TRIGGER_COMMENT" \
                  --arg main "$main_sha" \
                  --argjson command_id "$TRIGGER_COMMENT_ID" '
                    [
                      .[][]
                      | select((.id | type) == "number" and .id < $command_id)
                      | select(.user.login == "E-merging-digital")
                      | select(.author_association == "OWNER")
                      | select((.body // "") | startswith("PROJECT_LEAD_DIAGNOSTIC_AUTHORITY_1302_R"))
                      | select((.body // "") | contains("LIVE_MAIN =\n" + $main))
                      | select((.body // "") | contains("AUTHORIZED HUMAN COMMAND =\n" + $command))
                    ]
                    | sort_by(.id)
                    | last // empty
                  '
            )"
            test -n "$authority_json"
            authority_comment_id="$(jq -er '.id' <<<"$authority_json")"
            [[ "$authority_comment_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$authority_comment_id" -lt "$TRIGGER_COMMENT_ID" ]]
            echo "authority_comment_id=$authority_comment_id" >> "$GITHUB_OUTPUT"
          elif [[ "$ISSUE_NUMBER" == '1301' ]]; then
            [[ "$COMMENT_AUTHOR_ASSOCIATION" == 'OWNER' ]]
            [[ "$TRIGGER_COMMENT_ID" =~ ^[1-9][0-9]*$ ]]
            command_json="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$TRIGGER_COMMENT_ID")"
            [[ "$(jq -r '.user.login' <<<"$command_json")" == 'E-merging-digital' ]]
            [[ "$(jq -r '.author_association' <<<"$command_json")" == 'OWNER' ]]
            jq -e '.performed_via_github_app == null' <<<"$command_json" >/dev/null
            [[ "$(jq -r '.issue_url' <<<"$command_json")" == \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/1301" ]]
            [[ "$(jq -r '.body' <<<"$command_json")" == "$TRIGGER_COMMENT" ]]

            authority_json="$(
              gh api --paginate --slurp \
                "repos/$GITHUB_REPOSITORY/issues/1301/comments?per_page=100" \
                | jq -c \
                  --arg command "$TRIGGER_COMMENT" \
                  --arg main "$main_sha" \
                  --argjson command_id "$TRIGGER_COMMENT_ID" '
                    [
                      .[][]
                      | select((.id | type) == "number" and .id < $command_id)
                      | select(.user.login == "E-merging-digital")
                      | select(.author_association == "OWNER")
                      | select((.body // "") | startswith("PROJECT_LEAD_DIAGNOSTIC_AUTHORITY_1301_R"))
                      | select((.body // "") | contains("LIVE_MAIN =\n" + $main))
                      | select((.body // "") | contains("AUTHORIZED HUMAN COMMAND =\n" + $command))
                    ]
                    | sort_by(.id)
                    | last // empty
                  '
            )"
            test -n "$authority_json"
            authority_comment_id="$(jq -er '.id' <<<"$authority_json")"
            [[ "$authority_comment_id" =~ ^[1-9][0-9]*$ ]]
            [[ "$authority_comment_id" -lt "$TRIGGER_COMMENT_ID" ]]
            echo "authority_comment_id=$authority_comment_id" >> "$GITHUB_OUTPUT"
          else
            [[ "$(jq -r '.user.login' <<<"$issue_json")" == 'E-merging-digital' ]]
            authority_comment='5528251064'
            if [[ "$ISSUE_NUMBER" == '995' ]]; then
              authority_comment='5529562346'
            fi
            authority_json="$(gh api "repos/$GITHUB_REPOSITORY/issues/comments/$authority_comment")"
            [[ "$(jq -r '.user.login' <<<"$authority_json")" == 'E-merging-digital' ]]
            [[ "$(jq -r '.issue_url' <<<"$authority_json")" == \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" ]]
          fi

          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact trusted main
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.request.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable read-only implementation
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ steps.request.outputs.main_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN_SHA" ]]
          bash -n scripts/runner/run-prod-config-sync-runtime-diagnostic-980.sh
          bash -n scripts/production-ssh-trust/manage-known-host.sh
          php -l scripts/runner/filter-config-status-metadata.php
          php -l scripts/runner/canvas-runtime-diff-paths-995.php
          php -l scripts/runner/language-lock-runtime-state-1311.php

      - name: JIT revalidate live main before PROD identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: ${{ steps.request.outputs.main_sha }}
        run: |
          set -euo pipefail
          live="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$live" == "$EXPECTED_MAIN" ]]
          [[ "$(git rev-parse HEAD)" == "$live" ]]

      - name: Materialize transient PROD identity after JIT
        env:
          PROD_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PROD_KEY"
          printf '%s\n' "$PROD_KEY" > "$RUNNER_TEMP/agency-config-prod.key"
          chmod 600 "$RUNNER_TEMP/agency-config-prod.key"

      - name: Execute bounded read-only PROD diagnostic
        id: route
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DIAGNOSTIC_PROFILE: ${{ github.event.issue.number == 995 && 'canvas_paths' || github.event.issue.number == 1302 && 'language_lock' || 'metadata' }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          PROD_SSH_KEY: ${{ runner.temp }}/agency-config-prod.key
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts/config-runtime-prod
        run: bash scripts/runner/run-prod-config-sync-runtime-diagnostic-980.sh

      - name: Cleanup PROD identity
        if: ${{ always() }}
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/agency-config-prod.key"

      - name: Materialize bounded public evidence
        if: ${{ steps.route.outcome == 'success' }}
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          result='artifacts/config-runtime-prod/result.json'
          public='artifacts/config-runtime-prod/public-result.json'
          if [[ "$ISSUE_NUMBER" == '995' ]]; then
            jq '.runtime_canvas_paths' "$result" > "$public"
            jq -e '
              .environment == "PROD"
              and .public_schema == "environment + config_name + differing_paths[] + classification"
              and .config_values_exposed == false
              and .cohort_size == 15
            ' "$public" >/dev/null
          elif [[ "$ISSUE_NUMBER" == '1302' ]]; then
            jq '{
              TARGET: .target,
              CURRENT_RELEASE: .current_release,
              DRUPAL_ROOT: .drupal_root,
              DRUPAL_CORE_VERSION: .drupal_core_version,
              CANVAS_ENABLED: .canvas_enabled,
              CANVAS_VERSION: .canvas_version,
              CONFIG_LANGUAGE_LOCK_ENABLED: .config_language_lock_enabled,
              CONFIG_LANGUAGE_LOCK_VERSION: .config_language_lock_version,
              SITE_DEFAULT_LANGUAGE: .site_default_language,
              ACTIVE_LOCKED_LANGCODE: .active_locked_langcode,
              ACTIVE_FOLLOW_SITE_DEFAULT: .active_follow_site_default,
              SYNC_LOCKED_LANGCODE: .sync_locked_langcode,
              SYNC_FOLLOW_SITE_DEFAULT: .sync_follow_site_default,
              ACTIVE_SYNC_LOCK_SETTINGS_MATCH: .active_sync_lock_settings_match,
              CANVAS_REQUIREMENT_SOURCE: .canvas_requirement_source,
              CANVAS_REQUIREMENT_KEY: .canvas_requirement_key,
              CANVAS_REQUIREMENT_SEVERITY: .canvas_requirement_severity,
              CANVAS_REQUIREMENT_VERDICT: .canvas_requirement_verdict,
              CANVAS_REQUIREMENT_SUMMARY: .canvas_requirement_summary,
              CONFIG_STATUS_CONCERNED: .config_status_concerned,
              LANGUAGE_UND_PRESENT: .languages.und.present,
              LANGUAGE_UND_ID: .languages.und.id,
              LANGUAGE_UND_LANGCODE: .languages.und.langcode,
              LANGUAGE_UND_LOCKED: .languages.und.locked,
              LANGUAGE_ZXX_PRESENT: .languages.zxx.present,
              LANGUAGE_ZXX_ID: .languages.zxx.id,
              LANGUAGE_ZXX_LANGCODE: .languages.zxx.langcode,
              LANGUAGE_ZXX_LOCKED: .languages.zxx.locked,
              PROD_ACCESS: .prod_access,
              PROD_MUTATION: .prod_mutation,
              PROD_WRITE: .prod_write,
              PREPROD_ACCESS: .preprod_access,
              PREPROD_WRITE: .preprod_write,
              CONFIG_VALUES_EXPOSED: .config_values_exposed
            }' "$result" > "$public"
            jq -e '
              .TARGET == "PROD"
              and (.CURRENT_RELEASE | type == "string" and test("^[A-Za-z0-9._-]+$"))
              and .DRUPAL_ROOT == ("/var/www/agency/releases/" + .CURRENT_RELEASE + "/web")
              and (.DRUPAL_CORE_VERSION | type == "string" and length > 0 and length <= 64)
              and (.CANVAS_ENABLED | type == "boolean")
              and (.CANVAS_VERSION | type == "string" and length > 0 and length <= 64)
              and (.CONFIG_LANGUAGE_LOCK_ENABLED | type == "boolean")
              and (.CONFIG_LANGUAGE_LOCK_VERSION | type == "string" and length > 0 and length <= 64)
              and (.SITE_DEFAULT_LANGUAGE | type == "string" and test("^[A-Za-z0-9_-]+$"))
              and (.ACTIVE_LOCKED_LANGCODE == null or (.ACTIVE_LOCKED_LANGCODE | type == "string" and test("^[A-Za-z0-9_-]+$")))
              and (.ACTIVE_FOLLOW_SITE_DEFAULT == null or (.ACTIVE_FOLLOW_SITE_DEFAULT | type == "boolean"))
              and (.SYNC_LOCKED_LANGCODE == null or (.SYNC_LOCKED_LANGCODE | type == "string" and test("^[A-Za-z0-9_-]+$")))
              and (.SYNC_FOLLOW_SITE_DEFAULT == null or (.SYNC_FOLLOW_SITE_DEFAULT | type == "boolean"))
              and (.ACTIVE_SYNC_LOCK_SETTINGS_MATCH | type == "boolean")
              and .CANVAS_REQUIREMENT_SOURCE == "Drupal\\config_language_lock\\Hook\\ConfigLanguageLockRequirementsHooks::runtimeRequirements"
              and .CANVAS_REQUIREMENT_KEY == "config_language_lock_canvas_mismatch"
              and (.CANVAS_REQUIREMENT_SEVERITY == "NONE" or .CANVAS_REQUIREMENT_SEVERITY == "INFO" or .CANVAS_REQUIREMENT_SEVERITY == "OK" or .CANVAS_REQUIREMENT_SEVERITY == "WARNING" or .CANVAS_REQUIREMENT_SEVERITY == "ERROR")
              and (.CANVAS_REQUIREMENT_VERDICT == "PASS" or .CANVAS_REQUIREMENT_VERDICT == "WARNING" or .CANVAS_REQUIREMENT_VERDICT == "ERROR" or .CANVAS_REQUIREMENT_VERDICT == "NOT_APPLICABLE")
              and (.CANVAS_REQUIREMENT_SUMMARY | type == "string" and length > 0 and length <= 160 and (test("[<>]") | not))
              and (.CONFIG_STATUS_CONCERNED | type == "array")
              and all(.CONFIG_STATUS_CONCERNED[];
                (.config_name == "config_language_lock.settings" or .config_name == "system.site" or .config_name == "core.extension")
                and (.state == "Only in DB" or .state == "Only in sync dir" or .state == "Different")
                and (.operation == "CREATE" or .operation == "UPDATE" or .operation == "DELETE")
                and (.classification == "EXPECTED_REPOSITORY_DEPLOY_DRIFT" or .classification == "INTENTIONAL_RUNTIME_ONLY" or .classification == "UNEXPECTED_REVIEW_REQUIRED")
              )
              and (.LANGUAGE_UND_PRESENT | type == "boolean")
              and (.LANGUAGE_UND_ID == null or .LANGUAGE_UND_ID == "und")
              and (.LANGUAGE_UND_LANGCODE == null or (.LANGUAGE_UND_LANGCODE | type == "string"))
              and (.LANGUAGE_UND_LOCKED == null or (.LANGUAGE_UND_LOCKED | type == "boolean"))
              and (.LANGUAGE_ZXX_PRESENT | type == "boolean")
              and (.LANGUAGE_ZXX_ID == null or .LANGUAGE_ZXX_ID == "zxx")
              and (.LANGUAGE_ZXX_LANGCODE == null or (.LANGUAGE_ZXX_LANGCODE | type == "string"))
              and (.LANGUAGE_ZXX_LOCKED == null or (.LANGUAGE_ZXX_LOCKED | type == "boolean"))
              and .PROD_ACCESS == "READ_ONLY"
              and .PROD_MUTATION == "NONE"
              and .PROD_WRITE == "NONE"
              and .PREPROD_ACCESS == "NONE"
              and .PREPROD_WRITE == "NONE"
              and .CONFIG_VALUES_EXPOSED == false
            ' "$public" >/dev/null
          elif [[ "$ISSUE_NUMBER" == '1301' ]]; then
            jq '{
              TARGET: .target,
              CURRENT_RELEASE: .current_release,
              CURRENT_SYMLINK_TARGET: .current_symlink_target,
              DRUPAL_ROOT: .drupal_root,
              SETTINGS_SYMLINK_TARGET: .settings_symlink_target,
              SHARED_SETTINGS_SHA256: .shared_settings_sha256,
              EFFECTIVE_CONFIG_SYNC_DIRECTORY: .effective_config_sync_directory,
              RESOLVED_CONFIG_SYNC_PATH: .resolved_config_sync_path,
              RESOLVED_PATH_EXISTS: .resolved_path_exists,
              CONFIG_SYNC_ENTRY_COUNT: .config_sync_entry_count,
              DRUSH_BOOTSTRAP: .drush_bootstrap,
              DRUSH_CONFIG_STATUS: .drush_config_status,
              DRUPAL_STATUS_CONFIG_SYNC_WARNING: .drupal_status_config_sync_warning,
              PROD_ACCESS: .prod_access,
              PROD_MUTATION: .prod_mutation,
              PROD_WRITE: .prod_write,
              PREPROD_ACCESS: .preprod_access,
              PREPROD_WRITE: .preprod_write,
              runtime_config_metadata: .runtime_config_metadata
            }' "$result" > "$public"
            jq -e '
              .TARGET == "PROD"
              and (.CURRENT_RELEASE | type == "string" and test("^[A-Za-z0-9._-]+$"))
              and .CURRENT_SYMLINK_TARGET == ("/var/www/agency/releases/" + .CURRENT_RELEASE)
              and .DRUPAL_ROOT == (.CURRENT_SYMLINK_TARGET + "/web")
              and .SETTINGS_SYMLINK_TARGET == "/var/www/agency/shared/settings/settings.php"
              and (.SHARED_SETTINGS_SHA256 | type == "string" and test("^[0-9a-f]{64}$"))
              and (.EFFECTIVE_CONFIG_SYNC_DIRECTORY | type == "string" and . != "UNOBSERVABLE" and test("^/?[A-Za-z0-9._/-]+$"))
              and (.RESOLVED_CONFIG_SYNC_PATH | type == "string" and test("^/var/www/agency(/[A-Za-z0-9._-]+)+$"))
              and (.RESOLVED_PATH_EXISTS == "YES" or .RESOLVED_PATH_EXISTS == "NO")
              and (.CONFIG_SYNC_ENTRY_COUNT | type == "number" and . >= 0)
              and .DRUSH_BOOTSTRAP == "SUCCESS"
              and (.DRUSH_CONFIG_STATUS == "CLEAN" or .DRUSH_CONFIG_STATUS == "DIFFERENT")
              and (.DRUPAL_STATUS_CONFIG_SYNC_WARNING | type == "string" and length > 0 and length <= 80 and test("^[A-Z0-9_ -]+$"))
              and .PROD_ACCESS == "READ_ONLY"
              and .PROD_MUTATION == "NONE"
              and .PROD_WRITE == "NONE"
              and .PREPROD_ACCESS == "NONE"
              and .PREPROD_WRITE == "NONE"
              and .runtime_config_metadata.environment == "PROD"
              and .runtime_config_metadata.config_values_exposed == false
            ' "$public" >/dev/null
          else
            jq '.runtime_config_metadata' "$result" > "$public"
            jq -e '.environment == "PROD" and .config_values_exposed == false' "$public" >/dev/null
          fi

      - name: Upload bounded PROD evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agency-config-runtime-${{ github.event.issue.number }}-prod-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/config-runtime-prod/public-result.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish bounded PROD result
        if: ${{ always() && steps.request.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ROUTE_OUTCOME: ${{ steps.route.outcome }}
          TRUSTED_MAIN: ${{ steps.request.outputs.main_sha }}
        run: |
          set -euo pipefail
          result='artifacts/config-runtime-prod/public-result.json'
          if [[ "$ROUTE_OUTCOME" != 'success' || ! -s "$result" ]] || \
            ! jq -e . "$result" >/dev/null 2>&1; then
            body="$(printf '%s\n' \
              "### Agency #$ISSUE_NUMBER PROD config diagnostic FAILURE" \
              '' \
              "trusted_main: \`$TRUSTED_MAIN\`" \
              "run_id: \`$GITHUB_RUN_ID\`" \
              '' \
              'CONFIG_VALUES_EXPOSED=NO' \
              'PROD_WRITE=NONE' \
              'PREPROD_ACCESS=NONE' \
              'PREPROD_WRITE=NONE')"
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
            exit 1
          fi

          if [[ "$ISSUE_NUMBER" == '1302' ]]; then
            target="$(jq -r '.TARGET' "$result")"
            current_release="$(jq -r '.CURRENT_RELEASE' "$result")"
            drupal_root="$(jq -r '.DRUPAL_ROOT' "$result")"
            drupal_core_version="$(jq -r '.DRUPAL_CORE_VERSION' "$result")"
            canvas_enabled="$(jq -r '.CANVAS_ENABLED' "$result")"
            canvas_version="$(jq -r '.CANVAS_VERSION' "$result")"
            lock_enabled="$(jq -r '.CONFIG_LANGUAGE_LOCK_ENABLED' "$result")"
            lock_version="$(jq -r '.CONFIG_LANGUAGE_LOCK_VERSION' "$result")"
            site_default="$(jq -r '.SITE_DEFAULT_LANGUAGE' "$result")"
            active_locked="$(jq -r '.ACTIVE_LOCKED_LANGCODE' "$result")"
            active_follow="$(jq -r '.ACTIVE_FOLLOW_SITE_DEFAULT' "$result")"
            sync_locked="$(jq -r '.SYNC_LOCKED_LANGCODE' "$result")"
            sync_follow="$(jq -r '.SYNC_FOLLOW_SITE_DEFAULT' "$result")"
            active_sync_match="$(jq -r '.ACTIVE_SYNC_LOCK_SETTINGS_MATCH' "$result")"
            requirement_source="$(jq -r '.CANVAS_REQUIREMENT_SOURCE' "$result")"
            requirement_key="$(jq -r '.CANVAS_REQUIREMENT_KEY' "$result")"
