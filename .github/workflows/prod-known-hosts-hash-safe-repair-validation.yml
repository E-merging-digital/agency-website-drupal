name: Validate PROD known_hosts hash-safe repair governance

on:
  pull_request:
    paths:
      - '.github/workflows/prod-known-hosts-hash-safe-repair.yml'
      - '.github/workflows/prod-known-hosts-hash-safe-repair-validation.yml'
      - '.github/workflows/prod-known-hosts-repair-validation.yml'
      - 'scripts/production-ssh-trust/hash-safe-repair-known-hosts.sh'
      - 'scripts/production-ssh-trust/repair-known-hosts.sh'
      - 'scripts/production-ssh-trust/manage-known-host.sh'
      - 'scripts/production-ssh-trust/prod-ed25519.pub'
      - 'scripts/production-ssh-trust/prod-ed25519.sha256'

permissions:
  contents: read

jobs:
  validate-prod-known-hosts-hash-safe-repair:
    name: Prove #842 offline hash-safe repair matrix and governance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate static #842 authority, trust and no-network contract
        shell: bash
        run: |
          set -euo pipefail
          repair='scripts/production-ssh-trust/hash-safe-repair-known-hosts.sh'
          old_repair='scripts/production-ssh-trust/repair-known-hosts.sh'
          verify='scripts/production-ssh-trust/manage-known-host.sh'
          route='.github/workflows/prod-known-hosts-hash-safe-repair.yml'
          bash -n "$repair"
          bash -n "$old_repair"
          bash -n "$verify"
          grep -Fq "github.event.issue.number == 842" "$route"
          grep -Fq '/agency-prod-known-hosts-hash-safe-repair repair ' "$route"
          grep -Fq "RUNNER_NAME\" == 'agency-browser-runner-01'" "$route"
          grep -Fq 'hash-safe-repair-known-hosts.sh CLASSIFY' "$route"
          grep -Fq 'hash-safe-repair-known-hosts.sh' "$route"
          grep -Fq 'PRESTATE_PERSISTED_BEFORE_REPAIR=PASS' "$route"
          grep -Fq 'Upload metadata-only pre-state before repair' "$route"
          grep -Fq 'secrets.SERVER_HOST' "$route"
          ! grep -Fq 'SSH_PRIVATE_KEY' "$route"
          ! grep -Fq 'SERVER_USER' "$route"
          ! grep -Eq '(^|[[:space:]])ssh[[:space:]]' "$route"
          ! grep -Eq '(^|[[:space:]])scp[[:space:]]' "$route"
          ! grep -Eq '(^|[[:space:]])rsync[[:space:]]' "$route"
          ! grep -Eq '(^|[[:space:]])curl[[:space:]]' "$route"
          ! grep -Fq 'ssh-keyscan' "$repair"
          ! grep -Fq 'ssh-keyscan' "$route"
          ! grep -Fq 'StrictHostKeyChecking=no' "$repair"
          ! grep -Fq 'StrictHostKeyChecking=no' "$route"
          ! grep -Fq 'accept-new' "$repair"
          ! grep -Fq 'accept-new' "$route"
          ! grep -Fqi 'TOFU' "$repair"
          ! grep -Fqi 'TOFU' "$route"
          grep -Fq "exit 80" "$old_repair"
          grep -Fq 'Matching hashed known_hosts entry cannot be selectively repaired without unsafe assumptions.' "$old_repair"
          grep -Fq 'SERVER_HOST has multiple known_hosts entries; refusing ambiguity.' "$verify"
          ! grep -Fq "MODE\" != 'REPAIR'" "$verify"
          grep -Fq "REPAIR_STRATEGY='OFFLINE_HMAC_SHA1_WORK_COPY_V1'" "$repair"
          grep -Fq "hmac.new(salt, host.encode('utf-8'), hashlib.sha1)" "$repair"
          test "$(ssh-keygen -lf scripts/production-ssh-trust/prod-ed25519.pub -E sha256 | awk '{print $2}')" = 'SHA256:Pflpbgh2vc9dUYe4fpXPxdwzhPqyy8vmbAOcS+BRLDQ'

      - name: Run required #842 synthetic hash-safe matrix
        shell: bash
        run: |
          set -euo pipefail
          repair="$GITHUB_WORKSPACE/scripts/production-ssh-trust/hash-safe-repair-known-hosts.sh"
          old_repair="$GITHUB_WORKSPACE/scripts/production-ssh-trust/repair-known-hosts.sh"
          verify="$GITHUB_WORKSPACE/scripts/production-ssh-trust/manage-known-host.sh"
          host='prod.example.invalid'
          alias='alias.example.invalid'
          unrelated='unrelated.example.invalid'
          unrelated2='unrelated-two.example.invalid'
          read -r pinned_type pinned_blob _ < scripts/production-ssh-trust/prod-ed25519.pub
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          ssh-keygen -q -t ed25519 -N '' -f "$tmp/wrong-ed25519" >/dev/null
          read -r wrong_type wrong_blob _ < "$tmp/wrong-ed25519.pub"
          ssh-keygen -q -t rsa -b 2048 -N '' -f "$tmp/wrong-rsa" >/dev/null
          read -r rsa_type rsa_blob _ < "$tmp/wrong-rsa.pub"

          make_home() {
            local name="$1"
            mkdir -p "$tmp/$name/.ssh"
            chmod 700 "$tmp/$name/.ssh"
            : > "$tmp/$name/.ssh/known_hosts"
            chmod 600 "$tmp/$name/.ssh/known_hosts"
          }
          count_host() {
            local file="$1"
            ssh-keygen -F "$host" -f "$file" 2>/dev/null | grep -vc '^#' || true
          }
          hashed_line() {
            local hashed_host="$1" key_type="$2" key_blob="$3"
            local seed
            seed="$(mktemp "$tmp/hash-seed.XXXXXX")"
            printf '%s %s %s\n' "$hashed_host" "$key_type" "$key_blob" > "$seed"
            ssh-keygen -q -H -f "$seed" >/dev/null 2>&1
            cat "$seed"
            rm -f "$seed" "$seed.old"
          }
          assert_canonical() {
            local home="$1"
            test "$(count_host "$home/.ssh/known_hosts")" -eq 1
            HOME="$home" SERVER_HOST="$host" bash "$verify" VERIFY_ONLY >/dev/null
            grep -Fxq "$host $pinned_type $pinned_blob" "$home/.ssh/known_hosts"
          }
          assert_no_temp_escape() {
            local home="$1"
            ! find "$home/.ssh" -maxdepth 1 -type f \( -name '*.old' -o -name '.known_hosts.agency-842.*' \) -print -quit | grep -q .
          }

          # Metadata classification exists independently before mutation and leaks no host value.
          make_home metadata
          metadata_hashed="$(hashed_line "$host" "$wrong_type" "$wrong_blob")"
          {
            printf '%s\n' "$metadata_hashed"
            printf '%s %s %s\n' "$host" "$pinned_type" "$pinned_blob"
          } > "$tmp/metadata/.ssh/known_hosts"
          metadata="$(HOME="$tmp/metadata" SERVER_HOST="$host" bash "$repair" CLASSIFY)"
          grep -Fxq 'MATCHING_ENTRY_COUNT=2' <<< "$metadata"
          grep -Fxq 'PINNED_MATCH_COUNT=1' <<< "$metadata"
          grep -Fxq 'NON_PINNED_MATCH_COUNT=1' <<< "$metadata"
          grep -Fxq 'PLAIN_MATCH_COUNT=1' <<< "$metadata"
          grep -Fxq 'HASHED_MATCH_COUNT=1' <<< "$metadata"
          grep -Fxq 'ALIASED_MATCH_PRESENT=NO' <<< "$metadata"
          grep -Fxq 'REPAIR_STRATEGY=OFFLINE_HMAC_SHA1_WORK_COPY_V1' <<< "$metadata"
          ! grep -Fq "$host" <<< "$metadata"

          # A. one hashed SERVER_HOST / wrong key -> canonical pinned; unrelated plain retained.
          make_home hashed-wrong
          target_hashed="$(hashed_line "$host" "$wrong_type" "$wrong_blob")"
          unrelated_plain="$unrelated $wrong_type $wrong_blob"
          {
            printf '%s\n' "$unrelated_plain"
            printf '%s\n' "$target_hashed"
          } > "$tmp/hashed-wrong/.ssh/known_hosts"
          out="$(HOME="$tmp/hashed-wrong" SERVER_HOST="$host" bash "$repair" REPAIR)"
          assert_canonical "$tmp/hashed-wrong"
          grep -Fqx "$unrelated_plain" "$tmp/hashed-wrong/.ssh/known_hosts"
          grep -Fxq 'WORK_COPY_TARGET_MATCH_COUNT_AFTER_REMOVAL=0' <<< "$out"
          grep -Fxq 'UNRELATED_STATE_PRESERVED=PASS' <<< "$out"
          assert_no_temp_escape "$tmp/hashed-wrong"

          # B. duplicate hashed target entries -> all removed, one canonical pinned inserted.
          make_home hashed-duplicate
          h1="$(hashed_line "$host" "$wrong_type" "$wrong_blob")"
          h2="$(hashed_line "$host" "$wrong_type" "$wrong_blob")"
          printf '%s\n%s\n' "$h1" "$h2" > "$tmp/hashed-duplicate/.ssh/known_hosts"
          HOME="$tmp/hashed-duplicate" SERVER_HOST="$host" bash "$repair" REPAIR >/dev/null
          assert_canonical "$tmp/hashed-duplicate"
          assert_no_temp_escape "$tmp/hashed-duplicate"

          # C. hashed pinned + hashed wrong -> one canonical pinned.
          make_home hashed-mixed
          hp="$(hashed_line "$host" "$pinned_type" "$pinned_blob")"
          hw="$(hashed_line "$host" "$wrong_type" "$wrong_blob")"
          printf '%s\n%s\n' "$hp" "$hw" > "$tmp/hashed-mixed/.ssh/known_hosts"
          HOME="$tmp/hashed-mixed" SERVER_HOST="$host" bash "$repair" REPAIR >/dev/null
          assert_canonical "$tmp/hashed-mixed"

          # D. hashed + plain target matches -> one canonical pinned.
          make_home hashed-plus-plain
          hpwrong="$(hashed_line "$host" "$wrong_type" "$wrong_blob")"
          {
            printf '%s\n' "$hpwrong"
            printf '%s %s %s\n' "$host" "$wrong_type" "$wrong_blob"
          } > "$tmp/hashed-plus-plain/.ssh/known_hosts"
          HOME="$tmp/hashed-plus-plain" SERVER_HOST="$host" bash "$repair" REPAIR >/dev/null
          assert_canonical "$tmp/hashed-plus-plain"

          # E. unrelated hashed host remains byte-for-byte identical.
          make_home unrelated-hashed
          target_h="$(hashed_line "$host" "$wrong_type" "$wrong_blob")"
          unrelated_h="$(hashed_line "$unrelated" "$wrong_type" "$wrong_blob")"
          printf '%s\n%s\n' "$unrelated_h" "$target_h" > "$tmp/unrelated-hashed/.ssh/known_hosts"
          HOME="$tmp/unrelated-hashed" SERVER_HOST="$host" bash "$repair" REPAIR >/dev/null
          test "$(grep -Fxc "$unrelated_h" "$tmp/unrelated-hashed/.ssh/known_hosts")" -eq 1
          assert_canonical "$tmp/unrelated-hashed"

          # F. unrelated plain host remains byte-for-byte identical.
          make_home unrelated-plain
          unrelated_line="$unrelated $rsa_type $rsa_blob note-preserved"
          target_h="$(hashed_line "$host" "$wrong_type" "$wrong_blob")"
          printf '%s\n%s\n' "$unrelated_line" "$target_h" > "$tmp/unrelated-plain/.ssh/known_hosts"
          HOME="$tmp/unrelated-plain" SERVER_HOST="$host" bash "$repair" REPAIR >/dev/null
          test "$(grep -Fxc "$unrelated_line" "$tmp/unrelated-plain/.ssh/known_hosts")" -eq 1
          assert_canonical "$tmp/unrelated-plain"

          # G. comments and blank lines preserve exact bounded representation.
          make_home comments-blanks
          target_h="$(hashed_line "$host" "$wrong_type" "$wrong_blob")"
          {
            printf '# first comment\n'
            printf '\n'
            printf '%s\n' "$target_h"
            printf '\n'
            printf '# final comment\n'
          } > "$tmp/comments-blanks/.ssh/known_hosts"
          HOME="$tmp/comments-blanks" SERVER_HOST="$host" bash "$repair" REPAIR >/dev/null
          test "$(grep -Fxc '# first comment' "$tmp/comments-blanks/.ssh/known_hosts")" -eq 1
          test "$(grep -Fxc '# final comment' "$tmp/comments-blanks/.ssh/known_hosts")" -eq 1
          test "$(awk 'NF == 0 { count++ } END { print count + 0 }' "$tmp/comments-blanks/.ssh/known_hosts")" -eq 2
          assert_canonical "$tmp/comments-blanks"

          # H. plain multi-host alias preserves the unrelated alias association.
          make_home alias-preservation
          printf '%s,%s %s %s alias-comment\n' "$host" "$alias" "$wrong_type" "$wrong_blob" > "$tmp/alias-preservation/.ssh/known_hosts"
          HOME="$tmp/alias-preservation" SERVER_HOST="$host" bash "$repair" REPAIR >/dev/null
          grep -Fxq "$alias $wrong_type $wrong_blob alias-comment" "$tmp/alias-preservation/.ssh/known_hosts"
          assert_canonical "$tmp/alias-preservation"

          # I. multiple key types for target are all removed before ED25519 canonical insertion.
          make_home multiple-key-types
          target_rsa_h="$(hashed_line "$host" "$rsa_type" "$rsa_blob")"
          {
            printf '%s\n' "$target_rsa_h"
            printf '%s %s %s\n' "$host" "$wrong_type" "$wrong_blob"
          } > "$tmp/multiple-key-types/.ssh/known_hosts"
          multi_out="$(HOME="$tmp/multiple-key-types" SERVER_HOST="$host" bash "$repair" REPAIR)"
          grep -Fxq 'KEY_TYPES_AFTER=ssh-ed25519' <<< "$multi_out"
          grep -Fxq 'HASHED_MATCH_COUNT_AFTER=0' <<< "$multi_out"
          assert_canonical "$tmp/multiple-key-types"

          # J. no terminal newline -> fail closed with exact live bytes unchanged.
          make_home no-newline
          printf '%s %s %s' "$host" "$wrong_type" "$wrong_blob" > "$tmp/no-newline/.ssh/known_hosts"
          cp "$tmp/no-newline/.ssh/known_hosts" "$tmp/no-newline-before"
          set +e
          HOME="$tmp/no-newline" SERVER_HOST="$host" bash "$repair" REPAIR >/dev/null 2>&1
          no_newline_status=$?
          set -e
          test "$no_newline_status" -eq 90
          cmp -s "$tmp/no-newline-before" "$tmp/no-newline/.ssh/known_hosts"

          # K. malformed record -> fail closed and preserve exact live bytes.
          make_home malformed
          target_h="$(hashed_line "$host" "$wrong_type" "$wrong_blob")"
          {
            printf 'malformed-record-without-key-fields\n'
            printf '%s\n' "$target_h"
          } > "$tmp/malformed/.ssh/known_hosts"
          cp "$tmp/malformed/.ssh/known_hosts" "$tmp/malformed-before"
          set +e
          HOME="$tmp/malformed" SERVER_HOST="$host" bash "$repair" REPAIR >/dev/null 2>&1
          malformed_status=$?
          set -e
          test "$malformed_status" -eq 91
          cmp -s "$tmp/malformed-before" "$tmp/malformed/.ssh/known_hosts"
          assert_no_temp_escape "$tmp/malformed"

          # L. forced post-repair VERIFY_ONLY failure restores exact original live file.
          make_home rollback
          target_h="$(hashed_line "$host" "$wrong_type" "$wrong_blob")"
          unrelated_h="$(hashed_line "$unrelated2" "$rsa_type" "$rsa_blob")"
          printf '%s\n%s\n' "$unrelated_h" "$target_h" > "$tmp/rollback/.ssh/known_hosts"
          cp "$tmp/rollback/.ssh/known_hosts" "$tmp/rollback-before"
          set +e
          HOME="$tmp/rollback" SERVER_HOST="$host" AGENCY_842_SYNTHETIC_TEST=1 AGENCY_842_TEST_FORCE_POST_VERIFY_FAILURE=1 bash "$repair" REPAIR >/dev/null 2>&1
          rollback_status=$?
          set -e
          test "$rollback_status" -eq 96
          cmp -s "$tmp/rollback-before" "$tmp/rollback/.ssh/known_hosts"
          assert_no_temp_escape "$tmp/rollback"

          # M. second repair is a content no-op and known_hosts hash is unchanged.
          make_home idempotent
          target_h="$(hashed_line "$host" "$wrong_type" "$wrong_blob")"
          printf '%s\n' "$target_h" > "$tmp/idempotent/.ssh/known_hosts"
          HOME="$tmp/idempotent" SERVER_HOST="$host" bash "$repair" REPAIR >/dev/null
          first_hash="$(sha256sum "$tmp/idempotent/.ssh/known_hosts" | awk '{print $1}')"
          second_out="$(HOME="$tmp/idempotent" SERVER_HOST="$host" bash "$repair" REPAIR)"
          second_hash="$(sha256sum "$tmp/idempotent/.ssh/known_hosts" | awk '{print $1}')"
          test "$first_hash" = "$second_hash"
          grep -Fxq 'REPAIR_EFFECTIVE_CHANGE=NO' <<< "$second_out"
          assert_canonical "$tmp/idempotent"

          # #840 hashed behavior remains fail-closed with exit 80 and no mutation.
          make_home old-840-hashed
          target_h="$(hashed_line "$host" "$wrong_type" "$wrong_blob")"
          printf '%s\n' "$target_h" > "$tmp/old-840-hashed/.ssh/known_hosts"
          old_hash_before="$(sha256sum "$tmp/old-840-hashed/.ssh/known_hosts" | awk '{print $1}')"
          set +e
          HOME="$tmp/old-840-hashed" SERVER_HOST="$host" bash "$old_repair" REPAIR >/dev/null 2>&1
          old_status=$?
          set -e
          test "$old_status" -eq 80
          old_hash_after="$(sha256sum "$tmp/old-840-hashed/.ssh/known_hosts" | awk '{print $1}')"
          test "$old_hash_before" = "$old_hash_after"

          # Existing VERIFY_ONLY remains fail-closed on ambiguity with exit 76.
          make_home verify-ambiguous
          {
            printf '%s %s %s\n' "$host" "$pinned_type" "$pinned_blob"
            printf '%s %s %s\n' "$host" "$wrong_type" "$wrong_blob"
          } > "$tmp/verify-ambiguous/.ssh/known_hosts"
          set +e
          HOME="$tmp/verify-ambiguous" SERVER_HOST="$host" bash "$verify" VERIFY_ONLY >/dev/null 2>&1
          verify_status=$?
          set -e
          test "$verify_status" -eq 76
