name: Validate PROD known_hosts repair governance

on:
  pull_request:
    paths:
      - '.github/workflows/prod-known-hosts-repair.yml'
      - '.github/workflows/prod-known-hosts-repair-validation.yml'
      - 'scripts/production-ssh-trust/repair-known-hosts.sh'
      - 'scripts/production-ssh-trust/manage-known-host.sh'
      - 'scripts/production-ssh-trust/prod-ed25519.pub'
      - 'scripts/production-ssh-trust/prod-ed25519.sha256'

permissions:
  contents: read

jobs:
  validate-prod-known-hosts-repair:
    name: Prove bounded local repair, preservation, rollback and fail-closed trust
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate static trust and no-network contract
        shell: bash
        run: |
          set -euo pipefail
          repair='scripts/production-ssh-trust/repair-known-hosts.sh'
          verify='scripts/production-ssh-trust/manage-known-host.sh'
          route='.github/workflows/prod-known-hosts-repair.yml'
          bash -n "$repair"
          bash -n "$verify"
          grep -Fq "github.event.issue.number == 840" "$route"
          grep -Fq '/agency-prod-known-hosts-repair repair ' "$route"
          grep -Fq "RUNNER_NAME\" == 'agency-browser-runner-01'" "$route"
          grep -Fq 'repair-known-hosts.sh REPAIR' "$route"
          grep -Fq 'manage-known-host.sh VERIFY_ONLY' "$route"
          grep -Fq 'secrets.SERVER_HOST' "$route"
          ! grep -Fq 'SSH_PRIVATE_KEY' "$route"
          ! grep -Fq 'SERVER_USER' "$route"
          ! grep -Eq '(^|[[:space:]])ssh[[:space:]]' "$route"
          ! grep -Eq '(^|[[:space:]])scp[[:space:]]' "$route"
          ! grep -Eq '(^|[[:space:]])rsync[[:space:]]' "$route"
          ! grep -Fq 'ssh-keyscan' "$repair"
          ! grep -Fq 'ssh-keyscan' "$route"
          ! grep -Fq 'StrictHostKeyChecking=no' "$repair"
          ! grep -Fq 'StrictHostKeyChecking=no' "$route"
          ! grep -Fq 'accept-new' "$repair"
          ! grep -Fq 'accept-new' "$route"
          ! grep -Fqi 'TOFU' "$repair"
          ! grep -Fqi 'TOFU' "$route"
          grep -Fq 'SERVER_HOST has multiple known_hosts entries; refusing ambiguity.' "$verify"
          ! grep -Fq "MODE\" != 'REPAIR'" "$verify"
          test "$(ssh-keygen -lf scripts/production-ssh-trust/prod-ed25519.pub -E sha256 | awk '{print $2}')" = 'SHA256:Pflpbgh2vc9dUYe4fpXPxdwzhPqyy8vmbAOcS+BRLDQ'

      - name: Run full synthetic repair matrix
        shell: bash
        run: |
          set -euo pipefail
          repair="$GITHUB_WORKSPACE/scripts/production-ssh-trust/repair-known-hosts.sh"
          verify="$GITHUB_WORKSPACE/scripts/production-ssh-trust/manage-known-host.sh"
          host='prod.example.invalid'
          alias='alias.example.invalid'
          unrelated='unrelated.example.invalid'
          read -r pinned_type pinned_blob _ < scripts/production-ssh-trust/prod-ed25519.pub
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          ssh-keygen -q -t ed25519 -N '' -f "$tmp/wrong" >/dev/null
          read -r wrong_type wrong_blob _ < "$tmp/wrong.pub"

          make_home() {
            local name="$1"
            mkdir -p "$tmp/$name/.ssh"
            chmod 700 "$tmp/$name/.ssh"
            : > "$tmp/$name/.ssh/known_hosts"
            chmod 600 "$tmp/$name/.ssh/known_hosts"
          }
          count_host() {
            local file="$1"
            ssh-keygen -F "$host" -f "$file" 2>/dev/null | grep -vc '^#' || true
          }

          # 0 entries -> one exact pinned entry.
          make_home zero
          zero_out="$(HOME="$tmp/zero" SERVER_HOST="$host" bash "$repair" REPAIR)"
          test "$(count_host "$tmp/zero/.ssh/known_hosts")" -eq 1
          grep -Fxq 'MATCHING_ENTRY_COUNT=1' <<< "$zero_out"
          grep -Fxq 'PINNED_MATCH_COUNT=1' <<< "$zero_out"
          HOME="$tmp/zero" SERVER_HOST="$host" bash "$verify" VERIFY_ONLY >/dev/null

          # One exact pinned entry -> true content no-op.
          make_home exact
          printf '%s %s %s\n' "$host" "$pinned_type" "$pinned_blob" > "$tmp/exact/.ssh/known_hosts"
          exact_before="$(sha256sum "$tmp/exact/.ssh/known_hosts" | awk '{print $1}')"
          exact_out="$(HOME="$tmp/exact" SERVER_HOST="$host" bash "$repair" REPAIR)"
          exact_after="$(sha256sum "$tmp/exact/.ssh/known_hosts" | awk '{print $1}')"
          test "$exact_before" = "$exact_after"
          grep -Fxq 'REPAIR_EFFECTIVE_CHANGE=NO' <<< "$exact_out"

          # Duplicate pinned -> converge to one.
          make_home duplicate
          {
            printf '%s %s %s\n' "$host" "$pinned_type" "$pinned_blob"
            printf '%s %s %s\n' "$host" "$pinned_type" "$pinned_blob"
          } > "$tmp/duplicate/.ssh/known_hosts"
          HOME="$tmp/duplicate" SERVER_HOST="$host" bash "$repair" REPAIR >/dev/null
          test "$(count_host "$tmp/duplicate/.ssh/known_hosts")" -eq 1
          HOME="$tmp/duplicate" SERVER_HOST="$host" bash "$verify" VERIFY_ONLY >/dev/null

          # Pinned + wrong -> bounded convergence.
          make_home mixed
          {
            printf '%s %s %s\n' "$host" "$pinned_type" "$pinned_blob"
            printf '%s %s %s\n' "$host" "$wrong_type" "$wrong_blob"
          } > "$tmp/mixed/.ssh/known_hosts"
          HOME="$tmp/mixed" SERVER_HOST="$host" bash "$repair" REPAIR >/dev/null
          test "$(count_host "$tmp/mixed/.ssh/known_hosts")" -eq 1
          HOME="$tmp/mixed" SERVER_HOST="$host" bash "$verify" VERIFY_ONLY >/dev/null

          # Wrong-only -> replace with pinned identity.
          make_home wrong
          printf '%s %s %s\n' "$host" "$wrong_type" "$wrong_blob" > "$tmp/wrong-home/.missing" 2>/dev/null || true
          mkdir -p "$tmp/wrong-home/.ssh"
          chmod 700 "$tmp/wrong-home/.ssh"
          printf '%s %s %s\n' "$host" "$wrong_type" "$wrong_blob" > "$tmp/wrong-home/.ssh/known_hosts"
          chmod 600 "$tmp/wrong-home/.ssh/known_hosts"
          HOME="$tmp/wrong-home" SERVER_HOST="$host" bash "$repair" REPAIR >/dev/null
          HOME="$tmp/wrong-home" SERVER_HOST="$host" bash "$verify" VERIFY_ONLY >/dev/null

          # Unrelated line remains byte-for-byte identical.
          make_home unrelated
          unrelated_line="$unrelated $wrong_type $wrong_blob"
          {
            printf '%s\n' "$unrelated_line"
            printf '%s %s %s\n' "$host" "$wrong_type" "$wrong_blob"
          } > "$tmp/unrelated/.ssh/known_hosts"
          HOME="$tmp/unrelated" SERVER_HOST="$host" bash "$repair" REPAIR >/dev/null
          grep -Fxq "$unrelated_line" "$tmp/unrelated/.ssh/known_hosts"
          test "$(grep -Fxc "$unrelated_line" "$tmp/unrelated/.ssh/known_hosts")" -eq 1

          # Plain multi-host alias preserves the unrelated alias association.
          make_home alias-home
          printf '%s,%s %s %s\n' "$host" "$alias" "$wrong_type" "$wrong_blob" > "$tmp/alias-home/.ssh/known_hosts"
          class_alias="$(HOME="$tmp/alias-home" SERVER_HOST="$host" bash "$repair" CLASSIFY)"
          grep -Fxq 'ALIASED_MATCH_PRESENT=YES' <<< "$class_alias"
          HOME="$tmp/alias-home" SERVER_HOST="$host" bash "$repair" REPAIR >/dev/null
          grep -Fxq "$alias $wrong_type $wrong_blob" "$tmp/alias-home/.ssh/known_hosts"
          HOME="$tmp/alias-home" SERVER_HOST="$host" bash "$verify" VERIFY_ONLY >/dev/null

          # Hashed match fails closed without mutation.
          make_home hashed
          printf '%s %s %s\n' "$host" "$wrong_type" "$wrong_blob" > "$tmp/hashed/.ssh/known_hosts"
          ssh-keygen -q -H -f "$tmp/hashed/.ssh/known_hosts" >/dev/null
          rm -f "$tmp/hashed/.ssh/known_hosts.old"
          hashed_before="$(sha256sum "$tmp/hashed/.ssh/known_hosts" | awk '{print $1}')"
          class_hashed="$(HOME="$tmp/hashed" SERVER_HOST="$host" bash "$repair" CLASSIFY)"
          grep -Fxq 'HASHED_MATCH_PRESENT=YES' <<< "$class_hashed"
          set +e
          HOME="$tmp/hashed" SERVER_HOST="$host" bash "$repair" REPAIR >/dev/null 2>&1
          hashed_status=$?
          set -e
          test "$hashed_status" -eq 80
          hashed_after="$(sha256sum "$tmp/hashed/.ssh/known_hosts" | awk '{print $1}')"
          test "$hashed_before" = "$hashed_after"

          # Forced post-verify failure restores the exact pre-repair local file.
          make_home rollback
          {
            printf '%s %s %s\n' "$unrelated" "$wrong_type" "$wrong_blob"
            printf '%s %s %s\n' "$host" "$wrong_type" "$wrong_blob"
          } > "$tmp/rollback/.ssh/known_hosts"
          cp "$tmp/rollback/.ssh/known_hosts" "$tmp/rollback-before"
          set +e
          HOME="$tmp/rollback" SERVER_HOST="$host" AGENCY_840_SYNTHETIC_TEST=1 AGENCY_840_TEST_FORCE_POST_VERIFY_FAILURE=1 bash "$repair" REPAIR >/dev/null 2>&1
          rollback_status=$?
          set -e
          test "$rollback_status" -eq 83
          cmp -s "$tmp/rollback-before" "$tmp/rollback/.ssh/known_hosts"

          # Second repair is idempotent with no effective change.
          make_home idempotent
          printf '%s %s %s\n' "$host" "$wrong_type" "$wrong_blob" > "$tmp/idempotent/.ssh/known_hosts"
          HOME="$tmp/idempotent" SERVER_HOST="$host" bash "$repair" REPAIR >/dev/null
          first_hash="$(sha256sum "$tmp/idempotent/.ssh/known_hosts" | awk '{print $1}')"
          second_out="$(HOME="$tmp/idempotent" SERVER_HOST="$host" bash "$repair" REPAIR)"
          second_hash="$(sha256sum "$tmp/idempotent/.ssh/known_hosts" | awk '{print $1}')"
          test "$first_hash" = "$second_hash"
          grep -Fxq 'REPAIR_EFFECTIVE_CHANGE=NO' <<< "$second_out"

          # Existing VERIFY_ONLY ambiguity remains fail-closed with exit 76.
          make_home verify-ambiguous
          {
            printf '%s %s %s\n' "$host" "$pinned_type" "$pinned_blob"
            printf '%s %s %s\n' "$host" "$wrong_type" "$wrong_blob"
          } > "$tmp/verify-ambiguous/.ssh/known_hosts"
          set +e
          HOME="$tmp/verify-ambiguous" SERVER_HOST="$host" bash "$verify" VERIFY_ONLY >/dev/null 2>&1
          verify_status=$?
          set -e
          test "$verify_status" -eq 76
