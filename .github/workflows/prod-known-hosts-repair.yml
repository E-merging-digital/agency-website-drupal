name: Governed PROD known_hosts local repair

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: agency-prod-known-hosts-repair
  cancel-in-progress: false

jobs:
  validate-authority:
    name: Validate fresh owner PROD known_hosts repair authority
    if: >-
      ${{
        github.event.issue.pull_request == null &&
        github.event.issue.number == 840 &&
        startsWith(github.event.comment.body, '/agency-prod-known-hosts-repair repair ')
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    outputs:
      request_id: ${{ steps.authority.outputs.request_id }}
      authority_comment_id: ${{ steps.authority.outputs.authority_comment_id }}
      main_sha: ${{ steps.authority.outputs.main_sha }}
    steps:
      - name: Validate actor, one-shot request and exact live main
        id: authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRIGGER_COMMENT: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          AUTHORITY_COMMENT_ID: ${{ github.event.comment.id }}
          EVENT_DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'E-merging-digital' ]]
          [[ "$COMMENT_AUTHOR" == "$GITHUB_ACTOR" ]]
          [[ "$ISSUE_NUMBER" == '840' ]]
          [[ "$GITHUB_RUN_ATTEMPT" == '1' ]] || {
            echo 'PROD known_hosts repair authority cannot be replayed through a workflow rerun.' >&2
            exit 1
          }
          [[ "$AUTHORITY_COMMENT_ID" =~ ^[0-9]+$ ]]

          read -r command verb request_id requested_main extra <<< "$TRIGGER_COMMENT"
          [[ -z "${extra:-}" ]]
          [[ "$command" == '/agency-prod-known-hosts-repair' ]]
          [[ "$verb" == 'repair' ]]
          [[ "$request_id" =~ ^[A-Za-z0-9._-]{8,80}$ ]]
          [[ "$requested_main" =~ ^[0-9a-f]{40}$ ]]
          expected="/agency-prod-known-hosts-repair repair $request_id $requested_main"
          [[ "$TRIGGER_COMMENT" == "$expected" ]]

          issue_json="$(gh api "repos/$GITHUB_REPOSITORY/issues/840")"
          [[ "$(jq -r '.state' <<< "$issue_json")" == 'open' ]]
          [[ "$(jq -r '.pull_request // empty' <<< "$issue_json")" == '' ]]
          [[ "$(jq -r '.user.login' <<< "$issue_json")" == 'E-merging-digital' ]]

          live_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$requested_main" == "$live_main" ]] || {
            echo 'Requested main SHA is stale.' >&2
            exit 1
          }
          [[ "$EVENT_DEFAULT_SHA" == "$live_main" ]] || {
            echo 'Repair workflow must execute tooling from exact live main.' >&2
            exit 1
          }

          comments="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/840/comments?per_page=100" --jq '.[].body')"
          request_prefix="/agency-prod-known-hosts-repair repair $request_id "
          match_count=0
          while IFS= read -r body; do
            if [[ "$body" == "$request_prefix"* ]]; then
              match_count=$((match_count + 1))
            fi
          done <<< "$comments"
          [[ "$match_count" -eq 1 ]] || {
            echo 'request_id must be fresh and appear in exactly one owner authority comment.' >&2
            exit 1
          }

          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "authority_comment_id=$AUTHORITY_COMMENT_ID" >> "$GITHUB_OUTPUT"
          echo "main_sha=$live_main" >> "$GITHUB_OUTPUT"

      - name: Checkout exact trusted main tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.authority.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate repository-pinned PROD trust authority only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ steps.authority.outputs.main_sha }}'
          bash -n scripts/production-ssh-trust/manage-known-host.sh
          bash -n scripts/production-ssh-trust/repair-known-hosts.sh
          read -r key_type key_blob _ < scripts/production-ssh-trust/prod-ed25519.pub
          test "$key_type" = 'ssh-ed25519'
          test "$key_blob" = 'AAAAC3NzaC1lZDI1NTE5AAAAIHBzADlwNcSFBP6sYfGBH2SvD5NymTF6n2Ze996V4TqR'
          fingerprint="$(ssh-keygen -lf scripts/production-ssh-trust/prod-ed25519.pub -E sha256 | awk '{print $2}')"
          test "$fingerprint" = 'SHA256:Pflpbgh2vc9dUYe4fpXPxdwzhPqyy8vmbAOcS+BRLDQ'
          grep -Fxq "$fingerprint" scripts/production-ssh-trust/prod-ed25519.sha256

  repair-runner-local-trust:
    name: Repair only local PROD known_hosts state on Agency runner
    needs: validate-authority
    runs-on:
      - self-hosted
      - linux
      - x64
      - agency
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact trusted main tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-authority.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact Agency runner and prohibit synthetic hooks
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_NAME" == 'agency-browser-runner-01' ]] || {
            echo 'PROD known_hosts repair is restricted to agency-browser-runner-01.' >&2
            exit 1
          }
          unset AGENCY_840_SYNTHETIC_TEST AGENCY_840_TEST_FORCE_POST_VERIFY_FAILURE

      - name: Classify, repair and prove local trust idempotently
        id: repair
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          unset AGENCY_840_SYNTHETIC_TEST AGENCY_840_TEST_FORCE_POST_VERIFY_FAILURE
          before="$(SERVER_HOST="$SERVER_HOST" bash scripts/production-ssh-trust/repair-known-hosts.sh CLASSIFY)"
          first="$(SERVER_HOST="$SERVER_HOST" bash scripts/production-ssh-trust/repair-known-hosts.sh REPAIR)"
          known_hosts="$HOME/.ssh/known_hosts"
          first_hash="$(sha256sum "$known_hosts" | awk '{print $1}')"
          second="$(SERVER_HOST="$SERVER_HOST" bash scripts/production-ssh-trust/repair-known-hosts.sh REPAIR)"
          second_hash="$(sha256sum "$known_hosts" | awk '{print $1}')"
          test "$first_hash" = "$second_hash"
          grep -Fxq 'REPAIR_EFFECTIVE_CHANGE=NO' <<< "$second"
          after="$(SERVER_HOST="$SERVER_HOST" bash scripts/production-ssh-trust/repair-known-hosts.sh CLASSIFY)"
          verify="$(SERVER_HOST="$SERVER_HOST" bash scripts/production-ssh-trust/manage-known-host.sh VERIFY_ONLY)"

          value() {
            local key="$1" data="$2"
            awk -F= -v key="$key" '$1 == key { print substr($0, index($0, "=") + 1); exit }' <<< "$data"
          }

          mkdir -p artifacts/prod-known-hosts-repair
          evidence='artifacts/prod-known-hosts-repair/evidence.env'
          {
            printf 'schema_version=1\n'
            printf 'request_id=%s\n' '${{ needs.validate-authority.outputs.request_id }}'
            printf 'authority_comment_id=%s\n' '${{ needs.validate-authority.outputs.authority_comment_id }}'
            printf 'repository_sha=%s\n' '${{ needs.validate-authority.outputs.main_sha }}'
            printf 'RUNNER=%s\n' "$RUNNER_NAME"
            printf 'MATCHING_ENTRY_COUNT_BEFORE=%s\n' "$(value MATCHING_ENTRY_COUNT "$before")"
            printf 'PINNED_MATCH_COUNT_BEFORE=%s\n' "$(value PINNED_MATCH_COUNT "$before")"
            printf 'NON_PINNED_MATCH_COUNT_BEFORE=%s\n' "$(value NON_PINNED_MATCH_COUNT "$before")"
            printf 'KEY_TYPES_BEFORE=%s\n' "$(value KEY_TYPES "$before")"
            printf 'ALIASED_MATCH_PRESENT_BEFORE=%s\n' "$(value ALIASED_MATCH_PRESENT "$before")"
            printf 'HASHED_MATCH_PRESENT_BEFORE=%s\n' "$(value HASHED_MATCH_PRESENT "$before")"
            printf 'MATCHING_ENTRY_COUNT_AFTER=%s\n' "$(value MATCHING_ENTRY_COUNT "$after")"
            printf 'PINNED_MATCH_COUNT_AFTER=%s\n' "$(value PINNED_MATCH_COUNT "$after")"
            printf 'NON_PINNED_MATCH_COUNT_AFTER=%s\n' "$(value NON_PINNED_MATCH_COUNT "$after")"
            printf 'KEY_TYPES_AFTER=%s\n' "$(value KEY_TYPES "$after")"
            printf 'ALIASED_MATCH_PRESENT_AFTER=%s\n' "$(value ALIASED_MATCH_PRESENT "$after")"
            printf 'HASHED_MATCH_PRESENT_AFTER=%s\n' "$(value HASHED_MATCH_PRESENT "$after")"
            printf 'FIRST_REPAIR_RESULT=%s\n' "$(value REPAIR_RESULT "$first")"
            printf 'SECOND_REPAIR_EFFECTIVE_CHANGE=%s\n' "$(value REPAIR_EFFECTIVE_CHANGE "$second")"
            printf 'LOCAL_BACKUP_ROLLBACK_CONTRACT=ENFORCED\n'
            printf 'NO_NETWORK_DERIVED_TRUST=PASS\n'
            printf 'PROD_SSH_SESSION=NONE\n'
            printf 'PROD_DB_READ=NONE\n'
            printf 'PROD_WRITE=NONE\n'
            printf 'KNOWN_HOSTS_MATCH=%s\n' "$(value KNOWN_HOSTS_MATCH "$verify")"
            printf 'FINGERPRINT=%s\n' "$(value FINGERPRINT "$verify")"
          } > "$evidence"
          chmod 600 "$evidence"

          grep -Fxq 'MATCHING_ENTRY_COUNT_AFTER=1' "$evidence"
          grep -Fxq 'PINNED_MATCH_COUNT_AFTER=1' "$evidence"
          grep -Fxq 'NON_PINNED_MATCH_COUNT_AFTER=0' "$evidence"
          grep -Fxq 'KEY_TYPES_AFTER=ssh-ed25519' "$evidence"
          grep -Fxq 'SECOND_REPAIR_EFFECTIVE_CHANGE=NO' "$evidence"
          grep -Fxq 'KNOWN_HOSTS_MATCH=PASS' "$evidence"
          grep -Fxq 'FINGERPRINT=SHA256:Pflpbgh2vc9dUYe4fpXPxdwzhPqyy8vmbAOcS+BRLDQ' "$evidence"
          grep -Fxq 'PROD_SSH_SESSION=NONE' "$evidence"
          grep -Fxq 'PROD_DB_READ=NONE' "$evidence"
          grep -Fxq 'PROD_WRITE=NONE' "$evidence"

      - name: Upload metadata-only local trust repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: agency-prod-known-hosts-repair-${{ needs.validate-authority.outputs.request_id }}-${{ github.run_id }}
          path: artifacts/prod-known-hosts-repair/evidence.env
          if-no-files-found: error
          retention-days: 14
