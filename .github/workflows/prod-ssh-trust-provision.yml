name: Governed PROD SSH trust provisioning

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read

concurrency:
  group: agency-prod-ssh-trust
  cancel-in-progress: false

jobs:
  validate-authority:
    name: Validate fresh owner SSH trust authority
    if: >-
      ${{
        github.event.issue.pull_request == null &&
        github.event.issue.number == 830 &&
        startsWith(github.event.comment.body, '/agency-prod-ssh-trust provision ')
      }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    outputs:
      request_id: ${{ steps.authority.outputs.request_id }}
      authority_comment_id: ${{ steps.authority.outputs.authority_comment_id }}
      main_sha: ${{ steps.authority.outputs.main_sha }}
    steps:
      - name: Validate actor, one-shot request and live main
        id: authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRIGGER_COMMENT: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          AUTHORITY_COMMENT_ID: ${{ github.event.comment.id }}
          EVENT_DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == 'E-merging-digital' ]]
          [[ "$COMMENT_AUTHOR" == "$GITHUB_ACTOR" ]]
          [[ "$ISSUE_NUMBER" == '830' ]]
          [[ "$GITHUB_RUN_ATTEMPT" == '1' ]] || {
            echo 'SSH trust authority cannot be replayed through a workflow rerun.' >&2
            exit 1
          }
          [[ "$AUTHORITY_COMMENT_ID" =~ ^[0-9]+$ ]]

          read -r command verb request_id requested_main extra <<< "$TRIGGER_COMMENT"
          [[ -z "${extra:-}" ]]
          [[ "$command" == '/agency-prod-ssh-trust' ]]
          [[ "$verb" == 'provision' ]]
          [[ "$request_id" =~ ^[A-Za-z0-9._-]{8,80}$ ]]
          [[ "$requested_main" =~ ^[0-9a-f]{40}$ ]]
          expected="/agency-prod-ssh-trust provision $request_id $requested_main"
          [[ "$TRIGGER_COMMENT" == "$expected" ]]

          issue_json="$(gh api "repos/$GITHUB_REPOSITORY/issues/830")"
          [[ "$(jq -r '.state' <<< "$issue_json")" == 'open' ]]
          [[ "$(jq -r '.pull_request // empty' <<< "$issue_json")" == '' ]]
          [[ "$(jq -r '.user.login' <<< "$issue_json")" == 'E-merging-digital' ]]

          live_main="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$requested_main" == "$live_main" ]] || {
            echo 'Requested main SHA is stale.' >&2
            exit 1
          }
          [[ "$EVENT_DEFAULT_SHA" == "$live_main" ]] || {
            echo 'SSH trust workflow must execute tooling from live main.' >&2
            exit 1
          }

          comments="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/830/comments?per_page=100" --jq '.[].body')"
          request_prefix="/agency-prod-ssh-trust provision $request_id "
          match_count=0
          while IFS= read -r body; do
            if [[ "$body" == "$request_prefix"* ]]; then
              match_count=$((match_count + 1))
            fi
          done <<< "$comments"
          [[ "$match_count" -eq 1 ]] || {
            echo 'request_id must be fresh and appear in exactly one owner authority comment.' >&2
            exit 1
          }

          echo "request_id=$request_id" >> "$GITHUB_OUTPUT"
          echo "authority_comment_id=$AUTHORITY_COMMENT_ID" >> "$GITHUB_OUTPUT"
          echo "main_sha=$live_main" >> "$GITHUB_OUTPUT"

      - name: Checkout exact trusted main tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.authority.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate pinned trust anchor without network lookup
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ steps.authority.outputs.main_sha }}'
          test "$(ssh-keygen -lf scripts/production-ssh-trust/prod-ed25519.pub -E sha256 | awk '{print $2}')" = 'SHA256:Pflpbgh2vc9dUYe4fpXPxdwzhPqyy8vmbAOcS+BRLDQ'
          grep -Fxq 'SHA256:Pflpbgh2vc9dUYe4fpXPxdwzhPqyy8vmbAOcS+BRLDQ' scripts/production-ssh-trust/prod-ed25519.sha256
          bash -n scripts/production-ssh-trust/manage-known-host.sh

  provision:
    name: Provision exact pinned PROD host identity on Agency runner
    needs: validate-authority
    runs-on:
      - self-hosted
      - linux
      - x64
      - agency
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact trusted main tooling
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-authority.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact Agency runner identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_NAME" == 'agency-browser-runner-01' ]] || {
            echo 'SSH trust provisioning is restricted to agency-browser-runner-01.' >&2
            exit 1
          }

      - name: Inspect and provision pinned PROD host identity
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SERVER_HOST"
          SERVER_HOST="$SERVER_HOST" bash scripts/production-ssh-trust/manage-known-host.sh PROVISION >/dev/null

      - name: Prove exact post-provision trust without network lookup
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          REQUEST_ID: ${{ needs.validate-authority.outputs.request_id }}
          AUTHORITY_COMMENT_ID: ${{ needs.validate-authority.outputs.authority_comment_id }}
          REPOSITORY_SHA: ${{ needs.validate-authority.outputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/production-ssh-trust
          evidence='artifacts/production-ssh-trust/evidence.env'
          {
            printf 'schema_version=1\n'
            printf 'request_id=%s\n' "$REQUEST_ID"
            printf 'authority_comment_id=%s\n' "$AUTHORITY_COMMENT_ID"
            printf 'repository_sha=%s\n' "$REPOSITORY_SHA"
            printf 'RUNNER=%s\n' "$RUNNER_NAME"
            SERVER_HOST="$SERVER_HOST" bash scripts/production-ssh-trust/manage-known-host.sh VERIFY_ONLY
          } > "$evidence"
          chmod 600 "$evidence"
          grep -Fxq 'RUNNER=agency-browser-runner-01' "$evidence"
          grep -Fxq 'ENTRY_COUNT_FOR_SERVER_HOST=1' "$evidence"
          grep -Fxq 'KEY_TYPE=ssh-ed25519' "$evidence"
          grep -Fxq 'KEY_BLOB_MATCH=PASS' "$evidence"
          grep -Fxq 'FINGERPRINT=SHA256:Pflpbgh2vc9dUYe4fpXPxdwzhPqyy8vmbAOcS+BRLDQ' "$evidence"
          grep -Fxq 'TRUST_SOURCE=OUT_OF_BAND_PROD_CONSOLE' "$evidence"
          grep -Fxq 'KNOWN_HOSTS_MATCH=PASS' "$evidence"

      - name: Upload non-sensitive SSH trust evidence
        uses: actions/upload-artifact@v4
        with:
          name: agency-prod-ssh-trust-${{ needs.validate-authority.outputs.request_id }}-${{ github.run_id }}
          path: artifacts/production-ssh-trust/evidence.env
          if-no-files-found: error
          retention-days: 14
