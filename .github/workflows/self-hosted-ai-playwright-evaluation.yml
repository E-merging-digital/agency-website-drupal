name: Agency trusted AI Playwright evaluation

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: agency-ai-playwright-evaluation-${{ github.event.pull_request.base.sha }}
  cancel-in-progress: false

jobs:
  validate-target:
    name: Validate fixed AI Playwright pilot target
    if: ${{ github.event.pull_request.head.ref == 'feature/issue-499-ai-playwright-ddev-pilot' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.validate.outputs.head_sha }}
      base_sha: ${{ steps.validate.outputs.base_sha }}
    steps:
      - name: Validate same-repo exact-head inert pilot marker
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_ACTOR" != "E-merging-digital" && "$GITHUB_ACTOR" != "github-actions[bot]" ]]; then
            echo "Refusing pilot actor: $GITHUB_ACTOR" >&2
            exit 1
          fi

          [[ "$EVENT_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVENT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          state="$(jq -r '.state' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          base_sha="$(jq -r '.base.sha' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"

          [[ "$state" == "open" ]]
          [[ "$base_ref" == "main" ]]
          [[ "$head_ref" == "feature/issue-499-ai-playwright-ddev-pilot" ]]
          [[ "$head_repo" == "$GITHUB_REPOSITORY" ]]
          [[ "$head_sha" == "$EVENT_HEAD_SHA" ]]
          [[ "$base_sha" == "$EVENT_BASE_SHA" ]]

          mapfile -t changed_files < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename'
          )
          if [[ "${#changed_files[@]}" -ne 1 || "${changed_files[0]}" != "docs/evaluations/ai-playwright-456-pilot.md" ]]; then
            printf 'Pilot PR must change exactly the inert marker file; got:\n%s\n' "${changed_files[*]}" >&2
            exit 1
          fi

          marker="$(gh api "repos/$GITHUB_REPOSITORY/contents/docs/evaluations/ai-playwright-456-pilot.md?ref=$head_sha" --jq '.content' | tr -d '\n' | base64 --decode)"
          expected='AI Playwright DDEV pilot #456 — no production dependency.'
          [[ "$marker" == "$expected" ]]

          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

  report-start:
    name: Report trusted run locator before self-hosted wait
    needs: validate-target
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Publish validated run locator on pilot PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VALIDATED_BASE_SHA: ${{ needs.validate-target.outputs.base_sha }}
          VALIDATED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          ### Trusted AI Playwright evaluation — run locator

          - Run ID: \`${GITHUB_RUN_ID}\` (attempt \`${GITHUB_RUN_ATTEMPT}\`)
          - PR: \`#${PR_NUMBER}\`
          - Trusted base: \`${VALIDATED_BASE_SHA}\`
          - Pilot HEAD: \`${VALIDATED_HEAD_SHA}\`
          - State: \`validated; self-hosted pending\`

          The validation gate completed on GitHub-hosted infrastructure. The self-hosted job may still be queued, running, or waiting for runner capacity. Use this Run ID for Actions inspection; no product decision should be made until the final bounded report and artifact are inspected.
          EOF
          )"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"

  ai-playwright-evaluation:
    name: Run isolated provider-free DDEV evaluation
    needs: validate-target
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      evidence_status: ${{ steps.summarize.outputs.evidence_status }}
      failure_phase: ${{ steps.summarize.outputs.failure_phase }}
      failure_message: ${{ steps.summarize.outputs.failure_message }}
      artifact_name: ${{ steps.summarize.outputs.artifact_name }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - agency
      - ddev
      - browser

    steps:
      - name: Verify runner identity and trusted toolchain
        shell: bash
        run: |
          set -euo pipefail
          hostname
          whoami
          id
          command -v git
          git --version
          command -v docker
          docker --version
          command -v ddev
          ddev version
          command -v jq

      - name: Checkout trusted implementation from base
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-target.outputs.base_sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact inert pilot target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-target.outputs.head_sha }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkouts and immutable runner logic
        shell: bash
        env:
          EXPECTED_BASE_SHA: ${{ needs.validate-target.outputs.base_sha }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(git -C trusted rev-parse HEAD)" = "$EXPECTED_BASE_SHA"
          test "$(git -C target rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -f trusted/scripts/runner/run-ai-playwright-evaluation.sh
          bash -n trusted/scripts/runner/run-ai-playwright-evaluation.sh
          test "$(cat target/docs/evaluations/ai-playwright-456-pilot.md)" = 'AI Playwright DDEV pilot #456 — no production dependency.'

      - name: Isolate DDEV project for this evaluation
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          cat > .ddev/config.gate-ai-playwright-ci.yaml <<EOF
          name: agency-ai-playwright-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          EOF
          ddev utility configyaml | grep -F "agency-ai-playwright-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ddev start -y

      - name: Run trusted provider-free AI Playwright evaluation
        shell: bash
        env:
          TARGET_DIR: ${{ github.workspace }}/target
          ARTIFACT_DIR: ${{ github.workspace }}/target/artifacts/ai-playwright-evaluation
        run: |
          set -euo pipefail
          bash trusted/scripts/runner/run-ai-playwright-evaluation.sh

      - name: Summarize bounded evaluation metadata
        id: summarize
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          result_file='target/artifacts/ai-playwright-evaluation/result.json'
          evidence_status='MISSING'
          failure_phase='n/a'
          failure_message='result.json unavailable'

          if [[ -s "$result_file" ]] && jq -e . "$result_file" >/dev/null 2>&1; then
            evidence_status="$(jq -r '.status // "UNKNOWN"' "$result_file")"
            failure_phase="$(jq -r '.phase // "n/a"' "$result_file")"
            failure_message="$(jq -r '.message // "n/a"' "$result_file")"
          fi

          failure_phase="$(printf '%s' "$failure_phase" | tr '\r\n' '  ' | cut -c1-80)"
          failure_message="$(printf '%s' "$failure_message" | tr '\r\n' '  ' | cut -c1-200)"
          artifact_name="agency-ai-playwright-evaluation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "evidence_status=$evidence_status" >> "$GITHUB_OUTPUT"
          echo "failure_phase=$failure_phase" >> "$GITHUB_OUTPUT"
          echo "failure_message=$failure_message" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload AI Playwright evaluation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agency-ai-playwright-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/artifacts/ai-playwright-evaluation
          if-no-files-found: error
          retention-days: 14

      - name: Clean isolated DDEV and workspaces
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          if [[ -d target ]]; then
            (
              cd target
              ddev delete --omit-snapshot --yes
            )
          fi
          cd "$GITHUB_WORKSPACE"
          rm -rf target trusted

  report-result:
    name: Report bounded evaluation result
    needs:
      - validate-target
      - ai-playwright-evaluation
    if: ${{ always() && needs.validate-target.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Publish run locator and bounded outcome on pilot PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JOB_RESULT: ${{ needs.ai-playwright-evaluation.result }}
          EVIDENCE_STATUS: ${{ needs.ai-playwright-evaluation.outputs.evidence_status }}
          FAILURE_PHASE: ${{ needs.ai-playwright-evaluation.outputs.failure_phase }}
          FAILURE_MESSAGE: ${{ needs.ai-playwright-evaluation.outputs.failure_message }}
          ARTIFACT_NAME: ${{ needs.ai-playwright-evaluation.outputs.artifact_name }}
        run: |
          set -euo pipefail
          body="$(cat <<EOF
          ### Trusted AI Playwright evaluation

          - Run ID: \`${GITHUB_RUN_ID}\` (attempt \`${GITHUB_RUN_ATTEMPT}\`)
          - Self-hosted job: \`${JOB_RESULT}\`
          - Evidence status: \`${EVIDENCE_STATUS:-MISSING}\`
          - Failure phase: \`${FAILURE_PHASE:-n/a}\`
          - Failure message: \`${FAILURE_MESSAGE:-n/a}\`
          - Artifact: \`${ARTIFACT_NAME:-agency-ai-playwright-evaluation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}\`

          This comment contains only bounded execution metadata. Inspect the artifact before any product decision.
          EOF
          )"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
