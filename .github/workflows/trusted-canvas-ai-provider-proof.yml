name: Agency trusted Canvas AI provider proof

on:
  workflow_call:
    secrets:
      OPENAI_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  validate-target:
    name: Validate bounded Canvas AI provider target
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.validate.outputs.head_sha }}
    steps:
      - name: Revalidate owner, #530, PR #533 and exact bounded diff
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IS_PULL_REQUEST: ${{ github.event.issue.pull_request != null }}
          TRIGGER_COMMENT: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_FROM_APP: ${{ github.event.comment.performed_via_github_app != null }}
        run: |
          set -euo pipefail

          test "$EVENT_NAME" = 'issue_comment'
          test "$ISSUE_NUMBER" = '530'
          test "$IS_PULL_REQUEST" = 'false'
          test "$COMMENT_AUTHOR" = 'E-merging-digital'
          test "$COMMENT_AUTHOR_ASSOCIATION" = 'OWNER'
          test "$COMMENT_FROM_APP" = 'false'
          test "$GITHUB_ACTOR" = 'E-merging-digital'
          test "$COMMENT_AUTHOR" = "$GITHUB_ACTOR"

          if [[ ! "$TRIGGER_COMMENT" =~ ^/agency-canvas-ai-provider-proof\ run\ pr=533\ sha=([0-9a-f]{40})$ ]]; then
            echo 'Invalid #530 provider-proof command.' >&2
            exit 1
          fi
          requested_sha="${BASH_REMATCH[1]}"

          issue_json="$(gh api "repos/$GITHUB_REPOSITORY/issues/530")"
          test "$(jq -r '.state' <<<"$issue_json")" = 'open'
          test "$(jq -r '.pull_request // empty' <<<"$issue_json")" = ''

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/533")"
          state="$(jq -r '.state' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"

          test "$state" = 'open'
          test "$base_ref" = 'main'
          test "$head_ref" = 'feature/issue-530-bounded-canvas-ai-composition'
          test "$head_repo" = "$GITHUB_REPOSITORY"
          test "$head_sha" = "$requested_sha"

          mapfile -t changed_files < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/533/files?per_page=100" --jq '.[].filename' | sort
          )
          allowed_files="$(cat <<'EOF'
          composer.json
          composer.lock
          config/sync/canvas_ai.settings.yml
          config/sync/core.extension.yml
          docs/ai/canvas-ai-proof-policy.yml
          tests/browser/canvas-ai-provider-proof.spec.mjs
          web/modules/custom/agency_project_tests/tests/src/Unit/CanvasAiPreProviderAuditTest.php
          EOF
          )"

          unexpected=''
          for path in "${changed_files[@]}"; do
            if ! grep -Fxq "$path" <<<"$allowed_files"; then
              unexpected+="$path"$'\n'
            fi
          done
          if [[ -n "$unexpected" ]]; then
            printf 'Provider proof target contains untrusted files:\n%s' "$unexpected" >&2
            exit 1
          fi

          required_files=(
            composer.json
            composer.lock
            config/sync/core.extension.yml
            docs/ai/canvas-ai-proof-policy.yml
            tests/browser/canvas-ai-provider-proof.spec.mjs
            web/modules/custom/agency_project_tests/tests/src/Unit/CanvasAiPreProviderAuditTest.php
          )
          for path in "${required_files[@]}"; do
            if ! printf '%s\n' "${changed_files[@]}" | grep -Fxq "$path"; then
              echo "Required #530 proof file missing from target diff: $path" >&2
              exit 1
            fi
          done

          echo "head_sha=$requested_sha" >> "$GITHUB_OUTPUT"

  report-start:
    name: Publish provider proof run locator
    needs: validate-target
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Publish trusted run locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.validate-target.outputs.head_sha }}
        run: |
          set -euo pipefail
          gh pr comment 533 --repo "$GITHUB_REPOSITORY" --body "### Canvas AI provider proof — trusted run locator

          - Run ID: \`${GITHUB_RUN_ID}\` (attempt \`${GITHUB_RUN_ATTEMPT}\`)
          - Exact target: \`${TARGET_SHA}\`
          - State: \`validated; provider proof pending\`

          The #530 issue authority, exact #533 live HEAD and bounded product diff were revalidated on GitHub-hosted infrastructure before the secret-capable self-hosted job was admitted."

  provider-proof:
    name: Run one bounded Canvas AI provider composition
    needs:
      - validate-target
      - report-start
    timeout-minutes: 45
    permissions:
      contents: read
      issues: read
      pull-requests: read
    runs-on:
      - self-hosted
      - linux
      - x64
      - agency
      - ddev
      - browser
    outputs:
      evidence_status: ${{ steps.summarize.outputs.evidence_status }}
      failure_phase: ${{ steps.summarize.outputs.failure_phase }}
      artifact_name: ${{ steps.summarize.outputs.artifact_name }}
    steps:
      - name: Verify runner identity and trusted toolchain
        shell: bash
        run: |
          set -euo pipefail
          hostname
          whoami
          id
          command -v git
          command -v docker
          command -v ddev
          command -v jq
          git --version
          docker --version
          ddev version

      - name: Checkout exact validated target
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-target.outputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact checkout and immutable proof route
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -f tests/browser/canvas-ai-provider-proof.spec.mjs
          test -f docs/ai/canvas-ai-proof-policy.yml
          test -f package-lock.json
          git diff --check

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install chromium

      - name: Materialize trusted Playwright config from main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trusted_playwright_config='.agency-trusted-playwright.config.mjs'
          trusted_playwright_blob="$(
            gh api               "repos/$GITHUB_REPOSITORY/contents/playwright.config.mjs?ref=$GITHUB_SHA"               --jq '.sha'
          )"
          [[ "$trusted_playwright_blob" =~ ^[0-9a-f]{40}$ ]]
          gh api             "repos/$GITHUB_REPOSITORY/contents/playwright.config.mjs?ref=$GITHUB_SHA"             --jq '.content' |
            base64 -d > "$trusted_playwright_config"
          test -s "$trusted_playwright_config"
          grep -Fq             "process.env.CANVAS_AI_PROVIDER_PROOF === '1'"             "$trusted_playwright_config"
          grep -Fq             "'**/canvas-ai-provider-proof.spec.mjs'"             "$trusted_playwright_config"
          printf 'TRUSTED_PLAYWRIGHT_CONFIG_SOURCE=MAIN / ref=%s\n' "$GITHUB_SHA"
          printf 'TRUSTED_PLAYWRIGHT_CONFIG_BLOB=%s\n' "$trusted_playwright_blob"

      - name: JIT revalidate #530 and exact live #533 HEAD before secret exposure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ needs.validate-target.outputs.head_sha }}
        run: |
          set -euo pipefail
          issue_json="$(gh api "repos/$GITHUB_REPOSITORY/issues/530")"
          test "$(jq -r '.state' <<<"$issue_json")" = 'open'
          test "$(jq -r '.pull_request // empty' <<<"$issue_json")" = ''

          pr_json="$(gh api "repos/$GITHUB_REPOSITORY/pulls/533")"
          test "$(jq -r '.state' <<<"$pr_json")" = 'open'
          test "$(jq -r '.base.ref' <<<"$pr_json")" = 'main'
          test "$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")" = "$GITHUB_REPOSITORY"
          test "$(jq -r '.head.ref' <<<"$pr_json")" = 'feature/issue-530-bounded-canvas-ai-composition'
          test "$(jq -r '.head.sha' <<<"$pr_json")" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Inject OpenAI key only into isolated DDEV runtime
        shell: bash
        env:
          PROVIDER_SECRET: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$PROVIDER_SECRET" ]]; then
            echo 'OPENAI_API_KEY repository secret is unavailable; refusing provider proof.' >&2
            exit 1
          fi
          umask 077
          printf 'OPENAI_API_KEY=%s\n' "$PROVIDER_SECRET" > .ddev/.env.web
          unset PROVIDER_SECRET
          test -s .ddev/.env.web

      - name: Rebuild exact target with provider available to Drupal only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > .ddev/config.gate-canvas-ai-provider.yaml <<EOF
          {name: agency-canvas-ai-provider-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}, host_mailpit_port: "19025", host_webserver_port: "19080", host_db_port: "19306", host_https_port: "19443", router_http_port: "19180", router_https_port: "19444"}
          EOF
          ddev utility configyaml | grep -F "agency-canvas-ai-provider-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ddev start -y
          ddev composer install --no-interaction --no-progress --prefer-dist

          admin_pass="$(openssl rand -hex 24)"
          ddev drush site:install --existing-config -y --account-pass="$admin_pass"
          unset admin_pass
          ddev drush cim -y
          ddev drush cr
          ddev drush emerging:governed-content --all
          ddev drush cr

          canvas_page_entity_id="$(
            ddev drush php:eval '
              $uuid = "52600000-0000-4000-8000-000000000001";
              $ids = \Drupal::entityQuery("canvas_page")
                ->accessCheck(FALSE)
                ->condition("uuid", $uuid)
                ->execute();
              if (count($ids) !== 1) {
                throw new \RuntimeException(sprintf(
                  "Expected exactly one governed canvas_page for the stable UUID; found %d.",
                  count($ids),
                ));
              }
              print (string) reset($ids);
            '
          )"
          if [[ -z "$canvas_page_entity_id" || ! "$canvas_page_entity_id" =~ ^[0-9]+$ ]]; then
            echo 'Governed Canvas page entity ID must be a non-empty numeric runtime value.' >&2
            exit 1
          fi
          printf 'CANVAS_AI_CANVAS_PAGE_ENTITY_ID=%s\n' "$canvas_page_entity_id" >> "$GITHUB_ENV"
          unset canvas_page_entity_id

          ddev drush php:eval '$key = \Drupal::service("key.repository")->getKey("openai_api_key"); if (!$key || trim((string) $key->getKeyValue()) === "") { throw new \RuntimeException("OpenAI key is unavailable through Drupal Key."); } print "Drupal Key provider readiness: OK\n";'

          config_status_raw="$(ddev drush config:status --format=json 2>/dev/null)"
          config_status_metadata="$(
            printf '%s' "$config_status_raw" |
              php scripts/runner/filter-config-status-metadata.php PREPROD
          )"
          unset config_status_raw
          config_status_payload="$(
            jq -c '{items: [.items[] | {config_name, state}]}' \
              <<<"$config_status_metadata"
          )"
          unset config_status_metadata
          config_status_b64="$(printf '%s' "$config_status_payload" | base64 -w 0)"
          unset config_status_payload

          trusted_gate="${RUNNER_TEMP}/canvas-ai-provider-config-drift-gate-1373.php"
          gh api \
            "repos/$GITHUB_REPOSITORY/contents/scripts/runner/canvas-ai-provider-config-drift-gate-1373.php?ref=$GITHUB_SHA" \
            --jq '.content' |
            base64 -d > "$trusted_gate"
          test -s "$trusted_gate"

          trusted_comparator="${RUNNER_TEMP}/canvas-runtime-diff-paths-995.php"
          gh api \
            "repos/$GITHUB_REPOSITORY/contents/scripts/runner/canvas-runtime-diff-paths-995.php?ref=$GITHUB_SHA" \
            --jq '.content' |
            base64 -d > "$trusted_comparator"
          test -s "$trusted_comparator"

          trusted_helper=".ddev/trusted-run-canvas-ai-provider-config-drift-gate-1375.sh"
          gh api \
            "repos/$GITHUB_REPOSITORY/contents/scripts/runner/run-canvas-ai-provider-config-drift-gate-1375.sh?ref=$GITHUB_SHA" \
            --jq '.content' |
            base64 -d > "$trusted_helper"
          test -s "$trusted_helper"
          ddev exec test -s \
            /var/www/html/.ddev/trusted-run-canvas-ai-provider-config-drift-gate-1375.sh

          gate_code="$(
            {
              tail -n +2 "$trusted_comparator"
              sed '1,/^declare(strict_types=1);$/d' "$trusted_gate"
            }
          )"
          gate_code_b64="$(printf '%s' "$gate_code" | base64 -w 0)"
          unset gate_code
          config_drift_evidence="$(
            ddev exec env \
              AGENCY_CANVAS_1373_EXECUTE=1 \
              AGENCY_CANVAS_1373_STATUS_B64="$config_status_b64" \
              AGENCY_CANVAS_1375_CODE_B64="$gate_code_b64" \
              bash /var/www/html/.ddev/trusted-run-canvas-ai-provider-config-drift-gate-1375.sh
          )"
          unset config_status_b64 gate_code_b64
          rm -f "$trusted_gate" "$trusted_comparator"

          jq -e '
            (keys | sort) == ["items", "summary"]
            and (.items | length == 19)
            and (.items | all(
              (keys | sort) == [
                "classification",
                "config_name",
                "differing_paths"
              ]
              and (.config_name | type == "string")
              and (.differing_paths | type == "array" and length > 0)
              and (.differing_paths | all(type == "string" and length > 0))
              and (
                .classification == "KNOWN_CANVAS_DETERMINISTIC_DRIFT_PATTERN"
                or .classification
                  == "UNEXPECTED_CANVAS_BUSINESS_PATH_REVIEW_REQUIRED"
              )
            ))
            and ((.summary | keys | sort) == ["known", "total", "unexpected"])
            and .summary.total == 19
            and .summary.known
              == ([.items[] | select(
                .classification == "KNOWN_CANVAS_DETERMINISTIC_DRIFT_PATTERN"
              )] | length)
            and .summary.unexpected
              == ([.items[] | select(
                .classification
                  == "UNEXPECTED_CANVAS_BUSINESS_PATH_REVIEW_REQUIRED"
              )] | length)
            and (.summary.known + .summary.unexpected) == 19
          ' <<<"$config_drift_evidence" >/dev/null
          printf 'CANVAS_CONFIG_DRIFT_EVIDENCE=%s\n' \
            "$(jq -c . <<<"$config_drift_evidence")"

          jq -e '
            (.items | all(
              .classification == "KNOWN_CANVAS_DETERMINISTIC_DRIFT_PATTERN"
            ))
            and .summary == {"total": 19, "known": 19, "unexpected": 0}
          ' <<<"$config_drift_evidence" >/dev/null
          printf 'CANVAS_CONFIG_DRIFT_GATE=PASS\n'
          unset config_drift_evidence

          base_url="$(ddev describe -j | jq -r '.. | strings | select(test("^https://"))' | head -n 1)"
          if [[ -z "$base_url" ]]; then
            echo 'Unable to resolve isolated DDEV HTTPS URL.' >&2
            exit 1
          fi
          login_url="$(ddev drush uli --uri="$base_url" --no-browser | tail -n 1)"
          if [[ ! "$login_url" =~ ^https?:// ]]; then
            echo 'Unable to generate one-time Drupal admin login URL.' >&2
            exit 1
          fi
          echo "::add-mask::$login_url"
          echo "PLAYWRIGHT_BASE_URL=$base_url" >> "$GITHUB_ENV"
          echo "CANVAS_AI_ADMIN_LOGIN_URL=$login_url" >> "$GITHUB_ENV"

      - name: Run exactly one provider-backed Canvas AI composition
        shell: bash
        env:
          CI: 'true'
          CANVAS_AI_PROVIDER_PROOF: '1'
        run: |
          set -euo pipefail
          npx playwright test tests/browser/canvas-ai-provider-proof.spec.mjs --project=desktop --workers=1 --config=.agency-trusted-playwright.config.mjs

      - name: Summarize bounded evidence
        id: summarize
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          result_file='artifacts/canvas-ai-provider-proof/result.json'
          evidence_status='MISSING'
          failure_phase='result_unavailable'
          if [[ -s "$result_file" ]] && jq -e . "$result_file" >/dev/null 2>&1; then
            evidence_status="$(jq -r '.status // "UNKNOWN"' "$result_file")"
            failure_phase="$(jq -r '.failure_phase // "none"' "$result_file")"
          fi
          {
            echo "evidence_status=$evidence_status"
            echo "failure_phase=$failure_phase"
            echo "artifact_name=agency-canvas-ai-provider-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload bounded Canvas AI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: agency-canvas-ai-provider-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/canvas-ai-provider-proof
            artifacts/browser-validation/test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 14

      - name: Remove secret runtime and clean DDEV/workspace
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          rm -f .ddev/.env.web
          ddev delete --omit-snapshot --yes
          rm -f .ddev/config.gate-canvas-ai-provider.yaml
          rm -f .ddev/trusted-run-canvas-ai-provider-config-drift-gate-1375.sh
          rm -f "${RUNNER_TEMP}/canvas-runtime-diff-paths-995.php"
          rm -f .agency-trusted-playwright.config.mjs
          git restore --worktree -- web/robots.txt config/sync
          git clean -fd -- config/sync
          rm -rf artifacts/canvas-ai-provider-proof artifacts/browser-validation/test-results playwright-report
          rmdir artifacts/browser-validation 2>/dev/null || true
          rmdir artifacts 2>/dev/null || true
          git diff --check
          status="$(git status --porcelain)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status" >&2
            exit 1
          fi

  report-result:
    name: Report bounded provider proof result
    if: ${{ always() && needs.validate-target.result == 'success' }}
    needs:
      - validate-target
      - report-start
      - provider-proof
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Publish bounded outcome without secret data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.validate-target.outputs.head_sha }}
          JOB_RESULT: ${{ needs.provider-proof.result }}
          EVIDENCE_STATUS: ${{ needs.provider-proof.outputs.evidence_status }}
          FAILURE_PHASE: ${{ needs.provider-proof.outputs.failure_phase }}
          ARTIFACT_NAME: ${{ needs.provider-proof.outputs.artifact_name }}
        run: |
          set -euo pipefail
          gh pr comment 533 --repo "$GITHUB_REPOSITORY" --body "### Canvas AI provider proof — bounded outcome

          - Exact target: \`${TARGET_SHA}\`
          - Self-hosted job: \`${JOB_RESULT}\`
          - Evidence status: \`${EVIDENCE_STATUS:-MISSING}\`
          - Failure phase: \`${FAILURE_PHASE:-n/a}\`
          - Artifact: \`${ARTIFACT_NAME:-agency-canvas-ai-provider-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}\`

          This report contains bounded execution metadata only. No provider secret is included. Inspect the artifact before any product admission decision."
