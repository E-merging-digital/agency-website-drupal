name: '#1046 Drupal 2027 Candidate PREPROD FR+EN'

on:
  pull_request:
    paths:
      - '.github/workflows/trusted-drupal-2027-preprod-candidate.yml'
      - 'scripts/runner/drupal-2027-preprod-candidate.php'
      - 'scripts/runner/drupal-2027-preprod-candidate-runner.php'
      - 'scripts/runner/run-drupal-2027-preprod-candidate.sh'
      - 'tests/browser/contracts/drupal-2027-preprod.json'
      - 'tests/browser/drupal-2027-preprod.spec.mjs'
      - 'web/themes/custom/emerging_digital/templates/block/block--emerging-digital-drupal-lifecycle-diagnostic.html.twig'
      - 'config/sync/block.block.emerging_digital_drupal_lifecycle_diagnostic.yml'
      - 'web/modules/custom/agency_project_tests/tests/src/Unit/Drupal2027PreprodCandidateWorkflowTest.php'
      - 'web/modules/custom/agency_project_tests/tests/src/Kernel/Drupal2027PreprodCandidateKernelTest.php'
  workflow_call:
    secrets:
      PREPROD_SSH_PRIVATE_KEY:
        required: true
      PREPROD_SERVER_HOST:
        required: true
      PREPROD_BASIC_AUTH_USER:
        required: true
      PREPROD_BASIC_AUTH_PASSWORD:
        required: true

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: agency-drupal-2027-preprod-candidate-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  static-validation:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Validate closed FR+EN profile sources
        shell: bash
        run: |
          set -euo pipefail
          php -l scripts/runner/drupal-2027-preprod-candidate.php
          php -l scripts/runner/drupal-2027-preprod-candidate-runner.php
          bash -n scripts/runner/run-drupal-2027-preprod-candidate.sh
          node --check tests/browser/drupal-2027-preprod.spec.mjs
          jq -e '.id == "drupal-2027-preprod" and .target == "/fr/drupal-2027" and .target_en == "/en/drupal-2027"' \
            tests/browser/contracts/drupal-2027-preprod.json >/dev/null
          grep -Fq "private const CANDIDATE_ID = 'agency-drupal-2027-landing-1046';" scripts/runner/drupal-2027-preprod-candidate.php
          grep -Fq "private const EXPECTED_PAYLOAD_SHA256 = 'ac96465c5717f78af76e368d8598399cbe997ed63d7cc753d575337c9321af83';" scripts/runner/drupal-2027-preprod-candidate.php
          grep -Fq "private const TRANSLATION_LANGCODE = 'en';" scripts/runner/drupal-2027-preprod-candidate.php
          grep -Fq 'ed-section__content--contact-form' web/themes/custom/emerging_digital/templates/block/block--emerging-digital-drupal-lifecycle-diagnostic.html.twig

  candidate:
    if: >-
      ${{ github.event_name == 'issue_comment'
          && github.event.issue.number == 1046
          && github.event.comment.author_association == 'OWNER'
          && github.event.comment.user.login == 'E-merging-digital'
          && (github.event.comment.body == '/agency-drupal-2027-candidate inspect'
              || github.event.comment.body == '/agency-drupal-2027-candidate dry-run'
              || github.event.comment.body == '/agency-drupal-2027-candidate apply') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      EXPECTED_OWNER: E-merging-digital
      CANDIDATE_COMMENT_ID: '5555544679'
      CANDIDATE_SHA256: 'ac96465c5717f78af76e368d8598399cbe997ed63d7cc753d575337c9321af83'
      PREPROD_URL: https://preprod.emergingdigital.be
    steps:
      - name: Authorize exact issue and owner command
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.actor }}' = "$EXPECTED_OWNER"
          issue_json="$(gh api "repos/$REPO/issues/1046")"
          test "$(jq -r '.state' <<<"$issue_json")" = 'open'
          test "$(jq -r '.user.login' <<<"$issue_json")" = "$EXPECTED_OWNER"
          mode='${{ github.event.comment.body }}'
          mode="${mode##* }"
          case "$mode" in inspect|dry-run|apply) ;; *) exit 1 ;; esac
          echo "MODE=$mode" >> "$GITHUB_ENV"

      - name: Reload authoritative main
        shell: bash
        run: |
          set -euo pipefail
          main="$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')"
          [[ "$main" =~ ^[0-9a-f]{40}$ ]]
          echo "TRUSTED_MAIN=$main" >> "$GITHUB_ENV"

      - name: Load exact frozen #1046 candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/drupal-2027-preprod-candidate
          gh api "repos/$REPO/issues/comments/$CANDIDATE_COMMENT_ID" > artifacts/drupal-2027-preprod-candidate/candidate.json
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          comment = json.load(open('artifacts/drupal-2027-preprod-candidate/candidate.json', encoding='utf-8'))
          marker = '<!-- agency-drupal-2027-payload:v2 -->\n'
          if comment.get('id') != int(os.environ['CANDIDATE_COMMENT_ID']):
              raise SystemExit('Candidate comment identity mismatch.')
          if comment.get('user', {}).get('login') != os.environ['EXPECTED_OWNER']:
              raise SystemExit('Candidate is not owner-authored.')
          if not comment.get('issue_url', '').endswith('/issues/1046'):
              raise SystemExit('Candidate is not attached to #1046.')
          body = comment.get('body') or ''
          if not body.startswith(marker):
              raise SystemExit('Candidate marker mismatch.')
          payload = json.loads(body[len(marker):])
          fixed = {
              'schema_version': 2,
              'profile': 'drupal-2027-landing',
              'candidate_id': 'agency-drupal-2027-landing-1046',
              'issue_number': 1046,
              'source_issue': 1010,
              'source_candidate_revision': 5553858896,
              'source_candidate_sha256': '07fb10ab4a54371d877fbfc6b3f185eda41085ae3bd5080de2d695843c9d049e',
              'target': 'PREPROD',
              'bundle': 'page',
              'language_mode': 'FR_EN',
              'aliases': {'fr': '/fr/drupal-2027', 'en': '/en/drupal-2027'},
              'published': True,
          }
          for key, value in fixed.items():
              if payload.get(key) != value:
                  raise SystemExit(f'Frozen candidate field mismatch: {key}')
          canonical = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n'
          digest = hashlib.sha256(canonical.encode('utf-8')).hexdigest()
          if digest != os.environ['CANDIDATE_SHA256']:
              raise SystemExit('Frozen #1046 candidate SHA-256 mismatch.')
          pathlib.Path('artifacts/drupal-2027-preprod-candidate/payload.json').write_text(canonical, encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'candidate_revision={comment["id"]}\n')
              out.write(f'candidate_sha256={digest}\n')
          PY

      - name: Require exact prior dry-run before apply
        if: ${{ env.MODE == 'apply' }}
        shell: bash
        env:
          CANDIDATE_REVISION: ${{ steps.candidate.outputs.candidate_revision }}
          PAYLOAD_SHA256: ${{ steps.candidate.outputs.candidate_sha256 }}
        run: |
          set -euo pipefail
          comments="$RUNNER_TEMP/drupal-2027-1046-comments.json"
          gh api --paginate --slurp "repos/$REPO/issues/1046/comments?per_page=100" > "$comments"
          COMMENTS_FILE="$comments" python3 - <<'PY'
          # BEGIN DRUPAL_2027_RECEIPT_PARSER
          import json, os, re
          heading = '### Agency Drupal 2027 PREPROD candidate dry-run PASS'
          expected = {
              'candidate_revision': os.environ['CANDIDATE_REVISION'],
              'candidate_sha256': os.environ['PAYLOAD_SHA256'],
              'trusted_main': os.environ['TRUSTED_MAIN'],
          }
          patterns = {
              'candidate_revision': re.compile(r'^candidate_revision=([1-9][0-9]*)$'),
              'candidate_sha256': re.compile(r'^candidate_sha256=([0-9a-f]{64})$'),
              'trusted_main': re.compile(r'^trusted_main=([0-9a-f]{40})$'),
          }
          pages = json.load(open(os.environ['COMMENTS_FILE'], encoding='utf-8'))
          comments = [item for page in pages for item in (page if isinstance(page, list) else [page])]
          for comment in comments:
              if comment.get('user', {}).get('login') != 'github-actions[bot]':
                  continue
              lines = (comment.get('body') or '').splitlines()
              if not lines or lines[0] != heading or lines.count(heading) != 1:
                  continue
              fields = {}
              valid = True
              for name, pattern in patterns.items():
                  candidates = [line for line in lines[1:] if line.startswith(f'{name}=')]
                  if len(candidates) != 1 or pattern.fullmatch(candidates[0]) is None:
                      valid = False
                      break
                  fields[name] = pattern.fullmatch(candidates[0]).group(1)
              if valid and fields == expected:
                  raise SystemExit(0)
          raise SystemExit('PREPROD apply requires the exact #1046 dry-run PASS for the same candidate and main.')
          # END DRUPAL_2027_RECEIPT_PARSER
          PY

      - name: Checkout exact live main execution source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TRUSTED_MAIN }}
          fetch-depth: 1
          persist-credentials: false

      - name: JIT revalidate main and frozen candidate
        env:
          EXPECTED_SHA: ${{ steps.candidate.outputs.candidate_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRUSTED_MAIN"
          test "$(gh api "repos/$REPO/branches/main" --jq '.commit.sha')" = "$TRUSTED_MAIN"
          body="$(gh api "repos/$REPO/issues/comments/$CANDIDATE_COMMENT_ID" --jq '.body')"
          BODY="$body" python3 - <<'PY'
          import hashlib, json, os
          marker = '<!-- agency-drupal-2027-payload:v2 -->\n'
          body = os.environ['BODY']
          if not body.startswith(marker):
              raise SystemExit('Candidate marker changed.')
          payload = json.loads(body[len(marker):])
          canonical = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n'
          if hashlib.sha256(canonical.encode()).hexdigest() != os.environ['EXPECTED_SHA']:
              raise SystemExit('Candidate changed after authorization.')
          open('artifacts/drupal-2027-preprod-candidate/payload.json', 'w', encoding='utf-8').write(canonical)
          PY

      - name: Materialize PREPROD SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PREPROD_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/agency_preprod_ed25519
          chmod 600 ~/.ssh/agency_preprod_ed25519
          echo "PREPROD_SSH_KEY=$HOME/.ssh/agency_preprod_ed25519" >> "$GITHUB_ENV"

      - name: Execute closed Drupal 2027 PREPROD profile
        env:
          DRUPAL_2027_MODE: ${{ env.MODE }}
          PAYLOAD_SHA256: ${{ steps.candidate.outputs.candidate_sha256 }}
          PAYLOAD_FILE: artifacts/drupal-2027-preprod-candidate/payload.json
          PREPROD_SERVER_HOST: ${{ secrets.PREPROD_SERVER_HOST }}
        shell: bash
        run: bash scripts/runner/run-drupal-2027-preprod-candidate.sh

      - name: Setup Node for real browser review
        if: ${{ env.MODE == 'apply' }}
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Run existing FR+EN browser review against real PREPROD
        if: ${{ env.MODE == 'apply' }}
        env:
          BROWSER_VALIDATION_BASE_URL: ${{ env.PREPROD_URL }}
          BROWSER_VALIDATION_CONTRACT: tests/browser/contracts/drupal-2027-preprod.json
          BROWSER_VALIDATION_HTTP_USERNAME: ${{ secrets.PREPROD_BASIC_AUTH_USER }}
          BROWSER_VALIDATION_HTTP_PASSWORD: ${{ secrets.PREPROD_BASIC_AUTH_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium
          npm run browser:validate
          jq -e '.result == "PASS" and .visual_desktop == "PASS" and .visual_mobile == "PASS" and .console_errors == 0 and .page_errors == 0 and .unexpected_http_4xx == 0 and .http_5xx == 0' artifacts/browser-validation/result.json >/dev/null

      - name: Persist bounded #1046 candidate verdict
        if: ${{ success() }}
        env:
          CANDIDATE_REVISION: ${{ steps.candidate.outputs.candidate_revision }}
          CANDIDATE_SHA256_VALUE: ${{ steps.candidate.outputs.candidate_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          verdict="$(jq -r '.verdict' artifacts/drupal-2027-preprod-candidate/result.json)"
          if [[ "$MODE" == dry-run ]]; then heading='### Agency Drupal 2027 PREPROD candidate dry-run PASS';
          elif [[ "$MODE" == apply ]]; then heading='### Agency Drupal 2027 PREPROD candidate apply PASS';
          else heading='### Agency Drupal 2027 PREPROD candidate inspect PASS'; fi
          browser='NOT_YET'
          if [[ "$MODE" == apply ]]; then browser="$(jq -r '.result' artifacts/browser-validation/result.json)"; fi
          body="$heading

          mode=$MODE
          profile=drupal-2027-landing
          candidate_revision=$CANDIDATE_REVISION
          candidate_sha256=$CANDIDATE_SHA256_VALUE
          trusted_main=$TRUSTED_MAIN
          verdict=$verdict
          target=PREPROD
          bundle=page
          language_mode=FR_EN
          fr_url=https://preprod.emergingdigital.be/fr/drupal-2027
          en_url=https://preprod.emergingdigital.be/en/drupal-2027
          browser_validation=$browser
          prod_write=NONE
          content_sync=NONE"
          gh issue comment 1046 --repo "$REPO" --body "$body"

      - name: Upload non-sensitive #1046 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: drupal-2027-preprod-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/drupal-2027-preprod-candidate/result.json
            artifacts/browser-validation/result.json
            artifacts/browser-validation/evidence
            artifacts/browser-validation/screenshots
            artifacts/browser-validation/test-results
          if-no-files-found: warn
          retention-days: 30
