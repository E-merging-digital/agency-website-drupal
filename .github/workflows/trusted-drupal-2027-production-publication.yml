name: '#1010 Drupal 2027 production publication'

on:
  workflow_call:
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      SERVER_HOST:
        required: true
      SERVER_USER:
        required: true

permissions:
  contents: read
  issues: write

jobs:
  publication:
    name: Publish exact Drupal 2027 landing to PROD
    if: >-
      ${{ github.event.issue.pull_request == null
          && github.event.issue.number == 1010
          && github.event.comment.author_association == 'OWNER'
          && github.event.comment.user.login == 'E-merging-digital'
          && (github.event.comment.body == '/agency-drupal-2027-prod dry-run'
              || github.event.comment.body == '/agency-drupal-2027-prod apply') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: agency-drupal-2027-prod-1010
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_OWNER: E-merging-digital
      APPROVED_CANDIDATE_COMMENT: '5553858896'
      APPROVED_CANDIDATE_SHA256: '07fb10ab4a54371d877fbfc6b3f185eda41085ae3bd5080de2d695843c9d049e'
      SOURCE_COMMENT_ID: '5553624200'

    steps:
      - name: Authorize exact #1010 owner command and live main
        id: request
        shell: bash
        env:
          TRIGGER_COMMENT: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          EVENT_DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_ACTOR" == "$EXPECTED_OWNER" ]]
          [[ "$COMMENT_AUTHOR" == "$EXPECTED_OWNER" ]]
          case "$TRIGGER_COMMENT" in
            '/agency-drupal-2027-prod dry-run') mode='dry-run' ;;
            '/agency-drupal-2027-prod apply') mode='apply' ;;
            *) echo 'Unsupported Drupal 2027 production command.' >&2; exit 1 ;;
          esac
          issue_json="$(gh api "repos/$GITHUB_REPOSITORY/issues/1010")"
          [[ "$(jq -r '.state' <<<"$issue_json")" == 'open' ]]
          [[ "$(jq -r '.user.login' <<<"$issue_json")" == "$EXPECTED_OWNER" ]]
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVENT_DEFAULT_SHA" == "$main_sha" ]] || {
            echo 'Drupal 2027 production route must execute the workflow revision on live main.' >&2
            exit 1
          }
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Load exact approved candidate without creating a new payload
        id: payload
        shell: bash
        env:
          MODE: ${{ steps.request.outputs.mode }}
          TRUSTED_MAIN: ${{ steps.request.outputs.main_sha }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$APPROVED_CANDIDATE_COMMENT" > /tmp/drupal-2027-approved-comment.json
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$SOURCE_COMMENT_ID" > /tmp/drupal-2027-source-comment.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/1010/comments?per_page=100" > /tmp/drupal-2027-prod-comments.json
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re

          marker = '<!-- agency-drupal-2027-payload:v1 -->\n'
          approved_comment = json.load(open('/tmp/drupal-2027-approved-comment.json', encoding='utf-8'))
          if approved_comment.get('id') != int(os.environ['APPROVED_CANDIDATE_COMMENT']):
              raise SystemExit('Approved candidate comment identity mismatch.')
          if approved_comment.get('user', {}).get('login') != os.environ['EXPECTED_OWNER']:
              raise SystemExit('Approved candidate is not owner-authored.')
          if not approved_comment.get('issue_url', '').endswith('/issues/1012'):
              raise SystemExit('Approved candidate is not the terminal #1012 payload.')
          body = approved_comment.get('body') or ''
          if not body.startswith(marker):
              raise SystemExit('Approved candidate marker mismatch.')
          payload = json.loads(body[len(marker):])
          fixed = {
              'schema_version': 1,
              'profile': 'drupal-2027-landing',
              'candidate_id': 'agency-drupal-2027-landing-1012',
              'issue_number': 1012,
              'source_issue': 1010,
              'source_comment_id': 5553624200,
              'target': 'PREPROD',
              'bundle': 'page',
              'language': 'fr',
              'alias': '/fr/drupal-2027',
              'published': True,
              'title': 'Votre plateforme Drupal est-elle prête pour 2027 ?',
          }
          for key, value in fixed.items():
              if payload.get(key) != value:
                  raise SystemExit(f'Approved candidate fixed field mismatch: {key}')
          hero = payload.get('hero') or {}
          if hero.get('primary_cta') != 'Faire le point sur ma plateforme':
              raise SystemExit('Approved final CTA mismatch.')

          canonical = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n'
          digest = hashlib.sha256(canonical.encode('utf-8')).hexdigest()
          if digest != os.environ['APPROVED_CANDIDATE_SHA256']:
              raise SystemExit('Approved Drupal 2027 candidate SHA-256 mismatch.')

          source = json.load(open('/tmp/drupal-2027-source-comment.json', encoding='utf-8'))
          if source.get('id') != int(os.environ['SOURCE_COMMENT_ID']):
              raise SystemExit('Source comment identity mismatch.')
          if source.get('user', {}).get('login') != os.environ['EXPECTED_OWNER']:
              raise SystemExit('Source comment is not owner-authored.')
          if not source.get('issue_url', '').endswith('/issues/1010'):
              raise SystemExit('Source comment is not attached to #1010.')
          if source.get('updated_at') != payload.get('source_updated_at'):
              raise SystemExit('Approved source changed after candidate approval.')

          pathlib.Path('/tmp/drupal-2027-approved-payload.json').write_text(canonical, encoding='utf-8')

          if os.environ['MODE'] == 'apply':
              pages = json.load(open('/tmp/drupal-2027-prod-comments.json', encoding='utf-8'))
              if pages and isinstance(pages[0], list):
                  comments = [item for page in pages for item in page]
              else:
                  comments = pages
              heading = '### Agency Drupal 2027 PROD dry-run PASS'
              expected = {
                  'candidate_revision': os.environ['APPROVED_CANDIDATE_COMMENT'],
                  'payload_sha256': digest,
                  'trusted_main': os.environ['TRUSTED_MAIN'],
              }
              authorized = False
              for comment in comments:
                  if comment.get('user', {}).get('login') != 'github-actions[bot]':
                      continue
                  lines = (comment.get('body') or '').splitlines()
                  if not lines or lines[0] != heading or lines.count(heading) != 1:
                      continue
                  fields = {}
                  for line in lines[1:]:
                      if '=' not in line:
                          continue
                      key, value = line.split('=', 1)
                      if key in expected and key not in fields:
                          fields[key] = value
                  if fields == expected:
                      authorized = True
                      break
              if not authorized:
                  raise SystemExit('PROD apply requires one exact dry-run PASS for the same candidate and live main.')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'candidate_revision={approved_comment["id"]}\n')
              output.write(f'payload_sha256={digest}\n')
          PY

      - name: Resolve exact PREPROD review receipt and human approval surface
        id: preprod
        if: ${{ steps.request.outputs.mode == 'apply' }}
        shell: bash
        env:
          CANDIDATE_REVISION: ${{ steps.payload.outputs.candidate_revision }}
          PAYLOAD_SHA256: ${{ steps.payload.outputs.payload_sha256 }}
        run: |
          set -euo pipefail
          preprod_comments="$RUNNER_TEMP/drupal-2027-preprod-receipts.json"
          approval_comments="$RUNNER_TEMP/drupal-2027-human-approval-comments.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/1012/comments?per_page=100" \
            > "$preprod_comments"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/1010/comments?per_page=100" \
            > "$approval_comments"
          export PREPROD_COMMENTS_FILE="$preprod_comments"
          python3 - <<'PY'
          import json
          import os
          import re

          heading = '### Agency Drupal 2027 PREPROD candidate apply PASS'
          patterns = {
              'candidate_revision': re.compile(r'^candidate_revision=([1-9][0-9]*)$'),
              'candidate_sha256': re.compile(r'^candidate_sha256=([0-9a-f]{64})$'),
              'target': re.compile(r'^target=(PREPROD)$'),
              'alias': re.compile(r'^alias=(/fr/drupal-2027)$'),
              'browser_validation': re.compile(r'^browser_validation=(PASS)$'),
              'prod_write': re.compile(r'^prod_write=(NONE)$'),
          }
          expected = {
              'candidate_revision': os.environ['CANDIDATE_REVISION'],
              'candidate_sha256': os.environ['PAYLOAD_SHA256'],
              'target': 'PREPROD',
              'alias': '/fr/drupal-2027',
              'browser_validation': 'PASS',
              'prod_write': 'NONE',
          }
          pages = json.load(open(os.environ['PREPROD_COMMENTS_FILE'], encoding='utf-8'))
          comments = []
          for page in pages:
              if isinstance(page, list):
                  comments.extend(page)
              elif isinstance(page, dict):
                  comments.append(page)

          authorized = False
          for comment in comments:
              if comment.get('user', {}).get('login') != 'github-actions[bot]':
                  continue
              lines = (comment.get('body') or '').splitlines()
              if not lines or lines[0] != heading or lines.count(heading) != 1:
                  continue
              fields = {}
              invalid = False
              for name, pattern in patterns.items():
                  prefix = f'{name}='
                  candidates = [line for line in lines[1:] if line.startswith(prefix)]
                  if len(candidates) != 1:
                      invalid = True
                      break
                  match = pattern.fullmatch(candidates[0])
                  if match is None:
                      invalid = True
                      break
                  fields[name] = match.group(1)
              if invalid:
                  continue
              if all(fields[name] == value for name, value in expected.items()):
                  authorized = True
                  break

          if not authorized:
              raise SystemExit(
                  'Drupal 2027 PROD apply requires the exact PREPROD apply PASS and browser review for the same candidate.'
              )

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('fr_url=https://preprod.emergingdigital.be/fr/drupal-2027\n')
              output.write('en_url=NONE\n')
              output.write('language_mode=FR_ONLY_EXCEPTION_APPROVED\n')
          PY

      - name: Checkout exact live main execution source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.request.outputs.main_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify closed production publication implementation
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ steps.request.outputs.main_sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_MAIN_SHA" ]]
          test -f scripts/runner/drupal-2027-preprod-candidate.php
          test -f scripts/runner/drupal-2027-production-publication-runner.php
          test -f scripts/runner/run-drupal-2027-production-publication.sh
          test -f scripts/validation/editorial-human-approval.php
          php -l scripts/runner/drupal-2027-preprod-candidate.php
          php -l scripts/runner/drupal-2027-production-publication-runner.php
          bash -n scripts/runner/run-drupal-2027-production-publication.sh
          php -l scripts/validation/editorial-human-approval.php

      - name: Require direct human approval for exact reviewed PREPROD candidate
        if: ${{ steps.request.outputs.mode == 'apply' }}
        shell: bash
        env:
          CANDIDATE_REVISION: ${{ steps.payload.outputs.candidate_revision }}
          PAYLOAD_SHA256: ${{ steps.payload.outputs.payload_sha256 }}
          PREPROD_FR_URL: ${{ steps.preprod.outputs.fr_url }}
          PREPROD_EN_URL: ${{ steps.preprod.outputs.en_url }}
          LANGUAGE_MODE: ${{ steps.preprod.outputs.language_mode }}
        run: |
          set -euo pipefail
          php scripts/validation/editorial-human-approval.php \
            --comments="$RUNNER_TEMP/drupal-2027-human-approval-comments.json" \
            --owner="$EXPECTED_OWNER" \
            --candidate-revision="$CANDIDATE_REVISION" \
            --payload-sha256="$PAYLOAD_SHA256" \
            --preprod-fr-url="$PREPROD_FR_URL" \
            --preprod-en-url="$PREPROD_EN_URL" \
            --language-mode="$LANGUAGE_MODE"

      - name: Configure existing production SSH channel
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SERVER_HOST"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Execute exact Drupal 2027 production publication route
        id: route
        shell: bash
        env:
          DRUPAL_2027_PROD_MODE: ${{ steps.request.outputs.mode }}
          PAYLOAD_SHA256: ${{ steps.payload.outputs.payload_sha256 }}
          PAYLOAD_FILE: /tmp/drupal-2027-approved-payload.json
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts/drupal-2027-production-publication
        run: |
          set -euo pipefail
          bash scripts/runner/run-drupal-2027-production-publication.sh

      - name: Upload bounded production publication evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: drupal-2027-production-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/drupal-2027-production-publication
          if-no-files-found: warn
          retention-days: 30

      - name: Persist bounded #1010 production result
        if: ${{ always() && steps.request.outcome == 'success' }}
        shell: bash
        env:
          MODE: ${{ steps.request.outputs.mode }}
          TRUSTED_MAIN: ${{ steps.request.outputs.main_sha }}
          CANDIDATE_REVISION: ${{ steps.payload.outputs.candidate_revision }}
          PAYLOAD_SHA256: ${{ steps.payload.outputs.payload_sha256 }}
          ROUTE_OUTCOME: ${{ steps.route.outcome }}
        run: |
          set -euo pipefail
          result_file='artifacts/drupal-2027-production-publication/result.json'
          status='MISSING'
          verdict='UNKNOWN'
          node_id='n/a'
          revision_id='n/a'
          alias='n/a'
          prod_write='NONE'
          if [[ -s "$result_file" ]] && jq -e . "$result_file" >/dev/null 2>&1; then
            status="$(jq -r '.status // "UNKNOWN"' "$result_file")"
            verdict="$(jq -r '.verdict // "UNKNOWN"' "$result_file")"
            node_id="$(jq -r '.node.id // "n/a"' "$result_file")"
            revision_id="$(jq -r '.node.revision_id // "n/a"' "$result_file")"
            alias="$(jq -r '.alias // "n/a"' "$result_file")"
            prod_write="$(jq -r '.prod_write // "NONE"' "$result_file")"
          fi
          heading="### Agency Drupal 2027 PROD ${MODE} ${status}"
          if [[ "$ROUTE_OUTCOME" == 'success' && "$status" == 'PASS' ]]; then
            if [[ "$MODE" == 'dry-run' ]]; then
              heading='### Agency Drupal 2027 PROD dry-run PASS'
            else
              heading='### Agency Drupal 2027 PROD apply PASS'
            fi
          fi
          body="$heading

          candidate_revision=$CANDIDATE_REVISION
          payload_sha256=$PAYLOAD_SHA256
          trusted_main=$TRUSTED_MAIN
          route_outcome=${ROUTE_OUTCOME:-unknown}
          verdict=$verdict
          node_id=$node_id
          revision_id=$revision_id
          alias=$alias
          prod_write=$prod_write
          content_sync=NONE"
          gh issue comment 1010 --repo "$GITHUB_REPOSITORY" --body "$body"
