schema_version: 2
policy_id: agency-configuration-language-v2
status: enforced
site_default_language: fr
site_languages:
  - fr
  - en
historical_configuration:
  canonical_base_language_intent: en
  evidence_issue: 609
  migration_issue: 1316
configuration_writes:
  strategy: site_default
  resolved_langcode: fr
  follow_site_default: true
managed_configuration_translation_languages:
  - fr
  - en
current_configuration_translation_directories:
  - config/sync/language/fr
  - config/sync/language/en
enforce_consistency: true
enforcement:
  strategy: use_drupal
  implementation: drupal/config_language_lock
  minimum_release: 1.0.0
  locked_langcode_strategy: site_default
  resolved_locked_langcode: fr
  follow_site_default: true
  adoption_issue: 609
  migration_issue: 1316
transformation_sources:
  - manual_admin
  - module_install
  - theme_install
  - recipe
  - config_action
  - canvas
  - drupal_ai
  - automated_agent
evidence:
  require_before_snapshot: true
  require_after_snapshot: true
  require_diff: true
  require_independent_verdict: true
preflight:
  coupling: none
  contract: observable_policy_v2_and_snapshots
migration_watchlist:
  - config/sync/language.entity.und.yml
  - config/sync/language.entity.zxx.yml
  - config/sync/language/fr
  - config/sync/language/en
  - config/sync/canvas.folder.0d5d5129-0d2e-41f3-a6d5-0211018bd59f.yml
core_transition:
  upstream_issue: 'https://www.drupal.org/project/drupal/issues/3337864'
  remove_contrib_when_core_sufficient: true
