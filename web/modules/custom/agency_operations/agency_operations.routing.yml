agency_operations.overview:
  path: '/admin/agency/operations'
  defaults:
    _controller: '\Drupal\agency_operations\Controller\OperationsController::overview'
    _title: 'Agency Operations'
  requirements:
    _permission: 'access agency operations'
  methods: [GET]
  options:
    _admin_route: TRUE

agency_operations.editorial:
  path: '/admin/agency/operations/editorial'
  defaults:
    _controller: '\Drupal\agency_operations\Controller\EditorialOperationsController::overview'
    _title: 'Agency editorial readiness'
  requirements:
    _permission: 'access agency operations'
  methods: [GET]
  options:
    _admin_route: TRUE

agency_operations.cockpit_state:
  path: '/api/agency-operations/v1/environment-data-state'
  defaults:
    _controller: '\Drupal\agency_operations\Controller\CockpitStateController::state'
  requirements:
    # Machine authentication and the PREPROD-only gate are enforced in the controller.
    _access: 'TRUE'
  methods: [GET]
  options:
    no_cache: TRUE
