services:
  logger.channel.emerging_digital_content:
    parent: logger.channel_base
    arguments:
      - 'emerging_digital_content'

  emerging_digital_content.content_sync_catalog_loader:
    class: Drupal\emerging_digital_content\ContentSync\Loader\ContentSyncCatalogLoader
    arguments:
      - '@extension.list.module'
      - '%app.root%'

  emerging_digital_content.content_sync_catalog_validator:
    class: Drupal\emerging_digital_content\ContentSync\Validator\ContentSyncCatalogValidator

  emerging_digital_content.content_sync_mapping_repository:
    class: Drupal\emerging_digital_content\ContentSync\Repository\ContentSyncMappingRepository
    arguments:
      - '@database'
      - '@datetime.time'
      - '@logger.channel.emerging_digital_content'

  emerging_digital_content.content_sync_release_manager:
    class: Drupal\emerging_digital_content\ContentSync\ContentSyncReleaseManager
    arguments:
      - '@emerging_digital_content.content_sync_catalog_loader'
      - '@emerging_digital_content.content_sync_mapping_repository'

  emerging_digital_content.governed_core_default_content_importer:
    class: Drupal\emerging_digital_content\ContentSync\GovernedCoreDefaultContentImporter
    arguments:
      - '@Drupal\Core\DefaultContent\Importer'
      - '@entity.repository'
      - '%app.root%'

  emerging_digital_content.content_sync_manager:
    class: Drupal\emerging_digital_content\ContentSync\ContentSyncManager
    arguments:
      - '@emerging_digital_content.content_sync_catalog_loader'
      - '@emerging_digital_content.content_sync_catalog_validator'
      - '@emerging_digital_content.content_sync_mapping_repository'
      - '@entity_type.manager'
      - '@entity.repository'
      - '@path_alias.manager'
      - '@language_manager'
      - '@config.factory'
      - '@datetime.time'
      - '@emerging_digital_content.governed_core_default_content_importer'
