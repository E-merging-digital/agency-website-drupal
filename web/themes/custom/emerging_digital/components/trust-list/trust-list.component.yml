'$schema': 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json'
name: 'Trust list'
status: stable
group: 'Agency governed'
description: 'Governed semantic list for benefits, trust signals or short proof points.'
props:
  type: object
  required:
    - heading
    - items
  properties:
    heading:
      type: string
      title: Heading
      description: 'Section heading for the list.'
      examples:
        - Benefits
    items:
      type: array
      title: Items
      description: 'Short text items. Markup is intentionally not accepted.'
      minItems: 1
      maxItems: 12
      items:
        type: string
      examples:
        -
          - 'Drupal expertise'
          - 'Human validation'
          - 'Accessible by design'
